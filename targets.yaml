# targets.yaml — canonical destination architecture and allocation policy.
#
# PHQ-2026-02 (governance/decisions/PHQ-2026-02-holdings-reconciliation-and-actionable-allocation-policy.md):
# `destination:` replaces the prior tiered (T1/T2/ETF/band/spec) structure
# with the principal-approved canonical v1.30 architecture (PHQ-2026-01 point
# 1), 37 rows, weights sourced verbatim from
# governance/evidence/PHQ-2026-01/final_due_diligence/Portfolio_HQ_Final_Due_Diligence_and_Approval_v1_32.json
# (`architecture_rows`, SHA-256 09c7d45f2a6fe0820177dde3eb05c22798f5c62443f7df39f42ae479ce7e07d1
# for the source CSV) — no weight here was invented or estimated.
# `target_pct` is this repository's sole config-editable canonical destination
# weight per name (% of book). Actionable gates (7 names currently
# HOLD-TARGET-IN-CASH / no-add) are represented SEPARATELY in gates.yaml, per
# PHQ-2026-02 — a gated name's row here still carries its full destination
# weight; nothing here is zeroed or renormalized for a gate.
#
# Retired by this migration: the T1/T2/ETF/band/spec tier structure, the
# semis/power_infra/oil correlated-cluster tickers no longer in the canonical
# roster (KLAC/ETN/GEV/PWR remain and stay capped below; the rest of each
# cluster's prior membership exited with the transition — see PHQ-2026-02),
# and the T1/T2 1.5x concentration-ceiling trim rule (`gates.t1t2_trim_mult`)
# — that rule was defined in terms of the T1/T2 tiers this migration removes;
# no equivalent per-name trim rule is invented in its place (PHQ-2026-02 does
# not authorize a new trim rule — only quarterly review with tolerance bands,
# not numerically specified in any retained evidence).

regime_ticker: QQQ          # ticker whose 200-EMA regime status is shown; informational
                            # only since the regime-gate backtest verdict (see CLAUDE.md
                            # Decisions Log) — it no longer gates any buy

