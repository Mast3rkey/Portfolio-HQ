caps:
  # Correlated-cluster concentration caps carried forward unchanged from the
  # prior tiered structure (semis/power_infra/oil membership and pct
  # unchanged) — most prior members exited with the PHQ-2026-02 transition
  # and are no longer in `destination:` above, so each cluster now binds on
  # only its surviving canonical members (semis: ASML, TSM, NVDA, AVGO, KLAC;
  # power_infra: ETN, GEV, PWR; oil: none remaining). Not re-scoped or
  # re-derived by this filing —
  # doing so would be a new correlation-cluster decision, out of PHQ-2026-02's
  # scope.
  clusters:
    - name: semis
      pct: 25.0
      tickers: [ASML, TSM, NVDA, AVGO, KLAC]
    - name: power_infra
      pct: 20.0
      tickers: [ETN, GEV, PWR]
    - name: oil
      pct: 20.0
      tickers: []

levels:
  # Buy-level rungs: 50SMA minus (multiplier x ATR14). L3 is floored at the
  # 200SMA ("trend-floor") — never model a deep buy below the long-term trend.
  rung_atr_multipliers: [1.0, 2.0, 3.0]
  practicality_cap_pct: 25   # levels further below price than this = "unlikely near-term"
  swing_low_sessions: 60     # recent-support lookback

gates:
  min_lot_dollars: 25          # do not recommend buys smaller than this
  trend_rsi_override: 30       # allow add below 200-SMA only if RSI < this
  earnings_blackout_days: 7    # skip adds within this many calendar days of earnings
  # trim_rsi removed (independent review, PR #202): no code path read it --
  # the canonical destination architecture has no per-name RSI-gated trim
  # rule, and none is authorized. If a future tolerance-band trim rule is
  # ever authorized, add its parameter then, not speculatively now.

margin:
  # Doctrine (July 2026): fixed structural cap, not a timing lever. Book is
  # net equity (gross holdings minus margin debt); this cap bounds gross/equity.
  # Unchanged by PHQ-2026-02 — no new margin is authorized.
  leverage_cap: 1.8            # hard ceiling on gross-position-value / net-equity
  buffer_floor_pct: 30.0       # hard cutoff: block margin buys if buffer would drop below this
