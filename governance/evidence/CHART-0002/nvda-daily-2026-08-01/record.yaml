content:
  visible_facts:
  - In-chart watermark text reads "NVDA, 1D" with subtitle "NVIDIA Corporation."
  - Right-side price axis labeled in $10 increments from 100.00 to 280.00
  - A gray dotted line is labeled "High 236.54"
  - A gray dotted line is labeled "Low 142.03"
  - A magenta dotted horizontal line is labeled "202.95 +38.89%"
  - Additional stacked right-edge labels read "206.32" (teal/green box), "200.75" (yellow box), and "193.17"
    (orange box)
  - Volume panel numeric labels read "139.9M" (teal box) and "127.72M" (yellow box)
  - Green-bordered "E" square markers and blue-bordered "D" circle markers recur at multiple points along
    the volume timeline (four visible "E" markers)
  - Third panel contains a purple line and yellow line on a 0-100 scale, labeled "45.13" (purple) and
    "49.53" (yellow)
  - That panel's upper dashed line is red/pink (~70 level) and lower dashed line is green (~40 level)
  - Bottom panel contains a single red line on an approximately 2-12 scale, labeled "8.20"
  - 'X-axis date labels read: Jul, Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug'
  - '"TradingView" wordmark/logo appears at bottom-left'
  - Candlesticks are teal/green (up) and red (down)
  - The rightmost candles are red/down-colored
  observations:
  - Price rises fairly steadily from the left edge (near 140) through the fall months to a local peak
    around November, then trades in a choppier sideways range roughly Dec-Mar
  - A second, stronger rally occurs roughly April-June, reaching the chart's labeled high ("236.54")
  - Price declines from that high through the final weeks shown, with the most recent candles closing
    lower than the yellow/red overlay lines
  - The orange dotted line rises steadily and smoothly across the entire chart, consistently staying below
    price throughout
  - Volume bars show no single extreme outlier spike; bar heights appear more evenly distributed with
    a yellow moving-average line running through them
  - The bottom red-line panel rises from its lowest levels near the left edge to a broad plateau in the
    6-10 range for most of the remaining chart
  - The purple/yellow third-panel lines cross back and forth around the 45-50 mid-range multiple times
    without persistently reaching either dashed reference line for long stretches
  inferences:
  - The yellow/red overlay lines are most likely short/medium moving averages -- inferred from convention,
    not confirmed in-image
  - The orange dotted line is likely a longer-period moving average -- inferred from smoothness/lag, not
    confirmed
  - The purple/yellow third-panel lines are plausibly a stochastic-type oscillator given the paired-line,
    bounded-scale structure -- an inference, not a confirmed name
  - The bottom red-line panel is possibly a volatility-related measure -- inferred from shape/scale, not
    confirmed
  - The "E"/"D" markers most likely denote earnings and dividend-related dates respectively, per typical
    TradingView convention -- not confirmed by any in-image legend
  uncertainties:
  - No indicator names or moving-average periods are labeled anywhere in the image
  - The reference basis for the "+38.89%" figure on the magenta line is not stated
  - The computation window for "High 236.54"/"Low 142.03" is not stated
  - Exact dates of individual peaks/troughs described above are not individually labeled beyond the axis
    month markers
  - Whether "E"/"D" markers specifically denote earnings/dividends is not textually confirmed anywhere
    in-image
  - Whether the rightmost candle represents a fully closed session is not stated
