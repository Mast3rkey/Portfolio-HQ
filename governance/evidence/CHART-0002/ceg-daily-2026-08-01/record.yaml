content:
  visible_facts:
  - 'Watermark text: "nichmasters created with TradingView.com, Aug 01, 2026 14:46 UTC-4"'
  - 'Large semi-transparent overlay text: "CEG, 1D"'
  - 'Company-name watermark beneath it: "Constellation Energy Corporation"'
  - Right-side price axis labeled in $20 increments from roughly 200.00 (partially cut at bottom) to 500.00
  - Dotted line labeled "High 412.70"
  - Dotted line labeled "Low 228.63"
  - Orange dotted-line tag reads "308.53"
  - A magenta/light-teal tag reads "262.75" with "-18.39%" beneath it (percentage shown as negative)
  - Red price tag reads "263.57"
  - Yellow price tag reads "257.98"
  - Volume panel shows a yellow tag "2.71M" and a teal tag "1.85M"
  - Volume-panel bottom row carries green/red "E" hexagons and blue circular "D" icons at several points
    along the chart body
  - A distinct purple/magenta "E" tag with its own dashed vertical line appears past the rightmost candle,
    near the date axis's Aug/Sep boundary -- visually different color from the other "E" markers on this
    same chart
  - Oscillator panel (0-100 axis) shows a purple tag "52.57" and a yellow tag "52.39", with dashed pink
    line near 75 and dashed grey/green lines lower in the panel
  - Bottom sub-panel axis runs 8.00-24.00 with a red line and red tag "11.86"
  - 'Date axis reads: Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep'
  - '"TradingView" wordmark appears bottom-left'
  - Several dashed vertical lines cross the chart, including one distinctly red-colored (near the Nov
    region) and the purple one noted above near the right edge
  observations:
  - Price rises from around 300 near the left edge (Aug) to a peak near the "High" tag's 412.70 level
    around the Oct region, then declines in a sustained downtrend through the region labeled Feb, reaching
    down toward the "Low" tag's 228.63 level
  - After that low, price moves in a choppy, range-bound pattern roughly between 250 and 300 from Mar
    through May, followed by another decline into Jun-Jul, then a modest partial recovery into the final
    candles near 258-264
  - The orange dotted line sits above the candlestick price path for a large stretch of the chart (roughly
    Nov onward), a different relative position than the equivalent orange line in the other four tickers
    reviewed in the same shard, where it stayed below price
  - The overall percent-change tag on this chart is negative ("-18.39%"), unlike some other tickers in
    this batch which showed a positive percentage tag
  - Several tall red volume bars appear scattered through the Feb-Jun region of the volume panel
  - A purple-colored "E" marker with its own dashed vertical line sits beyond the last visible candle,
    near the right edge of the date axis -- a color distinct from the green/red "E" hexagons used earlier
    in the same chart
  inferences:
  - Overlay yellow/red lines are most likely moving averages, inferred from convention -- not labeled
    with a period
  - The orange dotted line's position above the price during the downtrend is consistent with it being
    a slower-moving average lagging above a declining price -- an inference from typical moving-average
    behavior, not a confirmed statement of the indicator's identity
  - The purple/differently-colored "E" marker beyond the last candle is possibly a projected or upcoming
    (not-yet-occurred) earnings-date marker, inferred from its position past the last printed candle and
    its distinct color from the other "E" icons -- not confirmed by any legible text
  - The oscillator panel is likely a bounded momentum indicator, inferred from its 0-100 scale -- not
    named on-image
  - The bottom red-line panel is possibly a volatility measure, inferred from scale/shape -- not labeled
  - '"D" icons likely denote a recurring event type distinct from "E" (possibly dividend-related), inferred
    from convention -- not confirmed'
  uncertainties:
  - No indicator names/parameters are legible for either overlay line, the oscillator, or the bottom panel
  - Reference anchor for the "-18.39%" figure is not stated
  - The precise meaning of the color distinction between the purple "E" marker and the green/red "E" markers
    is not confirmed by any on-image text
  - Timezone convention for "UTC-4" not stated as exchange vs. device time
  - Exact calendar date of the leftmost candle not numerically given
  - Whether the rightmost visible candle is a completed or in-progress session is not stated
  - Precise numeric values of the oscillator's dashed threshold lines beyond the two labeled readouts
    are not printed
