content:
  visible_facts:
  - Center chart watermark text reads "PWR, 1D" with "Quanta Services, Inc." beneath it
  - Right-side price axis (main panel) is numerically labeled from 1,000.00 at top down through gridlines
    to 280.00
  - A gray dotted horizontal line is labeled "High" with value "788.75" on the right-axis tag
  - A gray dotted horizontal line near the bottom of the price range is labeled "Low" with value "363.01"
    on the right-axis tag
  - A magenta/pink dotted horizontal line carries a right-axis tag "667.36" with accompanying text "+72.25%"
    in a teal box above it
  - 'Additional right-axis value tags visible: red box "682.06", yellow box "643.05", orange box "561.12"'
  - 'Three overlay lines run through the candlesticks: a yellow line, a red/maroon line, and an orange
    dotted line (visibly smoother/lower and lags the other two)'
  - Candlesticks are colored teal/green (up) and red (down)
  - A volume histogram panel beneath the price panel shows teal and red vertical bars with a yellow overlay
    line; right-axis tags read "1.96 M" (teal box) and "1.3 M" (yellow box)
  - Small circular markers labeled "E" (green) and "D" (blue) appear periodically along the bottom of
    the volume panel
  - A third panel below volume contains a purple line and a yellow line, with right-axis value tags "54.38"
    (purple) and "39.33" (yellow); the panel's numeric axis is labeled 0.00 to 120.00 in increments of
    20
  - That panel has three dashed horizontal reference lines -- a red/pink line near the top (axis-calibrated,
    against this image's own 0-120-scale gridlines, to approximately 70), a gray/blue-gray line at the
    panel's midpoint (approximately 50), and a green line near the bottom (approximately 30)
  - A fourth, bottom-most panel shows a single red line with a right-axis tag "39.88"; its numeric axis
    is labeled 0.00 to 50.00
  - 'Bottom date axis is labeled: Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep'
  - '"TradingView" wordmark/logo appears in the bottom-left corner of the image'
  - Vertical dashed teal lines cross the full chart height at several points along the timeline
  - A tall isolated red volume spike bar is visible in the volume panel roughly between the "Jun" and
    "Jul" date labels, taller than surrounding bars
  observations:
  - The candlestick series rises from roughly the 400 level near the left (Aug) edge of the chart to a
    peak in the mid-700s to high-780s range around the April-May period, then declines toward the current
    right-edge price in the low-to-mid 600s
  - The yellow and red/maroon overlay lines track close to the candles and cross each other at multiple
    points, while the orange dotted line stays persistently below both and rises more gradually across
    the whole date range
  - The rightmost candle(s) show a green/teal candle following a preceding decline, positioned near the
    magenta "667.36" reference line
  - Volume bars appear generally low and even through most of the timeline, punctuated by isolated taller
    spikes
  - In the purple/yellow oscillator panel, the yellow line's value (39.33) sits below the purple line's
    value (54.38) at the chart's right edge, and the panel shows a shaded green region around the April-May
    period where the purple line exceeds the upper dashed reference band
  - The bottom red-line panel trends generally upward across the full date range, with a visible step
    increase around the June-July period followed by continued gradual rise to its rightmost value
  inferences:
  - The yellow and red overlay lines are most likely short/medium-period moving averages, an inference
    from typical charting convention, not confirmed since no period parameter is printed on the chart
  - The orange dotted line, given its smoothness and greater lag, is likely a longer-period moving average;
    this is an interpretive guess, not a labeled fact
  - The purple/yellow panel with a 0-120-ish scale and a shaded overbought-style region is likely a momentum
    oscillator such as RSI, but no indicator name or period is printed anywhere in the image
  - The bottom red-line panel, given its distinct small numeric scale (0-50) and steady/gradual movement,
    could plausibly be a volatility-style indicator (e.g., ATR), but this is unconfirmed since no label
    is shown
  - The green "E" and blue "D" markers plausibly denote scheduled events (e.g., "E" for earnings, "D"
    for dividend), a common TradingView convention, but no legend or tooltip confirming this is visible
  uncertainties:
  - No indicator names or parameter settings are printed anywhere on the chart for any of the overlay
    lines or the two lower panels
  - The exact numeric values of the moving-average lines at the current (rightmost) candle are not printed/labeled
    anywhere
  - The precise date of the rightmost candle is not individually labeled (only month tick marks are shown)
  - The time zone convention for the date axis is not separately stated beyond the capture-timestamp watermark
    itself
  - The exact meaning/trigger of the "E" and "D" markers is not confirmed anywhere in the image (no legend
    visible)
  - The specific numeric value(s) the tall isolated volume spike bar(s) represent are not printed/labeled
  - Whether any panel uses a logarithmic vs. linear price scale is not indicated on the image
