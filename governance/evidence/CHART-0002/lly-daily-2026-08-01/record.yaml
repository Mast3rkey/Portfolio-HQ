content:
  visible_facts:
  - Large in-chart watermark text reads "LLY, 1D" with subtitle "Eli Lilly and Company."
  - Right-side price axis is labeled in $50 increments from 550.00 to 1,550.00
  - A gray dotted horizontal line is labeled "High 1,249.45"
  - A gray dotted horizontal line is labeled "Low 623.78"
  - A magenta/pink dotted horizontal line carries the label "1,148.84 +45.60%"
  - Three stacked price labels on the right edge read "1,184.11" (yellow box), "1,148.84" (pink/magenta),
    and "1,147.53" (red box)
  - An orange dotted overlay line's current-value label reads "1,024.66"
  - 'Bottom volume panel shows two numeric labels: "2.88M" (teal box) and "2.32M" (yellow box)'
  - Small square markers labeled "E" (green-bordered) and circular markers labeled "D" (blue-bordered)
    appear at multiple points along the volume-panel timeline
  - A third panel below volume contains a purple line and a yellow line on a 0-120 scale, with numeric
    labels "53.80" (yellow box) and "43.36" (purple box)
  - A dashed red horizontal reference line sits near the top of that third panel (~70-80 level) and a
    dashed gray line sits lower (~25-30 level)
  - A fourth, bottom-most panel contains a single red line on an approximately 10-60 scale, labeled "43.50"
  - 'X-axis (date) labels read: Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug -- with
    "2026" rendered in bold'
  - A "TradingView" wordmark/logo appears at the bottom-left of the image
  - Candlesticks are colored teal/green (up) and red/maroon (down) throughout the price panel
  - Volume bars are colored teal and red/maroon, with a yellow line overlay running through the volume
    panel
  - Several vertical dashed lines (light teal and gray) cross all four panels at discrete x-positions,
    coinciding with the "E"/"D" markers
  observations:
  - The yellow and red overlay lines track close to the candlesticks throughout, while the orange dotted
    line runs consistently below price and is visibly smoother/slower-moving than the yellow and red lines
  - A large red candle with a long lower wick appears near the left edge of the chart, extending down
    near the "Low 623.78" line, followed by a multi-month recovery
  - Price is range-bound from around October through April, then rises more steeply from about May onward
    toward the labeled high
  - The rightmost candle is red/down-colored and closes below both the yellow and red overlay lines
  - The tallest single volume bar in the panel occurs near the leftmost "E" marker, noticeably taller
    than surrounding bars
  - The bottom red-line panel rises gradually and steadily across the full date range, without the choppier
    back-and-forth pattern seen in the third (purple/yellow) panel
  - The "E" markers recur at roughly evenly spaced intervals across the timeline, each followed shortly
    afterward by a "D" marker
  inferences:
  - The yellow and red lines overlaid on price are most likely short/medium-period moving averages, an
    inference from common charting convention -- not confirmed, since no period parameter is labeled in-image
  - The orange dotted line is likely a longer-period (e.g., long-term trend) moving average, inferred
    from its smoothness and lag relative to price -- not confirmed by any label
  - The purple/yellow lines in the third panel, given the 0-120 scale and dual-line/reference-band structure,
    are plausibly a stochastic-type oscillator -- an inference from typical TradingView presentation,
    not a confirmed indicator name
  - The bottom red-line panel, given its distinct scale and shape, is possibly a volatility-related measure
    (e.g., something ATR-like) -- an inference only, not labeled
  - The "E" and "D" markers most likely denote scheduled corporate events such as earnings ("E") and dividends
    ("D"), a common TradingView marker convention -- not confirmed by any on-image legend or text
  uncertainties:
  - No moving-average period parameters are shown anywhere in the image
  - The names of the third-panel (purple/yellow) and fourth-panel (red-line) indicators are not labeled
    anywhere in the image
  - The reference point/date basis for the "+45.60%" figure attached to the magenta line is not stated
    in-image
  - The exact date range over which "High 1,249.45" and "Low 623.78" were computed is not stated
  - Whether "E"/"D" markers specifically denote earnings/dividends, versus some other event type, is not
    textually confirmed
  - Individual candle open/high/low/close values are not legible beyond the printed High/Low/current-price
    callouts
  - Whether the displayed UTC-4 timestamp reflects the chart's bar-close convention or only the capture
    time is not stated
