content:
  visible_facts:
  - Top-left watermark text reads "nichmasters created with TradingView.com, Aug 01, 2026 14:33 UTC-4"
  - Large semi-transparent ticker label overlaid mid-chart reads "AMZN, 1D"
  - Company-name watermark beneath the ticker label reads "Amazon.com, Inc" (partially obscured by candles)
  - Right-side price axis is labeled in $10 increments from 200.00 to 310.00
  - A dotted line is labeled "High 278.56"
  - A dotted line is labeled "Low 196.00"
  - A magenta/pink dotted horizontal line carries a green tag reading "271.58" with "+28.17%" beneath
    it
  - A red price tag reads "246.88"
  - A yellow price tag reads "243.86"
  - An orange dotted line carries a tag reading "235.05"
  - Volume sub-panel shows a yellow line labeled "51.75M" and a teal value tag reading "129.05M"
  - Small dark hexagon icons labeled "E" appear at multiple points along the bottom of the volume panel
  - A third (oscillator) sub-panel has a 0-100 axis, a purple tag reading "67.70", and a yellow tag reading
    "47.81"
  - A dashed pink horizontal reference line sits in the oscillator panel near the 67.70 level; a dashed
    green line sits lower in the same panel
  - A fourth (bottom) sub-panel has an axis labeled from 2.00 to 12.00, with a red line and a red tag
    reading "10.68"
  - 'Bottom date axis is labeled: Jul, Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug'
  - '"TradingView" wordmark/logo appears bottom-left of the image'
  - Several thin dashed vertical lines cross the full chart height at irregular intervals, one of which
    is red/pink-colored (the rest teal/gray)
  observations:
  - The candlestick price path rises from roughly the 200-210 area near the chart's left edge (Jul) to
    a peak reaching the labeled High of 278.56 around the May region, then declines into the Jun-Jul area
    before a sharp green candle at the rightmost edge lifts the close back up near the 271.58-tagged line
  - A pronounced sharp downward move occurs in the region labeled "Feb", with the candlestick body dropping
    toward the labeled Low of 196.00, accompanied by a visibly taller red volume bar at the same horizontal
    position
  - The rightmost candle on the chart is a large green (up) candle that is visually taller than most preceding
    candles
  - The yellow and red overlay lines on the price panel move together with the candles at a similar pace,
    while the orange dotted line moves more slowly and stays below price for most of the chart's visible
    history
  - Volume bars are tallest at the points aligned with the "E" hexagon markers
  - The oscillator-panel purple line ends near its own labeled reading of 67.70, close to the dashed pink
    reference line, at the chart's right edge
  inferences:
  - The yellow and red lines overlaid on the candlesticks are most likely short/medium-period moving averages
    -- an inference from typical charting convention, not a confirmed fact, since no period parameter
    is printed anywhere on the chart
  - The orange dotted line is most likely a longer-period moving average, inferred from its smoother,
    slower-reacting shape relative to price -- not confirmed by any visible label
  - The third (0-100 scale) sub-panel is likely a bounded momentum oscillator such as RSI or Stochastic,
    inferred from its scale and dashed reference lines -- the image contains no text naming this indicator
  - The green "E" hexagon icons are likely earnings-date markers, an inference from a common TradingView
    icon convention -- no on-image text confirms this
  - The bottom sub-panel (small numeric range, single red line) is possibly a volatility-related indicator
    such as ATR, inferred from its scale and smooth shape -- not confirmed by a label
  - The green "271.58 / +28.17%" tag most likely represents the latest price and a percent change measured
    from some reference point on the chart -- the anchor point for that percentage is not stated anywhere
    in the image
  uncertainties:
  - No indicator name or numeric parameter (period length, etc.) is legible anywhere for either of the
    two overlay lines or the orange dotted line
  - No indicator name is legible for the oscillator panel or the bottom red-line panel
  - The reference/anchor point used to compute "+28.17%" is not stated
  - Whether the displayed "UTC-4" timestamp reflects exchange time, capture-device local time, or another
    convention is not stated
  - The exact calendar date of the chart's leftmost visible candle is not numerically labeled (only the
    month tick "Jul" is shown)
  - The precise meaning of each individual dashed vertical line (why some are teal/gray and one is red/pink)
    is not labeled
  - Whether any candle beyond the visible right edge exists (i.e., whether Aug 01, 2026 is itself the
    last completed candle or an in-progress one) is not stated
