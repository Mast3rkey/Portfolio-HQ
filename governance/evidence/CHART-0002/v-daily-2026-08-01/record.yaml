content:
  visible_facts:
  - Center chart watermark text reads "V, 1D" with "Visa Inc." beneath it
  - Right-side price axis is numerically labeled from 410.00 at top down through gridlines to roughly
    260.00 at the bottom (spanning into the volume-panel region)
  - A gray dotted horizontal line is labeled "High" with tag value "373.97"
  - A gray dotted horizontal line lower in the panel is labeled "Low" with tag value "293.89"
  - A magenta/pink dotted horizontal line carries a right-axis tag "366.13" with a teal box above it reading
    "+5.19%"
  - 'Additional right-axis value tags visible: yellow box "356.91", red box "340.09", orange box "330.30"'
  - 'Three overlay lines run through the candles: a yellow line, a red/maroon line, and an orange dotted
    line'
  - Candlesticks are colored teal/green (up) and red (down)
  - Volume histogram panel shows teal/red bars with a yellow overlay line; right-axis tags read "7.83
    M" (teal box) and "7.38 M" (yellow box)
  - Green "E" and blue "D" circular markers appear periodically along the bottom of the volume panel
  - A momentum-style panel below volume shows a purple line and a yellow line, right-axis tags "65.07"
    (yellow) and "64.81" (purple); a pink/magenta dashed horizontal line is present near the upper portion
    of this panel, axis labeled 0.00 to 100.00
  - Bottom-most panel shows a single red line with right-axis tag "9.00"; axis labeled 4.00 to 10.00
  - 'Bottom date axis is labeled: Jul, Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug'
  - '"TradingView" wordmark/logo appears bottom-left'
  - Several tall isolated volume spike bars are visible at multiple points along the timeline (e.g., near
    "Oct", "Dec", and a notably tall one near "May")
  - Vertical dashed teal lines appear near the left edge, mid-chart, and again near the right edge
  observations:
  - The candlestick series is relatively range-bound/declining from around the mid-350s near the left
    (Jul 2025) edge down to a trough near the labeled "Low 293.89" around April 2026, followed by a pronounced
    recovery to a new high near the labeled "High 373.97" at the chart's right edge
  - The rightmost candles show a sharp, steep rise in a short span (roughly June through the current right
    edge), visually the steepest sustained up-move on the chart
  - The yellow and red overlay lines cross each other multiple times through the declining first two-thirds
    of the chart, then both turn upward together in the final rising segment
  - The orange dotted line stays close to the yellow/red lines through the first half of the range but
    diverges (stays lower) during the final rising segment
  - Volume bars show several isolated tall spikes scattered through the timeline rather than a smooth/even
    pattern, with the tallest spike appearing around the April-May period near the low-price trough
  - In the purple/yellow oscillator panel, the yellow (65.07) and purple (64.81) lines are nearly equal
    at the chart's right edge, both positioned above the panel's mid-range and near the pink dashed reference
    line
  - The bottom red-line panel shows a declining trend from the left edge down to a mid-chart low, then
    a rise beginning around June continuing to the current right-edge value
  inferences:
  - The yellow and red overlay lines are most likely short/medium-period moving averages, based on typical
    charting convention -- not a printed label
  - The orange dotted line is likely a longer-period/slower moving average, given its relative smoothness
    -- interpretive, not confirmed
  - The purple/yellow panel with a pink dashed reference line is likely a momentum oscillator (e.g., RSI-type)
    with an overbought-style reference level, but no indicator name or period is printed
  - The bottom red-line panel is plausibly a volatility-style indicator (e.g., ATR) given its small distinct
    numeric scale and gradual wave pattern, though unconfirmed
  - The tall volume spike near the April-May trough plausibly coincides with a notable single-session
    price move, but no direct on-image annotation confirms this correspondence
  uncertainties:
  - No indicator names or parameter settings are printed anywhere in the image for the overlay lines or
    the two lower panels
  - Exact numeric values of the moving-average lines at the current candle are not printed
  - The exact date of the rightmost candle is not individually labeled beyond month tick marks
  - The precise meaning of "E"/"D" markers is not confirmed by any on-image legend
  - The exact numeric value of the pink dashed reference line in the oscillator panel is not printed/labeled
  - The exact values represented by the isolated tall volume-spike bars are not printed/labeled
  - Whether the price axis is linear or logarithmic is not indicated
