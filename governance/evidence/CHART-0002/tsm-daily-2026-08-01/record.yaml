content:
  visible_facts:
  - Center chart watermark text reads "TSM, 1D" with "Taiwan Semiconductor Manufacturing Company Ltd"
    beneath it
  - Right-side price axis is numerically labeled from 600.00 at top down through gridlines to roughly
    75.00 at the very bottom (spanning into the volume-panel region)
  - A gray dotted horizontal line is labeled "High" with tag value "479.00"
  - A gray dotted horizontal line lower in the panel is labeled "Low" with tag value "206.20"
  - A magenta/pink dotted horizontal line carries a right-axis tag "404.25" with a teal box above it reading
    "+88.85%"
  - 'Additional right-axis value tags visible: red box "425.75", yellow box "416.10", orange box "357.40"'
  - 'Three overlay lines run through the candles: a yellow line, a red/maroon line, and an orange dotted
    line (persistently below and smoother than the other two across the full date range)'
  - Candlesticks are colored teal/green (up) and red (down)
  - Volume histogram panel shows teal/red bars with a yellow overlay line; right-axis tags read "16.33
    M" (yellow box) and "11.96 M" (teal box)
  - Green "E" and blue "D" circular markers appear periodically along the bottom of the volume panel
  - A momentum-style panel below volume shows a purple line and a yellow line, right-axis tags "42.33"
    (yellow) and "48.06" (purple); a pink/magenta dashed horizontal line and a green dashed horizontal
    line are also present in this panel, axis labeled 0.00 to 100.00
  - Bottom-most panel shows a single red line with right-axis tag "20.71"; axis labeled 0.00 to 30.00
  - 'Bottom date axis is labeled: Jul, Aug, Sep, Oct, Nov, Dec, 2026, Feb, Mar, Apr, May, Jun, Jul, Aug
    -- one month earlier start ("Jul") than some other tickers'' "Aug" start'
  - '"TradingView" wordmark/logo appears bottom-left'
  - A tall isolated blue/teal volume spike bar appears near the "Aug"(2025) tick mark, another near "Feb"
    (2026)
  - A vertical dashed teal line crosses the chart near the right edge, coinciding roughly with the "Aug"(2026)
    date label
  observations:
  - The candlestick series shows a sustained, relatively steady uptrend from around the low-200s near
    the left (Jul 2025) edge to a peak near the labeled "High 479.00" around June-July 2026, followed
    by a pullback toward the current right-edge price in the low-to-mid 400s
  - The orange dotted overlay line remains visibly and consistently below both the yellow and red lines
    throughout the entire date range, with a wider gap in the later (higher-price) portion of the chart
    than in the earlier portion
  - The yellow and red lines cross each other multiple times across the timeline, most visibly around
    the November-December and May-June periods
  - Volume bars are generally moderate through most of the range with occasional taller isolated spikes,
    and the bars near the far right (recent) portion appear somewhat taller/denser than the mid-chart
    region
  - In the purple/yellow oscillator panel, the yellow line (42.33) is below the purple line (48.06) at
    the chart's right edge, and the purple line's peaks earlier in the range approach or briefly cross
    the pink/magenta dashed upper reference line
  - The bottom red-line panel trends generally upward across the full date range, with visible step-like
    increases and no clear decline back to earlier (left-edge) levels
  inferences:
  - The yellow and red overlay lines are most likely short/medium-period moving averages, an inference
    from typical charting convention, not a printed label
  - The orange dotted line is likely a longer-period/slower moving average, given its smoothness and lag
    relative to price -- interpretive, not confirmed
  - The purple/yellow panel with pink and green dashed reference lines is likely a momentum oscillator
    such as RSI with overbought/oversold reference levels, but no indicator name or period is printed
  - The bottom red-line panel is plausibly a volatility-style indicator (e.g., ATR) given its small distinct
    numeric scale and gradual trend, though unconfirmed
  - The extra pink and green dashed lines present in this panel (not clearly present in the same form
    on some other tickers' charts) may indicate a different or additionally-configured reference-level
    setting for this specific chart, but the exact numeric values of those dashed lines are not printed,
    so this is an inference only
  uncertainties:
  - No indicator names or parameter settings are printed anywhere in the image for the overlay lines or
    the two lower panels
  - Exact numeric values of the moving-average lines at the current candle are not printed
  - The exact date of the rightmost candle is not individually labeled beyond month tick marks
  - The precise meaning of "E"/"D" markers is not confirmed by any on-image legend
  - The exact numeric values of the pink and green dashed reference lines in the oscillator panel are
    not printed/labeled
  - The exact values represented by the isolated tall volume-spike bars are not printed/labeled
  - Whether the price axis is linear or logarithmic is not indicated
