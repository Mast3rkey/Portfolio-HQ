# gates.yaml — actionable gates, represented separately from targets.yaml
# per PHQ-2026-02 (governance/decisions/PHQ-2026-02-holdings-reconciliation-and-actionable-allocation-policy.md).
#
# A gated ticker's target capital (its row in targets.yaml's `destination:`)
# is NEVER bought while gated and is NEVER renormalized into any other name's
# target — allocate.py's plan() simply excludes it from buy candidates, so
# its dollars remain represented as ordinary account cash. Existing shares of
# a gated name are held, not force-exited. Activating a gated name (moving it
# out of this file) requires its own separate principal approval per name —
# this filing does not activate any of the six below.
#
# SPCX was the only gated name with an existing position (0.502727 sh) at
# PHQ-2026-02 — its gate entry was retired by PHQ-2026-04 (2026-07-31) after
# a verified manual exit, not activated. See the note below the six entries.
#
# Membership, status, authority, and next_gate text below are transcribed
# verbatim from
# governance/evidence/PHQ-2026-01/final_due_diligence/Portfolio_HQ_Gated_Name_Disposition_v1_32.csv
# (retained under governance/evidence/PHQ-2026-01/) — no gate criterion here
# was invented.

