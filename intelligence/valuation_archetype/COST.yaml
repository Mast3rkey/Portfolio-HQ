rationale: 'Costco is a large, stable, well-covered retailer (933 warehouses; competitors named include
  Amazon, Walmart, Target, BJ''s) with consistent double-digit revenue and net-income growth, near-90%
  worldwide membership renewal rates, and operating cash flow well in excess of capital expenditures --
  characteristics consistent with a mature, diversified-revenue compounder valued by standard DCF/multiples
  (G, primary). The recurring, high-margin membership-fee revenue stream ($5.323B FY2025, funding a structurally
  low-margin bulk-goods retail model) is a distinct, asset-light, recurring-revenue economic layer within
  the business, supporting A as a secondary lens rather than treating Costco as pure-play discount retail
  alone. Archetype-F test: F was not selected: Costco is described as a single warehouse-club retail business
  with a dual-track revenue model (low-margin bulk goods plus recurring membership fees) rather than materially
  distinct reportable segments, so no disclosed basis for a sum-of-the-parts framing exists.'
evidence_quality:
