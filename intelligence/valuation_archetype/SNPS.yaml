rationale: 'Synopsys generates revenue predominantly through software licensing and IP subscriptions within
  an oligopolistic EDA market (~78%+ share held by three players), evidenced by an 83% gross margin, 39.5%
  non-GAAP operating margin, and continued double-digit revenue growth (FY2025 +15% YoY) despite integration
  disruption from the Ansys acquisition -- a classic high-incremental-margin, low-relative-reinvestment-intensity
  software platform profile. Reinvestment shows up mainly as acquisition-funded expansion (Ansys) and
  associated deleveraging (debt reduced from ~$13.5B to ~$10.0-10.8B) rather than ongoing heavy capital
  expenditure. A severe single-day stock decline tied to a Design IP segment revenue miss, guidance cut,
  and disclosed roadmap/resource misjudgments reflects execution risk and customer concentration within
  the licensing model rather than a change in the underlying economic archetype. Archetype-F test: F was
  considered given SNPS''s two reportable segments (Design Automation and Design IP, now including Ansys''s
  multiphysics simulation products) but was not selected as primary because both segments share the same
  underlying software/IP-licensing economic model -- high gross margin (83% in the most recent quarter),
  subscription- and license-based revenue recognition, and a common oligopolistic EDA-market structure
  -- rather than being materially different businesses; the Design IP segment''s 2025 revenue decline
  reflects an operational/execution and customer-concentration issue within that model, not a structurally
  distinct economic driver.'
