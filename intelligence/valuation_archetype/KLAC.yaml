ticker: KLAC
primary_archetype: D
secondary_archetype: A
rationale: 'KLA''s revenue is concentrated (90%+) in process-control/inspection equipment tied to semiconductor
  fabrication capex, and the packet discloses a real, confirmed down year (FY2024 revenue -6.5% vs FY2023)
  directly evidencing sensitivity to the wafer-fab-equipment spending cycle, which argues for cycle-normalized
  rather than trailing-year valuation inputs (archetype D). At the same time, the business exhibits unusually
  high gross margin (62.3% FY2025, the highest reported in this batch), a long track record of dividend
  increases (17 consecutive years), and a backlog-based revenue-visibility disclosure -- features more
  typical of an asset-light, high-incremental-margin equipment/instrumentation model (archetype A), supporting
  it as a secondary lens. Archetype-F test: KLA reports three segments (Semiconductor Process Control,
  Specialty Semiconductor Process, PCB and Component Inspection), so F was considered, but Semiconductor
  Process Control alone is 90.3% of Q3 FY2026 revenue -- one segment overwhelmingly dominates, so the
  business does not present materially diversified segment economics warranting F as primary or secondary.'
evidence_quality:
