rationale: 'KLA''s revenue is concentrated (90%+) in process-control/inspection equipment tied to semiconductor
  fabrication capex, and the packet discloses a real, confirmed down year (FY2024 revenue -6.5% vs FY2023)
  directly evidencing sensitivity to the wafer-fab-equipment spending cycle, which argues for cycle-normalized
  rather than trailing-year valuation inputs (archetype D). No secondary archetype is retained: the business''s
  high gross margin (62.3% FY2025), 17-year dividend-growth record, and backlog-conversion disclosure
  are financial-quality indicators, not evidence of subscription or platform-network economics -- archetype
  A''s actual defining mechanism (protocol §5). KLA is a capital-equipment manufacturer selling discrete
  systems and services, not a recurring-subscription or network-effect platform, so A does not fit as
  a genuine dual-lens beyond the primary D classification. Archetype-F test: KLA reports three segments
  (Semiconductor Process Control, Specialty Semiconductor Process, PCB and Component Inspection), so F
  was considered, but Semiconductor Process Control alone is 90.3% of Q3 FY2026 revenue -- one segment
  overwhelmingly dominates, so the business does not present materially diversified segment economics
  warranting F as primary or secondary either.'
