ticker: AVGO
primary_archetype: F
secondary_archetype: A
rationale: 'Broadcom operates two reportable segments with materially different economics: Semiconductor
  Solutions ($15.1B in Q2 FY2026, including AI accelerator revenue up 143% YoY and dependent on external
  foundry/advanced-packaging capacity) and Infrastructure Software ($7.18B, +9% YoY, built around the
  VMware Cloud Foundation subscription model with reported >87% customer migration and double-digit ARR
  growth). The semiconductor business carries customer-concentration and foundry-dependency risk typical
  of a cyclical, capital-intensive hardware business, while the software segment shows asset-light, high-incremental-margin,
  recurring-revenue characteristics. This segment-level divergence supports F as primary, with A as a
  secondary lens on the software segment''s distinct recurring-revenue profile. Archetype-F test: F was
  considered and selected as primary: Broadcom''s Semiconductor Solutions segment (custom AI accelerators,
  networking silicon, foundry-dependent) and Infrastructure Software segment (VMware Cloud Foundation
  subscription platform, $7.18B/+9% YoY) have materially different, separately disclosed segment economics,
  supporting a sum-of-the-parts framing over a single blended valuation.'
evidence_quality:
  primary_source_coverage: partial
  uncertainty_statement: The ~$73B AI-semiconductor backlog figure and the Google TPU agreement through
    2031 are secondary-sourced (aggregated analyst/trade coverage) and were not independently verified
    against a primary contract or filing.
disclosed_evidence_conflicts:
- Secondary reporting simultaneously frames the VMware Cloud Foundation transition as driving double-digit
  ARR growth and as generating customer backlash over 5x-10x list-price increases with elevated churn
  risk; the evidence does not resolve which framing will dominate.
