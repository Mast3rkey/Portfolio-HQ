rationale: 'ICE operates CFTC-designated derivatives clearing organizations (ICE Clear Credit, ICE Clear
  U.S., ICE Clear Europe) and the SEC-regulated NYSE national securities exchange -- regulated financial-market
  infrastructure explicitly named as a defining example of archetype C, where capital-structure and regulatory-capital
  considerations make a standard FCFF-DCF theoretically inappropriate and sector-specific multiples/excess-return
  framing are favored instead. The Fixed Income & Data Services segment adds a growing subscription-like
  annuity (recurring revenue $531M in Q2 2026, +10% YoY), while Mortgage Technology -- from the 2023-closed
  Black Knight acquisition -- has shown GAAP operating losses in recent periods (Q1 2026: -$13M GAAP operating
  income) attributed to acquisition-related debt service and amortization, a materially different economic
  profile from the regulated-exchange core. This segment divergence supports F as a secondary, sum-of-the-parts
  lens without displacing C as the governing archetype for the company''s largest, most structurally distinctive
  segment. Archetype-F test: F was considered given ICE''s three segments (Exchanges, Fixed Income & Data
  Services, Mortgage Technology) showing materially different economics -- regulated derivatives clearing/exchange
  infrastructure, a growing subscription-like data annuity, and a software segment still absorbing acquisition-related
  integration losses (Mortgage Technology posted -$13M GAAP operating income in Q1 2026) -- supporting
  a secondary sum-of-the-parts view; however, the core, largest-revenue segment (Exchanges, including
  CFTC-designated clearing organizations and the SEC-regulated NYSE) is a textbook financial-market-infrastructure
  business, so C was selected as primary.'
