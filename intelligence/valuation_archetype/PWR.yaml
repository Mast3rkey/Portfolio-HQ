rationale: 'Quanta is fundamentally a labor/contract-services business whose revenue is directly tied
  to multi-year grid, data-center, and utility capital-spending buildouts (the AEP $72B 2026-2030 capital
  plan, record backlog growing from $34.5B to $48.5B+), which is the defining trait of the infrastructure/industrial
  archetype even though its capital intensity is expressed through labor/backlog rather than owned heavy
  assets. It also carries a genuine, growing secondary manufacturing capability (power transformers, modular
  electrical systems via CEI) that reinforces rather than displaces this framing, since that manufacturing
  directly supports the same buildout-driven demand curve. Working-capital dynamics typical of a scaling
  percentage-of-completion contractor (unbilled receivables growing faster than earnings) and fixed-price
  execution risk further argue for reinvestment/backlog-sensitive valuation framing over a simple blended-multiple
  approach. Archetype-F test: F was considered given Quanta''s 2025 segment-reporting split into Electric
  Infrastructure Solutions and Underground Utility and Infrastructure Solutions, which carry materially
  different margins (Q1 2026: 8.7% vs. 7.5%; Q4 2025: 10.8% vs. 7.7%). It was not selected as primary
  because both segments share the same underlying economic mechanism -- labor-intensive, fixed-price/MSA
  infrastructure construction and maintenance contracting with roughly 80% recurring base work -- rather
  than fundamentally distinct business models, so a single reinvestment/backlog-driven framing is more
  defensible than treating them as economically separate entities.'
evidence_quality:
