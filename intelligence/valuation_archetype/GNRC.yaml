rationale: 'Generac''s own disclosed history shows severe, demonstrated boom-bust cyclicality tied to
  power-outage/storm activity -- net sales up over 50% in 2021, down roughly 12% in 2023, diluted EPS
  falling from $8.51 to $3.31, and operating margin nearly halving from 19.9% to 9.6%, with FY2025 Residential-segment
  sales explicitly attributed to weak outage activity -- making a trailing or current-year figure unrepresentative
  and a normalized/mid-cycle basis the standard approach (archetype D). A secondary capital-intensive-infrastructure
  lens (B) is warranted by the disclosed manufacturing-capacity buildout (Enercon acquisition, Belvidere
  and Sussex/Oshkosh expansion) funding a new, higher-reinvestment C&I data-center backup-power growth
  leg with a $1.6 billion disclosed order backlog. The business remains predominantly a hardware/equipment-revenue
  model with no quantified recurring/subscription share disclosed, reinforcing that this is not an asset-light
  recurring model. Archetype-F test: F was considered given Generac''s 2026 segment reorganization into
  Residential and Commercial & Industrial (C&I), which carry different demand drivers (storm/outage-driven
  residential demand vs. secular data-center/hyperscale C&I growth), but the packet discloses only revenue
  splits, not materially different segment margin/economics, so F was not selected as primary or secondary;
  the dominant, evidence-grounded driver of both segments remains cyclical, event-driven equipment demand.'
