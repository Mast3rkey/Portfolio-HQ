ticker: MSFT
primary_archetype: F
secondary_archetype: A
rationale: 'Microsoft''s three reportable segments show real, disclosed margin and business-model divergence
  (Productivity and Business Processes at roughly 58% operating margin vs. More Personal Computing at
  roughly 26%), each large enough to matter on its own, which is the direct evidentiary basis for archetype
  F. At the same time, the dominant characteristics across all three segments -- and especially the fastest-growing
  Intelligent Cloud/Azure business -- remain software- and cloud-subscription-like: high recurring revenue,
  an AI business already exceeding a stated $37B annual run rate, and substantial free-cash generation
  ($94.6B cash/short-term investments, funding capex, buybacks, and dividends simultaneously) -- consistent
  with archetype A as a secondary lens, notwithstanding real and disclosed AI-infrastructure capital intensity
  pressuring cloud gross margin. Archetype-F test: F was considered and selected as primary: Microsoft
  reports three segments with materially different economics -- Productivity and Business Processes (FY2025
  operating margin ~57.8%), Intelligent Cloud (~42.0%), and More Personal Computing (~25.9%) -- each individually
  representing tens of billions of dollars in revenue, with genuinely distinct demand drivers (productivity
  software/LinkedIn, cloud/AI infrastructure, and consumer devices/gaming/search), supporting a sum-of-the-parts
  view over a single blended multiple or entity-level DCF.'
evidence_quality:
  primary_source_coverage: comprehensive
  uncertainty_statement: FY2025 segment revenue/operating-income data underlying the F/A call was directly
    inspected by an independent evidence-recovery researcher (GPT-5.6 Thinking) from Microsoft's own FY2025
    Annual Report and FY2026 Q3 earnings release, with two further investor-relations pages rendered directly
    by this implementation session; a standalone SEC Form 10-K/10-Q was not separately inspected, a disclosed
    but non-load-bearing gap for the segment-structure-driven archetype call.
