schema_version: '1.0'
ticker: ASML
primary_archetype: B
secondary_archetype: D
rationale: 'ASML''s own permitted evidence discloses that its long (12-24 month) order-to-delivery lead
  time structurally smooths recognized revenue relative to the broader wafer-fab-equipment order cycle
  -- guidance and order timing, not recognized revenue itself, carry the demonstrated volatility (the
  October 2024 guidance cut produced an approximately 16% single-day stock decline without evidence of
  a corresponding sustained revenue decline in the record reviewed). This is capital-intensive-infrastructure
  economics, not raw commodity-cycle economics: ASML is the sole commercial EUV supplier building constrained,
  multi-year capacity (fewer than 20 High-NA systems/year, a wholly-owned EUV light-source subsidiary,
  an exclusive multi-decade optics relationship with Zeiss) into a structural, multi-year AI-driven fab-capex
  buildout, with FY2026 guidance raised twice on ''extremely strong'' order intake and high, stable gross
  margins (52.8%-54.0%) -- a reinvestment-and-buildout-driven profile fitting archetype B as primary,
  where ROIC/reinvestment framing is the necessary companion to DCF given demonstrated guidance-timing
  sensitivity. The underlying demand driver is nonetheless a real semiconductor-capex cycle: the same
  permitted evidence explicitly ties the guidance cut to delayed customer orders, and ASML''s own 2026
  discontinuation of quarterly bookings disclosure means a future cyclical downturn may now surface later
  (via revenue/guidance) rather than earlier (via bookings) than under the prior disclosure regime --
  supporting D as a secondary lens on that order-timing/cyclical risk, without displacing B as primary,
  since the evidence does not show the sustained revenue-cycle sensitivity D''s definition centers on.
  Archetype-F test: not applicable -- ASML is described as a single, focused lithography-systems business
  with two revenue streams (system sales and Installed Base Management) rather than materially distinct
  reportable segments, so no diversified/multi-segment economics are disclosed that would support sum-of-the-parts.'
evidence_quality:
  primary_source_coverage: limited
  uncertainty_statement: No primary document (annual report, 20-F, or earnings release) was directly opened
    by any researcher for this record -- every figure, including the order-timing-versus-revenue-stability
    facts underlying this archetype call, traces to WebSearch-returned snippet synthesis; TSMC's customer-concentration
    percentages are additionally unresolved against ASML's own 20-F.
disclosed_evidence_conflicts:
- A single, unattributed 29.1% China-sales figure surfaced once in search synthesis, inconsistent with
  the multiply-corroborated 14% Q2 2026 figure; it was not traced to any specific document and is not
  treated as a credible open conflict, but is disclosed here for completeness.
