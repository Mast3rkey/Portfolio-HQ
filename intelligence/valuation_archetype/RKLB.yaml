schema_version: '1.0'
ticker: RKLB
primary_archetype: E
secondary_archetype: F
rationale: 'RKLB has posted a net loss every year since inception through FY2025, continues to guide to
  further losses, and is funding growth through large and repeated ATM share issuances (a $1B program
  followed by a new $3B program) -- cash flow is not yet stable or predictable. Its flagship growth catalyst,
  the medium-lift Neutron vehicle, has not yet flown, making near-term company trajectory dependent on
  an unresolved technical/commercial milestone rather than an established, extrapolatable cash-flow base.
  The Space Systems segment and growing government backlog (Space Development Agency, NSSL Lane 1, Golden
  Dome) show real and growing revenue, but company-wide profitability remains negative and forward-looking.
  This combination of pre-profitability, pipeline/milestone dependency, and a not-yet-flown core product
  is the defining characteristic of the early-stage/binary-outcome archetype. Archetype-F test: F was
  considered given RKLB''s two genuinely distinct segments -- Launch Services (an operating, revenue-generating
  rocket business plus the not-yet-flown Neutron) and Space Systems (satellite component/spacecraft manufacturing
  assembled through a series of acquisitions) -- which have different underlying economics and were assigned
  as a secondary archetype rather than primary, because the company''s overall financial profile (net
  losses every year since inception, active dilution, an unproven medium-lift vehicle) is currently dominated
  by binary-outcome/early-stage characteristics that cut across both segments rather than segment diversification
  being the defining valuation challenge. A third, larger, structurally different business -- Iridium''s
  operating satellite-communications network and licensed spectrum -- is disclosed in the permitted portfolio-relationship
  context as the subject of a signed, pending acquisition that would shift the company toward space-infrastructure
  operation if completed. Because the transaction has not closed, is not reflected in any reported segment
  structure, and its regulatory/shareholder-approval progress remains outstanding per the permitted evidence,
  it is deliberately disclosed and excluded from this current-state archetype and F-test rather than treated
  as a third economic driver -- an exclusion made explicit here, not a silent omission, and one that should
  be revisited once the deal closes and its economics are reflected in reported segment results. The pending
  deal itself reinforces rather than weakens the E-primary call in the interim: a large, unclosed, still-conditional
  transaction pending regulatory and shareholder approval is itself a binary (may-or-may-not-close-as-structured)
  element layered on top of the existing pre-profitability and unproven-Neutron considerations.'
evidence_quality:
  primary_source_coverage: limited
  uncertainty_statement: This session's primary-source access was completely blocked for every domain
    attempted, multiple load-bearing figures (total Electron mission count, current shares outstanding)
    are internally inconsistent across the secondary sources available, and the pending, unclosed ~$8B
    Iridium acquisition -- not yet reflected in any reported segment structure -- adds a further, currently
    unresolved layer of forward uncertainty to this classification.
