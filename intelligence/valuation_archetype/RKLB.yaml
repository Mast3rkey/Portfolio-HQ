rationale: 'RKLB has posted a net loss every year since inception through FY2025, continues to guide to
  further losses, and is funding growth through large and repeated ATM share issuances (a $1B program
  followed by a new $3B program) -- cash flow is not yet stable or predictable. Its flagship growth catalyst,
  the medium-lift Neutron vehicle, has not yet flown, making near-term company trajectory dependent on
  an unresolved technical/commercial milestone rather than an established, extrapolatable cash-flow base.
  The Space Systems segment and growing government backlog (Space Development Agency, NSSL Lane 1, Golden
  Dome) show real and growing revenue, but company-wide profitability remains negative and forward-looking.
  This combination of pre-profitability, pipeline/milestone dependency, and a not-yet-flown core product
  is the defining characteristic of the early-stage/binary-outcome archetype. Archetype-F test: F was
  considered given RKLB''s two genuinely distinct segments -- Launch Services (an operating, revenue-generating
  rocket business plus the not-yet-flown Neutron) and Space Systems (satellite component/spacecraft manufacturing
  assembled through a series of acquisitions) -- which have different underlying economics and were assigned
  as a secondary archetype rather than primary, because the company''s overall financial profile (net
  losses every year since inception, active dilution, an unproven medium-lift vehicle) is currently dominated
  by binary-outcome/early-stage characteristics that cut across both segments rather than segment diversification
  being the defining valuation challenge.'
