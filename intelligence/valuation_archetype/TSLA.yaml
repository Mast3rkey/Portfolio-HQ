rationale: 'The evidence shows three reported segments with different margin trajectories (automotive
  gross margin ex-credits fell to 16.3%, energy segment margin fell sharply to 20.4% from 39.5%) alongside
  emerging, explicitly binary/pre-commercial businesses: Optimus production was reported near zero with
  the CEO himself calling 2026 output ''literally impossible to predict,'' and Robotaxi operates under
  an active, unresolved NHTSA safety investigation (EA26002) covering ~3.2 million vehicles. The company''s
  own governance structure -- a ~$1 trillion CEO compensation package gated on operational milestones
  including 1 million Optimus units and 1 million robotaxis operating -- makes explicit that a material
  share of the equity story rests on these unproven, approval-gated outcomes rather than the mature automotive/energy
  base. Free cash flow turned negative in the most recent quarter alongside sharply rising capex, consistent
  with a capital-intensive core business layered with speculative optionality rather than one uniform
  economic engine. Archetype-F test: F was considered and selected as primary: Automotive (record $20.52B
  quarterly revenue but compressing margin, now largely reliant on core vehicle economics as regulatory-credit
  revenue collapses), Energy Generation & Storage (capital-intensive, multi-year Megafactory buildout),
  and Services & Other (record profitability/margin) are materially different businesses that a sum-of-the-parts
  approach would separate rather than blend into one multiple. E is flagged as a secondary given the explicit,
  evidence-grounded valuation dependence on unproven, binary-outcome ventures layered on top of those
  core segments -- Robotaxi and Optimus -- whose economics are not yet stable enough for a single blended
  DCF.'
