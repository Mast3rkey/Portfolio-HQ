rationale: 'Lilly''s current economics are dominated by a fast-growing, high-margin, patent-protected
  drug franchise (incretin revenue +90% YoY, key products 68% of Q1 2026 revenue) with volume-driven growth
  on an already-established, profitable, positive-cash-flow base -- characteristics consistent with high-incremental-margin,
  asset-light-style recurring franchise economics once a product is approved and launched (archetype A).
  No secondary archetype is retained: archetype E is defined at the level of a company whose cash flow
  is ''not yet stable, predictable, or positive'' -- Lilly''s own permitted evidence shows the opposite
  (56% YoY revenue growth, an already-commercial, profitable franchise). The disclosed pipeline-stage
  acquisitions (Orna, Centessa, Kelonia, Ajax), Foundayo''s new safety-label burden, and the unresolved
  patent-exclusivity dates are ordinary, disclosed risk factors on an already-commercial business, not
  evidence that Lilly''s own cash flow is early-stage or binary in the way archetype E''s definition requires
  -- they are captured as disclosed risk and uncertainty within the archetype-A framing rather than a
  distinct secondary archetype. Archetype-F test: F was not considered as a live candidate: the packet
  describes Lilly''s current revenue as extremely concentrated (68% of Q1 2026 revenue from a small set
  of key incretin products) rather than diversified across materially distinct segments, so a sum-of-the-parts
  framing was not indicated by the disclosed evidence.'
evidence_quality:
  primary_source_coverage: partial
  uncertainty_statement: Precise product-by-product patent and regulatory-exclusivity dates for the incretin
    franchise are not established in this record's evidence base, leaving the multi-year exclusivity runway
    unverified.
