ticker: LLY
primary_archetype: A
secondary_archetype: E
rationale: 'Lilly''s current economics are dominated by a fast-growing, high-margin, patent-protected
  drug franchise (incretin revenue +90% YoY, key products 68% of Q1 2026 revenue) with volume-driven growth
  on an already-established, profitable base -- characteristics consistent with high-incremental-margin,
  asset-light-style recurring franchise economics once a product is approved and launched (archetype A).
  However, the packet also discloses meaningful binary/pipeline-dependent elements bearing on forward
  value: a just-approved product (Foundayo) carrying a boxed warning and real safety/monitoring burden,
  four pipeline-stage acquisitions announced in a single quarter requiring integration, and explicitly
  unresolved patent/exclusivity-date evidence for the existing franchise -- these argue for scenario/probability-weighted
  treatment as a necessary companion (archetype E) rather than a single-path projection of current growth.
  Archetype-F test: F was not considered as a live candidate: the packet describes Lilly''s current revenue
  as extremely concentrated (68% of Q1 2026 revenue from a small set of key incretin products) rather
  than diversified across materially distinct segments, so a sum-of-the-parts framing was not indicated
  by the disclosed evidence.'
evidence_quality:
  primary_source_coverage: partial
  uncertainty_statement: Precise product-by-product patent and regulatory-exclusivity dates for the incretin
    franchise are not established in this record's evidence base, leaving the multi-year exclusivity runway
    unverified.
