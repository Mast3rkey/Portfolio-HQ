rationale: 'SPGI''s four (post-Mobility-spin) reported segments show materially different margin profiles
  -- Indices 68-70%, Ratings 64-65%, Energy 40-46%, Market Intelligence only 19-33% -- indicating genuinely
  distinct business economics rather than one unified engine, which is the direct evidentiary basis for
  treating this as diversified (F) rather than homogeneous. Re-examined against protocol §5''s literal
  archetype-C definition -- financial intermediation / network economics, where a business''s OWN capital
  structure and regulatory-capital requirements make a standard FCFF-DCF theoretically inappropriate because
  financing flows are the business itself, not a residual claim on operating cash flow: S&P Global Ratings
  has no such balance-sheet or financing-flow economics of its own -- it holds no loan book, deposits,
  or float requiring its own regulatory capital treatment. Its moat is a regulatory-license (NRSRO/ESMA)
  requirement that OTHERS rely on its ratings for their own capital calculations -- a licensing/market-structure
  barrier, not archetype C''s own defining mechanism. Ratings, Indices, and Market Intelligence instead
  share fee-based, asset-light, high-incremental-margin licensing/subscription/data economics (Indices''
  AUM-linked fees on a record $6.35T of linked ETF assets, Ratings'' per-issuance/subscription fee model,
  Market Intelligence''s data/AI-monetization push) -- consistent with archetype A as the better-fitting
  secondary lens across these three higher-margin segments, while Energy (the lowest-margin, most commodity/geopolitically-exposed
  segment, +3% YoY growth attributed to the Iran conflict) is the segment most responsible for the genuine
  diversification finding underlying the F-primary call. Archetype-F test: F was considered and selected
  as primary: the four reported segments'' materially different margin profiles (19% to 70%) indicate
  genuinely distinct business economics rather than one unified engine, which supports a sum-of-the-parts
  framing over a single blended multiple or entity-wide DCF.'
