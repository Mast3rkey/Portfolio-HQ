rationale: 'SPGI''s Ratings segment (~36% of FY2025 revenue) fits the ratings-agency category explicitly
  named under archetype C, built on regulatory-license (NRSRO/ESMA) moats embedded in bond covenants and
  regulatory capital rules -- a fee structure distinct from a subscription or platform business. Indices
  (68-70% margin, AUM-linked fees, record $6.35T of linked ETF assets) and Market Intelligence (lower,
  more variable 19-33% margin, pursuing AI-monetization) behave more like asset-light data/subscription
  businesses. The wide margin dispersion across segments (19% to 70%) is the direct evidentiary basis
  for treating this as diversified rather than homogeneous. Ratings'' distinct regulatory-license economics
  justify C as a secondary lens on the segment that most resembles the taxonomy''s financial-intermediation
  examples. Archetype-F test: F was considered and selected as primary: the four (post-Mobility-spin)
  reported segments show materially different margin profiles -- Indices 68-70%, Ratings 64-65%, Energy
  40-46%, Market Intelligence only 19-33% -- indicating genuinely distinct business economics rather than
  one unified engine, which supports a sum-of-the-parts framing over a single blended multiple or entity-wide
  DCF.'
evidence_quality:
  primary_source_coverage: partial
  uncertainty_statement: Segment revenue figures rely on a secondary aggregation that initially omitted
    the Commodity Insights/Energy segment entirely and, even after correction, remains unverified against
    the primary 10-K (WebFetch blocked on sec.gov).
disclosed_evidence_conflicts:
- Big Three ratings-agency market-share splits are reported inconsistently across sources (~50%/31%/12%/7%
