rationale: 'Visa is explicitly a payment network -- a category the taxonomy names directly under archetype
  C -- and just as explicitly states it is not a financial institution, does not issue cards, extend credit,
  or set account-holder rates, distinguishing its network-toll-road economics from a lender''s balance-sheet-driven
  business. At the same time, the disclosed financials show a genuinely asset-light structure: FY2025
  operating cash flow of $23.059B against only $1.482B of property/equipment/technology purchases, with
  large-scale capital return via buybacks and dividends, resembling the high-incremental-margin, low-reinvestment-intensity
  profile the taxonomy associates with archetype A. Client incentives (a $15.751B contra-revenue deduction,
  ~28% of gross revenue) function as a real competitive cost specific to network relationships, reinforcing
  the network-economics framing over a pure subscription-platform read, hence C as primary with A recognized
  secondarily for the asset-light capital profile. Archetype-F test: F was considered but not selected:
  Visa''s four revenue categories (service, data-processing, international-transaction, other) are different
  volume-linked fee streams within one unified network business (VisaNet), not segments with materially
  different underlying economics, so a sum-of-the-parts framing is not supported by this evidence.'
