ticker: WM
primary_archetype: B
secondary_archetype: F
rationale: 'WM''s core economics are explicitly infrastructure-like: landfill permitting is described
  as extremely difficult to newly obtain in most jurisdictions, making the existing ~262-site network
  a structurally scarce, effectively irreplaceable asset base, reinforced by a disclosed $3 billion 2022-2026
  growth-capital program funding new recycling and renewable-natural-gas facilities. This combination
  of long asset lives, high reinvestment intensity, and utility-like recurring demand (20M+ customers)
  is the defining characteristic. The Healthcare Solutions segment (from the Stericycle acquisition) shows
  a materially different, lower disclosed margin (19% vs. ~30.9% consolidated adjusted EBITDA margin)
  and its own integration and synergy-target history, supporting a secondary diversified/multi-segment
  read without displacing the dominant landfill-network infrastructure economics. This B-over-F ordering
  rests on a qualitative reading of the core business''s dominant character, not on a precise revenue-mix
  percentage: WM''s own permitted evidence explicitly states its FY2025 line-of-business revenue breakdown
  could not be reconciled to a single, complete, non-overlapping accounting, so no specific ''majority
  of revenue'' figure is asserted or relied upon here -- the B-primary call instead rests on the landfill
  network''s structural scarcity and permitting-barrier characteristics, which are independently disclosed
  and not dependent on the unreconciled percentage breakdown. Archetype-F test: F was considered and selected
  as secondary: the Stericycle-derived Healthcare Solutions segment (medical/regulated waste) is described
  with its own distinct margin trajectory (adjusted operating EBITDA margin expanding from 17% to 19%)
  and integration history separate from the core landfill/collection business, and Renewable Energy is
  another distinct, fast-growing line -- but the core landfill/transfer/collection network is described
  with dominant, structurally scarce infrastructure characteristics independent of the unreconciled revenue-mix
  figures, so B was selected as primary rather than F.'
evidence_quality:
  primary_source_coverage: limited
  uncertainty_statement: WM's FY2025 revenue could not be reconciled to a single, complete, non-overlapping
    segment or line-of-business breakdown from any combination of secondary sources available this session
    -- the packet explicitly instructs treating every revenue-mix figure as partial and directionally
    indicative only.
disclosed_evidence_conflicts:
- Q2 2026 net income is reported inconsistently across sources ($785M vs. $786M); two different debt-to-EBITDA
  figures are cited for different quarters; the Stericycle deal's original synergy target ('exceeding
  $125 million') and the later-cited '>$300 million by end of 2027' target could not be reconciled or
  traced to a documented revision.
