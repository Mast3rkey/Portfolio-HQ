    whole -- it is never split into a per-legacy-identifier answer, per this methodology's own binding
    design. Per CLAUDE.md's own Workflow section, the entire deposit-to-allocation cycle begins with cash
    or buying power ('I deposit money and report buying power... run python allocate.py --cash X for a
    cash deposit') -- cash-like capital requires no conversion or liquidation step before it can fund
    a newly identified opportunity, unlike a market-traded instrument that would first need to be sold.
    Both legacy structural identifiers this family combines carry an already-sealed liquidity_character
    finding (cited by structural reference only, never restated as an independent finding here). This
    determination makes no claim about whether deploying this capital right now is advisable, and does
    not evaluate CASH or RESERVE separately.
