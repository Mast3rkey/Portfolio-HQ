analytical_subject: GLD
deployability_and_optionality:
  deployability_category: high_optionality_low_friction
  rationale: 'GLD is a normal, ungated canonical destination row (targets.yaml, asset_class: fund) with
    no allocator-level gate or lockup of any kind -- confirmed by direct inspection, gates.yaml carries
    zero mentions of GLD. Per CLAUDE.md''s own Workflow section, this tool never places orders -- every
    position, GLD included, is executed manually by the operator on Robinhood, meaning holding GLD imposes
    no structural barrier to redirecting that capital toward a different future opportunity whenever the
    operator chooses to act. GLD''s own sealed ETF classification record independently establishes it
    as a high-liquidity, actively-traded instrument (structural reference below, consumed by reference
    only, never restated). This determination concerns optionality only -- it makes no claim about whether
    redirecting capital out of GLD is currently advisable.'
instrument_specific_economic_characterization: &id001
  cost_and_tracking_economic_significance:
    significance_category: elevated_vs_category
    rationale: GLD's own sealed ETF classification record discloses its expense ratio as a structural
      fact (consumed here by reference only, never restated as a bare figure). Sourced comparison against
      other major physically-backed gold-trust ETFs -- iShares Gold Trust (IAU), abrdn Physical Gold Shares
      (SGOL), and SPDR Gold MiniShares (GLDM) -- found GLD's own expense ratio is meaningfully higher
      than every one of those three peers, each of which is also a direct, physically-backed gold-holding
      structure in GLD's own fund category. This is a categorical cost comparison against same-category
      peers, never a numeric cost-savings or hurdle-rate calculation.
  historical_inflation_sensitivity:
    sensitivity_category: historically_mixed_or_inconsistent
    rationale: Sourced academic and financial-press material presents a genuinely mixed, horizon-dependent
      picture rather than a single consistent relationship. Several cited studies find gold has functioned
      as a positive, effective inflation hedge over long horizons (multi-decade, and specifically horizons
      exceeding roughly ten years), with the relationship shaped by major historical episodes (the 1970s
      oil shock and its disinflation, the 2008 crisis and subsequent quantitative easing, and the COVID-era
      monetary response). Other cited sources, covering shorter windows since the early 1970s, describe
      the correlation with headline inflation as inconsistent, time-varying, and on the whole not statistically
      reliable over shorter periods. This record discloses both findings rather than silently reconciling
      them -- the evidence genuinely diverges by measurement horizon, and no single clean characterization
      is supportable from what was located.
  historical_equity_drawdown_behavior:
    behavior_category: historically_mixed
    rationale: Sourced material covering three separate historical episodes shows a genuinely mixed pattern,
      not a clean hedge relationship. During the acute panic phase of the 2008 financial crisis, gold
      fell sharply alongside equities (a substantial peak-to-trough decline around the Lehman Brothers
      collapse) before ending that year roughly flat and then rising materially over the following several
      years, while broad equity indices fell far further during the crisis itself. During the March 2020
      pandemic-driven crash, gold likewise sold off initially alongside equities before recovering within
      months and reaching new highs later that same year, a year in which broad equities also recovered.
      During the 2022 broad equity decline, cited material describes gold as comparatively stable rather
      than falling in step with equities. The pattern across all three episodes is initial co-decline
      during acute liquidity panics, with divergence (sometimes positive, sometimes merely stable) emerging
      afterward or in episodes without an acute liquidity-panic character -- not a reliable, uniform negative-correlation
      relationship.
    single_asset_disclosure: This finding characterizes gold's own historical price behavior in isolation
      during past equity-market drawdown episodes -- a single-asset, historical characterization only.
      It does not compute, constitute, imply, or substitute for a whole-portfolio diversification-benefit
      or correlation finding specific to Portfolio-HQ's own current holdings; that remains the separate,
      still-forced-abstention job of the overlap model's defensive_offset_interface dimension.
