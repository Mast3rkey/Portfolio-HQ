capital_use_type: DEBT_REDUCTION
schema_version: '1.0'
functional_role:
  role_category: leverage_reduction
hard_constraint_status:
  binding: true
  constraint_source: 'CLAUDE.md Portfolio Doctrine: the 1.8x gross/equity structural leverage cap and
    30% margin-buffer floor, hard cutoff -- before any margin-funded purchase, the system checks the most
    recently synced, Robinhood-displayed buffer against the 30% floor; a buffer already below 30% blocks
    the purchase outright and is treated as a forced de-leverage signal of the same severity as the cash-tight
    guardrail'
economic_assessment_readiness:
  avoided_borrowing_cost_readiness:
    status: assessment_required
    rationale: No governed methodology exists to compare the return foregone or gained by reducing margin
      debt against deploying the same capital elsewhere -- an opportunity-cost/return-shaped question
      XASSET-0005 SS3.5 keeps structurally distinct from survivability_and_buffer_benefit_readiness below,
      never blended into one figure. CLAUDE.md's own margin-interest doctrine ('~5% APR... a guaranteed
      cost, not something to optimize around -- it's a hurdle rate, not a variable') is cited as existing
      context, never restated here as a computed comparison.
  survivability_and_buffer_benefit_readiness:
    status: assessment_required
    rationale: 'No governed methodology exists to assess how a margin-debt change affects the account''s
      risk posture relative to the 1.8x leverage cap and 30% buffer floor -- a risk/survival-shaped question,
      distinct in kind from the opportunity-cost question above per XASSET-0005 SS3.5''s full rationale
      (the same return-versus-survival distinction CLAUDE.md''s own trim_backtest.md Decisions Log entry
      already applies: ''the unlevered backtest was able to remain invested through its worst moment,
      a levered account may not have that same latitude'').'
liquidity_character:
