freshness_state:
  status: unable_to_determine_freshness
  as_of_reference: holdings.yaml margin.synced_at (2026-07-31) was considered as a candidate reference
    point but not relied upon as the governing freshness citation -- see abstention_reason. No persisted
    classify_margin_state() run artifact and no standalone governance decision recording a margin-state
    sync exist in this repository today.
  abstention_reason: holdings.yaml's own margin.synced_at field is a live operational-tracking field,
    populated by the same 'allocate.py update-margin' command that also writes the live debt/buffer values
    themselves, sitting in the same file, with no accompanying governance decision or independent review
    of its own -- structurally different in kind from a standalone governed artifact (e.g. an accepted
    governance decision, or a persisted classify_margin_state() run record, neither of which exists for
    margin state today). Treating it as this record's freshness reference point risks blurring exactly
    the line XASSET-0005 SS3.6's contamination rule draws between citing that a governed mechanism exists
    and citing an account-specific live-state field. freshness_state therefore abstains (unable_to_determine_freshness)
    rather than resolving this genuinely open question unilaterally, per XASSET-0006 SS C.2.
