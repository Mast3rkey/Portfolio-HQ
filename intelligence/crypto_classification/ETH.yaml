network_fundamentals:
  consensus_mechanism: proof_of_stake
  adoption_trend_category: growing_usage
economic_model:
  supply_model: disinflationary_schedule
  fee_accrual_applicable: true
  fee_accrual_basis: Under EIP-1559, the base transaction fee is permanently burned (removing ETH from
    circulating supply on every block), while priority fees ("tips") and MEV accrue to proof-of-stake
    validators. Over the 90 days to 2026-07-27, validators earned roughly 254,000 ETH in issuance while
    base-fee burns removed only about 5,200 ETH, leaving net supply growth of roughly +0.21% for that
    window -- the burn is demand-sensitive (rising with network activity, fading when activity softens),
    so the net issuance/burn balance genuinely varies period to period rather than following a fixed schedule
    like Bitcoin's halving.
  staking_applicable: true
  staking_basis: Native proof-of-stake staking currently yields approximately 2.78-3.3% APY (figures vary
    by source and measurement date) across roughly 897,000-1,240,000 active validators. Staked ETH climbed
    from approximately 35.6 million ETH (January 1, 2026) to approximately 39.7 million ETH (June 15,
    2026) -- roughly 23-32% of the ~121.7 million ETH circulating supply, depending on the specific measurement
    date and source. Liquid-staking protocol Lido alone holds an approximately 47.4-61.7% share of the
    liquid-staked-ETH market (figures vary by source), with its own TVL reported in the $27.6-32 billion
    range.
liquidity_and_market_structure:
  liquidity_tier: high_liquidity
  market_structure_notes: Approximately $229 billion market capitalization as of 2026-08-07 (ranked second
    by market capitalization among all cryptocurrencies), with reported 24-hour trading volume in the
    approximately $7-9 billion range (figures vary modestly by data provider). Ethereum DeFi total-value-locked
    rose 4.11% over the trailing 30 days to approximately $41.54 billion as of 2026-08-06, with Ethereum
    accounting for roughly 13.7% of all on-chain DEX volume globally on that date. Broadly listed across
    major centralized and decentralized exchanges.
