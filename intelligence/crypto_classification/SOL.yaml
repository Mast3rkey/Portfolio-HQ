schema_version: '1.0'
instrument_id: SOL
asset_type: cryptocurrency
network_fundamentals:
  consensus_mechanism: other_consensus
  consensus_basis: Solana combines Proof of History (PoH) -- a verifiable, tamper-proof clock/ordering
    mechanism giving every validator the same transaction-ordering record without constant inter-validator
    messaging -- with Tower BFT proof-of-stake voting for consensus among validators (reported at roughly
    1,300 active validator nodes as of an April 2025 data point; a more current 2026 count was not located).
    This hybrid design is materially different from a "plain" proof-of-stake network and is itself scheduled
    for a major architecture change -- the Alpenglow upgrade, which passed validator governance in September
    2025 with 98.27% approval, is expected to remove Proof of History from the consensus process and replace
    Tower BFT entirely, targeted for mainnet via the Agave 4.1 release in late 2026.
  adoption_trend_category: growing_usage
economic_model:
  supply_model: disinflationary_schedule
  fee_accrual_applicable: true
  fee_accrual_basis: 50% of every base transaction fee is burned (removing SOL from circulating supply),
    while the remaining 50% of base fees plus all priority fees and MEV accrue to validators/stakers.
    Two pending governance proposals disclosed as of this record's evidence date would materially change
    this mechanism if adopted -- SIMD-0553 would introduce resource-based transaction fees and lift daily
    SOL burns from roughly 650 to as many as 9,000 coins, and SIMD-0550 would accelerate the disinflation
    schedule so the network reaches its 1.5% terminal inflation rate by 2029 rather than 2032 -- recorded
    here as pending, not yet adopted.
  staking_applicable: true
  staking_basis: Native SOL staking currently yields approximately 5.5% APY (inflation-based rewards supplemented
    by a share of base fees, priority fees, and MEV), down from roughly 5.9% earlier in Q2 2026, with
    roughly two-thirds of circulating supply currently staked across the validator set.
liquidity_and_market_structure:
  liquidity_tier: high_liquidity
  market_structure_notes: Market capitalization reported in the approximately $41.8-47 billion range depending
    on measurement date (e.g., ~$41.77 billion on 2026-06-03; ~$47 billion in a separate February 2026
    data point), with billions of dollars in daily trading volume (~$3.61 billion 24-hour volume against
    the ~$47 billion February 2026 figure). A genuine dispersion is disclosed rather than averaged away
    -- venue-specific decentralized-exchange volume dropped approximately 82% within a two-week window
    in May 2026 (from roughly $104.3 billion to $18.8 billion weekly), concentrated in meme-coin-driven
    trading on a single venue (Meteora), even as broader network-usage metrics (active addresses, transaction
    throughput) reached or approached all-time highs over the same general period -- overall trading liquidity
    and single-venue DEX volume are genuinely distinct facts here, not interchangeable.
custody_and_counterparty_risk:
  custody_model: exchange_custodied
  smart_contract_risk_category: smart_contract_platform_material_surface
correlation_and_volatility:
  historical_volatility_category: extreme_volatility
  cross_coin_correlation_status: not_yet_measured
regulatory_and_structural_uncertainty:
  disclosed_regulatory_matter_exists: true
  matter_summary_and_citation: On 2026-03-17, the SEC and CFTC jointly issued interpretive guidance formally
    classifying Solana -- together with 15 other digital assets including Bitcoin and Ethereum -- as a
    digital commodity rather than a security under federal law, ending a multi-year period of regulatory
    ambiguity. The same guidance's disclosed staking-specific interpretation states that staking activities
    on proof-of-stake networks (directly applicable to Solana) are not securities transactions, covering
    self-staking, self-custodial staking with a third party, custodial arrangements, and liquid staking.
    A further, separate formal rulemaking proposal (reported at 400+ pages) was expected within weeks
    of the guidance to provide additional implementation detail and safe-harbor provisions. The same guidance
    explicitly does not resolve the CFTC's own regulatory authority over digital-commodity spot markets
    and intermediaries -- multiple law-firm analyses describe this gap as requiring further rulemaking
    and, most likely, congressional action to fully resolve.
  structural_uncertainty_category: disclosed_and_unresolved
evidence_quality:
  primary_source_coverage: partial
  thesis_uncertainty_statement: The primary source attempted for this record (solana.com) was blocked
    by this environment's network egress policy and could not be directly inspected; every fact below
    rests on WebSearch-aggregated secondary sources, cross-corroborated across multiple independent outlets
    where possible. The most current validator-count figure located (~1,300, April 2025) predates this
    record's evidence date by more than a year -- a genuine, disclosed evidence gap rather than an assumed-current
    figure. The consensus_mechanism classification of "other_consensus" (rather than a bare "proof_of_stake")
    is this record's own drafting judgment, made because Solana's Proof of History layer is a materially
    distinct architectural feature from a plain proof-of-stake design, not a claim that any external source
    disputes Solana's proof-of-stake foundation.
