regulatory_and_structural_uncertainty:
  disclosed_regulatory_matter_exists: true
  matter_summary_and_citation: On 2026-03-17, the SEC and CFTC jointly issued interpretive guidance formally
    classifying Bitcoin -- together with 15 other digital assets including Ethereum and Solana -- as a
    digital commodity rather than a security under federal law, ending a multi-year period of regulatory
    ambiguity and enabling new ETF product categories. A further, separate formal rulemaking proposal
    (reported at 400+ pages) was expected within weeks of the guidance to provide additional implementation
    detail and safe-harbor provisions. The same guidance explicitly does not resolve the CFTC's own regulatory
    authority over digital-commodity spot markets and intermediaries -- multiple law-firm analyses describe
    this gap as requiring further rulemaking and, most likely, congressional action to fully resolve.
  structural_uncertainty_category: disclosed_and_unresolved
