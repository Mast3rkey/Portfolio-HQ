    by this environment's network egress policy and could not be directly inspected; every fact below
    rests on WebSearch-aggregated secondary sources, cross-corroborated across multiple independent outlets
    where possible. A genuine, disclosed tension exists in the current adoption evidence -- the network's
    hash rate exceeded 1 exahash/second in mid-2026 (security participation at or near all-time highs),
    while active-address counts were separately reported at year lows, the lowest level since December
    2024 -- recorded here as declining_or_stagnant_usage on the specific adoption_trend_category vocabulary
