scenario_evidence:
  scenarios:
  - scenario_name: Custom AI accelerator (XPU) customer concentration
    variables:
    - variable_name: custom_ai_accelerator_(xpu)_customer_concentration
      evidence_basis: Broadcom has disclosed deep collaboration with six hyperscale customers on custom
        AI XPUs (reportedly including Google, Meta, OpenAI, Anthropic, and possibly Apple per one unconfirmed
        source). Secured a ~$11B order from Anthropic for late-2026 delivery; management cited 'line of
        sight' to over $100B of AI-chip revenue in 2027 -- customer concentration in a small hyperscaler
        set is a disclosed risk factor in secondary commentary.
      provenance_label: historically_observed
  - scenario_name: VMware integration
    variables:
    - variable_name: vmware_integration
      evidence_basis: Management has targeted more than doubling VMware's EBITDA to $8.5B within three
        years of the November 2023 close, framed as enabling a full-stack silicon-to-virtualization offering.
      provenance_label: historically_observed
uncertainty_summary: 'All figures secondary/search-aggregation-sourced; no primary document directly opened.
  Two structural discontinuities affect this whole record: the VMware acquisition (closed Nov 22 2023,
  purchase price reported inconsistently as ~$61B vs. ''$69 billion'' in a separate headline, not reconciled)
  and a 10-for-1 forward stock split effective Jul 15 2024, which falls mid-way through FY2024 itself.
  FY2021/FY2022 net income are derived from margin percentages rather than directly reported dollar figures
  and are lower-confidence as a result; FY2021/FY2022 diluted EPS were not reported at all given unresolved
  uncertainty about the underlying split-adjustment. FY2025 total debt carries a large, unresolved, disclosed
  discrepancy between a FY2025-fiscal-year-end figure and a later, materially larger figure from an early-2026
  quarter -- only the FY2025-dated figure is used here. Segment operating income (as opposed to revenue)
  was not found for either segment.'
