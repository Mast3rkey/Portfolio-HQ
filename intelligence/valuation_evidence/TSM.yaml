  abstention_reason: No dedicated discount-rate-component research (risk-free rate, cost of debt, tax
    rate, capital-structure weights, beta observation) was conducted in this evidence-gathering pass --
    this domain requires a separate research effort beyond the financial-statement, market-price, segment,
    peer-candidate, and catalyst/scenario research performed here.
peer_set_evidence:
  candidates:
  - identity: ASML
    comparability_rationale: Critical lithography-equipment supplier to TSM, not a direct manufacturing
      competitor but tightly linked in the value chain.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
scenario_evidence:
  scenarios:
  - scenario_name: Arizona fab expansion
    variables:
    - variable_name: arizona_fab_expansion
      evidence_basis: Up to 12 fabs planned; additional $100B+ committed for at least 4 more 2nm fabs;
        second Phase-2 Arizona fab volume production pulled forward to 2H2027 citing strong/urgent demand
        from US customers.
      provenance_label: historically_observed
  - scenario_name: CoWoS advanced-packaging capacity
    variables:
    - variable_name: cowos_advanced-packaging_capacity
      evidence_basis: CoWoS advanced packaging was the primary AI-chip production bottleneck through 2025,
        running at full capacity; TSMC is accelerating CoWoS/InFO/SoIC expansion.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  TSM reports in NT$; the annual revenue/net-income trend above is in TWD as reported, with a single disclosed
  USD-equivalent figure for FY2025 revenue only (two sources disagreed by ~0.4%, not reconciled). A reported
  cash balance figure ('~$94.67B', apparently EUR-labeled for a Taiwan company) was found to be evidently
  garbled and is not used -- cash is abstained from the balance sheet items above as a result. Full-year
  operating cash flow was not found (only a single quarter's figure). Diluted EPS in TWD (2023/2024) was
  not found and is omitted rather than guessed. No IPO/spin-off/restructuring affects TSM's own 5-year
  comparability.
