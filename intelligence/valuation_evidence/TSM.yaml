segment_evidence:
  segments: []
  abstention_reason: TSM does not disclose dollar-denominated business segments in the classic sense;
    it discloses revenue mix by technology node (3nm 24%, 5nm 36%, 7nm 14%, mature/16nm+ 26% of FY2025
    revenue) and by platform (HPC 57%, Smartphone 30%, IoT 5%, Automotive 5%, DCE 1%, Other 2%) -- percentage-of-revenue
    mix data, not the dollar-value segment table this schema's segment_evidence domain expects.
