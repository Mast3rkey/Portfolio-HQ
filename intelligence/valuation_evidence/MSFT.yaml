scenario_evidence:
  scenarios:
  - scenario_name: OpenAI partnership and Azure commitment
    variables:
    - variable_name: openai_partnership_and_azure_commitment
      evidence_basis: MSFT holds a 27% equity stake in OpenAI (reported value ~$135B), restructured to
        a non-exclusive commercial partnership through 2032; on Oct 28 2025 OpenAI signed a definitive
        agreement to purchase an incremental $250B of Azure services beyond existing commitments.
      provenance_label: historically_observed
  - scenario_name: AI capex trajectory and disclosure litigation
    variables:
    - variable_name: ai_capex_trajectory_and_disclosure_litigation
      evidence_basis: FY2026 capex is running well above one cited analyst-consensus figure (a ~$35B beat,
        ~$25B attributed to component price inflation per one source, though this conflicts with the $115.9B
        actual capex figure above and is not reconciled); a Michigan pension fund sued MSFT in Seattle
        federal court (June 2026) alleging misleading disclosures about Azure growth deceleration and
        AI infrastructure spending pressure.
      provenance_label: historically_observed
uncertainty_summary: 'All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2022 and FY2025 net income and FY2025 revenue/operating-income figures are rounded/approximate rather
  than exact-to-the-million. Balance sheet cash is the weakest-sourced item: one source''s pure-cash figure
  ($32,105M, unclear date) was not reconciled against a separate combined cash+short-term-investments
  figure ($78.272B); total debt ($125.4B) traces to a single, uncorroborated source. FY2026 capex ($115.9B
  actual, reported) conflicts with a separate, larger guidance-based figure found elsewhere; both are
  disclosed rather than one being silently chosen. Microsoft has reported under the same three-segment
  structure for the entire FY2022-FY2026 window shown, so the data should be comparable across all five
  years.'
