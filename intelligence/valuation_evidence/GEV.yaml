uncertainty_summary: 'All figures secondary/search-aggregation-sourced; no primary document directly opened.
  This is the weakest-covered record in this population pass: GE Vernova has existed as a standalone public
  company only since approximately April 2024 (spun off from General Electric) -- the exact spin-off date
  was not independently re-confirmed this session -- meaning at most ~1.5-2 completed fiscal years of
  clean standalone history exist, nowhere near the general 5-year target. This is the disclosed IPO/spin-off
  shortened-history exception under VALUATION-0005 SS C.1, applied for a genuine structural limitation.
  FY2024 standalone revenue/net-income/EPS were not found this session (a real gap, this research session''s
  search budget was exhausted before it could be located) and are therefore also absent from this record
  -- only the single available FY2025 period is populated. Segment revenue, balance-sheet detail beyond
  cash, capex, D&A, diluted share count, and current stock price/market cap were all not found and are
  abstained rather than estimated.'
