  - scenario_name: da Vinci 5 cardiac clearance
    variables:
    - variable_name: da_vinci_5_cardiac_clearance
      evidence_basis: FDA clearance (Jan 22 2026 investor call) for da Vinci 5 use in several cardiac
        procedures (mitral valve repair, ASD/PFO closure) using non-Force-Feedback instruments.
      provenance_label: historically_observed
  - scenario_name: Tariff exposure
    variables:
    - variable_name: tariff_exposure
      evidence_basis: Q3 2025 non-GAAP gross margin outlook incorporated an estimated ~0.7% of revenue
        tariff impact.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; WebFetch was blocked for every
  finance domain attempted, so no primary document (10-K/press-release PDF) was directly opened by this
  research session. Full-year diluted EPS was not confirmed for any fiscal year despite multiple search
  attempts -- only quarterly EPS points surfaced, and summing quarterly EPS is not a valid annual figure
  given share-count weighting, so diluted EPS is omitted from this record rather than estimated. Cash-and-investments
  figures across two sources were not fully reconciled to each other (different scopes -- short-term-only
  vs. total). No IPO/spin-off/restructuring affects ISRG's own 5-year comparability.
