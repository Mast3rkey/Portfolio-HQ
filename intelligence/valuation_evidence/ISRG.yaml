- domain: segment_evidence
  reason: ISRG does not report classic business segments; it discloses revenue by product category (Instruments
    & Accessories / Systems / Service). A clean full-year dollar breakdown across all three categories
    was not found despite searching -- only partial data (e.g. I&A revenue +19% YoY, system placement
    counts) surfaced.
- domain: discount_rate_evidence
  reason: No dedicated discount-rate-component research (risk-free rate, cost of debt, tax rate, capital-structure
    weights, beta observation) was conducted in this evidence-gathering pass -- this domain requires a
    separate research effort beyond the financial-statement, market-price, segment, peer-candidate, and
    catalyst/scenario research performed here.
