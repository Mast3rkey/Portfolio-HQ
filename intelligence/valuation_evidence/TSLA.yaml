peer_set_evidence:
  candidates:
  - identity: F
    comparability_rationale: Ford / GM / Toyota (traditional automakers) -- legacy ICE/hybrid manufacturers
      now building EVs; useful for auto-industry multiples but a very different growth/margin profile
      than TSLA.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
  - identity: BYDDY
    comparability_rationale: BYD -- largest EV maker by global unit volume (reported ~17.1% global EV
      share vs. Tesla), direct EV competitor with a China-centric geographic mix.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
  - identity: RIVN
    comparability_rationale: Rivian -- much smaller (~$20B market cap reported) pure-play EV startup,
      an early-growth rather than scale comparable.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
scenario_evidence:
  scenarios:
  - scenario_name: Robotaxi/FSD rollout
    variables:
    - variable_name: robotaxi/fsd_rollout
      evidence_basis: Unsupervised robotaxi service active in Austin (full metro, ~245 sq mi) plus expansion
        confirmed to Dallas and Houston as of late April 2026, with additional cities (Phoenix, Miami,
        Orlando, Tampa, Las Vegas) targeted for H1 2026 -- some of this reflects company guidance rather
        than confirmed completed rollout, disclosed as mixed-quality sourcing. ~700,000 paid robotaxi
        miles logged since the June 2025 launch.
      provenance_label: historically_observed
  - scenario_name: Energy storage growth and deliveries
    variables:
    - variable_name: energy_storage_growth_and_deliveries
      evidence_basis: Q2 2026 energy storage deployments of 13.5 GWh, up over 40% YoY from 9.6 GWh in
        Q2 2025; SpaceX purchased $269M of Megapacks in April 2026 for xAI data-center power in Memphis.
        FY2025 vehicle deliveries were ~1.64M, a second consecutive annual decline, though Q2 2026 deliveries
        rebounded to 480,126 units (+25% YoY), the first quarterly YoY growth since the 2023 sales peak.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2023 net income includes a disclosed one-time $5.9B tax benefit and is not directly comparable to
  other years without adjustment (a non-GAAP-adjusted ~$10.9B figure was separately reported for that
  year). Some search results returned stale market-cap figures ($1.46-1.49T) from apparently older articles;
  the most recently-dated observation ($328.58/$1.26T, Aug 8 2026) was used instead and the rejected stale
  figures are disclosed here rather than silently discarded. FY2025 shares outstanding is a year-end issued-share
  count, not the weighted-average diluted count actually used to compute EPS.
