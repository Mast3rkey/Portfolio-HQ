      evidence_basis: $4.5B charge in Q1 FY2026 tied to H20 excess inventory/purchase obligations as China
        demand collapsed under export restrictions; a reported Malaysia/Singapore/UAE subsidiary routing
        pathway for Blackwell/Rubin chips was reportedly closed by the Commerce Department in May 2026.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  NVDA executed a 10-for-1 stock split effective June 2024 -- diluted EPS figures found for FY2022-FY2024
  appear to be PRE-SPLIT scale while FY2025-FY2026 figures are POST-SPLIT scale, a material comparability
  discontinuity; diluted EPS is therefore omitted from this record entirely rather than reported inconsistently
  across the split boundary (revenue and net income, unaffected by the split, are reported normally).
  FY2026 net income and FY2026 operating income both trace to single-source synthesis and were not independently
  corroborated from a second source, though internal consistency checks (FCF, price x shares) are directionally
  supportive.
