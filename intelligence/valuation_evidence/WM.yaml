        no WM-specific dollar figure was found this session.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  WM's Nov 2024 Stericycle acquisition (~$7.2B EV) is the dominant comparability event in this record
  -- FY2025 is the first full year including it, while FY2024 and earlier largely predate it. Full-year
  segment revenue/operating-income detail is a genuine, disclosed gap (only quarterly figures were found
  for each segment). Balance-sheet cash is several months stale relative to any fiscal-year-end figure.
  FY2025 net income being lower than FY2024's despite higher revenue and operating income is disclosed
  as a real pattern without a fully verified explanation.
