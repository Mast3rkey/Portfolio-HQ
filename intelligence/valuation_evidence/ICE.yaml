scenario_evidence:
  scenarios:
  - scenario_name: Pending MarketAxess acquisition
    variables:
    - variable_name: pending_marketaxess_acquisition
      evidence_basis: Announced ~Jul 30 2026, $167/share, $5.7B enterprise value, unanimous board approval
        on both sides, expected close H1 2027 pending shareholder/regulatory approval.
      provenance_label: historically_observed
  - scenario_name: Black Knight acquisition
    variables:
    - variable_name: black_knight_acquisition
      evidence_basis: Completed September 2023, $13.1B deal value, forms the core of the ICE Mortgage
        Technology segment alongside prior Ellie Mae (2020), Simplifile (2019), and MERS (2018) deals
        -- a major restructuring event limiting clean pre/post comparability for that segment.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  ICE's own net-revenue convention (net of transaction-based expenses) is used consistently for the revenue
  trend above; a separate gross-revenue figure found for 2025 was not reconciled and is disclosed, not
  used. FY2025 segment revenue was not located (only FY2024's), so segment_evidence reflects FY2024 with
  that limitation disclosed. ICE's own 'adjusted free cash flow' methodology does not reconcile to a simple
  OCF-minus-capex calculation and the gap is disclosed rather than resolved. Current market capitalization
  is a low-confidence derived estimate, since the only directly reported figure found was several months
  stale.
