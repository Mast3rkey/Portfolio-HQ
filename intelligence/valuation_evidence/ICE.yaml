    value: 149.84
    unit: usd_per_share
    as_of_date: '2026-08-09'
    value_basis: reported
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, current stock price
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
        limitation: Aug 5 2026. A market cap figure of $89.14B was dated March 2026 (stale); a derived
          current estimate at this price x ~572M shares is ~$85.7B (derived, low confidence).
