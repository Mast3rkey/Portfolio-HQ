scenario_evidence:
  scenarios:
  - scenario_name: AWS/AI capex trajectory
    variables:
    - variable_name: aws/ai_capex_trajectory
      evidence_basis: CEO guided ~$220B cash capex for 2026, up from an originally-planned ~$200B (~$20B
        increase attributed to rising memory prices); Trainium in-house AI chips have deals with Anthropic/OpenAI,
        with early exploratory conversations about offering Trainium to customers outside AWS's own cloud.
      provenance_label: historically_observed
  - scenario_name: FTC antitrust litigation
    variables:
    - variable_name: ftc_antitrust_litigation
      evidence_basis: FTC and 18 state Attorneys General's monopoly-power suit against Amazon; bench trial
        now scheduled for Feb 9 2027, delayed from an earlier October 2026 date (Amazon lost its bid to
        keep the earlier date).
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 net income is moderate-confidence only (the underlying snippet was internally contradictory,
  cross-checked via EPS-implied share count instead). AMZN executed a 20-for-1 stock split effective June
  2022 -- FY2021 EPS is not reported in this record to avoid a pre/post-split comparability trap (revenue
  and net income, unaffected by the split, are reported normally). AMZN's own reported capex and the capex
  figure implied by OCF minus FCF disagree by ~$3.5B, disclosed rather than reconciled. A materially wrong-looking
  aggregator claim about total debt ($209.88B) and net debt ($66.18B net DEBT) was investigated and explicitly
  rejected in favor of a directly-reported-component-based derivation showing AMZN in a net CASH position
  instead.
