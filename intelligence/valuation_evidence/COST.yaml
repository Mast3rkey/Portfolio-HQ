segment_evidence:
  segments: []
  abstention_reason: Costco discloses three geographic segments (US, Canada, Other International) but
    only growth percentages (US +9%, Canada +6%, Other International +8% for FY2025) and a qualitative
    statement ('US and Canadian operations accounted for 86% of net sales and 84% of operating income')
    were found -- no precise dollar-value segment breakdown was located.
market_observed_evidence:
  inputs:
  - input_name: observed_share_price
    value: 950.5
    unit: usd_per_share
    as_of_date: '2026-08-09'
    value_basis: reported
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, current stock price
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
        limitation: '~Aug 6 2026 (reported range ~$949-952); market cap ~$422.1B (sanity check: 444.8M
          shares x $951 = ~$423B, consistent).'
discount_rate_evidence:
  abstention_reason: No dedicated discount-rate-component research (risk-free rate, cost of debt, tax
    rate, capital-structure weights, beta observation) was conducted in this evidence-gathering pass --
    this domain requires a separate research effort beyond the financial-statement, market-price, segment,
    peer-candidate, and catalyst/scenario research performed here.
peer_set_evidence:
  candidates:
  - identity: WMT
    comparability_rationale: Walmart (including Sam's Club) -- largest general/warehouse retailer, direct
      membership-club overlap via Sam's Club, trades at a lower multiple than Costco per one source (~31x
      vs. ~40x earnings).
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
  - identity: BJ
    comparability_rationale: BJ's Wholesale Club -- closest pure-play warehouse-club peer, smaller footprint,
      trades at a materially lower multiple.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
  - identity: TGT
    comparability_rationale: Target -- a weaker structural comparable than Walmart/BJ's for a membership
      warehouse model, since it is a general-merchandise retailer rather than a warehouse club.
    provenance:
      sources:
      - source_identifier: WebSearch aggregation, candidate peer identification
        source_type: secondary
        as_of_date: '2026-08-09'
        access_status: consulted_via_search_aggregation
    as_of_date: '2026-08-09'
    inclusion_status: included
    inclusion_rationale: Disclosed as a comparability candidate only; no peer set has been selected or
      applied to any valuation.
scenario_evidence:
  scenarios:
  - scenario_name: Membership fee growth and renewal trends
    variables:
    - variable_name: membership_fee_growth_and_renewal_trends
      evidence_basis: FY2025 membership fee revenue grew 10.3% YoY to $5,323M (Q4 fee income +14% YoY
        to $1,724M); company guiding to ~9.1% fee growth in FY2026. Worldwide renewal rate eased slightly
        to 89.8% from 90.2%, attributed partly to a mix shift toward online sign-ups.
      provenance_label: historically_observed
  - scenario_name: E-commerce growth
    variables:
    - variable_name: e-commerce_growth
      evidence_basis: FY2025 e-commerce sales exceeded $19.6B, +15.6% YoY, ~7.3% of total sales -- an
        eighth straight quarter of 10%+ e-commerce growth; the company added deferred-payment/installment
        financing via Affirm. Warehouse count reached 914 locations after 24 net new openings in FY2025
        (15 US, 2 Canada, 7 Other International).
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 operating margin is abstained -- only a rounded operating-income figure was found. FY2025 operating
  margin required resolving a genuine prior conflict between a 3.77% derived figure and a previously-circulated,
  unreliable 3.14% figure that does not reconcile against any fiscal year's reported numbers -- 3.77%
  (total-revenue basis) is used, with the rejected figure disclosed rather than silently dropped. Precise
  dollar-value geographic segment data was not found (only growth percentages and a qualitative statement).
