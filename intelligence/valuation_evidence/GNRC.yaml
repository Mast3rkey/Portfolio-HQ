segment_evidence:
  segments: []
  abstention_reason: The only segment figures found ('Domestic revenue $1.07B +20% YoY, International
    revenue $187.5M -1% YoY') appear to be a single quarter's results mislabeled as full-year -- $1.07B
    + $187.5M is far short of the $4.21B FY2025 total. Flagged as likely bad/mislabeled data and not used,
    rather than reported as fact.
