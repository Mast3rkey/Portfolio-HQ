scenario_evidence:
  scenarios:
  - scenario_name: Hyperscale data-center backup power deal
    variables:
    - variable_name: hyperscale_data-center_backup_power_deal
      evidence_basis: Generac announced (Jun 2026) a global supply agreement with a major/unnamed hyperscale
        data-center operator to supply backup power generators -- a real, disclosed new demand vector
        distinct from its traditional residential/storm-driven business. Also raised 2026 net sales growth
        guidance to 'mid-to-high teens %' from a prior 'mid-teens' guidance, partly citing data-center/C&I
        demand.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 diluted EPS is abstained as an unreliable, aggregator-derived figure. FY2025 free cash flow and
  capex are trailing-twelve-month figures with an ambiguous exact period basis, not confirmed as clean
  FY2025-standalone numbers, disclosed as such. Segment revenue is abstained entirely -- the only figures
  found appear to be a mislabeled single quarter, not a genuine full-year breakdown, and using them would
  risk presenting bad data as fact. Note that Briggs & Stratton, a candidate peer named in the original
  research brief, is not a current public comparable (acquired by KPS Capital Partners and delisted) and
  is correctly excluded from the peer list above.
