        settlement's legal-immunity protection.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 revenue and net income are low-confidence derived estimates, reverse-engineered from later years'
  stated growth rates rather than directly reported. FY2025 revenue is abstained entirely -- the only
  figure found was internally inconsistent with the prior-year base and not reported as fact. FY2025 net
  income required catching and rejecting an apparent AI-search-synthesis fabrication ($22.03B/EPS $11.22)
  in favor of an internally-consistent, corroborated figure ($20.1B/EPS $10.20) -- a concrete instance
  of the verify-before-trusting-an-external-inference discipline this repository's own guardrails require.
  Segment structure is not asserted since it was not independently confirmed by search this session.
