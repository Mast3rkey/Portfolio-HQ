scenario_evidence:
  scenarios:
  - scenario_name: Pratt & Whitney GTF powder-metal engine issue
    variables:
    - variable_name: pratt_&_whitney_gtf_powder-metal_engine_issue
      evidence_basis: A 2023-disclosed contamination issue in powder metal used for certain PW1100 GTF
        engine parts (powers the A320neo family) triggered an accelerated inspection/removal campaign.
        RTX took a ~$3B pre-tax charge in Q3 2023, with total projected gross costs of $6-7B over several
        years. As of late October 2025, the global count of stored/grounded GTF-powered aircraft reportedly
        reached 835 (up from 748 mid-2025); Q1 2026 saw a reported 15% decline in groundings as maintenance
        capacity ramped. Some analyst commentary projects full fleet recovery not until 2027 or later
        -- this remains an active, material, ongoing operational and cash-flow issue for Pratt & Whitney
        specifically.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  RTX was formed by the April 2020 Raytheon-UTC merger and renamed from Raytheon Technologies to RTX Corporation
  in July 2023 -- FY2021/FY2022 revenue was not found and only net income is reported for those years;
  FY2020 (a net-loss merger/integration year) and any pre-merger standalone Raytheon/UTC data are excluded
  entirely as not comparable. The large GAAP-vs-adjusted-EPS gap each period is a direct, disclosed consequence
  of merger purchase-accounting amortization, not an anomaly. Collins Aerospace's segment operating-profit
  figure carries a specific, disclosed low-confidence flag (anomalously low implied margin, possibly a
  parsing error).
