        Electric segment year-end backlog alone was $36.2B (record).
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2025 diluted EPS carries a genuine, unresolved two-source conflict ($6.80 vs $6.91), disclosed rather
  than resolved; total debt has a similar unreconciled discrepancy across dates. PWR restructured its
  reportable segments in Q1 2025 (three segments to two) -- the FY2025 Underground and Infrastructure
  segment's full-year revenue was not found (only a Q3 2025 quarterly figure), so only the Electric segment
  is populated in segment_evidence above; this is a partial, disclosed gap, not a full domain abstention,
  since at least one genuine segment figure is available.
