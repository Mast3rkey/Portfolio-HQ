scenario_evidence:
  scenarios:
  - scenario_name: AI capex trajectory
    variables:
    - variable_name: ai_capex_trajectory
      evidence_basis: META raised FY2026 capex guidance to $130-145B (narrowed from a prior $125-145B
        range), citing higher component pricing and data-center buildout costs.
      provenance_label: historically_observed
  - scenario_name: Antitrust/regulatory posture
    variables:
    - variable_name: antitrust/regulatory_posture
      evidence_basis: META prevailed in the FTC's antitrust case challenging its Instagram/WhatsApp acquisitions;
        EU Digital Markets Act 'pay-or-consent' pressure and youth-related litigation remain live regulatory/legal
        risks.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced (accessed via WebSearch's own retrieval
  layer, not a directly-opened primary document -- SEC.gov and Meta's own IR pages were blocked for direct
  fetch). FY2025 net income is lower than FY2024's despite higher operating income; the specific tax mechanism
  driving that is disclosed as unverified. Pure cash-only balance (vs. combined cash+marketable-securities)
  and a sourced FY2025 buyback dollar figure were not found. META's current two-segment structure (Family
  of Apps/Reality Labs) has been used since 2021, so all five years shown are internally comparable; pre-2021
  historicals under the prior single-segment structure would not be.
