scenario_evidence:
  scenarios:
  - scenario_name: Neutron rocket development
    variables:
    - variable_name: neutron_rocket_development
      evidence_basis: First orbital launch has slipped multiple times; as of the most recent (Jul 2026)
        reporting, Rocket Lab is targeting Q4 2026 for first flight, after a January 2026 tank failure
        removed an earlier window. Program cost originally guided at $250-300M, but delays mean cumulative
        spend was reported at likely ~$360M by end of 2025. Structural-test qualification and the Wallops
        Island, VA launch site are reported complete.
      provenance_label: historically_observed
  - scenario_name: Pending Iridium acquisition
    variables:
    - variable_name: pending_iridium_acquisition
      evidence_basis: Announced Jun 29 2026 -- Rocket Lab to acquire Iridium Communications for ~$8.0B
        enterprise value, a cash-and-stock deal at $54.00/share for Iridium common stock, with $3.6B in
        acquisition financing from Deutsche Bank and Wells Fargo. Reported 'expected to close next year'
        (2027) -- not yet closed as of this research. Rationale reported as vertical integration, combining
        launch and satellite manufacturing with Iridium's L-band spectrum/network and subscriber base.
      provenance_label: historically_observed
  - scenario_name: Government contract backlog
    variables:
    - variable_name: government_contract_backlog
      evidence_basis: FY2025 total backlog grew 73% YoY to $1.85B; Rocket Lab was awarded an $816M Space
        Development Agency contract to design and build 18 satellites for the 'Tracking Layer Tranche
        3' program.
      provenance_label: historically_observed
uncertainty_summary: 'All figures secondary/search-aggregation-sourced; no primary document directly opened.
  Rocket Lab''s public listing was fact-checked and confirmed: SPAC merger with Vector Acquisition Corporation,
  trading commenced under ''RKLB'' on Aug 25 2021 -- a full loss history is available for all fiscal years
  since listing (no data gaps), so no shortened-history exception is needed on listing-age grounds, though
  this remains an archetype E (scenario/binary-outcome-relevant) record given the young, historically
  unprofitable, launch-milestone-dependent nature of the business -- cash-runway and scenario evidence
  (Neutron timeline, the pending Iridium acquisition, backlog) are prioritized accordingly. FY2025 capex
  is a Q4-only quarterly figure, not a full-year total (a full-year figure was not found and this is disclosed
  rather than annualized/estimated). The Iridium acquisition is real and pending, explicitly not yet closed.'
