scenario_evidence:
  scenarios:
  - scenario_name: Clario acquisition
    variables:
    - variable_name: clario_acquisition
      evidence_basis: Clinical-trial imaging/eCOA technology acquisition completed Q2 2026; deal value
        cited inconsistently across sources ('$8.9B' at a 'late March' close vs. '$9.1B' in Q2 2026 context)
        -- possibly enterprise value vs. equity value, or a revised figure, not reconciled.
      provenance_label: historically_observed
  - scenario_name: Solventum and microbiology portfolio changes
    variables:
    - variable_name: solventum_and_microbiology_portfolio_changes
      evidence_basis: Acquired Solventum's Purification & Filtration business for ~$4.0B cash, completed
        2025 (the acquired business generated ~$1B revenue in 2024). Separately, TMO is divesting its
        microbiology business for ~$1.075B, expected to close Q3 2026, expected to reduce 2026 revenue
        by ~$200M (net of a retained channel business) and 2026 adjusted EPS by $0.05.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  The 2021-peak-to-2023-trough revenue pattern reflects COVID-testing revenue fading, a real and disclosed
  pattern, not an error -- multi-year comparisons should account for it rather than treating it as a clean
  organic trend. Full-year FY2025 segment revenue was not found -- only partial-year (H1 or 9-month) figures
  were located for each segment and are disclosed as such in segment_evidence above rather than presented
  as full-year data. Three real M&A/divestiture events fall inside the last 12 months of this record (Solventum
  acquisition, Clario acquisition, microbiology divestiture), making segment and total-revenue trends
  genuinely hard to compare cleanly year over year without further adjustment.
