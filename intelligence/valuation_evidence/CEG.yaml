scenario_evidence:
  scenarios:
  - scenario_name: Crane Clean Energy Center restart
    variables:
    - variable_name: crane_clean_energy_center_restart
      evidence_basis: Three Mile Island Unit 1 restart, renamed the Crane Clean Energy Center, backed
        by a 20-year, 835MW power purchase agreement with Microsoft to supply mid-Atlantic AI data centers.
        Targeted online 2028; NRC licensing-basis review expected complete 2027.
      provenance_label: historically_observed
  - scenario_name: Calpine acquisition
    variables:
    - variable_name: calpine_acquisition
      evidence_basis: Closed Jan 7 2026, total consideration ~$22B (50M newly issued CEG shares plus $4.5B
        cash; originally announced Jan 10 2025 at ~$16.4B equity value) -- materially expands CEG's generation
        fleet with Calpine's natural-gas and geothermal assets, not reflected in any FY2025 figure above.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  CEG has only ~3 clean standalone fiscal years (2023-2025) plus a partial, non-comparable 2022 -- spun
  off from Exelon Feb 1 2022 -- disclosed as the shortened-history exception under VALUATION-0005 SS C.1
  for a genuine structural (spin-off) limitation, not forced into a misleading 5-year comparison. GAAP
  net-income swings across years are disclosed as a real pattern with only a plausible, unverified explanation.
  No quantitative generation-mix/segment breakdown was found. The Calpine acquisition, closed Jan 2026,
  will materially reshape CEG's FY2026-forward financials and is not reflected in any figure above.
