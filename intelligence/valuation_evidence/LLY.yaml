  abstention_reason: LLY discloses revenue predominantly by product/therapeutic area (Mounjaro, Zepbound,
    Trulicity, Verzenios, Jardiance, etc.) rather than classic business/geographic segments. Mounjaro
    + Zepbound alone were 56% of FY2025 revenue (reported), but a clean full product-revenue table was
    not obtained this session.
