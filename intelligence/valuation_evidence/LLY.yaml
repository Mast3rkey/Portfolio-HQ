scenario_evidence:
  scenarios:
  - scenario_name: Orforglipron oral GLP-1 approval
    variables:
    - variable_name: orforglipron_oral_glp-1_approval
      evidence_basis: FDA approved Lilly's oral GLP-1 pill for obesity/overweight on Apr 1 2026 -- the
        first GLP-1 pill approved with no food/water timing restriction; Phase 3 ATTAIN data showed up
        to 12.4% average weight loss at 72 weeks. Will compete against Novo Nordisk's oral semaglutide
        (approved Dec 2025).
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 net income and FY2022 net income could not be reliably confirmed and are abstained rather than
  reported (one search result appears to have erroneously repeated the FY2025 net-income figure when the
  FY2021 figure was requested). FY2025 capex and therefore free cash flow could not be pinned down to
  a specific dollar figure. Revenue/earnings growth 2021-2025 is extremely steep (driven by GLP-1 franchise
  growth), disclosed as organic growth concentrated in two products (56% of FY2025 revenue), not a structural
  discontinuity -- but multi-year trend comparisons should be read with that concentration in mind.
