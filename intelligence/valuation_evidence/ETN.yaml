uncertainty_summary: All figures secondary/search-aggregation-sourced (WebFetch blocked for every finance
  domain attempted); no primary document directly opened. FY2025 operating margin is abstained -- the
  only figure found was unclear as to basis and period. Two inconsistent cash figures at different dates
  were found and both disclosed rather than one silently chosen. Full-year segment detail was not obtained
  despite repeated attempts. Eaton is Ireland-domiciled ('Eaton Corp plc') and announced a planned Mobility
  spin-off targeted for completion by end of Q1 2027 -- a real future comparability event, not reflected
  in the history above.
