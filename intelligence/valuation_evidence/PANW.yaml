uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2025 GAAP net income and diluted EPS are genuinely unresolved between two irreconcilable search results
  and are abstained rather than reported. Operating income/margin was not found for any fiscal year. FY2024
  net income is disclosed as containing a large one-time tax benefit, not a clean operating result. The
  CyberArk acquisition, closed Feb 2026, will materially change the FY2026 balance sheet (added debt/goodwill)
  and consolidated results -- FY2026-forward figures will not be cleanly comparable to the FY2021-FY2025
  history above.
