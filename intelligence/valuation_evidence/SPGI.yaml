      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2021 net income is a low-confidence derived estimate. Operating income/margin was not found as a clean
  dollar figure for any year despite qualitative commentary ('operating margin grew... driven by revenue
  growth across all five divisions') and is omitted rather than estimated. Segment figures mix full-year
  (revenue, where found) and margin-only H1-2025 detail in the underlying research -- only full-year revenue
  is reported in segment_evidence above (Commodity Insights full-year revenue was not found and is therefore
  not included as a fifth segment entry). The Feb 2022 IHS Markit merger (~$43.5B all-stock) is the dominant
  structural discontinuity in this 5-year history -- FY2021-to-FY2022 revenue and share-count changes
  are merger-driven, not organic.
