scenario_evidence:
  scenarios:
  - scenario_name: Ansys acquisition
    variables:
    - variable_name: ansys_acquisition
      evidence_basis: ~$35B deal, closed Q3 FY2025; materially reshapes SNPS's revenue base, debt load,
        and competitive positioning (moving from pure EDA into simulation/'Silicon to Systems' design).
        Ansys contributed $756.6M of FY2025 revenue ($667.7M in Q4 FY2025 alone).
      provenance_label: historically_observed
  - scenario_name: Software Integrity Group divestiture
    variables:
    - variable_name: software_integrity_group_divestiture
      evidence_basis: Sold to Clearlake Capital and Francisco Partners for $1.65B total consideration
        ($1.48B upfront cash plus deferred/earnout payments), transaction completed Sept 30 2024.
      provenance_label: historically_observed
uncertainty_summary: 'All figures secondary/search-aggregation-sourced; no primary document directly opened.
  FY2022 net income is abstained as an apparent data-extraction error (identical to FY2021''s figure).
  Current stock price, market cap, and full-year segment revenue were not obtained -- genuine gaps, not
  estimated. This is the most significant comparability case in this research pass: Synopsys underwent
  two major structural events within ~18 months of FY2025 (the Sept 2024 Software Integrity Group divestiture,
  reclassified as discontinued operations, and the ~$35B Ansys acquisition, closed Q3 FY2025) -- only
  FY2021-FY2023 (three years) can be considered clean, pre-transformation comparable history; FY2024 reflects
  the divestiture transition and FY2025 reflects partial-year Ansys consolidation. This is the disclosed
  IPO/restructuring shortened-history exception under VALUATION-0005 SS C.1, applied here for a genuine
  structural limitation rather than forcing a misleading 5-year like-for-like comparison.'
