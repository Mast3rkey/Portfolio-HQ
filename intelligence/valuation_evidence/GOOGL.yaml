scenario_evidence:
  scenarios:
  - scenario_name: DOJ Google Search antitrust remedies
    variables:
    - variable_name: doj_google_search_antitrust_remedies
      evidence_basis: Final judgment entered December 2025 imposing behavioral remedies (data-sharing/syndication
        requirements, restrictions on distribution deals); Google appealed January 2026, DOJ and state
        AGs cross-appealed February 2026. Morgan Stanley estimated mandatory choice-screen remedies could
        cost Google 5-8% of search traffic over three years, translating to an estimated $15-25B in annual
        ad revenue at risk.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  Current stock price and market cap could not be resolved to one confident figure (genuine conflict between
  sources) and are abstained. Full-year Google Cloud and Other Bets operating income were not obtained
  (only Q4-2025-alone figures were found) -- a genuine segment-evidence gap, so only segment revenue (not
  profit) is reported here. Net debt is not confidently derivable given only a long-term-debt figure (no
  total-debt-including-current-portion). Alphabet's three-segment structure has been used consistently
  2021-2025, though full segment-boundary consistency across all five years was not independently verified.
