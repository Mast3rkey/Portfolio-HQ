scenario_evidence:
  scenarios:
  - scenario_name: China export-control exposure
    variables:
    - variable_name: china_export-control_exposure
      evidence_basis: China share of ASML revenue fell from ~36% (Q4 2025) to ~19% (Q1 2026); full-year
        2025 China share ~33%. EUV has never shipped to China (restricted since 2023). A pending US MATCH
        Act would ban DUV immersion-system exports/servicing to China -- not yet law, and contains a 150-day
        window for the Netherlands/Japan to tighten their own controls first.
      provenance_label: historically_observed
uncertainty_summary: All figures secondary/search-aggregation-sourced; no primary document directly opened.
  ASML reports in EUR; figures above are as-reported in that currency, not converted to USD. FY2024 and
  FY2025 operating margin are abstained -- the underlying operating-income figures found carried currency-tag
  inconsistencies or were not full-year figures. A cash-flow/capex multi-year table was attempted but
  the figures found were USD-labeled (suspicious for a EUR reporter) and are not used. No IPO/spin-off/restructuring
  affects ASML's own 5-year comparability.
