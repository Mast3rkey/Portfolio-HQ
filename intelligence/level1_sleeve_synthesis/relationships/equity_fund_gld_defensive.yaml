rationale: This account's own governing text describes the gold-defensive fund sleeve as serving a ballast
  function distinct from growth-oriented deployment -- the same functional distinction its own sealed
  functional-doctrine record independently confirms. The equity sleeve's own governed research base is
  considerably more developed than the gold-defensive sleeve's, but that gap does not bear on whether
  either sleeve belongs where it currently sits, since these sleeves serve genuinely different portfolio
  functions -- growth-oriented deployment on the equity side, a defensive offset function on the gold-defensive
  side. The gold-defensive fund's own already-sealed structural-classification record separately confirms
  it carries no embedded look-through exposure to any equity the account holds directly, unlike the broad-market
  fund sleeve.
