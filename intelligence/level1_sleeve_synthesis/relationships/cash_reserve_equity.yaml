rationale: 'The equity sleeve deploys capital into individually researched growth positions, while the
  cash-and-reserve sleeve preserves liquidity and optionality -- a survival/liquidity function this account''s
  own governing text treats as a guardrail rather than as a return-seeking allocation choice (a cash-tight
  condition triggers a recommended pause, never a redirection into equity). This is a functional distinction,
  not an evidence-maturity comparison: even though the equity sleeve''s own governed research base is
  considerably more developed than the cash-and-reserve sleeve''s, that gap does not bear on whether either
  sleeve belongs where it currently sits, since these sleeves serve genuinely different portfolio purposes.'
