rationale: 'The cash-and-reserve sleeve and the debt-reduction sleeve are both survival-oriented levers
  this account''s own governing guardrails treat with matching severity -- a cash-tight condition and
  a margin-buffer floor breach are each described, in this account''s own governing text, as triggering
  a matching forced-pause or forced-deleverage response. Whether these sleeves genuinely compete for the
  same marginal capital, whether they serve distinct functions that never trade off against each other,
  or whether they simply coexist without competing cannot be determined from these sleeves'' own currently
  governed evidence alone: the RESERVE identifier''s own functional role remains an unresolved abstention,
  and the debt-reduction sleeve''s own opportunity-cost evidence base is entirely forced-abstained. Both
  gaps sit precisely on the question this comparison would need to answer, so this record abstains rather
  than asserting a finding the governed evidence does not actually support.'
