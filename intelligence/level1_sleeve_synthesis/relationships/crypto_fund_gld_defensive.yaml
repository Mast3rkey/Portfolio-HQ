rationale: 'No governed evidence identifies the crypto sleeve and the gold-defensive fund sleeve as competing
  for the same marginal capital -- the crypto sleeve is populated through this account''s own deposit
  and gap-filling workflow, never as a substitute for, or an alternative to, deploying capital into the
  gold-defensive sleeve, and no governing text frames these sleeves as a choice against each other. Both
  sleeves'' own governed evidence does carry a real, sourced alternative-asset narrative, but that narrative
  match is not uniform across the crypto sleeve: the coin whose historical inflation-sensitivity characterization
  matches the gold-defensive sleeve''s own finding is a single covered coin, while its sibling coins''
  own sealed records independently reach a different characterization on that same sub-field. Generalizing
  the matching coin''s own narrative to the crypto sleeve as a whole would misrepresent evidence that
  is genuinely mixed within the sleeve, so this record discloses the split explicitly rather than smoothing
  over it.'
