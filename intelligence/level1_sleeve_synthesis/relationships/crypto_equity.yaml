rationale: Both the equity and crypto sleeves deploy capital toward growth-oriented positions, making
  this pair a genuine evidence-maturity comparison rather than a functional-role question. The equity
  sleeve's own governed research base spans economic-role classification, a qualitative archetype judgment,
  structured valuation evidence, and a produced valuation-result record for every covered company. The
  crypto sleeve carries only a structural classification and an instrument-level economic-assessment record
  -- no archetype, valuation-evidence, or valuation-result layer exists for any covered coin, and cross-coin
  correlation is structurally forced to an unmeasured state across the entire sleeve. On currently governed
  evidence, the equity sleeve's own research base is materially more developed.
