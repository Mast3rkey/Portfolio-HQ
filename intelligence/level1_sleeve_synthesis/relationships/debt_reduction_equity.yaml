rationale: Deploying capital into the equity sleeve and reducing margin debt through the debt-reduction
  sleeve sit on different sides of this account's own risk-and-survival governance domain, not on a shared
  evidence-maturity spectrum -- the debt-reduction sleeve's own functional-doctrine record marks a structural-leverage
  guardrail as currently binding, citing the same category of survival constraint that governs when new
  capital may be deployed at all, independent of how developed the equity sleeve's own research base is.
  Even though the debt-reduction sleeve's own opportunity-cost evidence base is entirely forced-abstained,
  that gap does not resolve into an evidence-maturity finding favoring equity, since the underlying question
  these sleeves each answer is not the same kind of question.
