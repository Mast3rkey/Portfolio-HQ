rationale: 'Both the equity sleeve and the broad-market fund sleeve deploy capital toward individual-name
  or index-level equity risk, making this pair a genuine evidence-maturity comparison. The equity sleeve''s
  own governed research base spans economic-role classification, a qualitative archetype judgment, structured
  valuation evidence, and a produced valuation-result record for every covered company; the broad-market
  fund sleeve carries only a structural classification and an instrument-level economic-assessment record
  for each covered fund, with no archetype or valuation-evidence layer of any kind. These sleeves'' own
  governed evidence also discloses a real, mechanically confirmed overlap: each broad-market fund''s own
  already-sealed structural-classification record resolves an embedded look-through exposure to names
  the account also holds directly as individually researched equities, per this account''s own issuer-concentration
  mechanism. This finding describes evidence completeness and disclosed overlap only -- it makes no claim
  about either sleeve''s own individual weight or size.'
