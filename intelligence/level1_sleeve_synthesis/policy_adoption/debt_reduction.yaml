function_rationale: 'Reached on Basis 1 alone, independently sufficient on its own; Basis 2 is separately
  available but not load-bearing given Basis 1 already suffices; Basis 3 is unavailable and not asserted.
  Basis 1 (relationship-record finding): the sealed debt_reduction_equity relationship record resolves
  role_preserving -- deploying capital into the equity sleeve and reducing margin debt through this sleeve
  sit on different sides of this account''s own risk-and-survival governance domain, not on a shared evidence-maturity
  spectrum, independent of how developed either sleeve''s own research base is. Basis 2 (CLAUDE.md doctrine
  citation): this account''s own governing Portfolio Doctrine directly names a structural leverage ceiling
  and a hard minimum margin-buffer threshold as binding guardrails, stating plainly that a breach of that
  threshold is "treated as a forced de-lever signal, same severity as the cash-tight guardrail" -- an
  independently available, verbatim-quoted passage confirming this sleeve''s own governed function, cited
  here for completeness though not required to reach this finding. Basis 3 (structural sleeve-definition
  basis) is unavailable for this sleeve: no destination-configuration row exists for it -- it is a margin-policy
  lever, not a market-traded destination category, per the fixed sleeve-taxonomy table the governing methodology
  cites -- and this filing does not treat that structural absence as evidence against this sleeve''s own
  portfolio_function_status, since Basis 1 and Basis 2 both independently, sufficiently establish the
  sleeve''s own distinct function regardless.'
