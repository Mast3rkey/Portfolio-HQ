cash_reserve_consolidation_note: 'This record''s combined treatment of the CASH and RESERVE legacy capital-use
  identifiers as a single family does not resolve, and must never be read as resolving, the underlying
  question of whether the CASH and RESERVE identifiers have ever been established as economically separate.
  Per an earlier, explicitly principal-directed provenance review, the identifiers have never been shown
  to be economically separate and remain an unresolved, undifferentiated combined family absent a future,
  separately authorized decision -- this record reuses, and does not reopen, that finding. The sealed
  functional-doctrine layer this sleeve''s own profile cites already reflects the same asymmetry this
  note restates: the CASH identifier carries a determined functional-role finding, while the RESERVE identifier''s
  own functional role remains an unresolved abstention -- neither fact is evidence that the identifiers
  serve separate purposes, and this record''s own combined portfolio_function_status, capital_eligibility_status,
  and sizing_readiness_status values apply identically and undifferentiated to both.'
