portfolio_function_status: function_confirmed_distinct
function_rationale: 'Reached on independently sufficient lawful bases. Basis 1 (relationship-record finding):
  the cash_reserve_equity, debt_reduction_equity, and equity_fund_gld_defensive sealed sleeve_relationship
  records each resolve role_preserving -- meaning this sleeve''s own governed evidence, cross-checked
  against separately-sealed comparative findings, consistently supports that the equity sleeve serves
  a portfolio function distinct from the cash-and-reserve, debt-reduction, and gold-defensive fund sleeves
  respectively. None of these findings is a stronger_evidence_maturity disposition, so none is barred
  from supplying Basis 1 grounds. Basis 3 (structural sleeve-definition basis) independently, separately
  supplies the identical conclusion: this sleeve''s own asset_class scope is currently populated by a
  live destination-configuration category, confirmed directly this session, per the fixed sleeve-taxonomy
  table the governing methodology cites -- a categorical, sleeve-level structural fact, never any individual
  covered company''s own weight, target, or rank within that category. This sleeve''s own sealed stronger_evidence_maturity
  findings (against crypto and against fund_broad_market, both favoring this sleeve) supply neither basis
  and are not relied upon here, per the mechanical prohibition on that disposition ever driving any axis
  -- this determination does not depend on, and would be unchanged without, either finding''s own favored-sleeve
  content.'
