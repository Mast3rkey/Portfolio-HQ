economic_role_summary: The cash-and-reserve sleeve combines the account's legacy CASH and RESERVE capital-use
  identifiers, which this repository has never established as economically distinct -- per an earlier,
  explicitly directed provenance review, both remain treated as a single undifferentiated family here
  rather than reopened. The CASH identifier carries its own determined functional-doctrine role; the RESERVE
  identifier's own functional role remains an unresolved abstention, since no governing narrative beyond
  its own bare label and a mechanical allocator fact could be located at the time its record was sealed.
  A separate, combined economic-assessment record covers the family as a whole and reaches a determined
  finding on its own deployability, even though that same record's own evidence-quality status is disclosed
  as partial. This summary describes currently governed evidence only.
