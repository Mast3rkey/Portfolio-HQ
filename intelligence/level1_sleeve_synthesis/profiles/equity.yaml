economic_role_summary: The equity sleeve holds the account's individually researched common-stock positions,
  each covered under a devoted, company-by-company research program spanning economic-role classification,
  qualitative valuation-archetype judgment, structured valuation evidence, and a produced valuation-result
  record. This is the only sleeve in this synthesis with a complete, multi-layer research stack behind
  it; every other sleeve draws on a comparatively thinner governed evidence base. This summary describes
  currently governed evidence only -- it is not a claim that the covered roster is an exhaustive investable
  universe, and it does not name any covered company's own individual weight or size, which remains a
  separate, still-unauthorized instrument-level question.
