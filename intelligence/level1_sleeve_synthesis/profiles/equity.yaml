    rather than completed, per that layer's own sealed corpus. A partial valuation-result reflects a genuinely
    open evidence gap (an abstained discount-rate or peer-set input, for example), not a defect in the
    covered company's own qualitative research -- disclosed here rather than rounded up to a fully computed
    sleeve.
- source_layer: valuation_evidence
  field_path: discount_rate_evidence
