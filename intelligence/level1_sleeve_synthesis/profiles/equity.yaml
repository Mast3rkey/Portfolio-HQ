  reason: Discount-rate evidence is abstained across the equity sleeve's entire sealed valuation-evidence
    corpus, per that layer's own disclosed gap. No governed methodology for sourcing a discount-rate input
    exists anywhere in this repository yet; every covered company's own valuation-evidence record states
    that absence plainly rather than inventing a figure.
- source_layer: classification
