economic_role_summary: The gold-defensive fund sleeve holds a single, sealed, physically backed gold-trust
  instrument, covered under a structural classification record, a functional-doctrine record describing
  its own defensive/ballast capital-use role, and a separate instrument-specific economic-assessment record
  characterizing its own historical cost, inflation-sensitivity, and equity-drawdown behavior. The functional-doctrine
  record's own economic-assessment-readiness sub-object remains forced to an abstention, since no governed
  opportunity-cost methodology exists anywhere in this repository yet for any capital-use type -- disclosed
  explicitly rather than left implicit. This summary describes currently governed evidence only; it makes
  no claim about whether this instrument's own defensive role should expand, contract, or be joined by
  a further defensive instrument in the future.
evidence_coverage_profile: substantially_computed_with_disclosed_gaps
functional_role_note: This sleeve's own functional-doctrine record characterizes its capital-use role
  as a defensive offset or ballast function, distinct from the growth-oriented deployment role the equity
  and broad-market fund sleeves each serve -- echoed here from that sealed record, never independently
  re-derived.
