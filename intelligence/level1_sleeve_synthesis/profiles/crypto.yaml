economic_role_summary: The crypto sleeve holds a small, sealed group of digital-asset positions, each
  covered under its own structural classification record and its own instrument-level economic-assessment
  record. Like the broad-market fund sleeve, this sleeve's own covered coins have never passed through
  a qualitative archetype or valuation-evidence research program -- no archetype, evidence, or results
  layer of any kind exists for this sleeve. Cross-coin correlation is structurally forced to an unmeasured
  state across the entire sleeve, and a single covered coin's own historical equity-market-drawdown characterization
  is separately forced to an abstention, distinct from its sibling coins' own determined findings. This
  summary describes currently governed evidence only; it makes no claim that the covered coin population
  is complete or permanently fixed.
