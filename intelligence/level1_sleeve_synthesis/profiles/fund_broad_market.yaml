economic_role_summary: The broad-market fund sleeve holds a small, sealed group of passively managed,
  market-traded index funds -- covering domestic, developed-ex-domestic, and emerging equity exposure
  -- each carrying its own structural classification record and its own instrument-level economic-assessment
  record. Unlike the equity sleeve, this sleeve's own covered funds have never passed through a qualitative
  archetype or valuation-evidence research program of any kind -- their governed evidence base begins
  and ends at structural classification and a categorical instrument-level economic finding. This summary
  describes only the currently governed fund population; it makes no claim that this population is a complete
  or permanently fixed universe of broad-market index instruments.
