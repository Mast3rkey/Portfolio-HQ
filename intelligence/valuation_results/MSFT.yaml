  exercise, not an independent fair-value opinion, and not a comparison to the current market price.
uncertainty_summary: 'Sum-of-the-parts range built from real reported FY2026 segment revenue and operating
  profit for all three segments, and consolidated debt. Each segment gets its own margin-derived EV/EBIT
  multiple tier (Productivity and Business Processes at 59.9% and Intelligent Cloud at 41.3% margin both
  select the high tier; More Personal Computing''s materially lower 26.6% margin selects the mid tier)
  -- genuine per-segment differentiation grounded in each segment''s own disclosed figures. No ''cash''
  item_category is populated in Stage-3 evidence for MSFT (only ''debt''), so this record''s net-debt
  bridge conservatively subtracts debt only, without adding back any cash offset -- disclosed as a downward-biasing
  simplification, not a claim that MSFT holds zero cash. The per-segment multiples applied here are disclosed,
  illustrative assumptions (provenance_label: assumed_for_illustration) -- no segment-specific peer trading
  multiple was gathered in Stage-3 evidence. family_2 (FCFF DCF) and family_3 (FCFE DCF), while adjustment_required
  rather than blocked outright for archetype F, were not applied -- discount_rate_evidence is abstained
  across all 27 sealed Stage-3 evidence records (VALUATION-0005), so no discount rate, WACC, beta, or
  terminal growth rate was fabricated for this or any other ticker.'
