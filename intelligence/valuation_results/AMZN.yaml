uncertainty_summary: 'Sum-of-the-parts range built from real reported FY2025 segment revenue and operating
  profit, consolidated debt, and cash. All three segments disclose operating profit, so each gets its
  own margin-derived EV/EBIT multiple tier (AWS''s 35.4% margin selects a materially higher tier than
  North America''s 6.9% or International''s 2.9%) -- genuine per-segment differentiation grounded in each
  segment''s own disclosed figures, not a company-level proxy applied uniformly. The per-segment multiples
  applied here are disclosed, illustrative assumptions (provenance_label: assumed_for_illustration) --
  no segment-specific peer trading multiple was gathered in Stage-3 evidence. family_2 (FCFF DCF) and
  family_3 (FCFE DCF), while adjustment_required rather than blocked outright for archetype F, were not
  applied -- discount_rate_evidence is abstained across all 27 sealed Stage-3 evidence records (VALUATION-0005),
  so no discount rate, WACC, beta, or terminal growth rate was fabricated for this or any other ticker.'
