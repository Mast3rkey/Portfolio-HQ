uncertainty_summary: 'family_1 (asset_based_sotp), ETN''s sole primary_candidate family for archetype
  F, could not be attempted -- segment_evidence carries a domain-level abstention_reason in the pinned
  Stage-3 evidence record (no per-segment revenue/profit data was gathered), and no total_assets/total_liabilities
  figures exist either to enable a NAV-style alternative. A corroborative-only family_5 (relative valuation,
  adjustment_required for archetype F) is offered instead, using real reported net income and diluted
  shares, but its governed_role structurally caps it below the ''completed'' bar regardless of data quality.
  All three Stage-3-included peer candidates (EMR, ROK, VRT) are cited as comparability context -- no
  candidate was excluded. The per-segment multiples applied here are disclosed, illustrative assumptions
  (provenance_label: assumed_for_illustration) -- no segment-specific peer trading multiple was gathered
  in Stage-3 evidence. family_2 (FCFF DCF) and family_3 (FCFE DCF), while adjustment_required rather than
  blocked outright for archetype F, were not applied -- discount_rate_evidence is abstained across all
  27 sealed Stage-3 evidence records (VALUATION-0005), so no discount rate, WACC, beta, or terminal growth
  rate was fabricated for this or any other ticker.'
