uncertainty_summary: 'Sum-of-the-parts range built from real reported FY2025 segment revenue, consolidated
  debt, and cash. Collins Aerospace (4.6% margin) and Pratt & Whitney (2.4% margin) both disclose segment
  operating profit and both land in the same margin-derived low EV/EBIT tier -- a real, evidence-grounded
  finding (both segments genuinely have similarly thin margins), not an artificial uniform assumption;
  the Raytheon segment does not disclose profit, so it uses a company-level-margin-proxy EV/Revenue tier
  (RTX''s own overall operating margin, 10.5%) instead, since no stronger segment-specific evidence exists
  for it. The per-segment multiples applied here are disclosed, illustrative assumptions (provenance_label:
  assumed_for_illustration) -- no segment-specific peer trading multiple was gathered in Stage-3 evidence.
  family_2 (FCFF DCF) and family_3 (FCFE DCF), while adjustment_required rather than blocked outright
  for archetype F, were not applied -- discount_rate_evidence is abstained across all 27 sealed Stage-3
  evidence records (VALUATION-0005), so no discount rate, WACC, beta, or terminal growth rate was fabricated
  for this or any other ticker.'
