uncertainty_summary: 'Sum-of-the-parts range built from real reported FY2025 segment revenue, consolidated
  debt, and combined cash-and-marketable-securities. No segment-level operating profit is disclosed in
  Stage-3 evidence, so a uniform EV/Revenue-style multiple tier (selected from GOOGL''s own overall operating
  margin, 32%, a high-margin proxy) is applied to all three segments. market_observed_evidence (current
  price) is abstained for GOOGL in Stage-3 evidence, but this methodology does not require a current price
  as an input (it derives an estimate from segment fundamentals and illustrative multiples), so the missing
  price does not itself block this family. Diluted share count is a derived, approximate figure (net income
  / diluted EPS) per the pinned Stage-3 evidence record''s own disclosure. No segment-specific peer trading
  multiples were gathered in Stage-3 evidence -- the per-segment multiples applied here are disclosed,
  illustrative assumptions (provenance_label: assumed_for_illustration), differentiated only where the
  pinned Stage-3 evidence record itself discloses segment-level operating profit (an EV/EBIT-style multiple
  is then used); segments lacking disclosed profit use a uniform EV/Revenue-style multiple tier selected
  from the company''s own overall reported operating (or net) margin, not from any segment-specific comparable.
  family_2 (FCFF DCF) and family_3 (FCFE DCF), while adjustment_required rather than blocked outright
  for archetype F, were not applied -- discount_rate_evidence is abstained across all 27 sealed Stage-3
  evidence records (VALUATION-0005), so no discount rate, WACC, beta, or terminal growth rate was fabricated
  for this or any other ticker.'
