uncertainty_summary: 'Sum-of-the-parts range built from real reported FY2025 segment revenue, consolidated
  debt, and combined cash-and-marketable-securities. No segment-level operating profit is disclosed in
  Stage-3 evidence for GOOGL -- every one of its 3 segments therefore shares one company-level-margin-derived
  EV/Revenue multiple tier, with no genuine segment-to-segment differentiation. This makes this SOTP computation
  arithmetically equivalent to applying that one multiple to GOOGL''s consolidated revenue (sum(segment_revenue
  x multiple) = multiple x total_revenue when the multiple is identical across every segment) -- the segment
  breakdown is disclosed for transparency, but does not, in this record, capture genuine sum-of-the-parts
  differentiation. market_observed_evidence (current price) is abstained for GOOGL in Stage-3 evidence,
  but this methodology does not require a current price as an input (it derives an estimate from segment
  fundamentals and illustrative multiples), so the missing price does not itself block this family. Diluted
  share count is a derived, approximate figure (net income / diluted EPS) per the pinned Stage-3 evidence
  record''s own disclosure. The per-segment multiples applied here are disclosed, illustrative assumptions
  (provenance_label: assumed_for_illustration) -- no segment-specific peer trading multiple was gathered
  in Stage-3 evidence. family_2 (FCFF DCF) and family_3 (FCFE DCF), while adjustment_required rather than
  blocked outright for archetype F, were not applied -- discount_rate_evidence is abstained across all
  27 sealed Stage-3 evidence records (VALUATION-0005), so no discount rate, WACC, beta, or terminal growth
  rate was fabricated for this or any other ticker.'
