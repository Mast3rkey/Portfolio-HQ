uncertainty_summary: 'Relative-valuation range built from real reported FY2026 net income. Diluted share
  count is not a dedicated Stage-3 evidence field for NVDA -- only an approximate cross-check figure (~24.5B
  shares) embedded in a market_observed_evidence source-limitation note, not a sourced, dedicated financial_evidence
  line item -- so this record deliberately avoids a per-share output and presents the range in aggregate
  dollar terms instead. No peer-specific trading multiples were gathered in Stage-3 evidence (peer_set_evidence
  carries only candidate identity and comparability rationale, never the peer''s own financial figures
  or multiples) -- the multiple bands applied here are disclosed, illustrative assumptions (provenance_label:
  assumed_for_illustration), archetype-informed but not peer-derived or market-derived. Families 2 (FCFF
  DCF) and 3 (FCFE DCF) were not applied to this or any other ticker in the 27-company VALUATION-0007
  cohort. discount_rate_evidence is abstained across all 27 sealed Stage-3 evidence records (VALUATION-0005)
  -- no risk-free-rate, cost-of-debt, tax-rate, capital-structure, or beta-observation input exists to
  enable even a partial DCF computation. No discount rate, WACC, beta, or terminal growth rate was fabricated
  for this or any other ticker. Closing this evidence gap is a separate, future, unauthorized governance
  unit.'
