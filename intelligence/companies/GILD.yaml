  - catalyst: "This record's own next scheduled review checkpoint, at which HIV franchise durability, cell-therapy trajectory versus Trodelvy growth, and the Arcellx/Ouro/Tubulis acquired-asset integration and IPR&D charge realization will next be actively re-checked."
    expected: "2026-10-25"
