conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). Gilead shows a large, currently-growing HIV franchise (product sales excluding Veklury up 8% in Q1 2026), meaningful balance-sheet strength and active capital return (debt repayment, dividends, and buybacks in the same quarter), and real 2026 regulatory conversion (Hepcludex, expanded Trodelvy indications). Held at Medium rather than High because of concrete, disclosed tensions this record does not discount: extreme concentration in HIV (~72% of Q1 2026 revenue); a real, current cell-therapy contraction (Yescarta down 14%) alongside Trodelvy's growth, making oncology diversification uneven rather than uniformly successful; a very large near-term EPS and capital burden (~$9.50 EPS reduction, ~$11.5 billion of anticipated acquired-IPR&D/financing costs) tied to acquisitions whose return is not yet established; and an unresolved, batch-relevant question about whether oncology/cell therapy will become a durable second engine (B7-U006). This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
