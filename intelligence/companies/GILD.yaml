sector: Health Care
industry: Pharmaceuticals
portfolio_role_ref: band
competitive_advantages:
  - "Large, durable HIV franchise generating the majority of company revenue: Q1 2026 HIV product sales were $5.0 billion, including $3.4 billion from Biktarvy, making HIV roughly 72% of total quarterly revenue of $7.0 billion (product sales excluding Veklury were $6.8 billion, up 8%). Per Gilead's Form 10-Q for the quarter ended 2026-03-31 (SEC accession 0000882095-26-000024) and Gilead's Q1 2026 earnings release, both directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 7 evidence bundle (see Source-access disclosure in GILD.md) -- not directly inspected by this Claude session."
  - "Regulatory conversion of liver-disease and oncology assets in 2026: the FDA approved Hepcludex for chronic hepatitis delta, described by the FDA as the first U.S.-approved treatment for chronic hepatitis delta virus infection (F-5-scoped wording; this record does not assert it was the first approval worldwide), and expanded Trodelvy into first-line triple-negative breast cancer settings (monotherapy and in combination with pembrolizumab). Per FDA approval announcements, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Meaningful balance-sheet and capital-return capacity: at Q1 2026 end Gilead reported $8.6 billion of cash, equivalents, and marketable securities; during the quarter it repaid $2.8 billion of debt, paid $1.0 billion of dividends, and repurchased $419 million of stock. Per Gilead's Q1 2026 earnings release, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Trodelvy growth as an oncology diversification data point: Q1 2026 Trodelvy sales grew 37% to $402 million, even as total cell-therapy sales (including Yescarta) declined -- a mixed but not uniformly negative oncology picture. Per Gilead's Form 10-Q for the quarter ended 2026-03-31, directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "Extreme concentration in a single therapeutic franchise: HIV products were approximately 72% of Q1 2026 total revenue, with Biktarvy alone at $3.4 billion. Loss of HIV franchise durability without an offsetting launch would have an outsized effect on total company results."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Cell-therapy sales declined 12% to $407 million in Q1 2026, including a 14% decline in Yescarta -- a disclosed, current contraction in one of Gilead's named oncology diversification engines, even as Trodelvy grew."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Gilead reduced 2026 EPS guidance by approximately $9.50 for anticipated $11.5 billion of acquired IPR&D and financing costs related to Arcellx, Ouro, and Tubulis -- a very large, disclosed near-term earnings and capital burden tied to acquisition-driven diversification, whose eventual clinical and economic return is not established in this record's evidence base."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Whether oncology and cell therapy will become durable second engines relative to HIV is not established in this record's evidence base (unresolved question B7-U006) -- Trodelvy is growing, but cell therapy declined and acquired-pipeline outcomes remain uncertain."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "This session's own primary-source access (WebFetch) was tested and confirmed blocked on 2026-07-27 (SEC EDGAR, and a neutral non-target control domain, both returned HTTP 403) -- every fact in this record is attributed to the governed v2 evidence bundle's own directly-inspected sources, not to this Claude session's independent document inspection. See GILD.md's Source-access disclosure."
    severity: low
    identified: "2026-07-27"
    status: monitoring
