conviction:
  rating: Medium
  rationale: "Amazon shows a genuinely diversified revenue base (retail, third-party marketplace, advertising, subscriptions) layered with a disproportionately profitable cloud segment -- AWS generated more Q1 2026 operating income ($14.161B) than the North America and International retail segments combined ($9.691B) -- and very strong liquidity ($143.089B). Conviction is held at Medium rather than High because of concrete, current tensions: capital expenditures nearly doubled year over year in the same period Amazon carried $121.8B of unsecured notes outstanding, including major new issuances in March 2026 -- the evidence establishes both the capex increase and the debt issuance, but not the use of debt proceeds or a causal funding relationship between the two, which this record treats as an unresolved inference, not an established fact; Amazon's consolidated profitability is disproportionately concentrated in a single segment (AWS); its multiple, very large AI-lab commitments (OpenAI, Anthropic) carry real counterparty, financing, and chip-performance-delivery risk and are not equivalent to realized revenue or deployed capital; and Amazon faces active FTC/state antitrust litigation alleging marketplace monopoly maintenance, an unresolved matter, alongside a preliminary EU cloud-gatekeeper regulatory exposure. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat disclosed AI-lab contract amounts or options as realized revenue or capital already deployed."
