sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Reported HBM (high-bandwidth memory) market leader, with reported share ranging from roughly 53% to 62% across sources depending on period and metric (shipments versus revenue) -- Q2 2025 shipment share cited at 62%, Q3 2025 revenue share cited variously at 53-57%, and a 2026 HBM4-specific projection at 54%. Reported as NVIDIA's primary HBM supplier, cited at roughly 90% of NVIDIA's current HBM supply (forecast by some sources to moderate toward ~50% in 2026 as NVIDIA diversifies suppliers) and reportedly holding roughly 70% of NVIDIA's HBM4 allocation for the upcoming 'Vera Rubin' platform (a UBS-cited estimate, forward-looking and not a confirmed contract). SK hynix reportedly overtook Samsung in operating profit for the first time in company history during 2025, despite trailing Samsung in overall DRAM revenue share -- attributed by secondary sources to HBM's premium pricing/margin mix"
  - "Record, rapidly improving financial results through the current AI-memory upcycle: FY2025 revenue KRW97.1 trillion, operating profit KRW47.2 trillion (record); Q1 2026 revenue KRW52.58 trillion (first quarter exceeding KRW50 trillion), operating profit KRW37.61 trillion (72% operating margin), net profit KRW40.35 trillion (77% net margin). New M15X fab (Cheongju) began HBM4 mass production in February 2026, ramping from roughly 10,000 to a targeted 55,000-60,000 wafers/month by end of 2026; the Yongin Semiconductor Cluster's first phase (Y1, secured KRW31 trillion investment) has its operational start date moved up from May 2027 to February 2027, designed for high-volume 1c DRAM production at scale"
  - "Improving credit profile and shareholder-return policy funded by the current upcycle: S&P upgraded SK hynix to BBB+ with a positive outlook in February 2026; balance-sheet aggregator figures (not independently primary-verified) show cash and short-term investments (~KRW28.0T) exceeding total debt (~KRW24.1T), debt/equity of roughly 24%. Annual fixed dividend raised 25% (to KRW1,500/share from KRW1,200), with an additional policy commitment to allocate half of accumulated free cash flow to shareholder returns beyond the fixed dividend, alongside a recurring buy-back-and-cancel program (approximately KRW100B tranches in February and September 2025 and February 2026, plus an ongoing KRW40B tranche March-June 2026)"
risks:
  - risk: "Severe, escalating single-customer concentration to NVIDIA: no customer exceeded 10% of revenue in 2023; NVIDIA reportedly contributed ~16% of 2024 revenue (~KRW10.9T), rose to ~27% in 1H 2025, then moderated to ~24% for full-year 2025 (both figures independently cross-checked via WebSearch by this synthesizing session, 2026-07-26, and found consistent across multiple sources). In 2026 a second, unnamed customer crossed the 10%-of-revenue disclosure threshold for the first time, at 12.4% (~KRW6.54T, ~$4.4B) -- an early sign of diversification, but NVIDIA concentration remains dominant in both percentage and, more importantly, rapidly growing absolute dollar terms (Q1 2026 HBM shipments to NVIDIA alone were KRW7.78T, +62.6% YoY). Whether NVIDIA is named directly in SK hynix's own regulatory disclosure, or whether the percentage figures above are analyst/press inference from a company reference to 'a single major client,' was not resolved in this research pass -- a distinction this record treats as unresolved, not as a confirmed company-disclosed fact"
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "ADR-specific structural risk unique to holding SKHY rather than the Seoul-listed (KRX: 000660) ordinary shares: SK hynix capped ADS conversion from ordinary shares at 2.5% of total outstanding shares, and that cap was fully exhausted by the $26.5B Nasdaq offering itself (2026-07-10) -- blocking new ADS creation from Seoul shares until existing ADR holders convert back to ordinary shares to free up quota. This broke the normal cross-listing arbitrage mechanism: the premium over the economically equivalent Seoul-listed shares peaked near 52.5% on 2026-07-14, narrowed sharply to roughly 26% by the 2026-07-15 close, persisted around 25% through the following week, and was reported at approximately 22% as of ~2026-07-24-25 -- a materially lower and still-narrowing range than an earlier draft of this record stated (30-33%), corrected in a 2026-07-26 remediation pass following an independent Fable review finding. Independently cross-checked by this synthesizing session (2026-07-26): a further 25% depositary capacity is technically registered with the SEC, but activating conversion beyond the exhausted 2.5% cap on NEW ADS creation (ordinary shares -> ADS) would reportedly require a process akin to a secondary public offering, not a routine administrative expansion. Separately, per the Korea Securities Depository (KSD), 2026-07-29 is reported as the date applications for two-way conversion become possible now that the ADR offering's newly issued underlying Korean common shares are domestically listed -- but the reported mechanism is asymmetric: ADS-to-ordinary-share conversion (cancelling an ADS to receive a Korean share) is reported to carry no separate KSD-administered limit, while ordinary-share-to-ADS conversion remains constrained by the same exhausted 2.5% issuer-set cap. As of this record's 2026-07-26 cutoff, the July 29 event had not yet occurred and its actual effect on the premium is unassessed -- some contemporaneous commentary found in this research explicitly cautions that primary source material does not support a definitive 'premium will resolve' interpretation, a caution this record preserves rather than replacing with a prediction. Whether the premium/arbitrage-block condition compresses, persists, or re-expands after 2026-07-29 remains an open, actively monitored question, not a resolved one"
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "China export-control exposure on SK hynix's Wuxi (DRAM) and Dalian (NAND, acquired from Intel) fabs: the US Commerce Department (BIS) announced on 2025-08-29 the revocation of Validated End-User (VEU) authorization for SK hynix's and Samsung's China facilities, effective 2025-12-31. Reporting indicates this was not converted into an outright shutdown but into a renewable annual site-license system for 2026, permitting continued *operation* of the existing fabs but explicitly not capacity expansion or technology upgrades within China -- described by TrendForce as SK hynix and Samsung having 'escaped the worst case,' but with annual license-review risk continuing indefinitely, i.e. a recurring, not permanently resolved, exposure. Single-source (uncorroborated across multiple outlets in this research pass) figures put Wuxi at roughly 40% of total DRAM output and Dalian at roughly 25% of NAND output -- if accurate, this makes the China fab exposure structurally material, not a rounding error, though these specific percentages require primary-source verification before being treated as confirmed"
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Severe historical memory-cycle cyclicality, directly comparable in kind (though measured in operating profit/loss rather than net income) to Micron's FY2022-2023 downturn: SK hynix posted an operating loss of KRW1.7 trillion in Q4 2022 (versus +KRW4.2 trillion a year earlier) -- its first quarterly operating loss since Q3 2012 -- with DRAM revenue down 54% YoY in that quarter, and a cumulative full-year 2023 operating loss of KRW7.73 trillion. Recovery began in Q4 2023, driven by DDR5 (+4x YoY) and HBM3 (+5x YoY) shipment growth. The company's current 2025-2026 profit levels (77% net margin in Q1 2026) represent the opposite extreme of the same cycle within roughly three years -- a swing of a magnitude comparable to, and arguably larger in relative terms than, MU's own documented downturn"
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Post-listing price volatility materially exceeding normal single-stock trading ranges, actively searched for as disconfirming evidence rather than assumed absent: SK hynix's Seoul-listed shares fell more than 15% in a single session on 2026-07-13 (two trading days after the Nasdaq ADR debut), reported as the stock's worst single-day performance on record. Broader context: the stock had gained an estimated ~260% cumulative year-to-date at its June 2026 peak, then corrected roughly 36.8% from its June 25 closing high in the run-up to the ADR listing, before a post-listing pop and a subsequent renewed selloff (further declines of roughly 6-9% by 2026-07-24 amid a broader reported 'Korea chip selloff' also affecting Micron and SanDisk). Reporting explicitly flagged elevated retail participation and margin-financed positions in the Korean market as a likely amplifier of the selloff. Separately, the $26.5B offering itself involved issuing 177.9 million new ADSs (17.79 million new underlying ordinary shares) -- real dilution to existing shareholders, cited by at least one source as a contributing factor to pre-listing share-price weakness. A single-source, unverified claim of a CEO-bonus-dispute lawsuit (~KRW700M) was also found and is not adopted as a confirmed fact -- noted here only as an unconfirmed governance-friction data point warranting a primary check"
    severity: low
    identified: "2026-07-26"
    status: monitoring
conviction:
  rating: Medium
  rationale: "SK hynix is the reported HBM market leader and NVIDIA's primary HBM supplier, with by far the strongest and most rapidly improving financial results found anywhere in this repository's Intelligence corpus to date (77% net margin in Q1 2026), a genuine first-mover technology position (first HBM4 mass production, February 2026), and an improving credit profile (S&P BBB+ positive outlook). Conviction is Medium rather than High or Very High because: (1) customer concentration to NVIDIA is severe and only recently, partially diversifying -- NVIDIA's revenue share reached as high as 27% in 1H 2025 -- and this concentration compounds rather than offsets the company's own severe historical cyclicality (a full-year operating loss as recently as 2023); (2) SKHY carries a structural risk layer that does not exist for the Seoul-listed ordinary shares at all -- the 2.5% ADS conversion cap on new-ADS creation, fully exhausted by the offering itself, produced a valuation premium that peaked near 52.5% (2026-07-14) and had narrowed to roughly 22% by ~2026-07-24-25, still material and divorced from a normal cross-listing arbitrage mechanism; a reported 2026-07-29 partial opening of the conversion mechanism (asymmetric -- it does not affect the capped direction) is an unresolved, actively monitored development, not a resolution of this risk, and reopening meaningful additional new-ADS conversion capacity would likely still require a process akin to a secondary offering rather than routine administrative action; (3) China export-control exposure on the Wuxi/Dalian fabs was only recently resolved from an outright VEU revocation into a renewable, not permanent, annual site-license system, leaving recurring regulatory risk; and (4) this record's own source-access constraints (WebFetch non-functional for the entire research session, independently re-confirmed as still blocked by this synthesizing session, including a control-domain test) mean every figure here is WebSearch-sourced and cross-corroborated rather than independently verified against SK hynix's own SEC filings (the F-1/424B4 risk-factors section in particular was never opened), an explicit limitation disclosed in the Markdown record. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from SKHY's existing `band` tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 §§2/3). This rating and rationale reflect AI-assisted research pending the independent PR review and human approval this repository's first-coverage discipline requires before this record is treated as finalized."
