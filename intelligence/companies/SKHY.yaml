ell-corroborated-secondary, per this repository's 'verify before acting on external review' guardrail."
    - date: "2026-07-26"
      note: "Bounded remediation pass addressing an independent Fable review's two Minor findings on PR #158 (this record's own finding only; MU's separate finding is logged in MU.yaml). Corrected the ADR-premium figures: updated from 'up to 51%, narrowing to roughly 30-33%' to the more granular and materially lower trajectory found on independent re-search -- peak ~52.5% (2026-07-14), narrowed to ~26% at the 2026-07-15 close, ~25% through the following week, ~22% as of ~2026-07-24-25. Added disclosure of a reported 2026-07-29 two-way-conversion event (per the Korea Securities Depository, via Korean local-media reporting): ADS-to-ordinary-share conversion is reported to carry no separate KSD-administered limit, while ordinary-share-to-ADS conversion remains constrained by the exhausted 2.5% issuer-set cap -- i.e., the event opens one direction of the mechanism already described in this record, not the capped direction. As of this record's cutoff the event had not yet occurred and its effect is unassessed; at least one source found explicitly cautions against a definitive 'premium resolves' interpretation, preserved here rather than resolved. Conviction rating reassessed against this new evidence and left unchanged at Medium (see conviction.rationale) -- the added detail sharpens and updates a risk already weighted into that rating; it does not surface a new risk category or materially change the risk's assessed severity, since the underlying structural condition (a capped, asymmetric conversion mechanism producing a persistent premium) was already reflected in the prior Medium rating, and the premium's narrowing, while notable, is consistent with (not contradictory to) the range of outcomes that rating already contemplated. No other figure, conclusion, or section of this record was changed in this pass. Independent Fable review anchored to the corrected head is required before this correction may be treated as verified."
