sector: Information Technology
industry: IT Services / Diversified Technology
portfolio_role_ref: band
competitive_advantages:
  - "Diversified four-segment portfolio (Software, Consulting, Infrastructure, Financing) combining hybrid-cloud and AI positioning with enterprise incumbency, mission-critical infrastructure, integration capability, and partner distribution -- the filing itself names hundreds of competitors and material dependence on innovation and client spending alongside this positioning. Per IBM's Form 10-K for the year ended 2025-12-31 (SEC accession 0000051143-26-000010), directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 8 evidence bundle (see Source-access disclosure in IBM.md) -- not directly inspected by this Claude session."
  - "Suspended common-stock repurchase program at the 2019 Red Hat closing, with unused authorization still on the books as of the 2025 Form 10-K -- indicating dividends, debt management, and acquisitions have held capital-allocation priority over active repurchases, while preserving future optionality. Per IBM's Form 10-K for the year ended 2025-12-31, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Real, current AI and hybrid-cloud momentum disclosed alongside mixed execution: the 2026-07-14 preliminary Q2 2026 investor letter reported total revenue up 1% and Software up 5%, even as Consulting was flat and Infrastructure was down 7% -- evidence of an active, if uneven, transformation rather than either a clean acceleration or a stalled turnaround. Per Arvind Krishna's Letter to IBM Investors (Form 8-K Exhibit 99.1, furnished 2026-07-14, SEC accession 0000051143-26-000070), directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "IBM's own Form 10-K names hundreds of competitors and material dependence on innovation execution and client-budget conditions; the moat case (enterprise incumbency, mission-critical systems, integration breadth, partner reach) is constrained by open-source alternatives, hyperscalers, and global consultancies, and durability varies materially by segment and product cycle -- mainframe-style switching costs should not be generalized to Consulting or the broader Software portfolio."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "Preliminary (furnished, not final) second-quarter 2026 results showed mixed segment execution -- total revenue +1%, Software +5%, Consulting flat, Infrastructure -7% -- with management's own disclaimer that final results could differ from the preliminary figures. This challenges a simple, uniform hybrid-cloud-and-AI acceleration narrative."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "Current watsonx AI revenue, margin, and retention contribution; the current zSystems mainframe cycle and renewal economics; and IBM's updated debt and pension position after the second-quarter close are not established in this record's evidence base -- unresolved questions carried from the governing evidence bundle, not resolved by this record."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) was tested and confirmed blocked session-wide on 2026-07-28 (SEC EDGAR, multiple company investor-relations domains, and a neutral non-target control domain all returned HTTP 403) -- every fact in this record is attributed to the governed, independently verified evidence bundle's own directly-inspected sources, not to this Claude session's own document inspection. See IBM.md's Source-access disclosure."
    severity: low
    identified: "2026-07-28"
    status: monitoring
