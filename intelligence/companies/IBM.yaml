    expected: "2026-10-26"
    status: pending
conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). IBM shows a diversified, century-scale enterprise franchise with real, current AI (watsonx) and hybrid-cloud (Red Hat) positioning, and disciplined capital allocation (suspended buybacks, prioritized dividends/debt management since 2019). Held at Medium rather than higher because the evidence base itself is mixed and incomplete: preliminary Q2 2026 segment results were uneven (Infrastructure -7%), the final Q2 Form 10-Q was not yet available at this record's cutoff, and watsonx's own revenue/margin/retention contribution and the current zSystems cycle economics are not established by the inspected sources. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
