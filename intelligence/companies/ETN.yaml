conviction:
  rating: Medium
  rationale: "Eaton shows real, dated, cross-checked demand evidence (FY2025 revenue $27.448B +10%, adjusted EPS $12.07 +12%, record Q4 2025 segment margin of 24.9%, accelerating Electrical backlog and data-center order growth, raised FY2026 EPS/growth guidance) alongside a structural moat (certification requirements, multi-year lead times and capacity-build times) independently corroborated by trade press, not just company materials. Conviction is held at Medium rather than High because of three concrete, current tensions disclosed alongside the growth: (1) a large, single, thesis-concentrated acquisition (Boyd Thermal, ~35% of FY2025 revenue in deal value) not yet reflected in reported financials; (2) a disclosed Q1 2026 margin contraction that management calls temporary and at least one named analyst (UBS) disputes as more structural, with a specific incremental-margin estimate (~28%) cited as evidence; and (3) an announced structural separation (Vehicle/eMobility spin-off, targeted Q1 2027 close) that changes the company's own reporting structure before this record's next scheduled review. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat Eaton's own guidance or backlog framing as validated fact without the qualifications above."
