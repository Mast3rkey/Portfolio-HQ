conviction:
  rating: Medium
  rationale: "Eaton shows real, dated, cross-checked demand evidence (FY2025 revenue $27.448B +10%, adjusted EPS $12.07 +12%, official Q1 2026 sales $7.5B and adjusted EPS $2.81, record Q4 2025 segment margin of 24.9%, accelerating Electrical backlog, raised FY2026 EPS/growth guidance) alongside a structural moat (certification requirements, multi-year lead times and capacity-build times) independently corroborated by trade press, not just company materials. A 2026-07-26 independent primary-source audit (GPT-5.6 Thinking) resolved one prior uncertainty (the Boyd Thermal close date, now confirmed 2026-03-12) and corrected a stale framing of the Vehicle/eMobility separation (a definitive Reverse Morris Trust combination with Dana Incorporated, not a standalone spin) -- but this does not reduce conviction below Medium, because the Dana transaction is a materially more complex cross-company combination than a standalone spin, carrying its own execution and governance risk, and because the previously-cited 240%/32 GW/228 GW data-center order-growth figures could not be located in Eaton's official Q1 2026 release by the audit and are now treated as unconfirmed secondary commentary rather than decision-bearing evidence. Conviction is held at Medium rather than High because of two concrete, current tensions: (1) a large, single, thesis-concentrated acquisition (Boyd Thermal, ~35% of FY2025 revenue in deal value, closed 2026-03-12 but not yet reflected in a full quarter or full-year of segment financials); and (2) a disclosed Q1 2026 margin contraction that management calls temporary and at least one named analyst (UBS) disputes as more structural, with a specific incremental-margin estimate (~28%) cited as evidence. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat Eaton's own guidance or backlog framing as validated fact without the qualifications above."
