conviction:
  rating: Medium
  rationale: "Reassessed 2026-07-26 following an independent primary-source audit (not mechanically preserved at its prior value). Vertiv shows strong, cross-checked, recent demand and margin evidence (FY2025 net sales +26% organic, Q4 2025 orders +252% YoY, Q1 2026 adjusted operating margin +430bps YoY, two guidance raises within roughly one quarter, official Q1 2026 gross margin ~37.7%) alongside a balance sheet now confirmed even stronger than this record previously stated -- net leverage approximately 0.2x at Q1 2026 (officially sourced, versus this record's prior ~0.8x-1.0x WebSearch-derived estimate), running below Vertiv's own 1.0x-2.0x stated target, with investment-grade ratings from all three major agencies as of February 2026. The audit also found that this record's prior central risk/catalyst/conviction-limiting claim -- a $15B-to-$12.45B backlog decline -- could not be substantiated against Vertiv's own official Q1 2026 release or Form 10-Q, and that claim has been stripped of decision-bearing weight (see risks[] and catalysts[] above). Removing an unsubstantiated risk and confirming a stronger balance sheet do not by themselves justify raising conviction to High, because conviction here assesses business-quality and thesis durability, not balance-sheet strength alone, and three other concrete, still-unresolved tensions remain, unaddressed by the audit: (1) a named, not hypothetical, hyperscaler disintermediation threat (AWS's in-house Blackwell-specific liquid-cooling system, associated with a confirmed stock-price reaction) aimed directly at the AI-thermal-density workload driving Vertiv's growth; (2) a real, recent (2022) demonstrated episode of margin compression under input-cost stress that management itself admitted underestimating; and (3) a disclosed customer-concentration/transparency gap flagged by independent commentators and not resolved by any Vertiv-specific quantification this record or the audit could locate. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments."
