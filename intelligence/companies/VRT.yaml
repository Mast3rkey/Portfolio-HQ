conviction:
  rating: Medium
  rationale: "Vertiv shows strong, cross-checked, recent demand and margin evidence (FY2025 net sales +26% organic, Q4 2025 orders +252% YoY, Q1 2026 adjusted operating margin +430bps YoY, two guidance raises within roughly one quarter) alongside a materially de-risked balance sheet compared to its private-equity/SPAC origin (net leverage roughly 0.8-1.0x vs. 2.8x in 2020, investment-grade ratings from all three major agencies as of February 2026). Conviction is held at Medium rather than High because of specific, concrete, currently-unresolved tensions: (1) a named, not hypothetical, hyperscaler disintermediation threat (AWS's in-house Blackwell-specific liquid-cooling system, associated with a confirmed stock-price reaction) aimed directly at the AI-thermal-density workload driving Vertiv's growth; (2) an unreconciled backlog discrepancy ($15B to $12.45B across one quarter) this record could not resolve via available sources; (3) a real, recent (2022) demonstrated episode of margin compression under input-cost stress that management itself admitted underestimating; and (4) a disclosed customer-concentration/transparency gap flagged by independent commentators and not resolved by any Vertiv-specific quantification this record could locate. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments."
