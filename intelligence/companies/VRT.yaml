sector: Industrials
industry: Electrical Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Data-center-pure-play thermal management and power equipment provider riding a reported AI-driven demand surge: FY2025 net sales $10,229.9M (+26% organic YoY, from FY2024's $8,011.9M); Q4 2025 organic orders +252% YoY with backlog reaching $15B (described as more than doubling YoY) and a book-to-bill ratio of approximately 2.9x; Q1 2026 net sales $2,649.5M (+30% YoY: 23% organic, 4% acquisitions, 3% FX), adjusted operating margin 20.8% (+430bps YoY), adjusted EPS $1.17 vs. $1.01 consensus, adjusted free cash flow $653M (+147% YoY). FY2026 guidance (as of the Q1 2026 update) of net sales $13,500-14,000M (29-31% organic growth) and adjusted diluted EPS $6.30-6.40, with full-year adjusted operating margin guidance of 22.8%-23.8% (corrected 2026-07-26 by an independent primary-source audit against the official Q1 2026 release, replacing this record's prior unresolved 23.3%-vs-22.0-23.0% ambiguity) -- raised from the Q4 2025 release's initial guide of $13.25-13.75B/$5.97-6.07 -- management raised guidance twice within roughly one quarter."
  - "Substantially de-levered balance sheet relative to Vertiv's private-equity/SPAC origin, corrected 2026-07-26 by an independent primary-source audit: net leverage was approximately 2.8x at end of 2020 and fell to approximately **0.2x** at the end of Q1 2026, per Vertiv's own official Q1 2026 results release -- a materially lower figure than this record's prior WebSearch-sourced estimate of ~0.8x-1.0x (company-stated target range remains 1.0x-2.0x, so Vertiv is currently running below its own stated target). Debt/equity ratio 0.80 as of 2025-12-31, down from 1.26 a year earlier. Credit ratings upgraded one notch by all three major agencies in February 2026 (Moody's Baa3, S&P BBB-, Fitch BBB-), all investment grade. Completed a $2.1B senior unsecured notes offering (10/20/30/40-year tranches, its debut investment-grade-rated offering) and a new $2.5B senior unsecured revolving credit facility in March 2026, proceeds used to fully repay the prior secured term loan."
  - "Reported market-leadership position in AI-thermal-density liquid cooling: one secondary market-research source places Vertiv's 2025 liquid-cooling market share at just over 11%, with Schneider Electric/Vertiv/Rittal/STULZ/Boyd/CoolIT/Alfa Laval collectively holding roughly 35% of a still-fragmenting category (single-source market-share figures, not independently cross-verified). Active manufacturing-capacity expansion (Tognana, Italy campus to double regional chiller production capacity by end of 2026, plus a new large-scale testing lab planned for early 2027) and a continuing NVIDIA collaboration on 800 VDC reference architectures for next-generation AI data centers."
  - "Corrected 2026-07-26 by an independent primary-source audit: Vertiv's official Q1 2026 Form 10-Q reports product sales of $2,091.2 million and services-and-spares sales of $558.3 million (approximately 78.9%/21.1%), replacing this record's prior unverified single-secondary-source estimate of an approximately 81%/19% split. The same filing reports gross profit of $999.7 million on net sales of $2,649.5 million -- approximately 37.7% gross margin -- resolving this record's prior 'no gross-margin figure found' gap."
risks:
  - risk: "Named, specific hyperscaler disintermediation risk, distinct from generic competitive-risk boilerplate: AWS announced a custom, proprietary, rack-level liquid-cooling system (reported as 'IRHX') designed specifically for NVIDIA Blackwell GPUs -- precisely the AI-thermal-density workload central to Vertiv's own growth narrative. Secondary commentary reports Vertiv's stock declined on this announcement. Vertiv continues signing third-party partnerships (e.g., Compass Datacenters) and deepening its own NVIDIA 800 VDC collaboration, suggesting hyperscaler in-house development and continued third-party procurement are coexisting for now, not mutually exclusive -- but a hyperscaler building its own alternative to what Vertiv sells, for its most AI-relevant customer segment, is a real and specific bear-case mechanism, not a hypothetical one."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Customer-concentration and disclosure-transparency gap: multiple secondary commentators flag high customer concentration tied to a small number of hyperscale/neocloud providers, with at least one explicitly characterizing Vertiv's decision to reduce backlog-reporting detail and vagueness regarding customer concentration as a 'less-than-bullish' signal. This record could not find Vertiv's own quantified customer-concentration disclosure (e.g., percentage of revenue from top customers) via WebSearch, and this gap was not addressed by the 2026-07-26 independent primary-source audit -- treated here as a genuine transparency gap, not confirmed non-disclosure, and still not resolved."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Demonstrated historical margin/cyclicality risk: in Q1 2022, Vertiv reported an operating loss of $45 million and adjusted operating profit of only $13 million, driven by inflation and supply-chain cost pressures that its own CEO (per secondary reporting) admitted the company had 'consistently underestimated... for both timing and degree.' This is a real, recent (not hypothetical) demonstrated failure mode for this specific company's cost/pricing discipline under input-cost stress, distinct from the current growth narrative."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Valuation and volatility flags from independent analysts (context, not a valuation judgment by this record): one secondary source cites VRT trading around 82x P/E versus a ~40x US Electrical Equipment industry/peer average, with a stated 5-year beta of 2.04; the stock is reported to have drawn down roughly 25% from a June 2026 high (with additional double-digit single-day moves noted in 2025-2026 coverage). This record does not evaluate valuation, but the existence of a high-beta, sentiment-sensitive trading pattern is a factual, margin-relevant characteristic distinct from the underlying business fundamentals."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Non-decision-bearing unresolved secondary claim, corrected 2026-07-26: the original draft of this record treated a $15.0 billion (Q4 2025) to $12.45 billion (Q1 2026) backlog decline as a settled, company-reported discrepancy and gave it moderate-severity, decision-bearing weight in risks, catalysts, and conviction. An independent primary-source audit (GPT-5.6 Thinking) inspected Vertiv's official Q1 2026 results release and Form 10-Q and could not locate a passage substantiating the $12.45 billion figure in either document. This claim is therefore downgraded: it is retained here only as an unresolved, unsubstantiated secondary-sourced figure -- not a confirmed company disclosure -- and carries no decision-bearing weight in this record's conviction rationale, risk severity, or catalyst tracking. It should not be re-elevated to decision-bearing status without an exact official document and passage."
    severity: low
    identified: "2026-07-26"
    status: monitoring
