sector: Information Technology
industry: Application Software / CRM Platform
portfolio_role_ref: band
competitive_advantages:
  - "Platform thesis integrates CRM applications with Slack, Data Cloud, MuleSoft, Tableau, and Agentforce -- the annual filing explains how AI agents use Salesforce's own data, metadata, applications, and MuleSoft APIs, describing a genuinely integrated architecture rather than a loose bundle. Per Salesforce's Form 10-K for the fiscal year ended 2026-01-31 (SEC accession 0001108524-26-000060) and Salesforce's latest earnings filing, directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 8 evidence bundle (see Source-access disclosure in CRM.md) -- not directly inspected by this Claude session."
  - "Reported fiscal-year-end 2026 remaining performance obligations (RPO) of $72.4 billion and an approximately 8% attrition rate at 2026-01-31 (excluding Slack self-service and current-year acquisitions) -- disclosed recurring-revenue scale and durability evidence, alongside the filing's own explicit warning that RPO is affected by seasonality, renewal timing, contract terms, currency, new business, and acquisitions (including ~$2.2 billion tied to Informatica). Per Salesforce's Form 10-K for the fiscal year ended 2026-01-31, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Materially increased capital returns: fiscal 2026 repurchases were approximately $12.7 billion and dividends approximately $1.6 billion, followed by a $25 billion accelerated share repurchase announced in March 2026 -- current, filed evidence of an actively deployed capital-return program, though the ASR's final share count and effective price were not settled at initial delivery. Per Salesforce's Form 10-K for the fiscal year ended 2026-01-31 and Salesforce's Form 10-Q for the quarter ended 2026-04-30 (SEC accession 0001108524-26-000127), directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "The product stack (CRM applications, Slack, Data Cloud, MuleSoft, Tableau, Agentforce) is acquisition-assembled and faces integration, competition, and monetization risk; Agentforce revenue, margin, cannibalization, and customer-payback evidence remain incomplete in the inspected sources -- product-adoption narratives should not be conflated with disclosed revenue and cash economics."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "RPO ($72.4 billion at fiscal year-end 2026) is not necessarily indicative of future revenue growth per Salesforce's own disclosure, is acquisition- and timing-sensitive (including ~$2.2 billion tied to Informatica), and is not directly comparable with Oracle's or ServiceNow's own differently defined RPO/renewal metrics."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "Large and increasing capital returns (~$12.7 billion repurchases, ~$1.6 billion dividends in fiscal 2026, plus a $25 billion March 2026 accelerated share repurchase) compete with acquisition financing, debt reduction, and reinvestment; economic return depends on the price paid and future per-share cash generation, neither of which is established as favorable by the inspected sources alone."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) was tested and confirmed blocked session-wide on 2026-07-28 (SEC EDGAR, multiple company investor-relations domains, and a neutral non-target control domain all returned HTTP 403) -- every fact in this record is attributed to the governed, independently verified evidence bundle's own directly-inspected sources, not to this Claude session's own document inspection. See CRM.md's Source-access disclosure."
    severity: low
    identified: "2026-07-28"
    status: monitoring
catalysts:
  - catalyst: "Salesforce's next quarterly results and any further Agentforce-specific KPI disclosure, which would update RPO, attrition, and AI-monetization evidence beyond the Q1 FY2027 figures inspected for this record -- not available as of this record's 2026-07-28 evidence cutoff."
    expected: "2026-08-27"
    status: pending
  - catalyst: "This record's own next scheduled review checkpoint, at which Agentforce standalone economics, Informatica integration progress, and the final accelerated-share-repurchase settlement will next be actively re-checked."
    expected: "2026-10-26"
    status: pending
conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). Salesforce shows a large, integrated platform (CRM, Slack, Data Cloud, MuleSoft, Tableau, Agentforce), meaningful disclosed recurring-revenue scale ($72.4 billion RPO, ~8% attrition), and an aggressively deployed capital-return program ($12.7 billion repurchases and $1.6 billion dividends in fiscal 2026, plus a further $25 billion accelerated repurchase). Held at Medium rather than higher because Agentforce's own standalone revenue, margin, and customer-payback economics are not established in the inspected sources, the product stack's acquisition-assembled nature (most recently Informatica) creates real integration risk, and RPO is explicitly acquisition- and timing-sensitive rather than a clean forward-revenue signal. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
