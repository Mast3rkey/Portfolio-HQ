sector: Industrials
industry: Space Launch Services and Spacecraft Manufacturing
portfolio_role_ref: gated
competitive_advantages:
  - "Rocket Lab combines operational Electron and HASTE launch services with spacecraft, components, and mission capabilities in Space Systems. The breadth is real; the integration and cross-selling benefits remain outcomes to test rather than assumed synergies. [RKLB-P01] [RKLB-P02]"
  - "Q2 2026 revenue was a record $234.1M, up 62%, and backlog was $2.356B. Approximately 45% of backlog was expected to be recognized within 12 months. Backlog is not revenue or profit, and option values require separate treatment. [RKLB-P01] [RKLB-P02]"
  - "Space Systems revenue was $189.5M, up 94%, reflecting spacecraft-manufacturing growth and acquisitions. Launch Services revenue was $44.6M, down 4%, despite six Electron missions versus five a year earlier because of revenue-recognition timing. [RKLB-P02]"
  - "At June 30, cash and current plus non-current marketable securities totaled $2.388B against $14.8M of convertible notes and long-term borrowings, producing derived net cash of $2.373B before leases and restricted cash. [RKLB-P01]"
risks:
  - risk: "Neutron remains pre-flight. Rocket Lab reported ongoing qualification, first-flight hardware integration, Archimedes testing, and Stage 1 tank production aligned with targeted Q4 2026 pad delivery, but also said the end-of-year launch window was narrowing and timing depended on unfinished first-stage assembly and test outcomes. The first-flight Stage 1 tank has not been reported as qualified or delivered to the pad. [RKLB-P01] [RKLB-P02]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "Q2 growth was concentrated in Space Systems. Launch Services revenue fell 4% despite one additional Electron mission; HASTE revenue-recognition timing explains part of the comparison but does not remove segment-mix and launch-economics risk. [RKLB-P02]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "Rocket Lab remains loss-making and cash-consuming: Q2 GAAP operating loss was $57.5M, net loss was $49.3M, adjusted EBITDA loss was $8.8M, and first-half operating cash outflow was $134.4M. [RKLB-P01]"
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "First-half gross ATM equity proceeds were $1.530B before $16.7M of issuance costs. Common shares outstanding rose to 598.2M from 543.6M in six months, and Q3 guidance uses 641M basic weighted-average shares including participating preferred shares. Liquidity should not be mistaken for self-funded operations. [RKLB-P01]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "The pending Iridium transaction requires cash plus Rocket Lab stock, is expected to close in 2027, and remains subject to shareholder, antitrust, FCC, foreign-investment, satellite, and telecommunications approvals. Rocket Lab obtained a commitment for a $3.6B 364-day senior secured bridge facility, creating material financing and integration risk. [RKLB-P02]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "Mynaric contributed $13.2M of Q2 revenue and a $13.2M operating loss; Motiv contributed $1.4M of revenue and a $0.2M operating loss. These partial-quarter results do not establish successful integration or normalized acquired-business economics. [RKLB-P02]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "At the September 4, 2026 close, a derived standalone enterprise value of $38.091B equaled 40.68x annualized Q2 revenue and 36.98x annualized Q3 revenue guidance midpoint. These high, non-normalized screens require substantial future growth and margin delivery and exclude the pending Iridium transaction."
    severity: high
    identified: "2026-09-07"
    status: monitoring
catalysts:
  - catalyst: "Prospectively defined Neutron checkpoint: issuer confirmation that the first-flight Stage 1 tank completed qualification and the integrated first stage was delivered to Launch Complex 3, with material test exceptions disclosed. Achievement reopens review but does not automatically clear the gate."
    expected: "Q4 2026 (management target; exact date not announced as of 2026-09-07)"
    status: pending
  - catalyst: "Q3 2026 results, including segment mix, backlog conversion, cash consumption, share count, acquisition integration, and Neutron test outcomes."
    expected: "November 2026 (estimate; issuer date not announced as of 2026-09-07)"
    status: pending
  - catalyst: "Iridium shareholder and regulatory approvals plus final financing structure and updated pro forma economics."
    expected: "2027 (management transaction-close expectation)"
    status: pending
conviction:
  rating: Medium
  rationale: "Direct Q2 primary evidence confirms strong Space Systems growth, record backlog, and substantial liquidity, but Launch Services revenue declined, operations remain loss-making and cash-consuming, dilution is material, and the pending Iridium transaction introduces major financing and integration risk. Management's nonspecific 'critical milestones' wording does not satisfy an independently testable Neutron gate. The current market screen is demanding and is not a normalized intrinsic-value conclusion. Retain Medium conviction and the existing cash_pending_clearance gate; no target, allocation, trading, or leverage judgment follows from this record."
