conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not itself constitute approval (see review.log below). Rocket Lab shows genuine, evidenced operational strength -- a demonstrated Electron reliability track record (21-for-21 in 2025), record and accelerating revenue with improving gross margins, a substantial and diversifying national-security contract base, and a real vertically integrated launch-plus-spacecraft-manufacturing model. Held at Medium rather than higher because this record's own research independently confirms every concern the gate names remains live, and surfaces one the gate's static text likely does not yet fully reflect: Neutron has not yet flown and has slipped at least twice, with no single confirmed 'defined technical milestone' identifiable as satisfying the gate's own reopening condition; the company remains GAAP-loss-making with active, growing dilution across two large 2026 ATM programs; and the newly announced, approximately $8 billion Iridium acquisition (financed via a new $3.6 billion bridge loan, not closing until mid-2027, requiring shareholder and antitrust/spectrum-regulatory approval) is a substantially larger and more complex integration question than whatever the gate's drafters likely had in mind when citing 'acquisition integration' -- a material fact any future gate reassessment should weigh explicitly, not treat as a footnote. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and was not inferred from RKLB's existing gated/cash-pending-clearance status or its 0.50% canonical target -- it was reasoned solely from the disclosed operating and financial picture, which independently supports the same 'material progress, but real milestone risk' conclusion the gate itself already recorded, while surfacing the Iridium deal as a materially updated fact the gate's original text may not yet capture."
