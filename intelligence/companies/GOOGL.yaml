    expected: "2026-12-31"
    status: pending
  - catalyst: "Search-distribution case appeal outcomes, following the December 2025 final judgment and the January/February 2026 cross-appeals; no source establishes a specific appeal-resolution date, so 2027-06-30 is an internal review checkpoint, not a forecast of event timing"
    expected: "2027-06-30"
    status: pending
  - catalyst: "TPU hardware revenue recognition beginning, per Alphabet's own disclosed expectation of 'later in 2026, with most revenue in 2027' -- the general timeframe is company-disclosed, but the specific 2027-01-01 date is an internal review checkpoint approximating 'early 2027,' not a source-established exact date"
    expected: "2027-01-01"
    status: pending
conviction:
  rating: Medium
  rationale: "Alphabet shows genuinely strong, diversified, and accelerating core economics: a still-largest-by-revenue advertising franchise growing double digits, a now-profitable and fast-growing cloud segment (63% YoY revenue growth, $6.598B quarterly segment operating income), a very large disclosed cloud backlog, and strong liquidity ($126.840B cash/marketable securities) with demonstrated capital-markets access. Conviction is held at Medium rather than High because of two concrete, current, unresolved tensions of a different character than ordinary business risk: two simultaneous, live U.S. antitrust matters, one of which (ad-tech) already carries an adverse liability finding with a possible structural remedy still to be determined, and a capex acceleration (more than doubled YoY) accompanied by a same-quarter new debt issuance -- new debt issuance accompanied the capex increase, but the specific use of proceeds, total-debt change, and net-leverage change are not established by any source this record relies on, so this record does not assert capex is directly debt-funded or that financial leverage increased. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat the disclosed cloud backlog as equivalent to realized revenue, nor treat either antitrust matter's outcome as resolved."
