sector: Consumer Discretionary
industry: Electric Vehicles, Energy Storage, and Autonomy/Robotics
portfolio_role_ref: gated
competitive_advantages:
  - "Q2 2026 vehicle deliveries reached 480,126, up 25%, while cumulative deliveries reached 9.7M. Scale is demonstrated; durable unit economics must be assessed separately. [TSLA-P01] [TSLA-P02]"
  - "Energy storage deployments were 13.5 GWh, up 41%, and energy generation and storage revenue was $3.139B, up 13%. The operating contribution cannot be inferred from deployment growth alone. [TSLA-P01]"
  - "Services and other revenue grew 50% to $4.581B. Tesla reported 1.48M active FSD subscriptions, providing an observable recurring-revenue metric, though it remains far below the nearest issuer-defined 10M milestone. [TSLA-P01]"
  - "At June 30, cash, equivalents, and short-term investments were $43.524B against $9.342B of debt and finance leases, producing derived net liquidity of $34.182B before other obligations. [TSLA-P02]"
risks:
  - risk: "Profitability did not keep pace with revenue: Q2 GAAP gross margin was 16.8%, operating income fell 57% to $398M, and operating margin was 1.4%. Q2 regulatory-credit revenue fell 67% to $146M. [TSLA-P01]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "Q2 operating cash flow of $4.697B was below $5.789B of capital expenditures, producing derived free cash flow of negative $1.092B. Management expects 2026 capex above $25B. [TSLA-P01] [TSLA-P02]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "Q2 GAAP net income included a $1.005B unrealized SpaceX-investment gain, and the tax provision included a $274M benefit from releasing a California deferred-tax valuation allowance. These reported benefits are not normalized operating earnings. [TSLA-P01] [TSLA-P02]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "Tesla invested $2.00B in SpaceX common stock during the first half of 2026. The related-party allocation adds concentration, governance, liquidity, and fair-value-volatility risk outside Tesla's operating businesses. [TSLA-P02]"
    severity: high
    identified: "2026-09-07"
    status: monitoring
  - risk: "The CEO performance award covers 423.7M restricted shares. Tesla reported $9.82B of unrecognized compensation for the probable milestone and $105.82B-$120.37B associated with milestones considered not probable. Q2 stock-based compensation was $1.151B. [TSLA-P02]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "Robotaxi service is early and heterogeneous: Tesla described the Bay Area as supervised with a safety driver and six other metros as ramping unsupervised, but disclosed no fleet count. Optimus lines were still being installed and no delivered-bot count was disclosed. [TSLA-P01]"
    severity: high
    identified: "2026-08-05"
    status: monitoring
  - risk: "At the September 4, 2026 close, derived enterprise value was $1.219T, or 11.77x trailing revenue and 278.9x trailing GAAP operating income. These non-normalized screens embed substantial future execution and do not constitute intrinsic value."
    severity: high
    identified: "2026-09-07"
    status: monitoring
catalysts:
  - catalyst: "A repository owner identifies the accepted milestone framework and thresholds in durable policy evidence. This is necessary to make the existing gate independently testable but does not itself clear the gate."
    expected: "No date established"
    status: pending
  - catalyst: "Issuer evidence that an operational milestone in the closest direct framework has been achieved, plus a fresh, decision-grade valuation review. Achievement reopens review; it does not automatically authorize an add."
    expected: "No date established"
    status: pending
  - catalyst: "Q3 2026 results, including segment margins, cash conversion, capital expenditures, SBC, related-party investment marks, FSD subscriptions, Robotaxi fleet evidence, and Optimus delivery evidence."
    expected: "October 2026 (estimate; issuer date not announced as of 2026-09-07)"
    status: pending
conviction:
  rating: Medium
  rationale: "Direct Q2 primary evidence confirms substantial scale and liquidity, but operating margin compressed to 1.4%, free cash flow was negative, 2026 capex is expected above $25B, reported net income included material investment and tax benefits, and dilution plus related-party capital allocation are meaningful. Autonomy and robotics are operating at a scale far below the nearest direct issuer milestones, while the current market screen is demanding and is not an intrinsic-value conclusion. Retain Medium conviction and the existing cash_pending_clearance gate; no target, allocation, trading, or leverage judgment follows from this record."
