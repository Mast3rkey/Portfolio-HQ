conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not itself constitute approval (see review.log below). Tesla's current-quarter operating scale is genuinely large and, on deliveries and storage deployments, record-setting (confirming and refining the gate's own cited Q2 2026 figures), with a real, evidenced charging-network moat and an actually-operating (if still safety-driver/geographically limited) robotaxi service. Held at Medium rather than higher because this record's research independently confirms the gate's own framing -- that the current small target depends on autonomy/energy/robotics/capital-allocation/valuation milestones rather than current deliveries alone -- is well supported: regulatory-credit revenue (a real historical profit cushion) has collapsed; both major segments showed material sequential margin compression in the most recent quarter with a swing to negative free cash flow against sharply rising capex; Optimus shows minimal-to-zero current production with management's own 'impossible to predict' framing; autonomy carries a live, material, unresolved NHTSA safety investigation covering roughly 3.2 million vehicles; and the CEO's own board-approved pay package makes explicit, via its own operational-milestone structure, how much of the forward valuation case rests on businesses (robotaxi, Optimus) with currently limited-to-near-zero commercial scale. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and was not inferred from TSLA's existing gated/cash-pending-clearance status or its 0.50% canonical target -- it was reasoned solely from the disclosed operating and financial picture, which independently supports the same 'substantial current scale, but forward value concentrated in unproven milestones' conclusion the gate itself already recorded."
