sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Leading position in plasma etch and thin-film deposition, particularly high-aspect-ratio etch/deposition for 3D NAND memory fabrication -- the batch's most memory-concentrated company. Q3 FY2026 (quarter ended 2026-03-29, reported 2026-04-22): revenue $5,841M (+9% QoQ, +24% YoY), GAAP net income $1,825M ($1.45 diluted EPS), GAAP gross margin 49.8%. Customer Support Business Group (CSBG, recurring service/spares/upgrades) reached a record $2.11B in Q3 FY2026 (+25% YoY), first time crossing $2B in a single quarter -- management targets CSBG growing more than 1.5x by calendar 2028 versus calendar 2024 levels"
  - "Gross margin trend improving through FY2025-FY2026: 47.3% (FY2024) to 48.7% (FY2025) to 49.8-50.6% across FY2026 quarters reported so far -- a consistent upward trend corroborated across independent sources. Stated capital-return policy targets returning at least 85% of free cash flow to shareholders over time; 9 months of FY2026 saw $4.55B returned to shareholders (buybacks + dividends) against $3.62B free cash flow over the same period, implying a pace above the long-run 85% target in this specific window"
  - "New product traction cited in secondary sources: the Vantex cryogenic etch system won a described 'key multi-generation etch decision at a major NAND customer'; ALTUS ALD molybdenum-deposition systems support 200+ layer 3D NAND stacks; advanced-packaging (electroplating and TSV etch) positioned for HBM4/4E and 16-high stack requirements, with company commentary citing advanced-packaging revenue tripling to over $3B in 2025 and an expectation of more than 50% growth in calendar 2026 -- these are recent, forward-looking management statements, not yet confirmed against a full fiscal-year 10-K figure"
risks:
  - risk: "The batch's most concentrated and most volatile memory-cycle exposure -- a Q2 FY2026 systems-revenue split cited in secondary sources (not verified against a primary transcript) as Foundry 59% / Memory 34% (DRAM 23%) / NAND 11%. The 2022-2023 memory/WFE downturn, precisely sequenced by quarter (remediation pass, 2026-07-25): Q1 FY2023 (quarter ended 2022-09-25) revenue $5,074M; Q2 FY2023 (quarter ended 2022-12-25) $5,278M, the cycle's peak; Q3 FY2023 (quarter ended 2023-03-26) $3,870M, a 26.7% sequential (QoQ) decline from Q2 FY2023; Q4 FY2023 (quarter ended 2023-06-25) $3,207M, a further 17.1% sequential (QoQ) decline from Q3 FY2023; Q1 FY2024 (quarter ended 2023-09-24) $3,482M, an 8.6% sequential (QoQ) increase from Q4 FY2023 but a 31.4% year-over-year (YoY) decline versus Q1 FY2023's $5,074M. The approximately 31% figure is therefore a YoY comparison between the Q1 FY2024 (Sept 2023) and Q1 FY2023 (Sept 2022) quarters specifically -- distinct from, and not to be conflated with, the two sequential QoQ declines (26.7% and 17.1%) that occurred in the two quarters immediately preceding it. This YoY decline is the sharpest single-metric decline found anywhere in this batch's research, and coincided with a ~1,300-employee (approximately 7% of workforce) layoff announced 2023-01-23/25 (Form 8-K filed 2023-01-23, SEC EDGAR accession 0000707549-23-000005; CEO Tim Archer publicly discussed the reduction on the Q2 FY2023 earnings call held 2023-01-25), which the company's own stated reasons (per secondary paraphrase of that call) attributed to both slowing wafer-fabrication-equipment demand and the effect of the most recent US export-control regulations restricting China shipments -- a mixed, company-stated causation, not a single cause asserted by this record independently"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "China export-control exposure, quantified and currently escalating: the October 2022 BIS action was estimated by the company at the time to cost as much as $2.5B, approximately 13% of FY2022 revenue. A newer 2026 'affiliate rule' restriction is company-quantified at approximately $200M revenue impact in the December 2025 quarter and approximately $600M headwind for calendar 2026, with China's share of Lam's revenue guided down from approximately 43% (Q1 FY2026, September 2025 quarter) to below 30% for calendar 2026. A separate secondary source describes Lam losing the ability to service certain already-installed China equipment after 2023 restrictions, with a Chinese competitor (AMEC) reportedly developing replacement parts (electrostatic chucks) to fill that servicing gap -- exact date/regulation for this specific servicing restriction was not independently confirmed in this research pass"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "One internally conflicting FY2025 figure was found and is explicitly not resolved by this record: FY2025 (fiscal year ended 2025-06-29) revenue was cited as $18.44B (+23.7% YoY, 48.7% gross margin) in two independent search results, but a separate source cited 'fiscal 2025 revenue of $14.6 billion' and '47.2% gross margin' in the context of a $1.0B buyback authorization -- possibly a stale or mislabeled figure referencing a different prior fiscal year. This record treats the $18.44B/48.7% figures as more likely correct (corroborated by two independent sources) but flags the conflict explicitly rather than silently discarding it"
    severity: low
    identified: "2026-07-25"
    status: monitoring
  - risk: "Elevated single-day stock volatility observed repeatedly in 2026 even during an up-cycle -- e.g. a reported -9.90% single-day move on 2026-06-23 amid sector-wide selling, and -6.34% on 2026-07-15 -- both tied to China export-curb news and broader semiconductor-sector selloffs, illustrating continued high sensitivity to China-policy headlines despite strong reported fundamentals in the same period"
    severity: low
    identified: "2026-07-25"
    status: monitoring
catalysts:
  - catalyst: "Q4 FY2026 earnings report (quarter ended approximately 2026-06-30), scheduled 2026-07-29 -- postdates this record's research cutoff; company guidance given alongside Q3 FY2026 results: revenue $6.6B +/- $400M, EPS $1.65 +/- $0.15"
    expected: "2026-07-29"
    status: pending
conviction:
  rating: Medium
  rationale: "Lam Research holds a leading position in plasma etch and thin-film deposition with particular strength in high-aspect-ratio NAND processes, a record CSBG (recurring service) revenue trajectory, and improving gross margins through FY2025-FY2026. Conviction is Medium rather than High because: (1) Lam carries this batch's most concentrated memory-cycle exposure, and the 2022-2023 downturn demonstrated the resulting severity directly -- a documented 31.4% YoY revenue decline (Q1 FY2024's quarter ended 2023-09-24 vs. Q1 FY2023's quarter ended 2022-09-25, distinct from two separate sequential QoQ declines of 26.7% and 17.1% in the two preceding quarters) and a ~7%-workforce layoff (per an official 2023-01-23 Form 8-K and the company's own 2023-01-25 earnings-call commentary, which cited both demand weakness and export controls), the sharpest downturn evidence found for any company in this batch; (2) China export-control exposure is quantified, material, and currently escalating (a newer 2026 'affiliate rule' restriction with a disclosed ~$600M calendar-2026 headwind, on top of the 2022 action's disclosed ~13%-of-FY2022-revenue estimated impact); (3) this record's research surfaced one internally conflicting FY2025 revenue figure ($18.44B vs. a separately cited $14.6B) not reconciled to a primary source; and (4) elevated single-day stock volatility persisted into 2026 even during a reported up-cycle, evidence of continued market sensitivity to China-policy headlines specifically. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from LRCX's existing band tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 SS2/SS3)."
