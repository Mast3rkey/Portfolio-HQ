    expected: "2026-07-31"
    status: pending
  - catalyst: "Chevron's Q2 2026 Form 10-Q, which will supersede the Q1 2026 Form 10-Q's balance-sheet, cash-flow, and segment detail -- no source inspected by this record establishes an exact 10-Q filing date; 2026-08-14 is an unconfirmed internal placeholder (the Q1 2026 10-Q filed 37 days after quarter-end), not a forecast the company has made."
    expected: "2026-08-14"
    status: pending
