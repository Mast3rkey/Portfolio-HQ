sector: Information Technology
industry: Application Software / Enterprise Workflow Automation
portfolio_role_ref: band
competitive_advantages:
  - "Unified cloud workflow platform spanning IT service management, IT operations management, security operations, customer/employee workflows, and creator tooling, with Now Assist AI agents embedded across modules -- a stated, filed strategy of platform breadth rather than a single point solution. Per ServiceNow's Form 10-K for the year ended 2025-12-31 (SEC accession 0001373715-26-000007), directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 8 evidence bundle (see Source-access disclosure in NOW.md) -- not directly inspected by this Claude session."
  - "Reported a 98% ACV-based renewal rate for 2023-2025 and year-end 2025 remaining performance obligations (RPO) of $28.2 billion, with 46% expected to be recognized within 12 months -- strong disclosed recurring-revenue and contract-durability evidence, though the renewal measure excludes several expansion/contraction effects and RPO varies with contract duration and currency. Per ServiceNow's Form 10-K for the year ended 2025-12-31, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "For first-quarter 2026, reported subscription revenue of $3.671 billion, cRPO of $12.64 billion, RPO of $27.7 billion, and more than 130% year-over-year growth in customers spending over $1 million ACV on Now Assist -- current, filed evidence of both continued recurring-revenue growth and an actively expanding AI-product customer cohort, though total Now Assist revenue and gross-margin economics are not separately disclosed. Per ServiceNow's Form 10-Q for the quarter ended 2026-03-31 (SEC accession 0001373715-26-000056) and ServiceNow's Q1 2026 earnings release, directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "Product breadth across IT, operations, security, customer, employee, and creator workflows raises bundling, sales-complexity, and execution risk; product capability does not by itself establish incremental AI revenue or profitability, and customer examples in the filing are selective rather than representative."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "The headline 98% ACV-based renewal rate is definition-limited -- it excludes several expansion and contraction effects -- and cannot be directly compared with Salesforce's attrition rate, CrowdStrike's ARR-based retention, or Palo Alto Networks' NGS ARR without accounting for each issuer's own definition and exclusions."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "ServiceNow acquired Moveworks for approximately $2.4 billion, recording substantial goodwill and developed-technology value -- integration and synergy realization are material to the AI-platform thesis and were not established as achieved in the inspected sources; purchase accounting was preliminary at filing."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "ServiceNow financed part of its Armis acquisition with a $4.0 billion unsecured term loan; its Q2 2026 filed cash-flow statement directly reports $3.991 billion of term-loan proceeds net of issuance costs and $4.000 billion of term-loan repayments in the same period -- the repayment itself is a directly reported fact, not unresolved. ServiceNow separately issued $4.0 billion of multi-tranche notes (2028-2056 maturities) around the same period. The precise funding bridge, the use of the notes' proceeds, the final debt-component composition, and Armis purchase-accounting details are not established in the inspected sources, and the notes should not be assumed to have necessarily funded the term-loan repayment."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) was tested and confirmed blocked session-wide on 2026-07-28 (SEC EDGAR, multiple company investor-relations domains, and a neutral non-target control domain all returned HTTP 403) -- every fact in this record is attributed to the governed, independently verified evidence bundle's own directly-inspected sources, not to this Claude session's own document inspection. See NOW.md's Source-access disclosure."
    severity: low
    identified: "2026-07-28"
    status: monitoring
catalysts:
  - catalyst: "ServiceNow's next quarterly results, which would update renewal, RPO/cRPO, and Now Assist customer-cohort metrics beyond the Q1 2026 figures inspected for those items in this record (the Q2 2026 earnings release was inspected only for the separate term-loan/notes financing facts added by this record's 2026-07-28 correction, not for renewal/RPO/cohort metrics). Correction note (2026-07-28): an earlier draft of this catalyst cited an unsupported 2026-10-22 date; independently inspected official ServiceNow sources (the July 1, 2026 earnings-date announcement and the July 22, 2026 Q2 2026 results release) establish only the already-completed Q2 2026 date and supply no official Q3 2026 date. This entry is event-based pending an official ServiceNow announcement, not a guessed date."
    expected: "pending official announcement -- no confirmed next-earnings date established by directly inspected sources as of 2026-07-28"
    status: pending
  - catalyst: "This record's own next scheduled review checkpoint, at which direct Now Assist revenue/margin disclosure, post-Moveworks retention evidence, and seat-versus-module expansion mix will next be actively re-checked."
    expected: "2026-10-26"
    status: pending
conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). ServiceNow shows strong disclosed recurring-revenue economics (98% renewal, $28.2 billion year-end RPO, continued Q1 2026 subscription and RPO growth) and a real, currently expanding AI-product customer cohort (>130% YoY growth in customers spending over $1 million ACV on Now Assist). Held at Medium rather than higher because material elements of the AI-monetization and acquisition-integration thesis remain undisclosed at the claim level this record relies on: total Now Assist revenue and gross margin are not separately reported, and Moveworks' ~$2.4 billion acquisition (with substantial recorded goodwill) has not yet demonstrated integration success in the inspected sources. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
