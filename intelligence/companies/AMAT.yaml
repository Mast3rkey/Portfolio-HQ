sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Largest US-based semiconductor equipment maker by revenue, with the broadest process-step coverage of any company in this batch: deposition (CVD/PVD/ALD), etch, ion implantation, chemical-mechanical planarization, and metrology/inspection, plus Applied Global Services (AGS, recurring service/spares/upgrades) and a smaller Display and Adjacent Markets segment. FY2025 (fiscal year ended 2025-10-26): record revenue $28.37B (+4% YoY, sixth consecutive year of growth), net income $6.998B, GAAP diluted EPS $8.66 (record). Q2 FY2026 (reported 2026-05-14): record revenue $7.91B (+11% YoY); calendar-2026 semiconductor-equipment growth outlook raised to >30% at that report"
  - "Margin expansion trend through FY2025-FY2026 despite China headwinds, likely mix-driven (AGS and leading-edge growth): non-GAAP gross margin reached 48.8% in Q4 FY2025 (described by the company as the highest level in 25 years), with GAAP gross margin at 49.0% in Q1 FY2026. AGS (recurring) segment revenue grew faster than Semiconductor Systems in the most recent quarters reported (Q2 FY2026 AGS +17% YoY vs. total company +11% YoY)"
  - "Active capital-return program: FY2025 total shareholder returns (dividends + buybacks) of approximately $6.3B; a new buyback authorization on top of prior programs, with roughly $13.2B remaining under authorization at the end of Q2 FY2026; multiple consecutive years of dividend increases (exact current quarterly rate unresolved -- see Markdown source-access disclosure for a conflict between $0.46 and $0.53 figures found in research, not resolved here)"
risks:
  - risk: "Highest, most volatile China-revenue concentration of any company in this batch -- reported in a roughly 24-30% of total-revenue range across the last five quarters found in research (FY2022 ~30%, FY2025 ~28-30% depending on basis, Q1 FY2026 30% / $2.1B, Q2 FY2026 24%), moving unevenly quarter to quarter rather than declining smoothly despite repeated export-control tightening -- consistent with lumpy shipment/install-acceptance timing rather than a steady glide-down. Three dated waves of US export-control tightening in roughly three years (October 2022, an October 2023 update whose AMAT-specific dollar impact was not found in this research pass, and a September 2025 'BIS Affiliates Rule' with a disclosed ~$110M Q4 FY2025 and ~$600M FY2026 estimated revenue impact -- one source separately cited a $710M figure not reconciled against the $110M+$600M breakdown) show no sign of stabilizing"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "China's own reported ~50% domestic-equipment-content mandate for new fab capacity (sourced only via anonymous-sourced/unofficial reporting as of this record's evidence date, not an officially documented regulation -- flagged explicitly as unresolved at the primary-source level) would be a structural, not merely cyclical, cap on AMAT's addressable China market share going forward, layered on top of existing US export controls. Chinese domestic equipment makers (Naura, AMEC) show real revenue growth (Naura's nine-month FY2025 revenue roughly 4-5x its full-year-2020 level) and technology-capability progression (14nm etch deployed, 7nm reportedly in test); one claim of an AMEC 5nm etch tool in 'validation' at a TSMC advanced-logic line was found in research and is flagged as needing strong independent verification given how unusual such a claim would be"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Workforce reduction (approximately 4%, ~1,400 jobs, disclosed 2025-10-23) with an associated $160-180M charge, explicitly attributed by the company to tightening export controls and a need to streamline operations -- a disconfirming data point against a pure growth-narrative framing, occurring in the same period the company was also citing AI-driven demand strength"
    severity: low
    identified: "2026-07-25"
    status: monitoring
  - risk: "Semiconductor capital-equipment cyclicality with documented historical severity: FY2019 revenue guided down approximately 16% amid a broader DRAM-oversupply-driven industry downturn (DRAM industry revenue -37.5% in that cycle); one third-party analytical source (Trefis, not independently verified) characterizes AMAT as having traded through 15 major historical shocks with an average peak-to-trough stock decline of 23% (vs. 16% for the S&P 500 over the same episodes) and a single deepest historical drawdown of approximately 55%"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
catalysts:
  - catalyst: "Q3 FY2026 earnings report (quarter ending approximately July 2026), company guidance given at Q2 FY2026 report: revenue approximately $8.95B, non-GAAP EPS approximately $3.36"
    expected: "2026-08-15"
    status: pending
conviction:
  rating: Medium
  rationale: "Applied Materials is the largest US semiconductor-equipment maker with the broadest process-step coverage of any company in this four-company batch and a record FY2025/Q2 FY2026 revenue and margin trajectory. Conviction is Medium rather than High because: (1) AMAT carries the highest and most volatile China-revenue concentration of the batch (roughly 24-30% of revenue across recent quarters), directly exposed to three separate dated waves of US export-control tightening in roughly three years with no sign of stabilizing; (2) China's reported (unofficially sourced, unresolved) domestic-equipment-content mandate would be a structural cap on AMAT's addressable China share independent of any further US action; (3) this record's own research surfaced multiple internally conflicting figures (Q2 FY2026 EPS, FY2025 Display-segment revenue, current dividend rate, the September 2025 export-rule dollar impact) that were not reconciled to a primary source in this research pass -- disclosed explicitly in the Markdown record rather than silently resolved in AMAT's favor or against it; and (4) a disclosed October 2025 workforce reduction explicitly attributed to export-control tightening is a real, recent disconfirming data point against a pure growth-story framing. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from AMAT's existing band tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 SS2/SS3)."
