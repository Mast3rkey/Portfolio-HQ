sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Largest US-based semiconductor equipment maker by revenue, with the broadest process-step coverage of any company in this batch: deposition (CVD/PVD/ALD), etch, ion implantation, chemical-mechanical planarization, and metrology/inspection, plus Applied Global Services (AGS, recurring service/spares/upgrades) and a smaller Display and Adjacent Markets segment. FY2025 (fiscal year ended 2025-10-26): record revenue $28.37B (+4% YoY, sixth consecutive year of growth), net income $6.998B, GAAP diluted EPS $8.66 (record). Q2 FY2026 (reported 2026-05-14): record revenue $7.91B (+11% YoY); calendar-2026 semiconductor-equipment growth outlook raised to >30% at that report"
  - "Margin expansion trend through FY2025-FY2026 despite China headwinds, likely mix-driven (AGS and leading-edge growth): non-GAAP gross margin reached 48.8% in Q4 FY2025 (described by the company as the highest level in 25 years), with GAAP gross margin at 49.0% in Q1 FY2026. AGS (recurring) segment revenue grew faster than Semiconductor Systems in the most recent quarters reported (Q2 FY2026 AGS +17% YoY vs. total company +11% YoY)"
  - "Active capital-return program: FY2025 total shareholder returns (dividends + buybacks) of approximately $6.3B; a new buyback authorization on top of prior programs, with roughly $13.2B remaining under authorization at the end of Q2 FY2026; multiple consecutive years of dividend increases (exact current quarterly rate unresolved -- see Markdown source-access disclosure for a conflict between $0.46 and $0.53 figures found in research, not resolved here)"
risks:
  - risk: "Material, moving China-revenue concentration -- reported in a roughly 24-30% of total-revenue range across the last five quarters found in research (FY2022 ~30% YTD basis, FY2025 ~28% on a systems+services basis / ~30.07% on a total-company-revenue basis -- two different denominators for the same period, not a conflict, see Markdown source-access disclosure -- Q1 FY2026 30% / $2.1B, Q2 FY2026 24%), moving unevenly quarter to quarter rather than declining smoothly despite repeated export-control tightening. This record does not claim AMAT's China exposure is the highest of the four companies in this batch -- an earlier draft made that comparative claim without a consistent, same-period, same-basis comparison across all four records; LRCX's own record shows a higher single-quarter peak (43% of revenue, Q1 FY2026) than any AMAT figure found, and KLAC's FY2024 figure (42.8% of total revenue, per KLA's own 10-K) also exceeds AMAT's range -- see the batch comparison artifact for the normalized cross-company table. Three dated waves of US export-control tightening in roughly three years affecting China shipments: October 2022 (~$400M +/- $150M disclosed Q4 FY2022 impact), an October 2023 update whose AMAT-specific dollar impact was not found in this research pass, and a September 2025 'BIS Affiliates Rule' with a disclosed ~$110M Q4 FY2025 and ~$600M FY2026 estimated revenue impact ($710M combined -- the figure some secondary sources cite alone is simply the sum of these two disclosed figures, not a separate or conflicting number, corrected from an earlier draft that treated it as unreconciled)"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "A separate, distinct matter from the export-control revenue-impact disclosures above. Applied Materials, Inc. and its subsidiary Applied Materials Korea, Ltd. (AMK) reached a settlement agreement with BIS resolving 56 total violations of the Export Administration Regulations. Per a third remediation pass (2026-07-25) resolving the prior date-range discrepancy: the controlling BIS order's Statement of Charges specifies 54 completed reexports (Charges 1-54) of ion-implantation equipment between March 23, 2021 and June 3, 2022, plus 2 attempted reexports (Charges 55-56) dated November 8, 2020 and July 18, 2022 -- 56 charges total. The affected recipients were Semiconductor Manufacturing International Corporation (SMIC) and its listed Entity List subsidiaries. AMAT's own press-release characterization of the case window as 'November 2020 to July 2022' is the broader overall case period (spanning the earliest attempted violation to the latest), consistent with, not contradicting, the detailed charge-by-charge breakdown -- this record's prior 'unresolved discrepancy' framing (between a 'March 2021-June 2022' range and a 'November 2020-July 2022' range) is now resolved: both ranges are accurate descriptions of different parts of the same 56-charge structure, not competing claims. Two different announcement dates remain attributable to two different parties' own press releases: AMAT's own ('Applied Materials Reaches Resolution with the U.S. Department of Commerce') dated 2026-02-11; BIS's own dated 2026-02-12. Well-corroborated across multiple independent legal/trade-press sources describing the order's content in structural detail (Torres Trade Law, Fenwick, ArentFox Schiff, Manufacturing Dive, Supply Chain Dive, FD Associates, Washington Trade & Tariff Letter, Tom's Hardware) -- all independently and consistently reporting the same 54+2=56 charge structure, dates, and SMIC/AMK identification: a $252.5 million civil penalty (the statutory maximum, twice the ~$126M total transaction value at issue; the second-highest BIS penalty on record after Seagate Technology's $300M in 2023), plus two required internal export-compliance audits and a three-year suspended denial order. This session's own WebFetch access to bis.gov and media.bis.gov remained blocked (HTTP 403) throughout all three passes -- this record's confidence rests on the density and independence of cross-corroborating legal/trade-press sources describing the BIS order's own content, not on this session's own reading of the order"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "China's own reported ~50% domestic-equipment-content mandate for new fab capacity (sourced only via anonymous-sourced/unofficial reporting as of this record's evidence date, not an officially documented regulation -- flagged explicitly as unresolved at the primary-source level) would be a structural, not merely cyclical, cap on AMAT's addressable China market share going forward, layered on top of existing US export controls. Chinese domestic equipment makers (Naura, AMEC) show real revenue growth (Naura's nine-month FY2025 revenue roughly 4-5x its full-year-2020 level) and technology-capability progression (14nm etch deployed, 7nm reportedly in test); one claim of an AMEC 5nm etch tool in 'validation' at a TSMC advanced-logic line was found in research and is flagged as needing strong independent verification given how unusual such a claim would be"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Workforce reduction, refined in this record's second remediation pass (2026-07-25) to distinguish the primary filing's own language from secondary paraphrase: AMAT filed a Form 8-K on 2025-10-23 (Item 2.05, Costs Associated with Exit or Disposal Activities; SEC EDGAR CIK 0000006951, accession 0001628280-25-046107) disclosing that approximately 4% of its global workforce would be affected, with associated charges of approximately $160-180 million (primarily severance, mostly to be recognized in Q4 FY2025), stated to be completed by Q1 FY2026. The 8-K's own main-document text (per WebSearch relay of its content -- not independently opened by this session) uses neutral restructuring language, to 'position the Company for continued growth as a more competitive and productive organization,' without explicitly naming export controls or automation as the cause. A CEO email to employees is separately filed as Exhibit 99.1 to the same 8-K. A phrase attributing the reduction to 'automation, digitalization, and geographic shifts... redefining our workforce needs' appeared in secondary press coverage (not confirmed to originate in the 8-K's own text or the CEO's Exhibit 99.1 email specifically) -- this record does not assert that phrase is the 8-K's own language. Separately, multiple news outlets (secondary, context only -- not primary sources) reported the reduction against the backdrop of, and in temporal proximity to, the September 2025 BIS Affiliates Rule's disclosed ~$600M FY2026 revenue-impact estimate. This record does not assert that export controls caused the workforce reduction, since no primary source found establishes that causal claim directly"
    severity: low
    identified: "2026-07-25"
    status: monitoring
  - risk: "Semiconductor capital-equipment cyclicality with documented historical severity: FY2019 revenue guided down approximately 16% amid a broader DRAM-oversupply-driven industry downturn (DRAM industry revenue -37.5% in that cycle); one third-party analytical source (Trefis, not independently verified) characterizes AMAT as having traded through 15 major historical shocks with an average peak-to-trough stock decline of 23% (vs. 16% for the S&P 500 over the same episodes) and a single deepest historical drawdown of approximately 55%"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
