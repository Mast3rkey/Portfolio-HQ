sector: Information Technology
industry: Cybersecurity / Cloud-Native Endpoint and XDR Platform
portfolio_role_ref: band
competitive_advantages:
  - "Falcon platform uses a cloud-native architecture and a common sensor across endpoint, cloud, identity, SIEM, and other modules -- reported 32 modules at fiscal year-end 2026 and 33 at filing, with subscription pricing by endpoint and module. Per CrowdStrike's Form 10-K for the fiscal year ended 2026-01-31 (SEC accession 0001535527-26-000010), directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 8 evidence bundle (see Source-access disclosure in CRWD.md) -- not directly inspected by this Claude session."
  - "Reported fiscal-year-end 2026 Annual Recurring Revenue (ARR) of approximately $5.253 billion, up 24% -- current, filed evidence of continued platform growth even after the July 2024 incident, though the ARR definition assumes expiring contracts renew on existing terms and can include active post-expiration renewal negotiations, and is not GAAP revenue. Per CrowdStrike's Form 10-K for the fiscal year ended 2026-01-31, CrowdStrike's Form 10-Q for the quarter ended 2026-04-30 (SEC accession 0001535527-26-000025), and CrowdStrike's latest earnings filing, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Disclosed, filed evidence of continued ARR growth (+24% at fiscal year-end 2026) and high retention despite the July 19, 2024 Falcon sensor incident, alongside the company's own acknowledgment of resulting customer commitment packages, longer sales cycles, and some contraction -- a genuinely mixed but not uniformly negative post-incident picture. Per CrowdStrike's Form 10-K for the fiscal year ended 2026-01-31 and the original July 2024 incident disclosure (SEC accession 0001104659-24-081571), directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "For Q1 fiscal 2027, reported $590.9 million of GAAP operating cash flow and $468.5 million of issuer-defined free cash flow, and consolidated GAAP net income of $45.966 million -- of which $18.192 million was attributable to non-controlling interests, leaving GAAP net income attributable to CrowdStrike of $27.774 million. GAAP operating loss was approximately $30.6 million against non-GAAP operating income of approximately $325.7 million in the same quarter. Per CrowdStrike's Form 10-Q for the quarter ended 2026-04-30 (SEC accession 0001535527-26-000025) and CrowdStrike's Q1 fiscal 2027 earnings release, directly inspected by the independent evidence-recovery researcher who authored the supplemental correction bundle addressing PR #177's formal review, not by this Claude session."
risks:
  - risk: "The July 19, 2024 Falcon sensor update caused Windows-system outages; later filings state the incident harmed sales, reputation, and partner relationships, leading to customer commitment packages, longer sales cycles, and some contraction. The company also reported continued ARR growth and high retention after the incident -- both facts are filed and neither should be read to the exclusion of the other."
    severity: high
    identified: "2026-07-28"
    status: monitoring
  - risk: "CrowdStrike states it cannot estimate the loss range from outage-related proceedings and that insurance is not expected to cover all possible costs, claims, and liabilities. Recorded settlement offers were described as immaterial and offset by insurance at fiscal year-end 2026, but broader exposure (government inquiries, customer claims, litigation) remained unresolved in the inspected sources -- this record does not, and cannot, quantify an ultimate liability."
    severity: high
    identified: "2026-07-28"
    status: monitoring
  - risk: "Fiscal-year-end 2026 ARR (~$5.253 billion) assumes expiring contracts renew on existing terms and can include active post-expiration renewal negotiations -- it is not GAAP revenue and may overstate durability if renewals later contract or fail; outage-related renewal effects can emerge with contract lags not yet visible in the inspected sources."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "CrowdStrike's Q1 fiscal 2027 consolidated GAAP net income ($45.966 million) and GAAP net income attributable to CrowdStrike ($27.774 million, after $18.192 million attributable to non-controlling interests) are single-quarter results against an accumulated deficit of approximately $1.3 billion; the company states it may not sustain profitability, and stock-based compensation and acquisition-related adjustments materially affect the non-GAAP operating-income figure ($325.7 million) relative to the GAAP operating loss (approximately $30.6 million) in the same quarter. One profitable quarter does not establish durable GAAP profitability."
    severity: moderate
    identified: "2026-07-28"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) was tested and confirmed blocked session-wide on 2026-07-28 (SEC EDGAR, multiple company investor-relations domains, and a neutral non-target control domain all returned HTTP 403) -- every fact in this record is attributed to the governed, independently verified evidence bundle's own directly-inspected sources, not to this Claude session's own document inspection. See CRWD.md's Source-access disclosure."
    severity: low
    identified: "2026-07-28"
    status: monitoring
catalysts:
  - catalyst: "Any material settlement, government inquiry outcome, or litigation development in the outage-related proceedings, which would update the loss-range and insurance-recovery uncertainty beyond what was disclosed at this record's 2026-07-28 evidence cutoff."
    expected: "2026-10-26"
    status: pending
  - catalyst: "This record's own next scheduled review checkpoint, at which post-outage renewal cohorts, government inquiry outcomes, and product-level competitive win rates will next be actively re-checked."
    expected: "2026-10-26"
    status: pending
conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). CrowdStrike shows a cloud-native, multi-module Falcon platform with disclosed, filed evidence of continued ARR growth (+24% at fiscal year-end 2026, ~$5.253 billion) and high retention even after the July 2024 outage. Held at Medium rather than higher because the company's own filings state it cannot estimate the ultimate loss range from outage-related proceedings, insurance is not expected to cover all possible costs and claims, and post-outage renewal cohorts, government inquiry outcomes, and product-level competitive win rates versus Palo Alto Networks remain unresolved in the inspected sources -- material, filed, unquantified tail risk sits alongside the otherwise strong recurring-revenue evidence. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
