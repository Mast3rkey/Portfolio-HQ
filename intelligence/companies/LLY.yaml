conviction:
  rating: High
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). Lilly shows exceptional current commercial momentum (56% Q1 2026 revenue growth, 90% incretin growth, a 60.1% management-reported U.S. incretin prescription share) combined with real regulatory conversion (Foundayo's approval) and deliberate pipeline diversification beyond incretins (four announced 2026 acquisitions plus internal immunology/oncology/neuroscience programs). Held at High rather than Very High because of concrete, disclosed tensions this record does not discount: extreme current revenue concentration in a narrow incretin/key-product set (68% of Q1 2026 revenue) that is simultaneously the source of both the growth and the realized-pricing pressure; a real, material safety/regulatory burden on Foundayo's label; simultaneous execution risk across large manufacturing-capacity investment and four separate acquisition integrations; and an unresolved, batch-wide patent/exclusivity-timeline question (B7-U001) that this record has not independently verified claim-by-claim. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
