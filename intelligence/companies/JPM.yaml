    expected: "2026-08-14"
    status: pending
  - catalyst: "Any material Federal Reserve, FSB, or other banking-regulator development affecting JPMorgan's capital, stress-test, or G-SIB status -- no source inspected by this record establishes a specific next event date. 2026-10-25 (this record's own next_due review date; corrected in this pass from a mismatched 2026-10-27 checkpoint) is the internal checkpoint at which this matter will next be actively re-checked, not a forecast of when the next regulatory event will occur."
    expected: "2026-10-25"
