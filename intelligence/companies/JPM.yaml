sector: Financials
industry: Diversified Banks
portfolio_role_ref: band
competitive_advantages:
  - "Large, diversified, regulated balance-sheet-intermediation franchise: $4.4 trillion of assets and $362.4 billion of stockholders' equity at 2025 year-end, operating across Consumer & Community Banking, Commercial & Investment Bank, and Asset & Wealth Management, with Corporate activities reported separately. This is a structurally different economic model from V/MA's fee-based network-toll-road business (deposit-taking, lending, credit risk, trading, investment banking, custody, and asset/wealth management, rather than transaction-processing fees) -- per JPMorgan Chase's Form 10-K for fiscal year ended 2025-12-31 (SEC accession 0001628280-26-008131), directly inspected by GPT-5.6 Thinking, not by this Claude session (see Source-access disclosure in JPM.md)."
  - "Precisely quantified regulatory-capital headroom at 2026-03-31 (corrected in this pass from unquantified 'comfortably above' language): standardized CET1 ratio 14.3% against a standardized CET1 requirement including buffers of 11.5% -- 2.8 percentage points of headroom; advanced CET1 ratio 14.1% against the same 11.5% benchmark -- 2.6 percentage points of headroom; supplementary leverage ratio 5.6% against an applicable SLR requirement of 4.3% -- 1.3 percentage points of headroom. CET1 capital of $291 billion and approximately $1.5 trillion of liquidity sources. Regulatory headroom is a capacity measure, not a guarantee against loss."
  - "Diversified Q2 2026 business-line economics, not solely a Payments narrative (corrected in this pass): managed firmwide net revenue $58.022 billion; net interest income $25.6 billion ($23.7 billion excluding Markets); Investment Banking revenue $3.9 billion (fees $3.3 billion); Markets revenue $12.1 billion (Fixed Income $6.1 billion, Equities $6.0 billion); Payments revenue $5.3 billion; Securities Services revenue approximately $1.7 billion; Asset & Wealth Management revenue $6.851 billion on $5.1 trillion of assets under management. Reviewer arithmetic only: Payments plus Securities Services were approximately $6.96 billion, or roughly 12.0% of Q2 managed firmwide net revenue -- a directional scale comparison only; Payments and Securities Services sit in different disclosed groupings, managed revenue is a non-GAAP measure, and this percentage is not a standalone segment-margin or risk measure."
  - "Q2 2026 average deposits up 7% year over year and average loans of $1.5 trillion -- continued core deposit-and-lending franchise growth, the foundation of the bank-intermediation model this record analyzes separately from V/MA's network-fee model."
  - "Q2 2026 capital return: common dividend $4.0 billion and common-stock net repurchases $6.2 billion, funded within a firm that also expanded its balance sheet (deposits +7% YoY) in the same quarter -- disclosed capital-return facts, not an assessment of whether the pace is sustainable through a credit-cycle downturn."
risks:
  - risk: "Q2 2026 reported net income of $21.2 billion included a $4.6 billion gain related to Visa shares and $1.0 billion of gains on other equity investments -- large, disclosed significant items. JPMorgan's own release separately reported net income excluding significant items of $16.9 billion. This record uses the excluding-significant-items figure for assessing ordinary quarterly operating profitability. Correction note: an earlier version of this record described this as 'JPM's equity stake in Visa' and asserted management presented the adjusted figure 'precisely because' the headline would overstate profitability; both are corrected here -- the release documents a gain related to Visa shares (not a continuing ownership stake, which is not established by any source this record relies on), and no source establishes management's specific motive for presenting the adjusted measure, so no motive is asserted."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Q2 2026 credit costs were $2.5 billion (provision for credit losses $2.515 billion), including approximately $2.4 billion of net charge-offs and a $149 million net reserve build -- a disclosed, current credit-cost figure that this record does not independently forecast forward; a credit-cycle deterioration would be expected to increase this figure, but no forward view is asserted here."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "The Federal Reserve's 2026 Dodd-Frank Act stress-test accessibility tables report a 2.0-percentage-point decline from starting to minimum CET1 for JPMorgan Chase under the severely adverse scenario. This is a supervisory stress scenario result, not a forecast of an actual future recession outcome, and it does not by itself establish a safe leverage level or margin-deployment conclusion -- treated strictly as regulatory-scenario evidence in this record."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "JPMorgan is designated a Global Systemically Important Bank (G-SIB) per the Financial Stability Board's 2025 G-SIB list, subjecting it to higher capital buffers, total loss-absorbing capacity (TLAC) requirements, resolvability requirements, and heightened supervision. This record describes G-SIB status as a regulatory constraint and resilience framework, not a guarantee against loss."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "Structural incomparability with V/MA: JPM's business combines deposit-and-lending economics with payments, custody, markets, investment banking, and asset management. This diversification may stabilize earnings but also creates regulatory, trading, and credit-cycle complexity that has no direct analog in V/MA's fee-based network model -- ordinary operating-company metrics (margins, free-cash-flow yield, net-debt ratios) are not meaningfully comparable between JPM and V/MA, and this record does not attempt that comparison (see the comparison artifact)."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "Net-interest-income and rate sensitivity (added in this correction): Q2 2026 net interest income was $25.6 billion ($23.7 billion excluding Markets), with lower rates partly offsetting higher balances per the disclosed release commentary. This record does not independently model JPM's forward net-interest-margin sensitivity to further rate changes -- it records the disclosed current-quarter figure and directional commentary only."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Investment Banking and Markets revenue cyclicality (added in this correction): Q2 2026 Investment Banking revenue was $3.9 billion (fees $3.3 billion) and Markets revenue was $12.1 billion (Fixed Income $6.1 billion, Equities $6.0 billion) -- both disclosed lines are historically more cyclical/transaction-dependent than deposit-and-lending net interest income, and this record does not establish a multi-quarter or multi-year trend for either line."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Merchant-acquiring exposure is not separately quantified in this record's evidence base. The Payments line (Q2 2026: $5.3 billion) is disclosed within the Commercial & Investment Bank without a further merchant-acquiring-specific breakout in the sources inspected. This record does not treat Payments as a pure merchant-acquiring business and discloses this as an explicit limitation rather than assuming a specific acquiring-revenue figure."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "Evidence-completeness gap, narrowed by this correction but not eliminated: management/capital-return history beyond identifying Jamie Dimon as Chairman and Chief Executive Officer and the Q2 2026 dividend ($4.0B) and repurchase ($6.2B) figures is not independently assessed for multi-year consistency in this record; 'fortress balance sheet' or similar issuer characterizations are not treated as an independent conclusion by this record."
    severity: low
    identified: "2026-07-27"
    status: monitoring
catalysts:
