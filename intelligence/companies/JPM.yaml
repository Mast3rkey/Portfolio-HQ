sector: Financials
industry: Diversified Banks
portfolio_role_ref: band
competitive_advantages:
  - "Large, diversified, regulated balance-sheet-intermediation franchise: $4.4 trillion of assets and $362.4 billion of stockholders' equity at 2025 year-end, operating across Consumer & Community Banking, Commercial & Investment Bank, and Asset & Wealth Management, with Corporate activities reported separately. This is a structurally different economic model from V/MA's fee-based network-toll-road business (deposit-taking, lending, credit risk, trading, investment banking, custody, and asset/wealth management, rather than transaction-processing fees) -- per JPMorgan Chase's Form 10-K for fiscal year ended 2025-12-31 (SEC accession 0001628280-26-008131), directly inspected by GPT-5.6 Thinking's 2026-07-27 evidence-recovery audit, not by this Claude session (see Source-access disclosure in JPM.md)."
  - "Strong regulatory-capital position at 2026-03-31: $291 billion of CET1 capital, standardized and advanced CET1 ratios of 14.3% and 14.1%, a 5.6% supplementary leverage ratio, and approximately $1.5 trillion of liquidity sources -- bank-appropriate capital-adequacy and liquidity measures, not comparable to V/MA's corporate-leverage metrics (this record does not attempt that comparison; see the comparison artifact's explicit metric-incomparability discussion)."
  - "Diversified fee and net-interest revenue mix: for Q2 2026, Commercial & Investment Bank Payments revenue was $5.3 billion (+12%) and Securities Services revenue was $1.7 billion (+17%); combined Banking & Payments revenue was $11.2 billion. This includes a merchant-acquiring-adjacent Payments business, giving JPM a partial, though structurally distinct, point of overlap with V/MA's network economics (see the comparison artifact)."
  - "Q2 2026 average deposits up 7% year over year and average loans of $1.5 trillion -- continued core deposit-and-lending franchise growth, the foundation of the bank-intermediation model this record analyzes separately from V/MA's network-fee model."
risks:
  - risk: "Q2 2026 reported net income of $21.2 billion included a $4.6 billion gain related to Visa shares and $1.0 billion of gains on other equity investments -- large, disclosed significant items. JPMorgan's own release separately reported net income excluding significant items of $16.9 billion. This record explicitly does not use headline Q2 2026 net income or ROE without separating these significant items, per the recovery audit's own drafting instruction, since reported results otherwise materially overstate ordinary operating profitability for the quarter."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Q2 2026 credit costs were $2.5 billion, including $2.4 billion of net charge-offs and a $149 million net reserve build -- a disclosed, current credit-cost figure that this record does not independently forecast forward; a credit-cycle deterioration would be expected to increase this figure, but no forward view is asserted here."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "The Federal Reserve's 2026 Dodd-Frank Act stress-test accessibility tables report a 2.0-percentage-point decline from starting to minimum CET1 for JPMorgan Chase under the severely adverse scenario. This is a supervisory stress scenario result, not a forecast of an actual future recession outcome, and it does not by itself establish a safe leverage level or margin-deployment conclusion -- treated strictly as regulatory-scenario evidence in this record, per the recovery audit's explicit instruction."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "JPMorgan is designated a Global Systemically Important Bank (G-SIB) per the Financial Stability Board's 2025 G-SIB list, subjecting it to higher capital buffers, total loss-absorbing capacity (TLAC) requirements, resolvability requirements, and heightened supervision. This record describes G-SIB status as a regulatory constraint and resilience framework, not a guarantee against loss."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "Structural incomparability with V/MA: JPM's business combines deposit-and-lending economics with payments, custody, markets, investment banking, and asset management. This diversification may stabilize earnings but also creates regulatory, trading, and credit-cycle complexity that has no direct analog in V/MA's fee-based network model -- ordinary operating-company metrics (margins, free-cash-flow yield, net-debt ratios) are not meaningfully comparable between JPM and V/MA, and this record does not attempt that comparison (see the comparison artifact)."
    severity: low
    identified: "2026-07-27"
    status: monitoring
