    expected: "2026-08-14"
    status: pending
  - catalyst: "Any material Federal Reserve, FSB, or other banking-regulator development affecting JPMorgan's capital, stress-test, or G-SIB status -- no source inspected by this record establishes a specific next event date, so 2026-10-27 is an internal review checkpoint (tied to this record's 90-day cadence), not a forecast of when the next event will occur."
    expected: "2026-10-27"
    status: pending
conviction:
  rating: Medium
  rationale: "JPMorgan shows a large, diversified, well-capitalized banking franchise (CET1 ratios above regulatory minimums with a wide margin, ~$1.5 trillion of liquidity sources, continued deposit and loan growth) and a diversified fee/net-interest revenue mix spanning consumer banking, investment banking, markets, and asset/wealth management. Conviction is held at Medium -- distinct from, and not directly comparable to, V's High and MA's Medium ratings in this same batch, since JPM's evidence base and risk profile are analyzed on bank-appropriate terms (capital ratios, credit costs, stress-test results) rather than the network-toll-road terms used for V/MA. Conviction is not higher because Q2 2026's headline results require significant-items adjustment to interpret correctly (a $4.6B Visa-share gain and $1.0B of other investment gains inflate headline net income), credit costs, while currently moderate, are a disclosed and monitored line item, and the Federal Reserve's 2026 severely-adverse stress scenario shows a real, if modest (2.0 percentage point), stressed CET1 decline -- a supervisory scenario, not a forecast, but a concrete data point this record does not discount to zero. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and does not treat the stress-test result as a prediction of an actual future outcome."
