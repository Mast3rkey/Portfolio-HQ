conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). AbbVie shows real, already-executed evidence of successful post-Humira replacement (Skyrizi plus Rinvoq revenue several times Humira's current residual run-rate) and genuine diversification into neuroscience, oncology, and aesthetics, plus continued pipeline conversion (the Decnupaz approval). Held at Medium rather than High because of concrete, disclosed tensions this record does not discount: substantial goodwill and acquired-intangible exposure whose exact scale this record cannot state (F-2, blocked primary-source re-verification); a real, material Imbruvica decline (24.7%) showing diversification is uneven, not uniform; a dated, concrete Medicare-pricing exposure for Botox beginning 2028; ongoing, recurring acquired-IPR&D expense; and an unresolved, batch-wide question about how much of AbbVie's growth is internally generated versus acquisition-dependent (B7-U003). This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
