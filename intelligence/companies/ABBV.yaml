sector: Health Care
industry: Pharmaceuticals
portfolio_role_ref: band
competitive_advantages:
  - "Demonstrated, already-executed post-Humira immunology replacement: Q1 2026 immunology revenue was $7.290 billion, with Skyrizi at $4.483 billion and Rinvoq at $2.119 billion, against Humira's own residual $688 million -- Skyrizi and Rinvoq combined are already several times larger than Humira's current run-rate, evidence of a replacement that has substantially happened, not merely a stated strategy. Total Q1 2026 net revenue was $15.002 billion, up 12.4% reported and 10.3% operational. Per AbbVie's Form 10-Q for the quarter ended 2026-03-31 (SEC accession 0001551152-26-000017) and AbbVie's Q1 2026 earnings release, both directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 7 evidence bundle (see Source-access disclosure in ABBV.md) -- not directly inspected by this Claude session."
  - "Diversification beyond immunology: Q1 2026 neuroscience revenue was $2.875 billion, aesthetics $1.186 billion, and oncology $1.631 billion -- real revenue outside the immunology franchise, though oncology showed a disclosed weak spot (Imbruvica down 24.7%). Per AbbVie's Q1 2026 earnings release, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Continued pipeline conversion: the FDA approved Decnupaz (pivekimab sunirine-pvzy) for blastic plasmacytoid dendritic cell neoplasm (BPDCN), an ultra-rare hematologic malignancy, in May 2026 -- evidence of business-development assets converting into approved products, not only revenue-stage products. Per the FDA's approval announcement, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Disclosed long-horizon U.S. investment commitment: AbbVie disclosed a $100 billion U.S. R&D and capital-investment pledge over a decade. This record treats this as a disclosed forward commitment, not as evidence of results already achieved. Per AbbVie's Form 10-Q for the quarter ended 2026-03-31, directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
