    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Q1 2026 acquired IPR&D and milestone expense was $744 million -- a real, disclosed, recurring cost of the acquisition-driven diversification strategy, separate from the goodwill/intangible balance-sheet exposure above."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Imbruvica (oncology) revenue declined 24.7% in Q1 2026 -- a disclosed, material erosion in one existing franchise even as Skyrizi/Rinvoq successfully replace Humira; oncology diversification is not uniformly successful across all products."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Botox was disclosed as selected for Medicare-set pricing beginning in 2028 -- a concrete, dated reimbursement-policy exposure affecting the aesthetics/neuroscience-adjacent franchise, not a hypothetical future policy risk."
