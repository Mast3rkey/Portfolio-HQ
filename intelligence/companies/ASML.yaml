conviction:
  rating: Medium
  rationale: "ASML holds a genuine, well-evidenced monopoly at the EUV frontier of semiconductor lithography with a structurally difficult-to-replicate supplier moat (exclusive Zeiss optics, owned Cymer light sources), and FY2026 guidance has been raised twice during the year on AI-driven demand. Conviction is Medium rather than High or Very High because: (1) export-control and geopolitical exposure is severe and actively moving within calendar 2026 itself -- China's share of net system sales fell from 36% (Q4 2025) to 19% (Q1 2026) to 14% (Q2 2026), and pending US legislation (the MATCH Act) could extend restrictions to DUV, ASML's currently-still-sellable China product line; (2) customer concentration is extreme (TSMC ~24%, top-10 >80% per secondary sources not yet verified against ASML's own 20-F); (3) this record's own source-access constraints (WebFetch blocked on ASML's and SEC's primary filing pages throughout this research pass) mean several figures -- including the customer-concentration percentages and some financial-quality metrics -- are secondary-sourced and cross-corroborated but not independently verified against primary text, an explicit limitation disclosed in the Markdown record; and (4) the October 2024 guidance-cut episode demonstrates that even ASML's multi-year backlog visibility does not fully insulate near-term results from demand-timing misses. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from ASML's existing T1 tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 SS2/SS3)."
