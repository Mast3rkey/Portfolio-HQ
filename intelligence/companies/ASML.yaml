sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: T1
competitive_advantages:
  - "Sole commercial supplier of EUV (extreme ultraviolet) lithography systems worldwide -- the single required chokepoint for leading-edge logic and advancing memory nodes -- within a broader ~94% share of all lithography equipment (DUV+EUV combined; Nikon and Canon split the remainder, DUV/legacy-only). Q2 2026 (reported 2026-07-15): total net sales EUR9.3B, net income EUR2.9B, gross margin 54.0% (above guidance); FY2026 net-sales guidance raised twice during 2026 to EUR43-45B (from an initial EUR34-39B given alongside FY2025 results in January 2026), management citing 'extremely strong' AI-driven order intake in H1 2026"
  - "Structural, multi-decade supply-chain moat: exclusive optics relationship with Carl Zeiss SMT (ASML holds an equity stake; joint EUV optics development since the EUCLIDES consortium, 1998), and a wholly-owned EUV light-source subsidiary (Cymer, acquired outright 2013 for ~EUR1.95B specifically to secure/accelerate EUV light-source development) -- a supplier ecosystem competitors would need to rebuild from scratch, not merely replicate ASML's own IP. Nikon abandoned EUV commercialization in the late 2010s as technically/financially infeasible; no commercial EUV competitor exists as of this record's evidence date"
  - "Improving capital-return posture with declining leverage: FY2025 total dividend EUR7.50/share (+17% YoY, approved at the April 2026 AGM), a new EUR12.0B buyback program for 2026-2028 (with intent to cancel repurchased shares), and a debt-to-equity ratio reported to have declined from roughly 0.47 (2021) to roughly 0.14 (2025) -- secondary-sourced trend, not independently verified against primary financial statements this pass (see Markdown source-access disclosure)"
risks:
  - risk: "Export-control and geopolitical exposure -- the single most consequential risk category for ASML specifically. EUV exports to China have been effectively blocked since 2019 (Dutch cooperation with US pressure; ASML states it has never shipped an EUV system to China). A Dutch government rule effective 2023-09-01 added licensing requirements for advanced immersion DUV systems (TWINSCAN NXT:2000i and later). China's share of ASML net system sales by ship-to destination was 36% in Q4 2025 (the quarter reported alongside FY2025 full-year results, 2026-01-29), then fell to 19% in Q1 2026 (reported ~2026-04-15) and 14% in Q2 2026 (reported 2026-07-15) -- two consecutive quarterly declines within calendar 2026 following a Q4 2025 peak, not a decline confined to 'two 2026 quarters' as an earlier draft of this record imprecisely stated. These figures are sourced to ASML's own Q2 2026 investor-relations presentation (see Markdown Source-access disclosure for the exact document); a second-remediation-pass search also surfaced one internally-summed regional breakdown citing China at 29.1% of Q2 2026 net system sales, which conflicts with the 14% figure used throughout this record -- the 14% figure is retained as the primary basis for this record (corroborated identically across at least three independent searches spanning the original research pass and both remediation passes, versus the 29.1% figure's single, unattributed appearance), and the 29.1% figure is explicitly not adopted, flagged as a low-confidence, likely-conflated outlier pending primary verification. ASML's own FY2026 guidance still expects China to average roughly 20% of full-year net sales, implying the 14% Q2 print is below the company's own full-year expectation, not necessarily a trend the company itself frames as accelerating further. Management commentary on the Q2 2026 call (per secondary relay) described current China demand as driven by domestic/mature-node logic applications rather than leading-edge capacity. A bipartisan US bill (the 'MATCH Act,' introduced ~April 2026) would, if enacted, extend restrictions to DUV shipments to China -- DUV is currently still a live, material China revenue line, so this is the largest identified forward regulatory risk. Status as of this record's evidence date: proposed, not enacted -- outcome unresolved. Separately, in June 2026 a US official reportedly alleged an ASML EUV machine may have reached China in breach of controls; ASML publicly disputed this, stating all 314 EUV machines shipped historically are accounted for -- a disputed claim with no independent resolution found in this research pass"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Extreme customer and geographic concentration -- secondary sources (not independently traced to ASML's own 20-F disclosure this pass) put TSMC at roughly 24% of net sales, the top two customers combined at roughly 38%, and the top ten customers at over 80% of revenue. Any capex pause at TSMC or Samsung would disproportionately affect ASML. This figure requires primary-source (20-F) verification before being treated as a confirmed fact rather than a well-corroborated estimate"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Semiconductor capital-equipment cyclicality combined with a long (12-24 month) order-to-delivery lead time, which smooths ASML's recognized revenue relative to the broader WFE order cycle but does not eliminate demand-timing risk to guidance. Demonstrated directly in October 2024: ASML cut FY2025 net-sales guidance to EUR30-35B (from a range implying up to ~EUR40B), citing delayed orders from Intel and Samsung and a slower-than-expected non-AI/memory recovery -- the stock fell approximately 16% in a single day (described by one source as the largest single-day drop since 1998), extended by a further ~4% the next session"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Reduced forward-order visibility -- ASML discontinued quarterly bookings/backlog disclosure starting Q1 2026, removing a metric investors had used as a leading indicator, concurrent with the company guiding aggressively upward on AI-driven demand. Company-stated rationale is that single large lumpy orders distort a quarter-to-quarter read; this record does not speculate about any other motive, but notes the reduced-transparency effect as a fact"
    severity: low
    identified: "2026-07-25"
    status: monitoring
