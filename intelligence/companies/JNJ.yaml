sector: Health Care
industry: Pharmaceuticals
portfolio_role_ref: band
competitive_advantages:
  - "Diversified two-segment structure post-Kenvue separation: Johnson & Johnson operates two reportable segments, Innovative Medicine and MedTech. Q2 2026 sales were $16.384 billion in Innovative Medicine and $8.926 billion in MedTech, roughly 65% and 35% of company sales, with operational growth of 6.8% in Innovative Medicine and 3.6% in MedTech -- two segments with different product and procedure drivers, not one undifferentiated pharmaceutical business. Per Johnson & Johnson's Form 10-K for FY2025, Form 10-Q for Q1 2026 (SEC accession 0000200406-26-000087), and Johnson & Johnson's Q2 2026 earnings release and earnings presentation, all directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 7 evidence bundle (see Source-access disclosure in JNJ.md) -- not directly inspected by this Claude session."
  - "Confirmed post-Kenvue structural boundary (F-1 resolution): following completion of the Kenvue separation in August 2023, Johnson & Johnson presented its former Consumer Health business as discontinued operations and described the continuing company as focused on Pharmaceutical (the company's own then-current term; current company reporting uses 'Innovative Medicine' for the same continuing segment) and MedTech. This directly substantiates why current J&J analysis in this record centers on Innovative Medicine and MedTech rather than Consumer Health, and is not a claim of any change in the company's economics since separation. Per Johnson & Johnson's 2023 corporate-action release announcing updated post-separation financials, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Active Innovative Medicine pipeline replacement: Q2 2026 growth included Darzalex, Carvykti, Tecvayli, Rybrevant/Lazcluze, Tremfya, Spravato, and Caplyta -- a broad set of newer products contributing to growth even as Stelara biosimilar competition created an approximately 760-basis-point operational headwind in the same period. Per Johnson & Johnson's Q2 2026 earnings release and earnings presentation, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "Disclosed balance-sheet and cash-generation capacity: the Q2 2026 presentation reported $20.8 billion of cash and marketable securities, $49.0 billion of debt, approximately $8.7 billion of year-to-date free cash flow (a non-GAAP measure, estimated as of 2026-07-15), and $6.4 billion of year-to-date dividends. Per Johnson & Johnson's Q2 2026 earnings presentation, directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "Material product-liability litigation, including talc-related matters, is disclosed as a real and current risk. This record does not quote or reproduce the filings' specific accrual or loss-estimation language (F-4 disposition, below) -- this session's own attempt to independently re-verify the exact litigation/accrual wording against the primary sources (JNJ-S01, JNJ-S02) was blocked by a confirmed network-policy denial. The general fact that this litigation is material and not fully estimable beyond disclosed accruals is preserved as a disclosed risk regardless of the unverified exact wording."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Stelara biosimilar competition created an approximately 760-basis-point operational growth headwind in Q2 2026 -- a large, currently-realized exclusivity-erosion effect on Innovative Medicine, not a hypothetical future risk."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "The diversified two-segment structure can obscure that Innovative Medicine and MedTech have different risk and return drivers (different growth rates in Q2 2026: 6.8% versus 3.6% operational) -- treating J&J as a single undifferentiated pharmaceutical peer, or assuming its MedTech segment behaves like a pure device company, risks conflating two distinct businesses."
    severity: low
    identified: "2026-07-27"
    status: monitoring
  - risk: "The financially plausible range of talc and other product-liability outcomes is not established from a reliable bounded total-outcome figure in this record's evidence base (unresolved question B7-U005)."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
