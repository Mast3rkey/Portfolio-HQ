sector: Communication Services
industry: Interactive Media and Services
portfolio_role_ref: T1
competitive_advantages:
  - "Accelerating growth on a very large existing base: Q1 2026 (quarter ended 2026-03-31) total revenue $56.311B, +33% YoY, operating income $22.872B. Family of Apps operating income was $26.900B (Reality Labs operating loss $4.028B). Ad impressions increased 19% YoY and average price per ad increased 12% YoY -- growth from both volume and pricing, not one alone. Average Family daily active people were 3.56B in March 2026, +4% YoY. Per Meta's own Q1 2026 Form 10-Q, independently inspected by GPT-5.6 Thinking (2026-07-26 evidence-recovery audit; this Claude session did not itself open this document -- see Source-access disclosure in META.md)."
  - "Very large, still-growing, high-margin Family of Apps segment: FY2025 Family of Apps operating income was $102.469B (per Meta's FY2025 Form 10-K), against a Q1 2026 quarterly run of $26.900B -- a scale of profitability that funds Meta's large discretionary AI and Reality Labs investment without external financing evident in this record."
  - "Real infrastructure ownership, not purely leased capacity: Meta's FY2025 Form 10-K reports ownership of 30 data-center locations globally, alongside use of some leased data centers -- a disclosed, tangible AI/compute infrastructure footprint."
  - "A live, favorable (though appealed) legal outcome, not an unresolved overhang alone: the district court entered judgment in Meta's favor in November 2025 in the FTC monopolization case; the FTC filed a notice of appeal on 2026-01-20. Meta currently holds the trial-level win, distinct from GOOGL's and AMZN's still-pending matters in this batch."
  - "UPDATE (2026-08-05, SECONDARY only, no primary source opened -- Variety, TechTimes, Yahoo Finance, StockTitan): Q2 2026 results reported 2026-07-29. Revenue reportedly $60.8B (+28% YoY); net income reportedly $15.85B, DOWN 14% YoY -- a reversal from this record's prior growth-momentum framing; diluted EPS reportedly $6.18, a miss against a cited $7.22 estimate. 2026 capex guidance reportedly updated to $130B-$145B (narrow low-end raise from the $125B-$145B range cited elsewhere in this record). See new risk entries below for the two new, previously undisclosed events driving the net-income decline (a legal-proceedings charge and a workforce reduction) -- needs primary-source (10-Q) verification."
risks:
  - risk: "Extreme single-revenue-stream concentration: Q1 2026 advertising revenue was $55.024B against total revenue of $56.311B -- advertising is essentially the entire disclosed revenue base (roughly 98%). Meta's filing identifies platform and regulatory changes as able to impair ad targeting and measurement, and states Apple's platform-policy changes have already negatively affected ad targeting/measurement and may continue to affect marketer budgets -- a disclosed, already-realized impact, not a hypothetical one."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "No public-cloud-resale business was disclosed to offset AI capital expenditure: unlike MSFT, GOOGL, and AMZN in this same batch, the inspected evidence discloses no Meta customer-facing cloud business. Meta anticipated approximately $125 billion to $145 billion of 2026 capital expenditures to support AI efforts and the core business (forward-looking guidance); the currently evidenced recovery path depends primarily on Meta's own advertising, applications, devices, and platform economics -- MSFT/GOOGL/AMZN, by contrast, disclose a customer-facing cloud business that could in principle recover capex from third-party sales."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Reality Labs is a large, persistent, and guided-to-continue loss: FY2025 Reality Labs operating loss was $19.193B; Q1 2026 Reality Labs operating loss was $4.028B on revenue that declined 2% YoY (lower Quest sales partly offset by higher AI-glasses sales); Meta expects full-year 2026 Reality Labs operating losses to remain similar to 2025 -- forward-looking guidance, not a resolved trajectory toward profitability."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Custom-silicon (MTIA) evidence gap: the evidence-recovery audit underlying this record explicitly could not establish equivalent primary evidence for Meta's own custom-silicon program's scale or economics, in contrast to the more specific disclosures available for MSFT (Maia/Cobalt), GOOGL (TPU), and AMZN (AWS-chip obligations in its OpenAI/Anthropic arrangements). This record does not assert MTIA deployment scale or performance."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "R&D expense growth outpacing revenue growth: Q1 2026 R&D expense was $17.699B, +46% YoY, against total revenue growth of +33% YoY, with the increase partly attributed to employee compensation and AI-related infrastructure -- an expense-growth trajectory worth monitoring relative to revenue growth, though not yet evidence of margin deterioration given operating income also grew."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "FTC monopolization allegation remains live on appeal despite the favorable district-court judgment: the FTC continues to allege Meta maintained a personal-social-networking monopoly through the Instagram and WhatsApp acquisitions, and filed a notice of appeal on 2026-01-20 -- an unresolved regulator allegation on appeal, not an adjudicated fact, and distinct from Meta's current trial-level win."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "NEW (2026-08-05, SECONDARY only, no primary source opened): per Q2 2026 results (reported 2026-07-29), Meta recorded a $2.4B charge in the quarter described only as 'related to legal proceedings' -- the specific nature was not disclosed by Meta on the earnings call per available secondary reporting. Meta's CFO reportedly flagged ongoing youth-related litigation with multiple U.S. trials scheduled in 2026 that 'may result in material losses' -- related to, but a distinct disclosure from, the FTC monopolization matter above. This is a wholly new, previously unrecorded risk event; materiality and final scope are unresolved pending Meta's own 10-Q disclosure of the charge's specific nature."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "NEW (2026-08-05, SECONDARY only, no primary source opened): per Q2 2026 results, Meta reportedly began an approximately 8,000-employee layoff in May 2026 with an associated $1.18B severance charge -- a previously unrecorded corporate action contributing to Q2 2026 total costs/expenses of $42.03B (+55% YoY). No primary-source (10-Q/8-K) confirmation of headcount or charge figures has been obtained."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
