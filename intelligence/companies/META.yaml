    status: pending
conviction:
  rating: Medium
  rationale: "Meta shows the strongest recent growth momentum of this batch on disclosed metrics (Q1 2026 revenue +33% YoY, ad impressions +19%, price per ad +12%) and a very large, high-margin core Family of Apps segment (FY2025 operating income $102.469B) funding its own large AI/Reality Labs investment without external financing evident in this record. Conviction is held at Medium, not High, because Meta carries the most concentrated risk profile of the four companies in this batch on the evidence available: advertising is roughly 98% of disclosed revenue with an already-realized (not merely hypothetical) negative impact from Apple's platform-policy changes; no public-cloud-resale business was disclosed in the inspected evidence to offset Meta's very large guided AI capex ($125B-$145B for 2026), while MSFT, GOOGL, and AMZN in this same batch disclose customer-facing cloud businesses that can in principle provide a third-party monetization channel (this record does not claim Meta's possible external monetization paths are permanently closed); Reality Labs is a large, persistent loss guided to continue at a similar scale in 2026; and this record's evidence base could not establish Meta's own custom-silicon (MTIA) program's scale or economics, a genuine evidentiary gap relative to the other three companies' more specific chip disclosures. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and treats the FTC's continuing appeal as an unresolved allegation, not a settled matter, notwithstanding Meta's current trial-level win."
