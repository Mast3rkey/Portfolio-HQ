    expected: "2026-07-30"
    status: pending
  - catalyst: "Further developments in Mastercard's disclosed multi-jurisdiction interchange/regulatory matters (U.S. interchange opt-outs, U.K./pan-European merchant claims, Portuguese and Dutch proceedings) -- no source inspected by this record establishes a specific next hearing or ruling date for any single matter, so 2026-10-27 is an internal review checkpoint (tied to this record's 90-day cadence), not a forecast of when the next procedural event will occur."
    expected: "2026-10-27"
    status: pending
conviction:
  rating: Medium
  rationale: "Mastercard shows the same durable network-toll-road economics as Visa (fee-based revenue tied to GDV and switched transactions), a larger disclosed value-added-services revenue share than this record establishes for Visa, and continued double-digit revenue growth into Q1 2026, with value-added services growing faster than the core network segment. Conviction is held at Medium, one notch below Visa's High in this same batch, for two concrete, current, evidence-based reasons rather than a generic 'second name in the pair' discount: rebates and incentives are growing faster than payment-network revenue in the most recently reported quarter (a real margin-pressure signal this record can point to directly), and Mastercard's disclosed regulatory/litigation footprint is broader and more jurisdictionally dispersed (U.S., U.K., pan-European, Portuguese, Dutch matters) than this record establishes for Visa's more concentrated U.S.-centered exposure. This is a distinction this record can evidence, not an assumption that Visa is categorically superior -- see BATCH6_FINANCIAL_INFRASTRUCTURE_COMPARISON.md for the full direct comparison. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments."
