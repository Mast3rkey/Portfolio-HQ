conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). ICE's core exchange, clearing, and data businesses show sustained, record-level financial performance (FY2025 net revenue $9.9B, +7%; Q2 2026 described in company materials as the best second-quarter in company history) with genuine structural moats (clearing-agency/exchange licensure, growing subscription-like data annuity). Held at Medium rather than higher because the newly announced, all-debt-financed MarketAxess acquisition (~$6.0B equity value, ~3.4x pro forma gross leverage) is layered on top of a still-integrating prior large acquisition (Black Knight/Mortgage Technology) with inconsistently reported synergy realization, and this record's own source access this session was unusually weak (WebFetch blocked on every domain tried, no primary document directly opened) -- meaning several material figures (existing debt load, post-deal leverage trajectory, credit-rating response) could not be independently corroborated and are flagged for direct verification in a future session with working primary-source access. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and was not inferred from ICE's existing gated/cash-pending-clearance status or its 1.25% canonical target -- it was reasoned solely from the disclosed operating and financial picture described above, which independently supports the same \"strong core business, unresolved leverage/integration case\" conclusion the gate itself already recorded."
