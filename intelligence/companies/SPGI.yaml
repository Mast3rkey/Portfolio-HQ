sector: Financials
industry: Credit Ratings, Financial Data/Analytics, and Market Indices
portfolio_role_ref: gated
competitive_advantages:
  - "S&P Global operates four continuing segments after the Mobility separation: Ratings, Indices, Energy, and Market Intelligence. Ratings provides regulated credit-rating infrastructure; Indices supplies embedded benchmarks; Energy and Market Intelligence provide data, analytics, and workflow products. [SPGI-P01]"
  - "Scale and profitability remain strong on the continuing-company view: Q2 2026 Article 11 pro-forma revenue excluding Mobility was $3.678B, up 11%, pro-forma operating profit was $1.757B, up 21%, and pro-forma operating margin was 47.8%, up 410 basis points. [SPGI-P02]"
  - "Cash generation supports strategic flexibility: Q2 2026 free cash flow was $1.330B and adjusted free cash flow excluding certain items was $1.370B, while the six-month figures were $2.249B and $2.362B. These are issuer-defined non-GAAP measures and remain separately labeled. [SPGI-P02]"
  - "The same-time September 3, 2026 market feed places SPGI at 27.22x trailing earnings versus MSCI at 31.38x, while a transition-date screen suggests SPGI carries less net debt relative to market capitalization. Because SPGI's trailing denominator may still include pre-separation Mobility, the apparent discount is screening evidence, not a normalized valuation or proof of undervaluation."
risks:
  - risk: "The gate's clean-quarter requirement is not yet satisfiable. Mobility separated on July 1, 2026; the filing states that Mobility results remain included through June 30 and will first be presented as discontinued operations across comparative periods beginning with Q3 2026. Q2 pro-forma disclosures improve visibility but are not the clean reported post-spin quarter."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "Current 2026 adjusted guidance is not directly comparable with the prior outlook because prior guidance included a full year of Mobility. The issuer's explicit comparability warning replaces the old unsupported assumption that the change was necessarily mechanical."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "The peer screen is mixed and not yet fully normalized: SPGI's 27.22x feed-defined trailing P/E is 13.3% below MSCI's 31.38x, but SPGI's trailing denominator may still include Mobility while its price is ex-Mobility. SPGI's Q2 pro-forma revenue growth of 11.0% trails MSCI's 12.2%, and SPGI's 47.8% pro-forma operating margin trails MSCI's 56.2% reported operating margin. This supports a screening-only posture, not an initiation conclusion."
    severity: moderate
    identified: "2026-09-03"
    status: monitoring
  - risk: "SPGI reported $15.170B of debt and $4.134B of cash at June 30. After subtracting $1.981B carrying value for Mobility notes that became Mobility's responsibility, derived continuing-company net debt is approximately $9.055B. This is a transition-date calculation rather than an issuer-reported post-spin leverage ratio; no directly comparable SPGI debt/adjusted-EBITDA ratio was available."
    severity: moderate
    identified: "2026-09-03"
    status: monitoring
  - risk: "SPGI adjusted operating margin and MSCI adjusted EBITDA margin are not the same metric. The 54.3% versus 62.1% adjusted-profitability figures are directional only and cannot support a precise peer discount without a common denominator."
    severity: low
    identified: "2026-09-03"
    status: monitoring
  - risk: "Ratings and Indices remain sensitive to debt issuance, spreads, passive flows, and market levels; Energy and Market Intelligence face data-product competition and technology execution risk."
    severity: low
    identified: "2026-09-03"
    status: monitoring
catalysts:
  - catalyst: "Q3 2026 results: the first report expected to present Mobility as discontinued operations across comparative periods and the event required to test the remaining clean-quarter gate condition."
    expected: "2026-10-31"
    status: pending
  - catalyst: "A post-Q3 refresh of SPGI-versus-MSCI growth, operating margin, valuation, and leverage on aligned continuing-company bases."
    expected: "2026-11-15"
    status: pending
  - catalyst: "Next scheduled Company Intelligence review, including post-spin cash conversion, share count, and capital-structure normalization."
    expected: "2026-12-02"
    status: pending
conviction:
  rating: Medium
  rationale: "Medium conviction is retained after primary-source recovery. S&P Global's four continuing businesses produced $3.678B of Q2 pro-forma revenue, 11% growth, and a 47.8% pro-forma operating margin. A same-time peer screen shows a lower feed-defined trailing P/E and lighter provisional net-debt burden than MSCI, but lower growth and margin, non-identical earnings and debt bases, and no clean reported post-spin quarter. The comparison half of the gate is materially advanced but not fully normalized; the clean-quarter half remains factually unavailable. This rating excludes target, allocation, trading, and leverage judgments."
