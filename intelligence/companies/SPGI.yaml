sector: Financials
industry: Credit Ratings, Financial Data/Analytics, and Market Indices
portfolio_role_ref: gated
competitive_advantages:
  - "Credit-ratings oligopoly member: S&P Global Ratings is one of the 'Big Three' rating agencies (alongside Moody's and Fitch), controlling a combined roughly 95% of the global market per secondary sources (individual SPGI/Moody's split reported inconsistently -- ~50%/31%/12%/7% in one source, ~40%/40%/15% in another). This is a regulatory-license-driven moat (NRSRO/ESMA designations) reinforced by issuer/investor reliance embedded in bond covenants and regulatory capital rules. [SPGI-C01]"
  - "Record scale and profitability: FY2025 revenue $15.336B (+8% YoY), GAAP net income $4.471B (+16%), GAAP diluted EPS $14.66 (+19%); Q2 2026 revenue $4.146-4.15B (~+10-11% YoY), operating profit $1.812B (+17% YoY). Indices segment operating margin 68-70% and Ratings 64-65% (2025 recast figures) are among the highest-margin businesses in this repository's covered roster. [SPGI-C02]"
  - "S&P Dow Jones Indices franchise benefits from the same AUM-linked-fee mechanism driving index-provider growth broadly: Q2 2026 Indices revenue +20% YoY, asset-linked fees +22%, ETF AUM linked to S&P indices reaching a record $6.35 trillion. [SPGI-C03]"
  - "53 consecutive years of dividend increases, paid annually since 1937 -- one of fewer than 30 S&P 500 companies with a 50+ year increase streak, evidencing long-run capital-return discipline through multiple economic cycles. [SPGI-C04]"
risks:
  - risk: "Post-Mobility-spin comparability is not yet resolved -- the specific condition this record's gate names. Mobility Global Inc. (NYSE: MBGL) completed its separation from SPGI effective 2026-07-01 (record date 2026-06-15). Under the disclosed accounting treatment, Mobility's results are included in SPGI's consolidated financials only through 2026-06-30, and Mobility will be presented as discontinued operations across all comparative periods beginning with Q3 2026 (expected to be reported around 2026-10-29) -- meaning no single quarter reported as of this record's authoring date (2026-08-05) presents SPGI on a clean, fully-discontinued-operations basis. Every quarter reported to date (including Q2 2026) is a transition-period result."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "FY2026 guidance changed materially around the spin: adjusted EPS guidance moved from $19.40-$19.65 (given February 2026, pre-spin-clarity) to $17.50-$17.75 (as of the Q2 2026 call) -- a large absolute change very likely mostly or entirely mechanical (removing Mobility's EPS contribution) rather than business deterioration, but no primary-source bridge reconciling the two figures was found this session, which is exactly the kind of reconciliation the gate's own 'normalized... valuation' language calls for and is not yet available."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "Valuation multiples for SPGI itself were internally inconsistent across secondary sources this session even before attempting an SPGI-vs-MSCI comparison: trailing P/E cited variously as 27.85x, 24.7x, and 33.9x; EV/EBITDA cited as 11.56x, 18.07x, and 18.45x across sources dated within about two weeks of each other. A same-date, same-earnings-basis SPGI-vs-MSCI valuation comparison -- the specific comparison the gate names -- was not achievable from sources available this session, though MSCI's own multiples (more internally consistent) appear to sit at a premium to SPGI's on every reading obtained."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "The Mobility separation triggered new corporate-level debt issuance (~$2 billion planned for H2 2026) to help fund an enlarged $7B+ FY2026 buyback target, layered on an earnings base that shrank when Mobility (~13% of FY2025 revenue) departed. Pre-issuance leverage figures were themselves inconsistent across sources (debt-to-equity cited as 0.34, 0.43, and 30.2% at different dates), and no updated post-issuance leverage figure was found. MSCI, used as the gate's own named comparator, discloses a formal leverage target range (3.0x-3.5x total-debt-to-adjusted-EBITDA) that no equivalent published SPGI target was found for."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "Regulatory/litigation history in the Ratings business: SEC charged S&P Global Ratings with conflict-of-interest violations in 2022 (self-reported, cooperated, remediated); in 2024 the SEC charged six credit rating agencies, S&P Global Ratings among them per the secondary summary found, with recordkeeping failures tied to electronic-communications preservation, resulting in a $20 million civil penalty and a required compliance consultant. Ongoing Australian class-action litigation alleges investment losses tied to pre-financial-crisis CDO ratings. No 2026-dated new litigation or enforcement matter was found this session, though this is a search-limited finding, not a clean-record confirmation."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "Energy segment (formerly Commodity Insights, renamed 'S&P Global Energy' effective 2025-11-14) showed the slowest growth of SPGI's four remaining segments in Q2 2026 (+3% YoY), explicitly attributed in company commentary to the Iran conflict and extreme volatility impacting renewals and GTS -- a live, named geopolitical exposure as of the most recent quarter."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) failed on every domain attempted this session, including sec.gov, investor.spglobal.com, and a Wikipedia control page used to confirm this was a general tool failure rather than domain-specific blocking. No primary document (10-K, 10-Q, 8-K, or SPGI's own press release) was directly opened. Every fact in this record traces to WebSearch-returned snippets/summaries, and several figures were internally inconsistent across sources and are flagged in SPGI.md rather than silently resolved (Q2 2026 adjusted-EPS beat-vs-miss framing conflicted across two sources; segment revenue percentages did not cleanly sum to 100%; S&P Dow Jones Indices JV ownership percentages found were dated to the 2011-2012 formation era with no 2026 confirmation)."
    severity: low
    identified: "2026-08-05"
    status: monitoring
