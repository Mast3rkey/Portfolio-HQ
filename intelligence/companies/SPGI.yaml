conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). SPGI's core Ratings/Indices/Market Intelligence/Energy businesses show record scale and profitability (FY2025 revenue $15.3B +8%, GAAP EPS +19%; Q2 2026 operating profit +17%) with genuine structural moats (Ratings oligopoly licensure, AUM-linked Indices franchise) and an unusually long dividend-growth track record (53 years). Held at Medium rather than higher because the gate's own stated concern -- post-Mobility-spin comparability -- is independently confirmed by this research as factually unresolved as of the authoring date: no clean post-spin quarter has yet been reported (the first is expected Q3 2026), FY2026 guidance moved by a large absolute amount around the spin without a found primary-source bridge, and a normalized SPGI-versus-MSCI valuation comparison (the gate's own named benchmark) was not achievable from available sources due to internally inconsistent multiples. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and was not inferred from SPGI's existing gated/cash-pending-clearance status or its 1.25% canonical target -- it was reasoned solely from the disclosed operating and financial picture, which independently supports the same 'strong core business, comparability not yet clean enough' conclusion the gate itself already recorded."
