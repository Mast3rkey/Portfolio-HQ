      note: >
        First Company Intelligence record created in a six-company
        administrative batch. Primary-source access failed during that session,
        so the record disclosed search-snippet dependence and unresolved data
        conflicts.
    - date: "2026-09-03"
      note: >
        Directly read SPGI and MSCI Q2 2026 SEC-filed results and 10-Q materials.
        Reconciled reported versus Article 11 pro-forma results, separation
        accounting, guidance comparability, cash, debt, and Mobility-note
        responsibility. Added a same-time valuation, growth, margin, and leverage
        screen. Retained Medium conviction and the existing gate because the
        first clean reported post-spin quarter remains unavailable.
