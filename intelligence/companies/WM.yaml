sector: Industrials
industry: Environmental and Waste Management Services
portfolio_role_ref: gated
competitive_advantages:
  - "North America's largest waste-services network: ~262 landfill sites, 339 transfer stations, 105 recycling facilities, and 413 collection operations (secondary aggregation, not independently verified against the 10-K), serving 20M+ residential, commercial, industrial, and municipal customers. Landfill permitting is described in secondary analysis as extremely difficult and often practically impossible to newly obtain in most jurisdictions, taking years and substantial capital -- making the existing network a structurally scarce, effectively irreplaceable asset base. [WM-C01]"
  - "Diversified, growing revenue base: FY2025 revenue $25.2B (vs. $22.1B FY2024, largely reflecting the first full year of Stericycle consolidation). Q2 2026 revenue $6.684B (+4.0% YoY), adjusted EBITDA $2.067B (+5.5% reported, +9.1% ex-2025-wildfire-cleanup comparisons), adjusted EBITDA margin ~30.9%, free cash flow $1.104B for the quarter (+34.5% YoY). [WM-C02]"
  - "Growing Sustainability business (Renewable Natural Gas and recycling automation): a $3 billion 2022-2026 growth-capital program (39 new/upgraded recycling facilities, 20 new RNG facilities). As of the Q1 2026 call, seven new RNG facilities had come online since Q1 2025; renewable-energy EBITDA more than doubled year-over-year; recycling EBITDA grew 18% despite a 27% decline in commodity prices. Combined recycling + renewable-energy adjusted operating EBITDA was $163M in Q2 2026, up 32.5% from $123M a year earlier. [WM-C03]"
  - "23rd consecutive year of dividend increase for 2026 (2026 increase +14.5% to $0.945/quarter, annualized $3.78); new $3B share-repurchase authorization approved alongside the dividend hike, superseding a prior $1.5B authorization; management targets returning approximately 90% of 2026 free cash flow to shareholders via dividends and buybacks combined. [WM-C04]"
risks:
  - risk: "Stericycle (Healthcare Solutions) integration showed real friction through 2025 before management characterized it as substantially resolved by Q2 2026. Multiple Waste Dive articles across Q2-Q4 2025 disclosed customer onboarding and billing/ERP integration issues -- 'tremendous amount of frustration with billing or reporting' among some customers, credits/deferred price increases offered, and Q3 2025 Healthcare Solutions revenue ($628M) coming in slightly below expectations attributed partly to ERP integration friction. By the Q2 2026 call, CEO Jim Fish characterized the segment as fully integrated ('we feel like we've fixed the business now'), with segment adjusted operating EBITDA margin expanding to 19% from 17% a year earlier and cross-selling generating $32M of cumulative annualized EBITDA to date -- a self-reported characterization by management, not independently audited."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "Stericycle synergy-target escalation is unverified: the deal's original 2024 announcement cited run-rate cost synergies 'exceeding $125 million,' while Q2 2026 commentary cites progress toward '>$300 million of total synergies by end of 2027' -- a materially larger, later-stated target whose origin and the timing of its increase could not be traced this session. This should be treated as an unreconciled figure, not confirmed guidance history."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "Commodity-price exposure in recycling: WM's own disclosed sensitivity (per secondary characterization, not independently verified against a primary filing) is approximately $27M of EBITDA impact for every $10/ton move in single-stream recycled-commodity prices, a sensitivity described as growing as WM processes more recycling tons over time. Recycled-materials (OCC/mixed paper) prices have historically swung 60-150% peak-to-trough. Recycling EBITDA has so far grown despite commodity-price declines (volume/automation offsetting price), but this insulation is described as partial, not complete, and the Q2 2026 guidance trim was partly attributed to softer recycling brokerage."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "PFAS (per- and polyfluoroalkyl substances) regulatory and litigation exposure is a live, industry-wide issue as of 2026: an industry-wide estimate puts PFAS-leachate remediation costs at over $1 billion (timeframe/scope unclear from sources found); EPA finalized a rule in April 2026 revising PFAS TSCA reporting-period requirements; industry trade groups have sued over EPA's CERCLA hazardous-substance designation for PFAS and lobbied for a landfill/water-treatment liability exemption with no confirmed legislative movement found. A specific PFAS groundwater-contamination lawsuit against a North Carolina county landfill (filed ~June 2026) was identified but this session could not confirm whether the landfill is WM-owned/operated. No WM-specific named PFAS litigation, defendant status, or reserve figure was found this session -- disclosed as a research gap, not a finding of no exposure, given WM operates the largest landfill network in North America."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "Full-year 2026 revenue guidance was trimmed at the Q2 2026 call (to $26.275B-$26.475B from $26.43B-$26.63B post-Q1, roughly a 0.5% cut) attributed to softer collection/disposal volumes (guided to decline ~1% for the year), RNG pipeline-connection delays (two completed RNG plants awaiting third-party pipeline connection as of Q2 2026), and softer recycling brokerage. Adjusted EBITDA and free cash flow guidance were maintained, and EBITDA margin guidance was raised 20bps, indicating the revenue softness is not yet flowing through to profitability guidance, but this is a fact pattern worth monitoring rather than a resolved question."
    severity: low
    identified: "2026-08-05"
    status: monitoring
  - risk: "This Claude Code session's own primary-source access (WebFetch) was tested and confirmed completely blocked (HTTP 403) on every domain attempted, including sec.gov, investors.wm.com, and a control domain (example.com) used to confirm this was a systemic tool failure rather than a domain-specific block. No primary document (10-K, 10-Q, 8-K, or WM's own press release/call transcript) was directly opened this session. Every fact in this record traces to WebSearch-returned snippets/summaries, and several figures were internally inconsistent across sources (net income $785M vs $786M for Q2 2026; two different debt-to-EBITDA figures for different quarters; Republic Services' landfill count cited as both 190 and 209) -- flagged in WM.md rather than silently resolved."
    severity: low
    identified: "2026-08-05"
    status: monitoring
