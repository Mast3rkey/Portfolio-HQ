conviction:
  rating: Medium
  rationale: "Medium conviction is retained after directly reading WM's Q2 2026 release and filed 10-Q. The collection, landfill, transfer, recycling, renewable-energy, and healthcare portfolio produced $6.684B of quarterly revenue, $2.067B of adjusted operating EBITDA, and $1.104B of free cash flow; EBITDA and free-cash-flow guidance were maintained despite a lower revenue range. The offset is valuation and leverage: the 2026-09-03 market snapshot was 31.75x trailing earnings, while filed June debt totaled $23.356B before cash. Stericycle integration benefits remain partly management claims, and WM-specific PFAS exposure is not quantified. This rating excludes allocation, trading, and margin judgments and supports retaining the gate until valuation evidence is robust enough to justify initiation."
