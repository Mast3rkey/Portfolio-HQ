    expected: "2026-10-25"
    status: pending
conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). Merck shows a still-large, still-growing Keytruda franchise with active lifecycle-extension execution (the June 2026 adjuvant renal-cell-carcinoma approval) and genuine, if early, diversification evidence (Winrevair, Animal Health, and the July 2026 Lipfendra approval). Held at Medium rather than High because of concrete, disclosed tensions this record does not discount: extreme concentration (Keytruda approximately 49% of Q1 2026 sales); underlying growth of only 3% excluding foreign exchange even before any exclusivity step-down; very large one-time acquisition charges ($9.0 billion Cidara, an additional ~$5.8 billion expected for Terns) whose return on capital is unproven in this record's evidence base; and an unresolved, batch-wide replacement-timing question (B7-U004) this record does not resolve. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments."
