competitive_advantages:
  - "Keytruda remains a very large, still-growing oncology franchise: Keytruda and Keytruda Qlex sales were $8.0 billion in Q1 2026, approximately 49% of total company sales of $16.286 billion (up 5% reported, 3% excluding foreign exchange). The FDA approved a Keytruda/Keytruda Qlex plus Welireg adjuvant regimen in renal-cell carcinoma in June 2026 -- evidence of active lifecycle extension into new indications, not a franchise standing still ahead of exclusivity risk. Per Merck's Form 10-Q for the quarter ended 2026-03-31 (SEC accession 0001628280-26-029802), Merck's Q1 2026 earnings release, and the FDA's belzutifan/pembrolizumab approval announcement, all directly inspected by the independent evidence-recovery researcher who authored the governed WS-0005 Milestone 3 Batch 7 evidence bundle (see Source-access disclosure in MRK.md) -- not directly inspected by this Claude session."
  - "Real, if early, diversification beyond Keytruda: Q1 2026 included $525 million of Winrevair sales and $1.8 billion of Animal Health sales -- disclosed, non-oncology revenue engines distinct from the core Keytruda franchise. Per Merck's Q1 2026 earnings release, directly inspected by the evidence-recovery researcher, not by this Claude session."
  - "New non-oncology pipeline conversion: the FDA approved Merck's oral PCSK9 inhibitor Lipfendra (the first oral PCSK9 inhibitor approved to lower LDL cholesterol) in July 2026 -- a genuinely new diversification asset outside oncology and outside Merck's existing disclosed franchises. Per the FDA's approval announcement, directly inspected by the evidence-recovery researcher, not by this Claude session."
risks:
  - risk: "Extreme single-franchise concentration: Keytruda and Keytruda Qlex represented approximately 49% of total Q1 2026 company sales -- essentially half of the company's revenue rests on one franchise's continued commercial and regulatory success, even as lifecycle-extension work (the June 2026 renal-cell-carcinoma approval) continues."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Underlying growth was materially slower than the headline figure once currency effects are removed: Q1 2026 worldwide sales were up 5% reported but only 3% excluding foreign exchange."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Merck recorded a $9.0 billion charge for the Cidara acquisition and announced a Terns transaction expected to produce an additional approximately $5.8 billion one-time charge -- very large, disclosed one-time costs for business-development-driven diversification, whose eventual return on capital is not established in this record's evidence base."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "Whether launches and acquired pipeline assets (Winrevair, Animal Health, Lipfendra, Cidara- and Terns-derived assets) can offset Keytruda concentration before its principal exclusivity step-downs is not established by a probability-weighted replacement curve in this record's evidence base (unresolved question B7-U004)."
    severity: moderate
    identified: "2026-07-27"
    status: monitoring
  - risk: "This session's own primary-source access (WebFetch) was tested and confirmed blocked on 2026-07-27 (SEC EDGAR, and a neutral non-target control domain, both returned HTTP 403) -- every fact in this record is attributed to the governed v2 evidence bundle's own directly-inspected sources, not to this Claude session's independent document inspection. See MRK.md's Source-access disclosure."
    severity: low
    identified: "2026-07-27"
    status: monitoring
