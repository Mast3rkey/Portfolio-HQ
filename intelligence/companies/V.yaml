  - catalyst: "Visa fiscal Q3 2026 earnings release — confirmed scheduled for 2026-07-28 per Visa's own investor-relations notice (2026-07-07), directly inspected by GPT-5.6 Thinking. As of this record's evidence cutoff, these results had not yet been furnished; this record does not present them as known and must be refreshed once they are released."
    expected: "2026-07-28"
    status: pending
  - catalyst: "Further procedural developments in U.S. v. Visa, Inc. [2024] (the DOJ debit-network monopolization case) following the 2025-06-23 denial of Visa's motion to dismiss — no source inspected by this record establishes a specific next hearing or ruling date. 2026-10-25 (this record's own next_due review date) is the internal checkpoint at which this matter will next be actively re-checked; it is not a forecast of when the next procedural event will occur."
    expected: "2026-10-25"
    status: pending
conviction:
  rating: High
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance — AI-assisted research and drafting do not themselves constitute approval (see review.log below). Reassessed independently after this correction, not mechanically carried over from the prior draft. Visa shows a durable network-scale business model (VisaNet authorization/clearing/settlement) with diversified, growing revenue across service, data-processing, and international-transaction categories, recent evidence (fiscal Q2 2026) of continued double-digit net-revenue and volume growth, and now-established financial quality (FY2025 operating cash flow $23.059B, ~$21.577B of that remaining after disclosed capex, $18.2B of buybacks plus $4.6B of dividends, $24.9B of remaining repurchase authorization, against $25.392B of total debt) — reported in parallel, without asserting a specific source-of-funds conclusion for the capital-return program. Held at High rather than Very High because of concrete, current tensions: an active DOJ monopolization complaint concerning debit-network services with a denied motion to dismiss (unresolved, not yet a liability finding, but real and live); the corrected client-incentive cost (28.25% of pre-incentive gross revenue, not the previously miscalculated ~22%) as a persistent, material competitive cost; and a still-incomplete balance-sheet/liquidity picture beyond total debt. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat the pending DOJ litigation's outcome as predictable from the evidence in this record."
