sector: Information Technology
industry: Electronic Design Automation Software and Semiconductor IP
portfolio_role_ref: gated
competitive_advantages:
  - "Synopsys combines an embedded electronic-design-automation franchise with Design IP and the acquired Ansys simulation portfolio. The strategic breadth is real, while integration benefits remain a management objective rather than a completed outcome. [SNPS-P01]"
  - "Q3 2026 revenue was $2.477B, up 42%; Design Automation revenue was $2.003B, up 53%, with $905.0M of adjusted operating income and a 45% adjusted margin. These segment profit figures are management-defined non-GAAP measures. [SNPS-P01]"
  - "Q3 Design IP revenue was $473.9M, up 11%, and adjusted operating margin improved to 27%. The nine-month comparison was weaker, so the quarter is treated as evidence of improvement rather than proof of a durable repair. [SNPS-P01]"
  - "Management forecasts approximately $2.8B of fiscal 2026 operating cash flow and $2.6B of free cash flow. These are issuer forecasts and remain separately labeled from reported results. [SNPS-P01]"
risks:
  - risk: "The September 30, 2026 Investor Day has not occurred. The existing gate requires that event plus a fresh normalized valuation model, so current evidence cannot authorize an add or sleeve change."
    severity: moderate
    identified: "2026-08-05"
    status: monitoring
  - risk: "Q3 earnings quality is mixed: GAAP diluted EPS of $2.84 includes a $425.4M pre-tax Processor IP divestiture gain, while non-GAAP EPS of $3.91 excludes $402.4M of acquired-intangible amortization, $231.6M of stock compensation, and other acquisition-related items. Neither denominator is a clean standalone valuation basis. [SNPS-P01]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "Design IP's Q3 improvement has not repaired the longer-period record. Nine-month revenue was $1.335B versus $1.345B and adjusted operating income was $302.2M versus $363.1M, a 17% decline. [SNPS-P01]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "The expected restructuring cost increased from $300-$350M to $425-$500M, with the plan continuing through fiscal 2027 and the majority of workforce reductions expected in fiscal 2026. [SNPS-P03]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "At July 31, total debt was $10.037B and derived net debt was $6.430B. Quarterly interest expense was $133.2M. Deleveraging and cash conversion remain material integration tests. [SNPS-P02]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "Goodwill of $26.835B plus net intangible assets of $11.459B represented 80.2% of total assets. This balance-sheet concentration increases purchase-accounting and impairment sensitivity if integration benefits underdeliver. [SNPS-P02]"
    severity: moderate
    identified: "2026-09-07"
    status: monitoring
  - risk: "Fiscal 2026 guidance assumes no further change to applicable export-control or entity-list restrictions. Regulatory changes affecting access to controlled markets remain outside management's control. [SNPS-P01]"
    severity: low
    identified: "2026-09-07"
    status: monitoring
catalysts:
  - catalyst: "Investor Day, the existing gate's named disclosure event, scheduled by Synopsys for September 30, 2026 at 1:00 p.m. ET."
    expected: "2026-09-30"
    status: pending
  - catalyst: "A post–Investor Day normalized valuation refresh incorporating disclosed organic-growth, margin, synergy, capital-allocation, and deleveraging targets."
    expected: "2026-10-15 (internal review target)"
    status: pending
  - catalyst: "Q4 and fiscal 2026 results, including Design IP durability, GAAP-to-adjusted earnings quality, cash conversion, and debt reduction."
    expected: "December 2026 (estimate; issuer date not announced as of 2026-09-07)"
    status: pending
conviction:
  rating: Medium
  rationale: "Medium conviction is retained after direct primary-source recovery. Q3 revenue growth and Design Automation economics were strong, while Design IP's nine-month results, the widened restructuring estimate, $10.037B of debt, an acquisition-heavy balance sheet, and a highly adjusted earnings bridge remain unresolved. The dated valuation work is screening evidence only. The September 30 Investor Day and a fresh normalized model are still required before any gate, target, allocation, trading, or leverage judgment."
