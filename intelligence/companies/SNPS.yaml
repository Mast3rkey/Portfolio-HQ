conviction:
  rating: Medium
  rationale: "PROPOSED rating, presented for independent exact-head review and principal acceptance -- AI-assisted research and drafting do not themselves constitute approval (see review.log below). Synopsys shows genuinely strong underlying business execution -- record FY2025 revenue, two consecutive beat-and-raise quarters in FY2026, a first-ever 83% gross margin, and major new AI-industry partnerships (Nvidia, Microsoft, AMD) -- and real deleveraging progress since the transformative Ansys acquisition closed. Held at Medium rather than higher because every specific concern this record's gate names is independently confirmed by this research as still live: GAAP/non-GAAP normalization shows an extreme, structurally persistent gap (~38x in the most recent quarter) driven by years of remaining non-cash amortization; leverage, while declining, remains above the company's own stated long-term target; purchase valuation is complicated by $38.8B of combined goodwill and intangibles now on the balance sheet against a still-unresolved securities class action alleging the company overstated the acquired/adjacent Design IP business's health; and the September 2025 one-day ~35% stock decline -- from which the stock had not fully recovered as of the most recent price found -- demonstrates the market itself has not resolved these questions. This rating excludes valuation, entry-price, allocation, trading, and margin/safe-leverage judgments, and was not inferred from SNPS's existing gated/cash-pending-clearance status or its 2.50% canonical target -- it was reasoned solely from the disclosed operating and financial picture, which independently supports the same 'strong execution, unresolved integration/leverage/GAAP/valuation questions' conclusion the gate itself already recorded."
