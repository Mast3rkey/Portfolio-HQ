conviction:
  rating: Medium
  rationale: "Intel's Q2 2026 results provide the strongest verified evidence in this record's history of an in-progress operational turnaround: revenue $16.1B (+25% YoY, the fastest growth rate since 2011 per secondary characterization), materially above guidance on every disclosed metric, Data Center and AI segment revenue +59% YoY, and -- most consequentially for the foundry thesis specifically -- 18A process output and yields both reported running ahead of Intel's own internal targets, with a growing (though still small, $293M) external-foundry-revenue contribution and a lengthening list of disclosed external design-win commitments (AMD, NVIDIA, Marvell, Microsoft, Micron, OpenAI, a defense customer). The government/NVIDIA/SoftBank capital infusions have also materially strengthened near-term liquidity ahead of a very large domestic capital-spending program. Conviction is Medium rather than High or Very High because: (1) Intel's own disclosed contingency -- pausing or discontinuing 14A absent sufficient committed external demand -- means the foundry-turnaround thesis remains conditional on future customer commitments Intel does not yet have in hand, with secondary analysis specifically framing 14A (not 18A) as the real decisive test, expected around 2027; (2) restructuring remains ongoing and incomplete, with 23,000 cumulative layoffs across three phases and management signaling further cuts are possible if foundry external-customer targets are missed; (3) new government/NVIDIA/SoftBank equity stakeholders introduce governance and national-security-politicization considerations, and dividend/buyback restrictions, that are not purely commercial in character; and (4) Intel's own multi-year history of missed leading-edge-node targets means this record deliberately does not extrapolate durable future execution from one strong quarter and one quarter of positive 18A yield data, however real and verified those data points are. This record's own source-access constraint (WebFetch blocked at the tool/proxy level on every URL attempted this session, including a non-target control domain -- see the AVGO record's Source-access disclosure for the control-domain test performed once for the whole session) means every figure here is WebSearch-sourced or secondary-cited rather than independently verified against primary filing text. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from INTC's existing spec tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 §§2/3). This rating and rationale reflect AI-assisted research pending the independent PR review and human approval this repository's first-coverage discipline requires before this record is treated as finalized."
