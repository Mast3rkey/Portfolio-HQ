conviction:
  rating: Medium
  rationale: "Reassessed 2026-07-26 following an independent primary-source audit (not mechanically preserved at its prior value). Quanta shows strong, cross-checked, recent growth evidence (FY2025 revenue $28.48B +20.3%, record and accelerating total backlog reaching $48.5B by Q1 2026, a specific named contractual relationship with AEP tied to data-center-driven transmission demand, improving segment margins off a weaker prior-year base, a Moody's outlook upgrade to positive) and a business model that, corrected by the audit, is now understood as primarily labor/contract-services with a genuine, growing secondary manufacturing capability (power transformers and related electrical components) -- a more nuanced and, if anything, structurally stronger position than this record's original 'no manufacturing at all' framing suggested. The audit also removed decision-bearing weight from two legacy litigation matters (Maurepas Pipeline, PRONATEL) that this record's original draft had counted toward a more cautious rating, and corrected several disclosure figures (larger workforce at ~69,500 employees, ~36% collective-bargaining coverage, current 8%/30% customer concentration, a 70%/17%/13% end-market mix) that clarify rather than worsen the picture. These corrections do not by themselves justify raising conviction to High: genuine, unaddressed structural constraints remain -- fixed-price-contract execution risk that is qualitatively real but still not quantified; labor/safety tail risk in a business where fatal accidents are disclosed even as aggregate metrics improve; renewable-energy tax-policy exposure; a stale (September 2023) confirmed S&P rating action; and an unresolved FY2025 full-year adjusted-EBITDA figure, none of which the audit addressed. Conviction is therefore held at Medium, for a rebalanced set of reasons than the original draft's rationale (which leaned more heavily on now-corrected disclosure gaps and litigation uncertainty) -- not mechanically carried forward from that reasoning. Corrected again 2026-07-26 by a second independent primary-source review: Quanta's data-center exposure is not, as this record's first correction pass still stated, entirely indirect -- CEI provides direct, in-facility electrical design/installation/manufacturing for hyperscaler and technology customers, a real and more specific growth-driver overlap with VRT/ETN than previously stated. This additional correction reinforces, rather than changes, the Medium rating: it strengthens the demand-side picture already reflected in the AEP-partnership evidence above, but does not resolve the still-unaddressed structural constraints (fixed-price execution risk, safety/tail risk, renewable-policy exposure, stale S&P rating, unresolved FY2025 adjusted-EBITDA figure) that keep this rating at Medium rather than High. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments."
