conviction:
  rating: Medium
  rationale: "Quanta shows strong, cross-checked, recent growth evidence (FY2025 revenue $28.48B +20.3%, record and accelerating total backlog reaching $48.47B by Q1 2026, a specific named contractual relationship with AEP tied to data-center-driven transmission demand, improving segment margins off a weaker prior-year base, a Moody's outlook upgrade to positive) and a structurally distinct, labor-intensive business model from ETN/VRT that provides genuine diversification within the power_infra cluster rather than duplicated equipment-manufacturing exposure. Conviction is held at Medium rather than High because of a meaningfully larger set of unresolved evidence gaps than this batch's other two companies: fixed-price-contract execution risk is qualitatively real but not quantified; the most recent customer-concentration figure located is from FY2023, not current; two legacy litigation matters (Maurepas Pipeline, a PRONATEL arbitration) and an ERISA lawsuit headline could not be confirmed as resolved, current, or material; the most recent independently-confirmed S&P rating action is nearly three years old; and full-year 2025 adjusted EBITDA could not be pinned down from conflicting secondary sourcing. None of these gaps is itself disconfirming evidence of a problem -- they are gaps in what WebSearch-only research could establish -- but their number and nature (concentrated in disclosure currency and legal-matter resolution, areas a labor-intensive contractor is more exposed on than an equipment manufacturer) justify a more cautious rating than the growth evidence alone would suggest. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments."
