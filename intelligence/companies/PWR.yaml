sector: Industrials
industry: Construction & Engineering
portfolio_role_ref: T2
competitive_advantages:
  - "Labor-intensive specialty infrastructure services contractor (not an equipment manufacturer, distinct from ETN/VRT's manufacturing model) with a record, accelerating backlog: total backlog grew from $34.54B (year-end 2024) to $43.98B (year-end 2025) to $48.47B (Q1 2026, a reported record), with Q1 2026 Remaining Performance Obligations (contracted fixed-price backlog) of $26.24B, of which $15.9B is expected to convert to revenue within 12 months. Management describes approximately 80% of the business as recurring, master-service-agreement-driven base work, with large discrete projects layered on top. FY2025 total revenue $28.48B (+20.3% YoY from FY2024's $23.67B); Q1 2026 revenue $7.87B (+26.3% YoY), adjusted diluted EPS $2.68 (vs. $1.78 in Q1 2025)."
  - "Named, contractually-evidenced data-center-adjacent grid demand: a November 2025 strategic partnership with American Electric Power (AEP) covering (a) a Cooperation and Commitment Agreement for 765 kV and other high-voltage transmission EPC work tied explicitly to AEP's $72B 2026-2030 capital plan and 'the rapidly growing data center market,' with Quanta described in the release as the most experienced 765 kV constructor in the United States, and (b) a Development Services Agreement to expand domestic manufacturing capacity for extra-high-voltage transformers and breakers. This is a specific, named, verifiable contractual relationship, not a general market-narrative claim."
  - "Improving segment margins off a weaker prior-year base following a 2025 segment-reporting reorganization (Electric Infrastructure Solutions and Underground Utility and Infrastructure Solutions, replacing the prior three-segment structure): Q4 2025 Electric segment margin 10.8%; Underground segment operating margin improved to 7.7% from 3.6% a year earlier; Q1 2026 Electric segment margin 8.7%, Underground 7.5%. Record full-year 2025 free cash flow reported at $1.7B. Moody's revised Quanta's outlook from stable to positive in July 2025 (Baa3 rating affirmed), citing potential for further upgrade if adjusted Debt/EBITDA falls to or below 2.0x or FFO/total debt consistently exceeds 40%."
risks:
  - risk: "Fixed-price-contract execution risk, structurally distinct from ETN's/VRT's equipment-manufacturing economics: Quanta's own disclosed risk-factor language states it 'assumes risks related to revenue, cost and profitability on fixed-priced contracts' and that actual costs 'can vary, sometimes substantially, from original projections,' which 'could result in reduced profitability or losses on projects.' This record could not find a disclosed percentage of revenue that is fixed-price versus cost-plus/time-and-materials -- the risk is qualitatively confirmed but not quantified from available sources."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Labor and safety risk in a craft-labor-dependent field-services business: Quanta reports aggregate safety-metric improvement (a claimed 47% decrease in 'Stuff That Kills You' incidents since 2019, a claimed 29% year-over-year decrease in life-threatening/life-altering/fatal accidents), but the same trade-press source reporting these improvements also states the company has had 'a few fatal accidents involving electrocution and truck driving' in the two years preceding that report, and that industry-wide, severe/fatal accident rates have not always declined at the same pace as recordable-injury rates. Safety record functions as a customer-qualification gate for large utility/hyperscaler contracts, making this both an operational and a commercial risk. No numeric Total Recordable Incident Rate (TRIR) or disclosed union-membership percentage was found."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Stale or unconfirmed evidence on several material points: the most recent customer-concentration disclosure this record could locate is from the FY2023 10-K (largest customer 6% of revenue, top 10 customers 31%) -- not confirmed current; the most recent independently-confirmed S&P Global Ratings action found dates to September 2023 (BBB-, stable); the current status of two legacy litigation matters (the Maurepas Pipeline liquidated-damages dispute, originally ~$59M reduced to ~$48M as of a 2022-era filing, and a referenced PRONATEL arbitration) could not be confirmed as resolved or still pending; a PlanSponsor.com headline referencing an ERISA lawsuit against Quanta could not be dated or detailed. A separately-sourced '$35.3B renewable energy backlog' figure appears inconsistent with total/segment backlog figures and is treated here as a likely secondary-source error, not used elsewhere in this record."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Renewable-energy policy exposure: the 'One Big Beautiful Bill Act' narrows investment-tax-credit and production-tax-credit eligibility for wind/solar projects not in service by end-2027 or not under construction within 12 months of passage. Quanta's solar/wind-adjacent work is now folded into the larger Electric Infrastructure Solutions segment following the 2025 segment reorganization and can no longer be isolated from headline segment figures. Industry-wide, clean-energy projects accounted for a large majority of 2025 project cancellations (utility-scale solar, battery storage, and wind cancellations all cited in the tens of gigawatts) -- this is industry-wide context, not evidence of a Quanta-specific cancellation, and Quanta's own backlog has continued growing through the same period, but the policy and cancellation-wave context is a real, disclosed exposure for the renewable-adjacent portion of its work."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Working-capital-driven cash-flow dynamics typical of a scaling percentage-of-completion contractor: unbilled receivables grew from $859.9M (2024-12-31) to $1.19B (2025-09-30), a meaningful working-capital use of cash embedded within an otherwise strong reported free-cash-flow year. This is a normal, not alarming, pattern for a rapidly growing contract-services business, but it means cash conversion lags reported earnings growth."
    severity: low
    identified: "2026-07-26"
    status: monitoring
