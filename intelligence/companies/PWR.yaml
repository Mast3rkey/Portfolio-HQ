sector: Industrials
industry: Construction & Engineering
portfolio_role_ref: T2
competitive_advantages:
  - "Primarily a labor-intensive specialty infrastructure services contractor, corrected 2026-07-26 by an independent primary-source audit to include a growing, still-secondary manufacturing capability: Quanta's own official 2025 Form 10-K states the company manufactures power transformers and related electrical components and owns manufacturing facilities associated with those businesses -- this record's original draft overstated the contrast with ETN/VRT by describing Quanta as not manufacturing equipment at all, which the audit found inaccurate. Quanta remains fundamentally a labor/contract-services business (its manufacturing capability is secondary and supporting, not its primary economic function), but the distinction from ETN's/VRT's equipment-manufacturing models is now stated as one of degree and primacy, not an absolute services-only characterization. Record, accelerating backlog: total backlog grew from $34.54B (year-end 2024) to $43.98B (year-end 2025) to $48.5B (Q1 2026, a reported record), with Q1 2026 Remaining Performance Obligations (contracted fixed-price backlog) of $26.2B. Management describes approximately 80% of the business as recurring, master-service-agreement-driven base work, with large discrete projects layered on top. FY2025 total revenue $28.48B (+20.3% YoY from FY2024's $23.67B); Q1 2026 revenue $7.87B (+26.3% YoY), adjusted diluted EPS $2.68, adjusted EBITDA $686.4M. UPDATE (2026-08-05, SECONDARY only, no primary source opened -- PRNewswire, Quiver Quantitative): Q2 2026 results reported 2026-07-30. Revenue reportedly $9.56B (beat a cited $8.70B est.), GAAP diluted EPS $2.96, adjusted diluted EPS $4.24 (beat a cited $3.33 est.), net income $451.4M, adjusted EBITDA $1.1B; RPO reportedly grew to $33.6B (from Q1's $26.2B) and total backlog to $53.4B (from Q1's $48.5B, another reported record). FY2026 guidance reportedly raised (revenue $39.3B-$39.7B, adjusted EPS $16.45-$16.95, adjusted EBITDA $4.1B-$4.2B, FCF $2.0B-$2.5B). Company reportedly completed four acquisitions in the quarter (Falcone, Interfab, Percheron, PSD) expanding geographic presence and self-perform craft capability -- not previously reflected in this record. Needs primary-source (10-Q/earnings release) verification."
  - "Named, contractually-evidenced data-center-adjacent grid demand: a November 2025 strategic partnership with American Electric Power (AEP) covering (a) a Cooperation and Commitment Agreement for 765 kV and other high-voltage transmission EPC work tied explicitly to AEP's $72B 2026-2030 capital plan and 'the rapidly growing data center market,' with Quanta described in the release as the most experienced 765 kV constructor in the United States, and (b) a Development Services Agreement to expand domestic manufacturing capacity for extra-high-voltage transformers and breakers -- itself now understood, per the correction above, as an extension of Quanta's existing (if secondary) manufacturing capability rather than an entirely new activity. This is a specific, named, verifiable contractual relationship, not a general market-narrative claim."
  - "Improving segment margins off a weaker prior-year base following a 2025 segment-reporting reorganization (Electric Infrastructure Solutions and Underground Utility and Infrastructure Solutions, replacing the prior three-segment structure): Q4 2025 Electric segment margin 10.8%; Underground segment operating margin improved to 7.7% from 3.6% a year earlier; Q1 2026 Electric segment margin 8.7%, Underground 7.5%. Record full-year 2025 free cash flow reported at $1.7B. Moody's revised Quanta's outlook from stable to positive in July 2025 (Baa3 rating affirmed), citing potential for further upgrade if adjusted Debt/EBITDA falls to or below 2.0x or FFO/total debt consistently exceeds 40%."
  - "Scale confirmed larger than this record's original draft stated, corrected 2026-07-26 by an independent primary-source audit: Quanta's official 2025 Form 10-K reports approximately 69,500 employees at 2025-12-31 (this record's original draft cited 51,306, a figure the audit found stale/incorrect), of which approximately 36% are covered by collective-bargaining agreements. The same filing gives a directional customer-end-market mix of Utility and Power 70%, Energy and Other 17%, and Technology, Manufacturing and Communications 13% of revenue -- new disclosure this record's original WebSearch-only draft did not locate."
  - "Direct, in-facility data-center exposure through Cupertino Electric, Inc. (CEI), corrected 2026-07-26 by a second independent primary-source review: this record's prior correction pass still described Quanta's data-center exposure as 'entirely indirect' via utility/grid work -- that characterization is itself now corrected. Quanta's official 2025 Form 10-K states the company provides design and installation of electrical systems for large load centers, including data centers, that its customer base includes hyperscalers and technology companies, and that the CEI acquisition increased demand for Quanta's critical-path electrical design and installation solutions from the technology and data-center industry. Quanta's own official CEI acquisition release and CEI operating-company profile state CEI has more than 25 years of data-center industry experience, designs and installs critical electrical systems, has installed electrical systems in more than 20 million square feet of data centers, and is a custom manufacturer of modular electrical systems for large-scale data centers. Quanta therefore has two distinct data-center-relevant channels: (A) direct in-facility electrical design, engineering, procurement, construction, installation, commissioning, maintenance, and modular-electrical-system manufacturing through CEI, serving hyperscaler/technology customers; and (B) indirect utility/grid exposure (transmission, distribution, substations, interconnection, generation and load-growth infrastructure, e.g. the AEP partnership). No percentage of total Quanta revenue attributable to data centers is disclosed or estimated here."
risks:
  - risk: "Fixed-price-contract execution risk, structurally distinct from ETN's/VRT's equipment-manufacturing economics: Quanta's own disclosed risk-factor language states it 'assumes risks related to revenue, cost and profitability on fixed-priced contracts' and that actual costs 'can vary, sometimes substantially, from original projections,' which 'could result in reduced profitability or losses on projects.' This record could not find a disclosed percentage of revenue that is fixed-price versus cost-plus/time-and-materials -- the risk is qualitatively confirmed but not quantified from available sources, and this specific figure was outside the scope of the 2026-07-26 independent primary-source audit."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Labor and safety risk in a craft-labor-dependent field-services business: Quanta reports aggregate safety-metric improvement (a claimed 47% decrease in 'Stuff That Kills You' incidents since 2019, a claimed 29% year-over-year decrease in life-threatening/life-altering/fatal accidents), but the same trade-press source reporting these improvements also states the company has had 'a few fatal accidents involving electrocution and truck driving' in the two years preceding that report, and that industry-wide, severe/fatal accident rates have not always declined at the same pace as recordable-injury rates. Safety record functions as a customer-qualification gate for large utility/hyperscaler contracts, making this both an operational and a commercial risk. Corrected 2026-07-26: the official 2025 Form 10-K establishes approximately 36% collective-bargaining coverage (this record's original draft found no union-membership percentage); no numeric Total Recordable Incident Rate (TRIR) was located in either this record's original research or the audit."
    severity: moderate
    identified: "2026-07-26"
    status: monitoring
  - risk: "Legacy litigation, corrected 2026-07-26 to remove decision-bearing weight: this record's original draft carried two legacy legal matters -- the Maurepas Pipeline liquidated-damages dispute (originally ~$59M, reduced to ~$48M as of a 2022-era filing) and a referenced PRONATEL arbitration -- as unresolved-status risks. An independent primary-source audit (GPT-5.6 Thinking) inspected Quanta's official 2025 Form 10-K and did not locate either matter in it. Absence from the current 10-K does not itself prove resolution, so this record does not claim either matter is closed -- but per the audit's finding, neither is now treated as a current, material, decision-bearing risk; they are retained only as historical matters with unresolved present status, not weighted in this record's conviction rationale. A PlanSponsor.com headline referencing an ERISA lawsuit against Quanta likewise could not be dated, detailed, or located in the inspected 10-K, and carries the same non-decision-bearing treatment."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Stale or unconfirmed evidence on remaining material points, not addressed by the 2026-07-26 audit: the most recent independently-confirmed S&P Global Ratings action found dates to September 2023 (BBB-, stable); full-year 2025 adjusted EBITDA could not be pinned down from conflicting secondary sourcing (the audit confirmed Q1 2026 adjusted EBITDA of $686.4M but did not address the FY2025 full-year figure). A separately-sourced '$35.3B renewable energy backlog' figure appears inconsistent with total/segment backlog figures and is treated here as a likely secondary-source error, not used elsewhere in this record."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Renewable-energy policy exposure: the 'One Big Beautiful Bill Act' narrows investment-tax-credit and production-tax-credit eligibility for wind/solar projects not in service by end-2027 or not under construction within 12 months of passage. Quanta's solar/wind-adjacent work is now folded into the larger Electric Infrastructure Solutions segment following the 2025 segment reorganization and can no longer be isolated from headline segment figures. Industry-wide, clean-energy projects accounted for a large majority of 2025 project cancellations (utility-scale solar, battery storage, and wind cancellations all cited in the tens of gigawatts) -- this is industry-wide context, not evidence of a Quanta-specific cancellation, and Quanta's own backlog has continued growing through the same period, but the policy and cancellation-wave context is a real, disclosed exposure for the renewable-adjacent portion of its work."
    severity: low
    identified: "2026-07-26"
    status: monitoring
  - risk: "Working-capital-driven cash-flow dynamics typical of a scaling percentage-of-completion contractor: unbilled receivables grew from $859.9M (2024-12-31) to $1.19B (2025-09-30), a meaningful working-capital use of cash embedded within an otherwise strong reported free-cash-flow year. This is a normal, not alarming, pattern for a rapidly growing contract-services business, but it means cash conversion lags reported earnings growth."
    severity: low
    identified: "2026-07-26"
    status: monitoring
