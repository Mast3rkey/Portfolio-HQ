sector: Information Technology
industry: Semiconductors & Semiconductor Equipment
portfolio_role_ref: band
competitive_advantages:
  - "Dominant, reported position in process control -- inspection, defect review, and metrology equipment used across wafer fabrication (distinct from the deposition/etch 'process' equipment ASML/AMAT/LRCX provide; KLA measures and inspects rather than processes). Semiconductor Process Control was 90.3% of Q3 FY2026 total revenue ($3.08B of $3.415B, +12.6% YoY). FY2025 (fiscal year ended 2025-06-30): record total revenue $12.16B (+24% YoY from FY2024's $9.81B), GAAP net income $4.06B, gross margin 62.3% -- the highest reported gross margin of any company in this four-company batch"
  - "17 consecutive years of annual dividend increases as of 2026; quarterly dividend raised 21% to $2.30/share (pre-split) in a May 2026 board action, alongside a board-approved 10-for-1 forward stock split (effective 2026-06-12). Reported free cash flow approximately $3.36B trailing-twelve-months and capital returns (dividends + buybacks) of approximately $2.88B over the same period -- both secondary-sourced, not independently split out to a verified primary total-debt or buyback-authorization figure in this research pass"
  - "Backlog of $7.86B at 2025-06-30 (down from $9.83B at 2024-06-30), with a reported 71-76% of backlog expected to convert to revenue within 12 months -- the only company in this batch for which a specific backlog-conversion disclosure was found in research, offering somewhat more forward revenue visibility than a bare bookings figure would"
risks:
  - risk: "China revenue percentage is the least reliably established figure of any company in this batch -- sources found in research disagreed and were internally inconsistent (a range of roughly 30-44% of revenue was cited across FY2022-FY2025 depending on year and methodology, with one synthesis's own '41-44% in 2024' and 'anticipated 30%/high 20s in 2025' statements appearing to conflict). This record does not assert a specific year-by-year China percentage as fact and flags this as needing direct primary-source (10-K geographic revenue table) verification before any figure is relied upon"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "Two dated export-control shock episodes with disclosed financial impact: October 2022 BIS rules (KLA estimated a $600-900M FY2023 revenue hit at the time, with China then representing roughly 30% of total revenue/$2.66B in the pre-restriction fiscal year), and an April 2026 US Commerce Department order halting certain tool shipments to Hua Hong (a Chinese chipmaker), which the company told investors would create a fiscal 2026 revenue headwind -- no specific dollar magnitude for the April 2026 episode was found in this research pass, and KLA's Q4 FY2026 results (which would likely disclose it) were not yet released as of this record's evidence date"
    severity: moderate
    identified: "2026-07-25"
    status: monitoring
  - risk: "FY2024 (ended 2024-06-30) was a real, confirmed down year -- revenue $9.81-9.812B vs. FY2023's $10.50B, an approximately 6.5% decline -- demonstrating that KLA's process-control-specific revenue is not fully immune to the broader WFE/memory-digestion cycle, even though secondary commentary characterizes process-control spend as qualitatively somewhat stickier than raw deposition/etch capacity spend during a downturn (no quantified lead/lag figure was found to support that characterization with precision)"
    severity: low
    identified: "2026-07-25"
    status: monitoring
  - risk: "Recent (June-July 2026) stock-price volatility -- reported approximately 18% decline over 30 days (2026-06-18 to 2026-07-17, split-adjusted) following an insider-selling disclosure and broader semiconductor-equipment-sector weakness, after a prior ~68% rally (mid-April to late-June 2026, split-adjusted). One secondary valuation-model source described the stock as trading roughly 120% above its estimated fair value around the April 2026 export-curb news -- a single analytical model's opinion, recorded here as a data point, not as this record's own valuation judgment (which is explicitly out of scope for this record per its conviction rating's own exclusions)"
    severity: low
    identified: "2026-07-25"
    status: monitoring
catalysts:
  - catalyst: "Q4 FY2026 earnings release (quarter ended approximately 2026-06-30), scheduled 2026-07-28 -- postdates this record's research cutoff; expected to disclose the April 2026 Hua Hong-related export-control revenue impact not yet quantified in available sources, and to reconcile the apparent post-split guidance-EPS figures given alongside Q3 FY2026 results"
    expected: "2026-07-28"
    status: pending
conviction:
  rating: Medium
  rationale: "KLA holds a reported dominant position in semiconductor process control/inspection with the highest gross margin (62.3% FY2025) and the most explicit backlog-conversion disclosure of any company in this four-company batch, and has delivered 17 consecutive years of dividend increases. Conviction is Medium rather than High because: (1) this record's own research found KLA's China-revenue percentage to be the least reliably established figure of any company in the batch -- multiple sources disagreed and one synthesis's own figures appeared internally inconsistent, and this record explicitly declines to assert a specific year-by-year percentage as fact pending primary-source verification; (2) KLA has two dated export-control shock episodes (October 2022, April 2026) with the second's dollar impact not yet disclosed as of this record's evidence date; (3) FY2024 was a real, confirmed ~6.5% revenue decline, evidence against an unqualified 'process control is acyclical' framing that some secondary commentary implies but does not quantify; and (4) this record's own source-access limitations (WebFetch blocked throughout this research pass) mean several figures -- including the market-share percentage claims found (ranging inconsistently from roughly 50% to 85% depending on source and sub-segment) and the balance-sheet leverage/liquidity detail -- are secondary-sourced and, in the market-share case, internally inconsistent enough that this record does not adopt any single percentage. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and was not inferred from KLAC's existing band tier placement -- it was reasoned from the disclosed business and risk picture above, per WS-0005's zero-based research discipline (OPS-0006 SS2/SS3)."
