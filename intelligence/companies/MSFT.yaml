conviction:
  rating: High
  rationale: "Microsoft shows diversified, already-profitable growth across all three reporting segments (FY2025 revenue $281.724B, operating income $128.528B; FY2026 Q3 Microsoft Cloud +29% YoY, Azure +40% YoY), a real (not purely narrative) AI monetization signal (management-stated $37B AI annual revenue run rate, +123% YoY -- read as a management metric, not an audited segment), and the balance-sheet strength ($94.6B cash/short-term investments, $13.0B FY2025 buybacks plus $24.082B dividends) to fund a large capex buildout without financial strain evident in the record. Conviction is held at High rather than Very High because of concrete, current, evidence-based tensions rather than only a generic capex-risk disclaimer: disclosed cloud-gross-margin compression specifically attributed to AI-infrastructure scaling; an Azure capacity constraint that can delay revenue realization independent of underlying demand; an unusually deep, complex, and financially entangled OpenAI relationship large enough to require its own non-GAAP carve-out; and a live, though still preliminary, EU DMA cloud-gatekeeper regulatory exposure. This rating explicitly excludes valuation, entry-price, allocation, trading, and margin judgments, and does not treat forward-looking capex or AI-run-rate guidance as realized fact."
