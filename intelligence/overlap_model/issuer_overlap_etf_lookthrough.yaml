  inherits that disclosed staleness risk rather than independently re-verifying it.
later_governance_action: None required by this record itself. A future cross-asset synthesis unit consuming
  this dimension must independently re-check issuer_lookthrough.yaml's own freshness before relying on
  it, per that file's own quarterly-refresh requirement.
