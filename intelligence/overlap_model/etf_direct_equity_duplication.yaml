- intelligence/etf_classification/VWO.yaml:overlap_and_concentration
- intelligence/etf_classification/GLD.yaml:overlap_and_concentration
output_shape: A future computed record would restate, per fund, whether that fund's own already-sealed
  overlap_and_concentration finding (mechanically computed against issuer_lookthrough.yaml at classification
  time) indicates any embedded exposure to a name the account also holds directly as a canonical equity
  -- a categorical duplication flag per fund, never a numeric overlap percentage duplicated from the ETF
  record's own field.
uncertainty_or_gap_disclosure: SPY, VEA, and VWO's own overlap_and_concentration fields already resolve
  against issuer_lookthrough.yaml's own live fund-carrier membership at classification time; GLD's own
  record resolves not_applicable outright, since GLD holds physical gold, not equity constituents. This
  dimension cites those already-sealed findings; it does not re-derive them.
later_governance_action: None required by this record itself. A future cross-asset synthesis unit consuming
  this dimension should re-check each cited ETF record's own overlap_and_concentration field for drift
  before relying on it, since that field is itself a live mechanical rollup against issuer_lookthrough.yaml
  at the ETF framework's own validation time.
