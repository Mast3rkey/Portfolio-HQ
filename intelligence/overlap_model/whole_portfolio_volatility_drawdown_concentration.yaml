output_shape: A future computed record, once both a comparable equity/ETF-sleeve volatility axis and a
  whole-portfolio aggregation mechanism are separately built, would restate a categorical whole-portfolio
  volatility/drawdown concentration comparison across sleeves -- never a numeric standard deviation, beta,
  maximum-drawdown percentage, or portfolio-level risk figure.
uncertainty_or_gap_disclosure: Only the three crypto instruments carry a populated, per-instrument historical_volatility_category
  finding of their own; neither the equity classification schema nor the ETF classification schema defines
  a comparable volatility/drawdown axis anywhere, and no cross-sleeve aggregation mechanism exists to
  combine even the crypto sleeve's own three data points into a whole-portfolio figure. This is a genuine
  two-layer evidence gap (no per-instrument equity/ETF volatility axis, and no cross-sleeve aggregation
  mechanism), disclosed plainly rather than glossed over as a simple pointer.
later_governance_action: Extending the equity and ETF schemas with their own volatility/drawdown axis,
  and/or building a whole-portfolio aggregation mechanism, each requires its own separate future authorization
  -- not proposed, designed, or begun by this record.
