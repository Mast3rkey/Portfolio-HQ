output_shape: A future computed record would restate, per sleeve (equity, fund, crypto, reserve, cash),
  a categorical comparison of that sleeve's own aggregate destination weight against whatever cap mechanism
  already governs it -- within_governed_cap, at_or_near_governed_cap, exceeds_governed_cap, or no_governed_cap_defined
  -- never the sleeve's own numeric aggregate percentage, which allocate.py's own plan() already computes
  and enforces at runtime.
uncertainty_or_gap_disclosure: targets.yaml's own caps.clusters mechanism governs only three named sub-groupings
  within the equity sleeve (semis, power_infra, oil) -- no cap mechanism of any kind exists today for
  the fund, crypto, reserve, or cash sleeves as wholes, or for the equity sleeve in aggregate; a future
  computed record for those uncapped sleeves would correctly read no_governed_cap_defined, not a fabricated
  threshold.
later_governance_action: Defining a whole-sleeve cap for the fund, crypto, reserve, cash, or aggregate-equity
  sleeves, if ever warranted, requires its own separate future governance decision -- not proposed, implied,
  or begun by this record.
