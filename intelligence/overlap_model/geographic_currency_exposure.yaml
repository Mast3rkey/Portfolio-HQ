output_shape: A future computed record, once a whole-portfolio geographic/currency aggregation mechanism
  is separately built, would restate a per-sleeve or whole-portfolio categorical geographic/currency concentration
  comparison -- never a numeric percentage of book denominated in, or exposed to, any single geography
  or currency.
uncertainty_or_gap_disclosure: The four cited ETF records each already carry a populated, per-instrument
  geographic_concentration and currency_exposure finding -- but no whole-portfolio rollup mechanism exists
  anywhere in this repository to aggregate those per-instrument facts across sleeves, and none of the
  27 canonical equities or 3 crypto instruments carries a comparable geographic/currency axis of their
  own at all. This is a genuine two-layer evidence gap, not a simple pointer.
later_governance_action: Building a whole-portfolio geographic/currency aggregation mechanism, and/or
  extending the equity and crypto schemas with their own geographic/currency axis, each requires its own
  separate future authorization -- not proposed, designed, or begun by this record.
