# conviction, portfolio_role_ref, tier, target, weight, cluster membership, or
# any allocator-visible fact, and no copy of review.last_reviewed/next_due/
# cadence_days (those remain owned by each company's own Company Intelligence
# record; PI-0011 is the reporting consumer of those fields, not their owner).
