archetype_assessment:
  primary_archetype: B
  secondary_archetype: null
  rationale: >-
    Vertiv designs, manufactures, and services power and thermal-management equipment for
    data centers, funded by a large, growing, multi-year order backlog converting into
    equipment and services revenue -- a capital-intensive, long-cycle industrial model.
    Vertiv's own disclosed manufacturing-capacity expansion (a European chiller-production
    campus, plus a planned testing facility) and elevated order-to-shipment (book-to-bill)
    dynamics reinforce a reinvestment-intensive, long-asset-life profile in which
    reinvestment-rate and backlog-conversion assumptions materially affect the business,
    requiring ROIC/reinvestment framing alongside a discounted-cash-flow view -- archetype
    B's own description. No secondary archetype is assigned: Vertiv's own evidence base
    does not disclose segment-level financial detail showing materially different economics
    across its power-equipment, thermal-management, and services-and-spares product lines
    sufficient to support a distinct sum-of-the-parts lens, so no secondary archetype is
    forced from the available evidence.
evidence_quality_assessment:
  primary_source_coverage: partial
  uncertainty_statement: >-
    An external audit process independently inspected several of Vertiv's own official
    disclosures underlying this assessment, but this evaluation session did not itself open
    any primary document. Vertiv's own evidence base retains real, disclosed unresolved
    items -- an unquantified customer-concentration gap flagged by outside commentary that
    the underlying audit did not resolve, and a materially large backlog figure the
    underlying audit could not substantiate against an official filing and which is
    accordingly excluded from this assessment's reasoning -- placing overall coverage
    between the comprehensive and limited tiers.
