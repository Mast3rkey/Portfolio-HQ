evidence_parity_finding:
  finding: comparable_evidence_depth
  rationale: >-
    Vertiv's own evidence base and this comparator's own sealed evidence-quality state sit
    at broadly comparable investigative maturity: an external audit process directly
    inspected several of Vertiv's own official disclosures, a materially richer sourcing
    chain than a pure WebSearch-synthesis record, but this evaluation session did not itself
    open a primary document for either the contender or the comparator, and Vertiv's own
    record retains real, disclosed unresolved items of its own -- an unquantified
    customer-concentration gap and an unsubstantiated backlog figure explicitly excluded
    from this assessment's own reasoning. Neither evidence base is meaningfully thinner or
    richer than the other for the purpose of supporting a future, separately authorized
    capital-priority comparison -- both would need further evidentiary work before such a
    comparison could proceed with confidence, a maturity gap that runs in the same general
    direction for the contender as for the comparator.
