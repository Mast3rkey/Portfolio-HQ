evidence_parity_finding:
  finding: contender_evidence_gap
  rationale: >-
    Walmart's own evidence package traces to directly-inspected regulatory filings and
    carries strong claim-level citation, but it supplies no margin, cash-flow, dividend,
    buyback, or balance-sheet-leverage figures of any kind -- an entire category of
    financial-quality evidence the comparator's own sealed archetype record does carry (a
    stated free-cash-flow proxy figure, membership-economics detail, and
    operating-cash-flow-versus-capital-expenditure characterization). This is a genuine,
    disclosed completeness gap in the contender's own evidence base relative to the
    comparator's, specific to financial-quality depth rather than to sourcing reliability --
    both evidence bases trace to directly-inspected primary filings, but the comparator's
    own sealed record captures a fuller financial-quality picture than the contender's
    currently does.
