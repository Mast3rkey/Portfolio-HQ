ticker: WM
economic_role:
  economic_system_ref: 'other: Waste & Environmental Infrastructure Services'
  company_role: Largest North American waste collection, disposal, and recycling network operator
  role_basis: Evidence shows WM operating the largest landfill, transfer-station, and recycling network
    in North America (~262 landfills, 339 transfer stations, 105 recycling facilities) serving 20M+ customers,
    with landfill permitting scarcity cited as making the existing network a structurally difficult-to-replicate
    asset base.
capital_priority:
  status: maintain_current_weight
  comparator_set:
  - RSG
  - WCN
  - CWST
  rationale: Waste Management's evidence shows a diversified, growing operating business (record FY2025
    revenue, strong free cash flow, 23rd consecutive year of dividend increases) with Stericycle integration
    friction from 2025 that management now characterizes as substantially resolved, alongside ordinary
    industry-wide risks (commodity-price exposure in recycling, general industry PFAS regulatory exposure
    with no WM-specific litigation identified, and a modest FY2026 revenue-guidance trim not yet flowing
    through to profitability guidance). None of these developments rises above WM's own ordinary, disclosed
    risk/opportunity profile -- there is no unresolved acute shock, confirmed litigation, or structural
    change comparable to distinctive situations found elsewhere in this batch. This is the expected, default
    operating picture for this holding.
