economic_role:
  economic_system_ref: 'other: Waste & Environmental Services'
  company_role: waste collection, landfill disposal, transfer, and recycling services
  role_basis: WM operates North America's largest waste-services network (~262 landfill sites, 339 transfer
    stations, 105 recycling facilities, 413 collection operations serving 20M+ customers), with FY2025
    revenue of $25.2B from Collection, Landfill, Transfer, Recycling, and a growing Renewable Energy/Healthcare
    Solutions category; none of the five listed economic-system categories describes this core waste/environmental-services
    function.
capital_priority:
  status: maintain_current_weight
  comparator_set:
  - RSG
  - WCN
  - CWST
  - GFL
  rationale: The evidence describes a structurally moated core business (landfill permitting described
    as practically impossible to newly obtain in most jurisdictions, making the existing network a scarce
    asset base), diversified and growing revenue, and an exceptional capital-return record (23rd consecutive
    year of dividend increases, a new $3B buyback authorization). Disclosed risks -- Stericycle integration
    friction now management-characterized as resolved, commodity-price sensitivity in recycling, and an
    industry-wide PFAS liability overhang without a WM-specific reserve figure found -- are real but appear
    to be ordinary-course monitoring items rather than a distinctive thesis-altering signal in this evidence
    set. Nothing here surfaces an unusually strong or weak deviation from the company's established profile
    that would argue for elevating scrutiny beyond normal review cadence.
