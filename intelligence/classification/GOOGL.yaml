  rationale: A final judgment was entered in the search-distribution antitrust case in December 2025,
    with both Alphabet and the DOJ/states now appealing, while the separate ad-tech case's April 2025
    liability finding is proceeding toward remedies that Alphabet's own filing says could include structural
    remedies materially affecting the business -- a materially different risk category than a fine or
    behavioral commitment. This concrete legal escalation coincides with capital expenditure more than
    doubling year-over-year in the same quarter Alphabet issued $31.1B of new senior notes, with FY2026
    capex guidance reportedly raised further (secondary-sourced, unverified) to $205B. Together these
    represent a specific, evidence-based departure from Alphabet's ordinary disclosed profile warranting
    explicit reviewer reconsideration rather than routine monitoring.
