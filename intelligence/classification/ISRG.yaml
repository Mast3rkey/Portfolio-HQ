  company_role: robotic-assisted surgical systems manufacturer (capital equipment plus recurring instruments/service)
  role_basis: Intuitive Surgical supplies the da Vinci and Ion robotic-assisted surgical platforms through
    a model combining systems sales with recurring, procedure-linked instruments/accessories and service
    revenue, with Q2 2026 systems, instrument, and service revenue all growing at comparable double-digit
    rates and installed base/procedure counts both expanding.
