schema_version: '1.0'
ticker: ISRG
economic_role:
  economic_system_ref: Healthcare & Life Sciences
  company_role: robotic-assisted surgical systems manufacturer (capital equipment plus recurring instruments/service)
  role_basis: Intuitive Surgical supplies the da Vinci and Ion robotic-assisted surgical platforms through
    a model combining systems sales with recurring, procedure-linked instruments/accessories and service
    revenue, with Q2 2026 systems, instrument, and service revenue all growing at comparable double-digit
    rates and installed base/procedure counts both expanding.
capital_priority:
  status: case_for_review
  comparator_set:
  - Medtronic
  - Johnson & Johnson (MedTech)
  - Stryker Corporation
  rationale: 'Since the prior review, robotic-surgery competitive entry has moved from a disclosed risk-factor
    category to realized fact: Medtronic''s Hugo system reached FDA clearance and completed its first
    U.S. commercial procedure in February 2026, and Johnson & Johnson''s OTTAVA progressed through a pivotal
    clinical study to reported FDA De Novo market authorization on 2026-07-22 (secondary-sourced), becoming
    the first table-integrated soft-tissue robotic system reported to receive such clearance for a named
    list of general-surgery procedures. The record''s own narrative characterizes this shift as the competitive
    backdrop becoming ''concrete rather than hypothetical,'' a change in kind from ordinary disclosed
    competitive risk, even though Intuitive''s own Q2 2026 results show no observable deceleration yet
    -- this concrete regulatory-cleared entry by two major competitors into ISRG''s core market warrants
    explicit reviewer reconsideration.'
  assessed_date: '2026-08-05'
  assessing_record: null
