  - JNJ
  - SYK
  - ZBH
  rationale: 'The evidence shows continued strong, broad-based business-quality signals -- recurring revenue
    growing at rates comparable to systems sales, and double-digit installed-base and procedure growth
    -- alongside a material, newly concrete competitive-entry development: Medtronic''s Hugo completed
    its first U.S. commercial procedure and Johnson & Johnson''s OTTAVA reportedly received FDA De Novo
    market authorization, moving competitive risk from a disclosed risk-factor category to an observed
    market event since the prior review. The filing itself notes no observable deceleration attributable
    to either competitor yet, but the shift from hypothetical to concrete competitive entry in a moat-dependent
    business is precisely the kind of development a reviewer should specifically weigh going forward.'
