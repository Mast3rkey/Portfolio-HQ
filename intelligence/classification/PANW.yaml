  rationale: 'The evidence shows continued scale in the platformization thesis (NGS ARR and RPO growth,
    strong TTM adjusted free-cash-flow margin of 38.5%) alongside several disclosed items a reviewer should
    specifically weigh: a $1.293 billion working-capital deficit and $1.1 billion of remaining CyberArk
