    but no separately disclosed standalone revenue or ARR, and that the company''s historical billings
    metric has been absent from recent filings without confirmed discontinuation. These disclosed comparability
    and financial-quality gaps, combined with direct competitive overlap versus CrowdStrike, warrant explicit
    reviewer attention rather than routine monitoring.'
