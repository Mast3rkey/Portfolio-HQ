  rationale: 'Microsoft''s evidence shows continued strong operating performance (FY2026 Q4 revenue +17.8%
    YoY, Azure accelerating to 43% YoY and reportedly crossing $100B annualized) alongside ordinary, already-disclosed
    risk categories: AI-capex-driven cloud-margin pressure, Azure capacity constraints, OpenAI relationship
    concentration (now partially diversified by a newly reported Anthropic investment), and a preliminary,
    non-final EU DMA cloud-gatekeeper designation. None of these represents a marked departure from Microsoft''s
    own established profile as a fast-growing, AI-capex-heavy hyperscaler; each is best treated as ordinary
    monitored risk rather than a distinctive trigger.'
