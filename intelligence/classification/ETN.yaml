economic_role:
  economic_system_ref: Energy & Electrification
  company_role: Electrical-equipment and power-management supplier providing switchgear, transformers,
    and electrical distribution infrastructure -- including data-center liquid cooling -- that forms the
    physical power/electrification layer for utility, industrial, and AI-driven data-center demand.
  role_basis: Eaton's Electrical Americas and Electrical Global segments manufacture switchgear and transformers
    subject to UL 891/IEC 61439 certification, with lead times reflecting acute grid/electrification capacity
    constraints, and the FY2025-agreed, 2026-03-12-completed Boyd Thermal acquisition (~$9.5B, concentrated
    in liquid-cooling equipment for hyperscale/AI data centers) directly extends this electrification
    role into data-center thermal/power infrastructure, per Eaton's FY2025 Form 10-K and Q1 2026 results
    release.
