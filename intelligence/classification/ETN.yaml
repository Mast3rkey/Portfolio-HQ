  rationale: 'The evidence shows a distinctive, regulator/lead-time-protected moat and a large, accelerating
    electrical backlog, an unusually strong quality signal. It also discloses several concrete, dated
    developments worth specific reviewer attention: a disputed margin-quality thesis (management''s ''temporary''
    framing versus a named analyst''s structural-decline estimate), a single acquisition (Boyd Thermal)
    representing roughly a third of FY2025 revenue in deal value and concentrated in one growth thesis,
    and a more complex-than-expected Reverse Morris Trust separation of the Vehicle/eMobility businesses
    with Dana Incorporated. These combine a strong exposure story with concrete, unresolved execution
    and concentration questions.'
