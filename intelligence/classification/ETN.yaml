  rationale: 'Eaton''s evidence discloses two concrete, fundamental structural developments: a definitive
    Reverse Morris Trust combination of its Vehicle+eMobility Mobility Group with Dana Incorporated (a
    materially more complex transaction than a standalone spin-off, carrying cross-company integration,
    governance, and shareholder-approval/regulatory-clearance contingency), and the approximately $9.5B
    Boyd Thermal acquisition -- Eaton''s largest deal since 2012, concentrated entirely in a single data-center-liquid-cooling
    thesis. A named analyst (UBS) has also publicly disputed management''s characterization of Q1 2026
    margin contraction as temporary, downgrading the stock. These are concrete, dated, structural events
    distinct from Eaton''s ordinary industrial-cyclicality risk profile and warrant a reviewer''s fresh
    look.'
