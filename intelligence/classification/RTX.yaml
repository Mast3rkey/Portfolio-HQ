  company_role: aerospace/defense
  role_basis: RTX operates through three segments -- Collins Aerospace (avionics/aircraft systems), Pratt
    & Whitney (commercial and military engines, including the sole-source F135 for the F-35), and Raytheon
    (defense/missile systems) -- with FY2025 consolidated net sales of $88,603 million and roughly 52%
    government-related revenue, a role distinct from any of the five listed economic-system categories.
capital_priority:
  status: case_for_review
  comparator_set:
  - LMT
  - NOC
  - GD
  - LHX
  - BA
  rationale: RTX's own FY2025 Form 10-K discloses a newly enacted (January 7, 2026) Executive Order empowering
    the 'Secretary of War' to potentially restrict RTX's ability to pay dividends or repurchase stock
    based on a government determination that RTX has underperformed on U.S. government contract execution
    -- an unusual, recently-disclosed political risk directly targeting capital-return capacity, not generic
    risk-factor boilerplate. This sits alongside the still-open, multi-year Pratt & Whitney GTF powder-metal
    matter (an ongoing SEC investigation and appealed securities litigation) and a buyback pace that has
    collapsed to near zero even as cash generation and the balance sheet improved. This combination of
    a novel, capital-return-specific regulatory risk and an unresolved multi-year liability is distinctive
    enough to warrant a reviewer's fresh look.
