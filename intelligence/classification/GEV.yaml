  - VRT
  - ABB
  rationale: The evidence shows a distinctive, rapidly accelerating demand signal directly tied to data-center/AI-driven
    electrification build-out -- data-center equipment orders more than doubling year-over-year and total
    backlog growing by double-digit billions sequentially, with management twice raising FY2026 guidance
    and accelerating its multi-year backlog target by a full year. This is weighed against a disclosed,
    quantified weakness in the Wind segment (widening EBITDA losses, maintained ~$400M full-year loss
    guidance) and tariff exposure, so the combination of a differentiated growth exposure and a concrete
    offsetting segment weakness is worth a reviewer's specific attention.
