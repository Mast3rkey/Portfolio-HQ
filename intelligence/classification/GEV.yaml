  role_basis: GEV's backlog spans gas power, electrification, and grid equipment, growing to $176 billion
    by Q2 2026 with gas-equipment backlog/slot-reservation agreements at 116 GW, and the Electrification
    segment recorded over $5 billion of first-half-2026 data-center-specific equipment orders, evidencing
    a core role supplying physical power and grid infrastructure.
