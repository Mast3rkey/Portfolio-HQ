  rationale: 'The evidence documents two large, currently unresolved execution questions that did not
    both exist in their current form previously: Neutron has slipped twice (most recently after a January
    2026 Stage-1 tank rupture) with no first flight as of this record''s date and no single confirmed
    technical milestone identified, and a transformative ~$8 billion pending acquisition of Iridium (roughly
    an order of magnitude larger than any prior RKLB deal) requiring 2027 closing, shareholder approval,
    and spectrum-regulatory clearance. These sit alongside continued strong revenue growth (+63.5% YoY)
    and a substantial, evidenced national-security contract base. The combination of unusually consequential,
    disclosed execution/integration risk and a large concurrent CEO insider stock sale is exactly the
    kind of evidence a reviewer should weigh explicitly; this record''s own weak source-verification posture
    (network-blocked WebFetch, several unresolved figure conflicts) further argues for closer review rather
    than routine monitoring.'
