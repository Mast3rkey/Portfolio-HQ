schema_version: '1.0'
ticker: RKLB
economic_role:
  economic_system_ref: 'other: Space Launch & Satellite Infrastructure'
  company_role: Vertically integrated space-launch provider and satellite/spacecraft-component manufacturer,
    expanding toward satellite-communications network operation via a pending acquisition.
  role_basis: RKLB generates revenue through two segments -- Launch Services (Electron, operational since
    2018, plus Neutron in development; Q1 2026 revenue $63.7M) and Space Systems (satellite components/subsystems/spacecraft
    manufacturing built via acquisition; Q1 2026 revenue $136.7M) -- and has signed a definitive agreement
    to acquire Iridium's operating satellite-communications network and licensed spectrum, evidencing
    a shift from a pure launch/manufacturing role toward space-based infrastructure operation.
capital_priority:
  status: case_for_review
  comparator_set:
  - ASTS
  - IRDM
  - FLY
  rationale: RKLB entered a definitive agreement to acquire Iridium (~$8B enterprise value, $54.00/share
    cash-and-stock), a fundamental structural transaction combining launch/spacecraft manufacturing with
    an operating satellite-communications network and licensed spectrum -- by far the largest and most
    consequential disclosed fact in this record, financed via a $3.6B bridge loan and a newly-registered
    $3B ATM program. Concurrently, the CEO sold approximately $286.4 million of stock over three days
    under a 10b5-1 plan, and RKLB stock reportedly surrendered roughly a third of its post-announcement
    gain within a month amid dilution and Neutron-delay concerns, both distinctive, recently-realized
    developments unresolved as of the evidence date. This combination of a major pending acquisition,
    material CEO insider selling, and an unresolved Neutron first-flight schedule (following a January
    2026 tank-rupture setback) together constitute a distinctive circumstance warranting explicit reconsideration,
    separate from RKLB's ordinary launch-market competitive and customer-concentration risk.
