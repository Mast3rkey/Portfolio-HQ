  economic_system_ref: Digital Platforms & Enterprise Software
  company_role: EDA software / semiconductor design software
  role_basis: Synopsys is one of three players controlling an estimated ~78%+ of the global EDA market
    (~31% share) via end-to-end electronic design automation tool suites, and post-Ansys markets itself
    as offering 'the first vertically integrated device-to-system design stack,' fusing chip-level EDA
    software with Ansys's multiphysics simulation software.
capital_priority:
  status: case_for_review
  comparator_set:
  - CDNS
  - ADSK
  - PTC
  - SIEGY
  rationale: 'The evidence shows genuinely strong and accelerating underlying execution (record FY2025
    revenue, first-ever 83% gross margin, a $2B Nvidia strategic investment) set against a cluster of
    material, still-unresolved disclosed conditions worth a reviewer''s attention: an extreme and structurally
    persistent GAAP/non-GAAP earnings gap tied to Ansys purchase-accounting amortization, a severe September
    2025 credibility event (~35% one-day stock drop, guidance cut, workforce reduction) with ongoing securities
    litigation, substantial post-acquisition leverage still above the company''s own target, and a disclosed
    activist-investor stake pushing for portfolio changes. The combination of record operating scale with
    an unusually large earnings-normalization and litigation overhang is a distinctive pattern meriting
    explicit reconsideration rather than routine treatment.'
