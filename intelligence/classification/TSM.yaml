schema_version: '1.0'
ticker: TSM
economic_role:
  economic_system_ref: AI & Compute Infrastructure
  company_role: foundry / advanced-node semiconductor manufacturing
  role_basis: TSM is described as the world's largest dedicated pure-play foundry manufacturing chips
    designed by fabless and IDM customers, with High-Performance Computing at 66% of Q2 2026 revenue and
    advanced (7nm-and-below) process technology at 77% of wafer revenue, alongside management's explicit
    attribution of the FY2026 capex raise to AI/HPC/agentic-AI demand.
capital_priority:
  status: maintain_current_weight
  comparator_set:
  - Samsung Foundry
  - GlobalFoundries
  - United Microelectronics (UMC)
  - Intel Foundry
  rationale: Q2 2026 results and raised full-year guidance reflect continued execution within TSM's established
    leading-edge foundry profile, with disclosed customer-concentration, Taiwan geopolitical, Nanjing
    export-license, natural-disaster, and capital-intensity risks all continuing under existing 'monitoring'
    status rather than escalating in kind or degree. No development in the evidence, including the enlarged
    Arizona investment commitment, represents a structural change distinct from TSM's already-disclosed
    overseas-fab execution risk. The evidence supports treating TSM's current posture as operating within
    its ordinary, disclosed risk/opportunity profile.
  assessed_date: '2026-08-05'
  assessing_record: null
