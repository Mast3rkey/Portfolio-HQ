economic_role:
  economic_system_ref: AI & Compute Infrastructure
  company_role: foundry / advanced-node semiconductor manufacturing
  role_basis: TSM is described as the world's largest dedicated pure-play foundry manufacturing chips
    designed by fabless and IDM customers, with High-Performance Computing at 66% of Q2 2026 revenue and
    advanced (7nm-and-below) process technology at 77% of wafer revenue, alongside management's explicit
    attribution of the FY2026 capex raise to AI/HPC/agentic-AI demand.
capital_priority:
  status: case_for_review
  comparator_set:
  - INTC
  - GFS
  - UMC
  rationale: 'The evidence shows an unusually strong, currently-realized business-quality signal: record
    margins (67.7% gross in Q2 2026), 36% YoY revenue growth, a raised full-year growth outlook, and a
    differentiated leading-edge technology roadmap (N2/N2P/A16) that management describes as advanced-packaging-capacity-constrained.
    This is counterbalanced by concrete, quantified disclosed risks -- top-two customer concentration
    (19%/17% of 2025 revenue), an unresolved Nanjing export-license renewal, recurring Taiwan natural-disaster
    losses, and capital intensity (~39% of Q2 revenue as capex) -- a combination of differentiated exposure
    and material disclosed risk that warrants specific reviewer attention rather than passive treatment.'
