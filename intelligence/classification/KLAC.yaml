economic_role:
  economic_system_ref: AI & Compute Infrastructure
  company_role: semiconductor process-control / inspection and metrology equipment
  role_basis: KLA makes process control, defect inspection, and metrology equipment used across wafer
    fabrication (distinct from lithography/deposition/etch peers), with Semiconductor Process Control
    representing 90.3% of Q3 FY2026 revenue and record FY2025 revenue of $12.16B supporting the broader
    semiconductor-capex buildout that underlies AI/compute hardware production.
capital_priority:
  status: maintain_current_weight
  comparator_set:
  - AMAT
  - LRCX
  - ASML
  - ONTO
  rationale: KLA's evidence shows a well-established, highly profitable process-control business with
    a normal cyclicality profile (a confirmed FY2024 down year followed by a strong FY2025 rebound), a
    China revenue trend and export-control exposure that has been evolving for several years as a recurring,
    disclosed industry feature rather than a new shock, and a recent post-earnings share-price decline
    attributed to gross-margin mix concerns despite beating estimates. None of these developments represents
    a structural change in kind or degree from KLA's own established profile -- there is no acquisition,
    litigation, or leadership change in evidence. This falls within KLA's ordinary, disclosed risk/opportunity
    baseline.
