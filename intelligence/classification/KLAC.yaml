  rationale: The evidence shows the highest gross margin (62.3%) of a comparable equipment-sector batch,
    a 17-consecutive-year dividend growth record, and the most specific backlog-conversion disclosure
    found in this evidence set (71-76% within 12 months) alongside a large recent stock split and dividend
    hike -- distinctive business-quality signals. This sits alongside a real, primary-verified, material
    China-revenue decline (43% FY2024 to 33% FY2025) driven by tightening export controls, a second dated
    2026 export-control shock (Hua Hong), and a confirmed FY2024 down year showing the business is not
    fully acyclical -- a combination of strong quality and material geopolitical/cyclical exposure worth
    a closer look.
