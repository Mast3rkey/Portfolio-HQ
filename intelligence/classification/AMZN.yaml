  rationale: Q1/Q2 2026 evidence shows AWS as a disproportionate and accelerating profit engine (Q2 AWS
    revenue +36.7% YoY, described as its fastest pace in 18 quarters) alongside diversified retail/advertising
    revenue, near-doubled capex funded partly by new senior-note issuance, and ordinary-course FTC antitrust
    litigation plus a preliminary EU DMA gatekeeper finding. None of these developments represents a marked
    change from Amazon's already-established profile as a capital-intensive, AWS-driven business operating
    under standing antitrust scrutiny; each is consistent with the company's ordinary, disclosed risk/opportunity
    profile rather than a distinctive break from it.
