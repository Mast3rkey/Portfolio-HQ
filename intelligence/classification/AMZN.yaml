  role_basis: Q1 2026 segment data shows AWS generated $14.161B of operating income -- more than the combined
    North America and International retail segments ($9.691B) -- on $37.587B of AWS revenue growing 28%
    YoY, making cloud infrastructure the dominant profit driver layered on top of the online-retail/marketplace/advertising
    business.
