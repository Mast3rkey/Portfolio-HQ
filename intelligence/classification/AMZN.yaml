  rationale: AWS's disproportionate share of consolidated operating income, combined with capex that nearly
    doubled YoY ($43.2B vs $24.3B) and $121.8B of unsecured notes outstanding, indicates a business whose
    profit engine is increasingly capital-intensive rather than capital-light. The file also documents
