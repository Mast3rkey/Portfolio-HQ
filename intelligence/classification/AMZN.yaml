    chip-delivery risk, plus active FTC/state antitrust litigation and a preliminary EU DMA cloud-gatekeeper
    finding against AWS specifically. These are distinctive, evolving exposures -- both upside optionality
    and disclosed risk -- that merit closer reviewer attention rather than routine treatment.
