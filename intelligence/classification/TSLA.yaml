  rationale: 'The evidence shows record operating scale (deliveries, storage deployments, revenue) sitting
    alongside a cluster of material, currently unresolved conditions: a structural collapse in regulatory-credit
    revenue, simultaneous automotive and energy margin compression with a swing to negative free cash
    flow against sharply rising capex, a live NHTSA engineering analysis covering ~3.2 million vehicles,
    a confirmed structural inability of roughly 4 million HW3 vehicles to ever run unsupervised FSD, near-zero
    disclosed Optimus production against repeated schedule slippage, and declining regional share in Europe
    and China. The company''s own governance structure (a ~$1 trillion CEO pay package) makes explicit
    that much of the forward valuation case rests on largely unproven autonomy, robotics, and energy milestones
    rather than current auto/energy earnings -- a combination of scale strength and concentrated, disclosed
    risk that merits explicit reviewer attention.'
