  role_basis: Tesla operates Automotive (vehicle sales, regulatory credits, leasing), Energy Generation
    & Storage (Megapack/Powerwall, with a Brookshire Texas Megafactory targeting 50 GWh/year capacity),
    and Services & Other segments, reporting Q2 2026 record deliveries (480,126 vehicles) and record trailing-twelve-month
    energy storage deployments (13.5 GWh).
