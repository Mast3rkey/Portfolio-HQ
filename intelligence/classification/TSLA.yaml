  role_basis: Evidence shows Tesla operating Automotive and Energy Generation & Storage segments at record
    scale (480,126 Q2 2026 deliveries, 13.5 GWh storage deployments) alongside the largest North American
    fast-charging network and expanding Megafactory capacity, plus emerging robotaxi/FSD and Optimus robotics
    programs layered on the core electrification business.
