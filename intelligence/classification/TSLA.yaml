  rationale: 'Tesla''s evidence shows several concrete, unresolved developments materially different from
    ordinary disclosed risk: a live NHTSA engineering analysis (EA26002) covering approximately 3.2 million
    vehicles that is the step preceding a potential recall, a structural collapse in regulatory-credit
    revenue (down 67% YoY) following expiration of federal EV incentives, and a swing to negative free
    cash flow alongside sharp margin compression in the most recent quarter. Additional distinctive factors
    include a confirmed structural limitation permanently freezing roughly 4 million HW3 vehicles at Level-2
    capability, and Optimus production remaining near zero against repeated reveal delays and management''s
    own admission that the 2026 production rate is ''impossible to predict.'' Together these represent
    a company whose forward narrative rests heavily on unproven autonomy and robotics milestones amid
    a currently deteriorating core-business margin and regulatory picture, warranting explicit reviewer
    reconsideration rather than routine monitoring.'
