  role_basis: Visa operates VisaNet, providing authorization, clearing, and settlement, and explicitly
    states it is not a financial institution and does not issue cards or extend credit, distinguishing
    its network-toll-road role from a bank's credit/deposit business; FY2025 net revenue was $40.0B across
    service, data-processing, international-transaction, and other categories.
