  rationale: 'Visa''s evidence shows continued double-digit growth (fiscal Q2 2026 net revenue +17% YoY,
    cross-border volume +12%) alongside already-known, ongoing risk categories: the DOJ debit-network
    monopolization case (filed 2024, motion to dismiss denied mid-2025 -- an unresolved but not newly-arising
    procedural status), disclosed interchange litigation/escrow, and client-incentive cost pressure now
    corrected to roughly 28% of pre-incentive gross revenue. A newly disclosed 7% workforce reduction
    and $563M restructuring charge is a real but ordinary cost-realignment action reallocating investment
    toward existing growth priorities, not a structural change to Visa''s network-toll-road business model.
    Nothing here rises above Visa''s own established, ongoing risk profile.'
