ticker: GNRC
economic_role:
  economic_system_ref: Energy & Electrification
  company_role: backup power generation equipment (residential standby generators and commercial/industrial/data-center
    backup power)
  role_basis: Generac holds an estimated roughly 75-80% share of the North American residential standby-generator
    market and has pivoted its Commercial & Industrial segment toward hyperscale data-center backup power,
    disclosing a $1.6 billion data-center order backlog at Q2 2026 (up from $600 million) and two multi-year
    hyperscale supply agreements.
capital_priority:
  status: case_for_review
  comparator_set:
  - CMI
  - CAT
  - ETN
  - VRT
  rationale: 'GNRC disclosed a concrete, dollar-quantified strategic inflection: its C&I data-center order
    backlog scaled from $600 million to $1.6 billion within roughly 90 days, backed by two named multi-year
    hyperscale supply agreements (the second, signed late June 2026, expected to be at least as large
    as the first ~$700 million commitment) that management now treats as load-bearing to its 2028 revenue/EBITDA
    targets. This is layered onto a business whose FY2025 net income nearly halved and posted a Q4 2025
    net loss because of a $104.5 million litigation-settlement provision tied to a 2023 product-liability
    event that catastrophically injured six workers -- a severe, concentrated, dollar-material event,
    not merely a disclosed possibility. Together, a newly load-bearing growth leg and a realized, large
    P&L-impacting liability event represent a materially different circumstance from GNRC''s ordinary
    storm/outage-driven cyclicality risk, worth a reviewer''s explicit reconsideration.'
