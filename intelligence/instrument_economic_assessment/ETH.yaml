macro_behavioral_characterization:
  historical_equity_market_drawdown_behavior:
    behavior_category: historically_mixed
    rationale: Sourced material covering two major historical episodes shows a genuinely mixed pattern,
      not a clean uncorrelated or negatively correlated relationship. During the acute panic phase of the
      March 2020 "Black Thursday" episode, ETH's own price fell sharply within a single 24-hour window --
      sourced material discloses the reported single-day decline inconsistently (one figure near a third
      of value, another figure near half), disclosed here as a genuine reporting range rather than
      resolved to one number -- occurring the same day broad equity indices sold off sharply on the same
      COVID-driven liquidity shock. During the 2022 decline, ETH's own price fell by a materially larger
      percentage than the S&P 500 over the same broad window, in a period sourced material attributes
      partly to the same Federal Reserve rate-hike macro catalyst affecting equities and partly to
      crypto-specific contagion events (the Terra/LUNA ecosystem collapse and related counterparty
      failures) that have no clean equity-market analogue. The pattern across both episodes is initial
      co-decline during acute macro-liquidity panics, with the 2022 episode's own magnitude substantially
      amplified by idiosyncratic, ETH-specific and crypto-sector-specific contagion factors layered on
      top of the shared macro driver -- not a reliable, uniform relationship attributable to equity-market
      correlation alone.
    single_asset_disclosure: This finding characterizes ETH's own historical price behavior in isolation
      during past equity-market drawdown episodes -- a single-asset, historical characterization only.
      It does not compute, constitute, imply, or substitute for a whole-portfolio diversification-benefit
      or correlation finding specific to Portfolio-HQ's own current holdings; that remains the separate,
      still-forced-abstention job of the overlap model's defensive_offset_interface dimension. It also
      makes no claim, and is not intended to be read as making any claim, about ETH's own relationship to
      BTC or SOL specifically; any cross-coin relationship remains a separate, future, bounded,
      pre-registered research charter's own unaddressed question.
  historical_inflation_sensitivity_narrative:
    sensitivity_category: historically_weakly_associated
    rationale: Sourced material finds ETH carries a materially weaker, less-established inflation-hedge
      narrative than BTC's own frequently-cited "digital gold" framing. Sourced financial-press material
      characterizes ETH's own price behavior as demand driven chiefly by protocol usage -- decentralized-finance
      activity, non-fungible-token activity, and broader smart-contract adoption -- rather than by a
      store-of-value or scarcity-driven investment thesis of the kind cited for BTC specifically. Sourced
      academic material covering both major cryptocurrencies together finds limited and inconsistent
      backing for either as a reliable inflation hedge, with ETH specifically not carrying an equivalent,
      widely-cited narrative of its own the way BTC does. This record treats the narrative's own comparative
      weakness (relative to BTC, not an absolute absence of any inflation-related commentary) as the basis
      for this determination rather than treating a genuinely absent narrative as automatic grounds for
      abstention.
