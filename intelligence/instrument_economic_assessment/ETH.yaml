  thesis_uncertainty_statement: ETH's own referenced crypto classification record already discloses that
    ethereum.org was blocked by this environment's network egress policy; this record's own two findings
    rest entirely on further WebSearch-aggregated secondary sources -- financial-press retrospectives and
    academic-literature summaries -- none of which was directly inspected as a primary document. The
    reported single-day March-2020 price-decline figure is disclosed as a genuine range across sources
    rather than resolved to a single number. The drawdown-behavior finding also discloses that the 2022
    episode's own magnitude is confounded by crypto-sector-specific contagion events layered on top of a
    shared macro driver, rather than isolating a clean equity-correlation signal.
