  rationale: VWO's own sealed ETF classification record discloses its expense ratio as a structural
    fact (consumed here by reference only, never restated as a bare figure). Sourced comparison against
    two other major emerging-market index funds in VWO's own category -- iShares Core MSCI Emerging
    Markets ETF and Schwab Emerging Markets Equity ETF -- found VWO's own disclosed cost figure is lower
    than the first named peer, and matches the second named peer's own cost figure following that peer's
    own disclosed mid-2026 fee reduction. VWO's own cost is therefore neither meaningfully elevated nor
    distinctly the cheapest of the category peers actually located -- it sits at the low end of the
    category alongside its cheapest same-category peer, rather than standing out in either direction.
    This is a categorical cost comparison against same-category peers, never a numeric cost-savings or
    hurdle-rate calculation.
