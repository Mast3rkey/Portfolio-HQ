    solana.com was blocked by this environment's network egress policy; this record's own two findings
    rest entirely on further WebSearch-aggregated secondary sources -- financial-press retrospectives and
    industry-commentary articles -- none of which was directly inspected as a primary document. The
    drawdown-behavior sub-field abstains outright rather than forcing a value onto evidence this session's
    own research found genuinely confounded by idiosyncratic, SOL-specific factors; the inflation-sensitivity
    sub-field, by contrast, rests on adequately sourced, mutually reinforcing material and reaches a
    determined finding.
