macro_behavioral_characterization:
  historical_equity_market_drawdown_behavior:
    behavior_category: unable_to_determine
    rationale: SOL's own mainnet beta launched days after the March 2020 acute equity-drawdown episode
      (the one clean, widely-sourced liquidity-panic reference point available for BTC and ETH), leaving
      no meaningful liquid-market price data for SOL during that specific episode. For the 2022 episode,
      sourced material attributes SOL's own decline overwhelmingly to idiosyncratic, SOL-specific factors
      -- direct balance-sheet exposure to the FTX/Alameda Research collapse (which held a large SOL
      position and triggered forced liquidations) and separately disclosed network-outage/technical
      reliability issues during the same year -- rather than to a clean, equity-market-drawdown-driven
      signal comparable to what sourced material establishes for BTC and ETH. SOL's own reported 2022
      decline was also reported as substantially deeper than either BTC's or ETH's own reported decline
      over the same broad window, consistent with a dominant idiosyncratic driver rather than a shared
      macro one. Sourced material also discloses that broader network-usage metrics for SOL were reported
      reaching or approaching multi-year highs during a similar general period even as trading-volume
      on a single major venue fell sharply, a further sign that SOL's own historical episodes do not
      resolve into one clean equity-drawdown-behavior signal the way BTC's and ETH's do.
    single_asset_disclosure: This abstention concerns SOL's own single-asset historical price behavior
      only. It does not compute, constitute, imply, or substitute for a whole-portfolio diversification-benefit
      or correlation finding specific to Portfolio-HQ's own current holdings; that remains the separate,
      still-forced-abstention job of the overlap model's defensive_offset_interface dimension. It also
      makes no claim, and is not intended to be read as making any claim, about SOL's own relationship to
      BTC or ETH specifically; any cross-coin relationship remains a separate, future, bounded,
      pre-registered research charter's own unaddressed question.
    abstention_reason: No meaningful liquid-market price data exists for SOL during the March 2020 acute
      equity-drawdown episode (SOL's own mainnet beta launched only days afterward), and the one major
      subsequent drawdown episode located (2022) is confounded by dominant, disclosed, SOL-specific
      factors -- direct FTX/Alameda counterparty exposure and separately reported network-outage issues
      -- that make it impossible to honestly isolate a clean equity-market-drawdown-correlation signal
      for SOL specifically from the sourced material located. Forcing a categorical value here would
      misrepresent an idiosyncratic-risk-dominated episode as evidence of a general equity-drawdown
      relationship.
  historical_inflation_sensitivity_narrative:
    sensitivity_category: historically_weakly_associated
    rationale: Sourced material finds SOL carries essentially no established inflation-hedge or "digital
      gold" narrative of its own. Sourced industry commentary positions SOL explicitly as infrastructure
      for decentralized applications and transaction processing rather than as a store-of-value asset,
      in direct contrast to BTC's own widely-cited framing. Sourced material further discloses that SOL's
      own token-supply schedule remains net inflationary at the protocol level today (a disinflationary
      path toward a lower terminal rate, but not yet net-deflationary or fixed-supply), a structural
      property in tension with the scarcity premise an inflation-hedge narrative would typically rest on.
      This record treats the narrative's own clear, sourced absence -- not merely a comparative weakness
      relative to BTC, as with ETH's own determination -- as the basis for this determination, since
      unlike the drawdown-behavior sub-field above, adequate sourced evidence exists here to sustain a
      determined finding rather than an abstention.
