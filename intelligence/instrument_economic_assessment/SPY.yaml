cost_and_tracking_quality_economic_significance:
  significance_category: elevated_vs_category
  rationale: SPY's own sealed ETF classification record discloses its expense ratio as a structural
    fact (consumed here by reference only, never restated as a bare figure). Sourced comparison against
    the two other major, effectively identical S&P 500-tracking funds in SPY's own category -- Vanguard's
    S&P 500 ETF and iShares Core S&P 500 ETF -- found both of those peers charge a cost meaningfully
    lower than SPY's own disclosed figure, more than three times lower by one sourced comparison. The
    same sourced comparison also found SPY captures a smaller share of the underlying index's own upside
    than at least one of those two peers over three-, five-, and ten-year lookback periods, consistent
    with a materially higher-cost structure producing a measurable performance drag relative to
    same-category, same-benchmark peers. This is a categorical cost/tracking comparison against
    same-category peers, never a numeric cost-savings or hurdle-rate calculation.
