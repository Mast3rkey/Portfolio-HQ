  thesis_uncertainty_statement: This record's own peer-comparison finding rests entirely on WebSearch-aggregated
    secondary financial-press and fund-comparison material -- no primary issuer fact sheet, prospectus,
    or SEC filing for SPY or either of its two named peers was directly inspected, matching SPY's own
    sealed ETF classification record's disclosed primary-source-access limitation (this environment's
    network egress policy blocked ssga.com and sec.gov outright). The specific numeric cost differential
    and upside-capture figures located are not restated in this record's own free text under any
    circumstance (XASSET-0010's own zero-numeric-field rule, no carve-out) -- they informed the
    categorical determination only.
