        per TIER-0009 SS G.1(1): No conflict is possible between the sealed economic_role and current
        baseline policy, because current baseline policy (portfolio_role_ref, targets.yaml) carries no
        economic-function claim of its own to disagree with -- it is a stale tier label and a numeric
        weight, not a role description. The sealed record is treated as the corpus''s only economic-role
        finding for this ticker; nothing here is flagged as divergent or stale.'
      supporting_evidence:
      - intelligence/classification/WM.yaml (sealed economic_role.role_basis)
      - intelligence/reconciliation/MILESTONE7_BASELINE_RECONCILIATION.yaml (role_comparison, ticker=WM)
      later_governance_action: Milestone 9 review plus its own separate future governance decision before
        any portfolio_role_ref or economic-role-driven edit (TIER-0009 SS G.1(8)).
    tier_architecture:
      primary_status: review_warranted
      secondary_conditions:
      - unresolved_evidence
      - structural_measurement_gap
      rationale: 'Consistency check only, per TIER-0009 SS G.2(1): whether WM''s current tier/gate/portfolio_role_ref
        treatment (gated=true, next_gate defined) appears consistent with Milestone 7''s reconciled role_comparison
        and capital_priority_comparison evidence, reusing Milestone 7''s own ticker-level primary_disposition
        (divergence_requires_review) as the consistency signal. No new tier schema, threshold, category,
        or replacement architecture is proposed, evaluated, or implied here (TIER-0009 SS G.2(6)). Design
        note, addressing why this area deliberately reuses Milestone 7''s signal rather than computing
        an independently distinct one: for WM as a gated ticker, Milestone 7''s own capital_priority_comparison
        text is itself already a gate-consistency test -- it reasons directly from whether the gate''s
        own withholding posture and the sealed capital-priority finding point the same direction. Re-deriving
        ''is the current gate treatment consistent with reconciled evidence'' as a second, separate computation
        would necessarily reproduce that identical reasoning, not answer a distinct question -- the two
        TIER-0009-SS-G.2(7)-authorized evidence sources (gates.yaml/portfolio_role_ref state, and Milestone
        7''s own comparison text) do not contain a second, independent gate-consistency signal to draw
        on. Any attempt to manufacture one would require inventing new tier judgment, which SS G.2(6)
        prohibits outright.'
      supporting_evidence:
      - gates.yaml (ticker=WM)
      - intelligence/reconciliation/MILESTONE7_BASELINE_RECONCILIATION.yaml (role_comparison, capital_priority_comparison,
        ticker=WM)
