evidence:
  - claim: >
      AVGO's own Company Intelligence record carries a dedicated risk entry,
      "Foundry and advanced-packaging dependency": "Broadcom's semiconductor
      products (both merchant chips and custom AI silicon) rely on external
      foundry and advanced-packaging capacity -- industry-wide reporting
      places TSMC as the dominant advanced-node/advanced-packaging supplier
      to the AI-accelerator industry broadly, and this record's own TSM
      Company Intelligence record... independently documents TSMC
