  - stress_testing
evidence:
  - claim: >
      Constellation Energy Corporation (CEG) is party to a disclosed
      20-year Power Purchase Agreement (PPA) with Microsoft Corporation
      (MSFT), under which Microsoft is named as the offtake counterparty
      supporting the planned restart of CEG's 835 MW Crane Clean Energy
      Center nuclear generating asset, subject to regulatory and execution
      conditions.
    source: >
      intelligence/companies/CEG.yaml, claim CEG-C05 ("A 20-year power
      purchase agreement with Microsoft supports the planned restart of the
      835 MW Crane Clean Energy Center..."), itself citing Constellation
      Energy Corporation's 2025 Form 10-K (SEC accession
      0001868275-26-000032), Item 1, nuclear facilities, page 14.
    inspected_source_type: secondary
    source_date: "2026-02-24"
    effective_date: "2026-08-04"
    evidence_classification: inferred
    confidence: moderate
    materiality: high
    uncertainty: >
      This unit did not itself open Constellation's Form 10-K or any
      Microsoft-side primary source — it cites CEG.yaml's own already-vetted
      claim only, per this unit's explicit no-external-research boundary.
      The relationship is disclosed from CEG's side only: MSFT's own
      Company Intelligence record (intelligence/companies/MSFT.yaml and
      MSFT.md) does not independently name Constellation Energy, the Crane
      Clean Energy Center, or this PPA anywhere — confirmed by direct grep
      of both files during this unit's own preflight (2026-08-04). No named
      contract dollar value or percent-of-CEG-revenue figure was located in
      the existing evidence base. The underlying Crane restart is itself
      disclosed as subject to regulatory and execution conditions (CEG's
      own risk disclosure) — it is a planned restart, not an operating
      asset, so the demand this PPA represents is not yet realized as
      delivered power or recognized revenue. Per REL-0001 §E, this
      evidence_classification is deliberately kept at `inferred` rather
      than upgraded to `observed` specifically because independent
      confirmation from the counterparty's own record could not be located
      without new research this unit is not authorized to perform — this
      is a one-sided-sourcing discipline choice, not a claim that CEG's own
      disclosure is itself unreliable.
    disconfirming_evidence: null
