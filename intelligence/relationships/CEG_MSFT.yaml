direction: >
  CEG (subject) is customer-dependent on MSFT (object): Microsoft is
  disclosed as the named, contracted long-duration offtake counterparty
  under the Crane Clean Energy Center Power Purchase Agreement — a source
  of contracted demand/revenue for CEG, not the reverse. No MSFT-side
  dependency on CEG is asserted by this record.
relationship_status: current
