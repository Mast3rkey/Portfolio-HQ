evidence:
  - claim: >
      Amazon Web Services (AMZN) and Google Cloud (GOOGL) are two of the
      three companies this repository's own WS-0005 Milestone 3 Batch 5
      comparison artifact identifies as "duplicat[ing] each other to a real
      degree as public-cloud sellers competing for the same enterprise
      AI-infrastructure spending — this is the batch's clearest overlap"
      (the third being MSFT, recorded separately per REL-0001 §D's
      one-pairwise-record-per-pair rule). Within that overlap, the batch's
      own comparative synthesis distinguishes each company's competitive
      approach as genuinely different rather than three identical
      businesses measured three ways — AWS's differentiator is
      scale/profitability; Google Cloud's is TPU-based technical
      differentiation. Separately, AMZN and GOOGL are also both named,
      unverified, as customers of already-covered semis-cluster names
      (MRVL for AMZN's Trainium program, per BATCH3 §5, non-canonical; no
      canonical-pair supplier relationship between AMZN and GOOGL
      themselves was located) — disclosed here as related context per
      REL-0001 §H, not as evidence of this competitor claim.
    source: >
      intelligence/BATCH5_HYPERSCALER_AI_INFRASTRUCTURE_COMPARISON.md §7
      ("Genuine diversification versus duplicated exposure"): "MSFT, GOOGL,
      and AMZN duplicate each other to a real degree as public-cloud
      sellers competing for the same enterprise AI-infrastructure
      spending... Within the three cloud sellers, AWS's scale/profitability,
      Azure's enterprise-software-bundled distribution (via Microsoft
      365/Dynamics), and Google Cloud's TPU-based differentiation each
      represent a genuinely different competitive approach..."
    inspected_source_type: secondary
    source_date: "2026-07-26"
    effective_date: "2026-08-04"
    evidence_classification: inferred
    confidence: moderate
    materiality: high
    uncertainty: >
      This claim rests on BATCH5's own comparative synthesis of each
      company's already-vetted individual evidence, not on a single named
      risk-disclosure statement from either company's own record — this
      unit directly grepped intelligence/companies/AMZN.yaml and
      intelligence/companies/GOOGL.yaml this session for cross-references
      to each other and found no independent, separately-stated
      competitive-overlap claim in either company's own words — this is a
      lower evidentiary tier than a company's own named risk disclosure,
      per the inventory audit's own §4.6 classification of this exact
      finding. BATCH5 §7 itself also discloses an unresolved, separate
      question this record does not extend to: whether holding the
      demand-side hyperscalers alongside already-covered supply-side
      semis-cluster names (NVDA, TSM, AVGO, and others) constitutes
      genuine diversification or a duplicated bet on the same AI-capex
      cycle from two value-chain positions — explicitly named as "squarely
      a Milestone 4... question, which remains unauthorized" beyond this
      record's own narrow competitor claim. No price correlation of any
      kind was computed between AMZN and GOOGL.
    disconfirming_evidence: null
