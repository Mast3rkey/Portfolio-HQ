name: Run frozen whole-portfolio robustness study

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-whole-portfolio-robustness.yml"
      - "research/whole_portfolio_robustness/pre_registration.yaml"
      - "research/whole_portfolio_robustness/implementation_config.yaml"
      - "whole_portfolio_robustness_engine.py"
      - "whole_portfolio_robustness_runner.py"
      - "whole_portfolio_robustness_result_validator.py"
      - "whole_portfolio_sol_reacquisition.py"
      - "targets.yaml"
      - "gates.yaml"
      - "issuer_lookthrough.yaml"
      - "requirements.txt"
permissions:
  contents: read
  actions: read

concurrency:
  group: whole-portfolio-robustness-PORTFOLIO-ROBUSTNESS-0001
  cancel-in-progress: false

jobs:
  reacquire-frozen-input:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable study commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse execution after governed results are retained
        run: |
          if [ -e research/whole_portfolio_robustness/execution/output_manifest.json ]; then
            echo "PORTFOLIO-ROBUSTNESS-0001 already has retained results; use a new study ID." >&2
            exit 1
          fi

      - name: Refuse a new run after the persistent execution lock exists
        id: execution_lock
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_LOCK: whole-portfolio-execution-lock-PORTFOLIO-ROBUSTNESS-0001-${{ github.run_id }}
        run: |
          set -euo pipefail
          locks="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name | select(startswith("whole-portfolio-execution-lock-PORTFOLIO-ROBUSTNESS-0001-"))')"
          prior="$(printf '%s\n' "$locks" | grep -Fvx "$CURRENT_LOCK" || true)"
          if [ -n "$prior" ]; then
            echo "PORTFOLIO-ROBUSTNESS-0001 already has a persistent execution lock; use a new study ID." >&2
            exit 1
          fi
          if printf '%s\n' "$locks" | grep -Fxq "$CURRENT_LOCK"; then
            echo "current_lock_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "current_lock_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable execution-lock receipt
        if: steps.execution_lock.outputs.current_lock_exists != 'true'
        run: |
          mkdir -p artifacts/execution-lock
          printf '{"study_id":"PORTFOLIO-ROBUSTNESS-0001","run_id":"%s","head_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifacts/execution-lock/receipt.json

      - name: Persist once-only execution lock before holdout access
        if: steps.execution_lock.outputs.current_lock_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whole-portfolio-execution-lock-PORTFOLIO-ROBUSTNESS-0001-${{ github.run_id }}
          path: artifacts/execution-lock/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Reacquire exact frozen SOL evidence
        run: >-
          python whole_portfolio_sol_reacquisition.py
          --output-dir artifacts/frozen-sol

      - name: Retain exact input and acquisition provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-portfolio-sol-${{ github.sha }}
          path: artifacts/frozen-sol/
          if-no-files-found: error
          retention-days: 90

  validate-non-holdout:
    needs: reacquire-frozen-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout identical immutable study commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact frozen SOL input
        uses: actions/download-artifact@v4
        with:
          name: whole-portfolio-sol-${{ github.sha }}
          path: artifacts/frozen-sol

      - name: Install quarantined bytes at their frozen locator
        run: >-
          install -D -m 0644 artifacts/frozen-sol/SOL.json
          research/level1_sleeve_robustness/data/quarantine/selected/SOL.json

      - name: Validate only registered non-holdout windows
        env:
          PORTFOLIO_ROBUSTNESS_CODE_COMMIT: ${{ github.sha }}
        run: >-
          python whole_portfolio_robustness_runner.py validate
          --output-dir artifacts/non-holdout

      - name: Retain code-and-input-bound validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: whole-portfolio-validation-${{ github.sha }}
          path: artifacts/non-holdout/validation_receipt.json
          if-no-files-found: error
          retention-days: 90

  execute-holdout-once:
    needs: validate-non-holdout
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout identical immutable study commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact frozen inputs and validation receipt
        uses: actions/download-artifact@v4
        with:
          name: whole-portfolio-sol-${{ github.sha }}
          path: artifacts/frozen-sol

      - name: Download non-holdout validation receipt
        uses: actions/download-artifact@v4
        with:
          name: whole-portfolio-validation-${{ github.sha }}
          path: artifacts/non-holdout

      - name: Install quarantined bytes at their frozen locator
        run: >-
          install -D -m 0644 artifacts/frozen-sol/SOL.json
          research/level1_sleeve_robustness/data/quarantine/selected/SOL.json

      - name: Execute frozen holdout and all registered sensitivities
        env:
          PORTFOLIO_ROBUSTNESS_CODE_COMMIT: ${{ github.sha }}
        run: >-
          python whole_portfolio_robustness_runner.py execute
          --validation-receipt artifacts/non-holdout/validation_receipt.json
          --output-dir artifacts/results

      - name: Validate complete output contract and reproduced disposition
        env:
          PORTFOLIO_ROBUSTNESS_CODE_COMMIT: ${{ github.sha }}
        run: python whole_portfolio_robustness_result_validator.py artifacts/results

      - name: Retain complete governed results
        uses: actions/upload-artifact@v4
        with:
          name: whole-portfolio-results-${{ github.sha }}
          path: artifacts/results/
          if-no-files-found: error
          retention-days: 90
