name: Reacquire frozen SOL evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reacquire-frozen-sol.yml"
      - "whole_portfolio_sol_reacquisition.py"
      - "test_whole_portfolio_sol_reacquisition.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-sol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reacquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen study
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Reacquire and verify frozen SOL bytes
        run: >-
          python whole_portfolio_sol_reacquisition.py
          --output-dir artifacts/frozen-sol

      - name: Verify the complete network-free data gate
        run: |
          install -D -m 0644 \
            artifacts/frozen-sol/SOL.json \
            research/level1_sleeve_robustness/data/quarantine/selected/SOL.json
          python - <<'PY'
          import whole_portfolio_robustness_engine as engine

          freeze = engine.require_ready()
          assert freeze["gate"] == "READY"
          assert freeze["stage1"] == "UNARMED_AND_NOT_EXECUTABLE"
          print("whole-portfolio data gate: READY")
          PY

      - name: Retain candidate, raw pages, and verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-sol-evidence
          path: artifacts/frozen-sol/
          if-no-files-found: error
          retention-days: 30
