# operations/WORKSTREAMS.yaml — Portfolio-HQ workstream register (OPS-0001).
#
# This is an OPERATIONAL COORDINATION register, not an authority source. It
# preserves active priorities, planning intent, dependencies, blockers,
# verified milestones, and exact next actions across Claude Code sessions,
# ChatGPT conversations, branches, PRs, and research programs. It does not
# originate investment policy, governance authority, research authority,
# approval, or implementation authority, and cannot override the Constitution,
# an accepted governance decision, a frozen protocol, targets.yaml,
# holdings.yaml, production code/tests, or live GitHub state.
#
# Live repository and GitHub facts always supersede any cached field below —
# verify against the actual repo/PR/branch state before acting on anything
# here. Owning files (the governance decision, the protocol, the PR itself)
# control when a conflict arises; this register only points to them.
#
# See governance/decisions/OPS-0001-portfolio-hq-workstream-register.md for
# the full authority boundary, status/authorization rules, and scope.

