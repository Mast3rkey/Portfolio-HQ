  - id: WS-0007
    title: Repository-native Portfolio-HQ dashboard
    objective: >
      Provide one repository-native, read-only, local-only dashboard that
      renders this repository's own committed state — portfolio, targets,
      concentration and risk context, governance and provenance — from
      structured repository sources plus local git metadata, with prominent
      stale/missing/incomplete-state disclosure and explicit abstention
      wherever current allocation truth is unavailable. Presentation only:
      it derives no new portfolio fact, duplicates no governed calculation,
      and is never a source of truth. Distinct from WS-0002 Phase Two
      (OPS-0005), which is a stdout-only status layer expressly barred from
      producing a generated report file, and distinct from WS-0003, whose
      broader daily allocation-check user-experience planning intent
      remains deferred and unauthorized — this dashboard deliberately does
      not produce an allocation conclusion. Phase 2 ("Dashboard 2.0",
      OPS-0012) extends this same objective with a comprehensive visual and
      navigational redesign — modern, dark-first, calm, responsive — of the
      same read-only capability, built only from information the existing
      dashboard model already exposes; it changes no investment behavior
      and adds no new portfolio calculation.
