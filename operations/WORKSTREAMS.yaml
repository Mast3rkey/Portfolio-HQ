      - governance/decisions/OPS-0002-unified-core-planning-and-audit-gate.md
      - governance/decisions/OPS-0003-post-acceptance-workstream-priority-transition.md
      - governance/decisions/OPS-0004-ws0002-phase-one-audit-provenance-reconciliation.md
      - governance/decisions/OPS-0005-ws0002-phase-two-reactivation-authorization.md (Phase Two reactivation only)
    status: authorized
    priority: secondary
    dependencies: []
    authorized_scope: >
      Planning-and-audit phase (OPS-0002, complete via PR #143) plus exactly
      one bounded reactivation: Phase Two, a thin, consolidated, read-only,
      stdout-only status/report layer displaying facts already computed by
      allocate.py, margin_state.py, intelligence_report.py (public API only),
      and freshness_* — margin debt/buffer/risk-state/sync/staleness,
      market-data/earnings gaps, Intelligence freshness, and an explicit list
      of missing/stale/unavailable/degraded inputs. Authorized via exactly
      one implementation PR: one status/report module, its dedicated tests,
      and a minimal doc pointer only if convention requires one (OPS-0005 §3).
      No architecture-implementation authority beyond this bounded slice is
      granted — the blueprint's Layer 2 recommending architecture, Phase
      Three, and WS-0003 remain unauthorized.
    prohibited_scope: >
      Any allocator/targets/holdings/margin-data change; any conviction
      score, ranking, opportunity score, or aggregation; making Intelligence
      mathematically load-bearing to any allocator computation; any reverse
      import of the new status module into allocate.py, margin_state.py, or
      any Intelligence/freshness production code (one-directional read only,
      per OPS-0005 §4); any consumption of MARGIN-0005/research artifacts;
      any trial ledger, candidate freeze, runner, or results; any order;
      silently treating stale/missing data as current; replacing
      run_portfolio_check.sh or the default daily workflow; beginning Phase
      Three or WS-0003 work; any generated/tracked report file (stdout-only).
    milestones:
      - gate: planning-package-drafted
        description: >
          Draft WS-0002 planning baseline (docs/PORTFOLIO_HQ_UNIFIED_CORE_BLUEPRINT_V1.md)
          and its scoping decision (OPS-0002) filed together on a single
          draft, unmerged pull request.
        pr: 143
        status: drafted
        date: "2026-07-24"
      - gate: planning-package-audited-accepted-merged
        description: >
          Independent Fable audit against PR #143's exact head (F1 disposed
          via PR #142's closure; F2–F4 disposed by reconciliation commit
          263b64b; confirming Fable delta re-review passed with no
          architecture regression); principal explicitly accepted both
          conclusions; PR #143 merged to main. Completes the entire
          OPS-0002-authorized planning-and-audit phase.
        pr: 143
        status: merged
        date: "2026-07-24"
      - gate: phase-two-reactivation-authorized
        description: >
          OPS-0005 accepted: WS-0002 narrowly reactivated for exactly one
          bounded Phase Two implementation PR (read-only, stdout-only
          status/report layer), gated on Fable Audit Gate #2 (blueprint §8
          checkpoint 2, retained artifact per OPS-0004 §5) plus explicit
          principal acceptance before that PR may merge. No implementation
          has begun; no branch/PR opened yet for it.
        pr: null
        status: authorized
        date: "2026-07-25"
    evidence_refs:
