      Any architecture design implementation, allocator/targets/holdings/
      margin/Intelligence change, research execution, trade, or order.
      Implementation of anything the blueprint describes remains
      prohibited until (a) the independent audit is performed against the
      draft PR's head commit, (b) its findings are reconciled, and (c) the
      principal separately authorizes an implementation scope — all three,
      not any one alone.
    milestones:
      - milestone: PLAN-1
        description: >
          Unified-core blueprint (docs/PORTFOLIO_HQ_UNIFIED_CORE_BLUEPRINT_V1.md)
          and governing decision (OPS-0002) drafted, reverified against
          live repository state, and filed as a draft, unmerged pull
          request.
        pr: null
        status: draft_filed
        date: "2026-07-24"
      - milestone: AUDIT-1
        description: >
          First independent, high-capability audit (currently intended to
          be Fable) of the exact draft PR head implementing PLAN-1.
          Required before this planning package may be accepted or any
          WS-0002 implementation is authorized.
        pr: null
        status: pending
        date: null
    evidence_refs:
      - docs/PORTFOLIO_HQ_UNIFIED_CORE_BLUEPRINT_V1.md
      - governance/decisions/OPS-0002-unified-core-planning-and-audit-gate.md
    next_action: >
      Independent, high-capability audit (currently intended to be Fable)
      of the exact draft PR head implementing PLAN-1 above. Findings must
      be reconciled before this planning package may be accepted or any
      WS-0002 implementation authorized. This register entry does not
      itself authorize implementation — a separate future principal
      decision, made after audit reconciliation, is required before any
      architecture or code change begins. The draft PR's number/URL should
      be confirmed live and recorded in this entry's active_pr field by
      the next session that touches this register, per OPS-0001's
      verify-before-transition rule (not asserted here at authoring time,
      before the PR exists).
    completion_criteria: >
      This planning/audit-review phase of WS-0002 is complete when: (a)
      the independent audit is performed against the draft PR head and its
      findings are reconciled (accepted, corrected, or explicitly declined
      with stated reasoning); and (b) the principal explicitly accepts the
