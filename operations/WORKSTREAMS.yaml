      exhausted; no further S2 implementation PR may open without a charter
      amendment. Strictly within the 300-run trial ceiling. No simulation
      before the G1 data gate passed (confirmed merged) and none has run
      since — trial_ledger.jsonl and candidate_freeze.yaml both confirmed
      absent as of this register's last_verified_main_sha.
    prohibited_scope: >
      No modification of holdings.yaml, targets.yaml, allocate.py,
      margin_state.py, Intelligence records, CLAUDE.md doctrine text, or
      the Constitution by research code or by virtue of any result; no
      live signal, opportunity map, price target, opaque score, or
      precomputed recommendation; no order; no re-running of a closed
      Decisions-Log question as a variant; no result changes any
      production policy, parameter, target, tier, cap, or floor without
      its own separate future governance decision (G8).
    milestones:
      - gate: G0
        description: Charter (MARGIN-0005) + pinned PROTOCOL_V2.md + pre_registration.yaml filed and merged; hashes verified from committed blobs.
        pr: 137
        status: merged
        date: "2026-07-24"
      - gate: G1
        description: >
          Data-adequacy gate passed — official DFF ingested/validated,
          dividend reconciliation (T-D3) PASS 63/63 tickers + both Track 3
