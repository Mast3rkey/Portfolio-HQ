      final equity universe may be inferred from WS-0005's own status:
      complete alone.


      (5) Descriptive portfolio-risk evidence — historical drawdown and
      recovery behavior, stress-scenario evidence, and (only under its own
      separately bounded future authority, never assumed here)
      correlation evidence. No default formal portfolio optimizer and no
      hidden, opaque risk-score-driven allocator step is authorized or
      implied by this category — any such mechanism would require its own
      future, separate, explicit governance decision on the same bar as
      every other allocator-adjacent proposal this repository's Decisions
      Log has declined by default.


      (6) Cross-asset opportunity-cost synthesis (XASSET-0001 §E/§F) —
      wholly undesigned; the mechanism that would eventually compare
      equities, ETFs, crypto, GLD, and cash-like/debt-reduction capital
      uses against each other using the evidence categories (1)-(5)
      supply, never itself performed here.


      (7) Level 1 (sleeve-level) candidate targets — equities/ETFs/
      crypto/GLD/cash-reserve/debt-reduction, each requiring its own
      future sizing methodology, gated on (6).


      (8) Level 2 (instrument-level) candidate targets — inside each
      approved sleeve, gated on (7).


      (9) Chart-informed work remains its own major workstream, not a
      minor deployment footnote — remaining governed chart ingestion
      beyond CHART-0001/CHART-0002's own already-sealed one-asset pilot
      and 19-image first batch; any further governed 1D-timeframe
      coverage; genuinely interpretive chart analysis (as distinct from
      the raw evidence-record ingestion already governed); higher-
      timeframe chart governance (weekly/monthly, unaddressed by CHART-
      0001/CHART-0002); and a required chart-evidence review step before
      any final deployment decision — all remaining unauthorized beyond
      what CHART-0001/CHART-0002 already sealed.


      (10) Portfolio relationship and overlap mapping and synthesis —
      building on, not duplicating, the already-sealed
      intelligence/relationships/ records (REL-0001 through REL-0007) and
      the already-sealed intelligence/overlap_model/ ten-dimension
      evidence layer (XASSET-0005/XASSET-0007), neither of which performs
      synthesis on its own.


      (11) Buy-ladder integration and target-allocation elasticity —
      connecting LADDER-0001's own bounded backtest-research charter (once
      it produces a result and, separately, is adopted) to any future
      sizing/deployment mechanism from (7)/(8), never assumed here.


      (12) Backtesting as an explicit, available evidence tool for real
      future decision questions — drawdown/recovery characterization,
      sleeve-mix stress testing, concentration-limit testing, trim/
      rebalance-rule testing, buy-ladder behavior testing, unlevered
      portfolio testing, margin deployment/repayment testing, and
      leverage-amplified drawdown/survivability testing — each its own
      future, separately authorized, pre-registered study, matching this
      repository's own established backtest discipline (trim_backtest.md,
      rung_backtest.md, regime_backtest.md, weight_backtest.md,
      t1t2_trim_backtest.md, and MARGIN-0005's own hash-pinned protocol,
      none of which this category re-runs or supersedes). Required
      methodological controls, restated here as a standing checklist for
      every future study under this category, not a new rule: pre-
      registration where applicable; no history-mining; walk-forward/out-
      of-sample validation where appropriate; neighboring-parameter
      robustness/plateau checks where applicable; untouched-test
      discipline (MARGIN-0005's own precedent); no automatic policy
      adoption from any result; and separate, explicit governance for any
      resulting policy change, exactly as every closed backtest in this
      repository's own Decisions Log has already been held to.


      (13) Unlevered portfolio testing before any margin/leverage
      adoption question is revisited — a sequencing requirement, not new
      research authority: the unlevered case must be evidenced and judged
      sound first.


      (14) Margin/leverage and DEBT_REDUCTION economic research, after
      (13) — reusing MARGIN-0005's own already-accepted, hash-pinned
      research charter where applicable rather than opening a competing
      one; the 1.8x leverage cap and 30% margin-buffer floor remain
      binding, provisional guardrails throughout (NUM-0001), untouched by
      this category.


      (15) Monitoring and sell discipline — thesis-break review triggers,
      add/trim/exit rules, freshness and catalyst monitoring (reusing
      intelligence_report.py's own existing staleness-reporting fields per
      PI-0011, not duplicating them), and concentration monitoring
      (reusing issuer_lookthrough.yaml/caps.clusters/the overlap model
      rather than inventing a parallel mechanism).


      (16) Final integration and an independent audit before any
      deployment-readiness determination — the last step, gated on every
      prior category above having reached its own separately-authorized,
      separately-reviewed conclusion.


      Sequencing principle (informational, not a new rule — restates the
      logical dependency order the fourteen-item objective/completion_
      criteria fields above already imply, made explicit for readability):
      finish missing evidence (1)-(3) → broaden contender competition (4)
      → cross-asset synthesis (6) → provisional sleeve/instrument sizing
      (7)-(8) → descriptive risk analysis and targeted backtests (5),(12)
      → chart-informed deployment work (9) → buy ladders (11) → unlevered
      portfolio testing (13) → revise policy/sizing if evidence requires →
      margin/leverage research and backtesting (14) → monitoring/sell
      discipline (15) → final integration/audit (16) → a deployment-ready
      portfolio, converging into WS-0013's own existing final-allocation-
      readiness sequence (unedited, unaffected by this field).
