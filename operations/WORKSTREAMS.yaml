      rules-based, evidence-gated conditional margin-deployment or
      target-sizing rule outperforms the current fixed posture — ending
      honestly, with the fixed posture unchanged, at any pre-declared
      stopping gate if the evidence does not support a change.
    governing_authority:
      - GOV-0003
      - MARGIN-0005
      - OPS-0003 (priority restoration only; grants no new research authority)
      - research/margin_target_study/PROTOCOL_V2.md (pinned SHA-256, charter §3)
