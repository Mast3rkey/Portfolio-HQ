        pr: 144
        status: documented
        date: "2026-07-24"
      - gate: S2-final
        description: >
          Third and final of ≤3 authorized S2 PRs — dividend_ledger.py,
          validation_lib.py, overlay_lib.py, target_variants.py, plus
          test_validation_lib.py, test_overlay_lib.py,
