# (PHQ-2026-03 authorization) and removed here per verified post-trade
# evidence (governance/evidence/PHQ-2026-04/) — same zero-position removal
# convention as above, not zeroed. Sale proceeds remain cash (resulting
# cash $2,675.05 per evidence, not persisted in this schema); margin debt
# confirmed $0.00 (unchanged from the existing 0.0 below).
#
# PHQ-2026-05 (2026-07-31): seven post-buy quantity updates reconciled from
# the principal-supplied v1.37 "Final Confirmed Account State" package
# (governance/evidence/PHQ-2026-05/v1_37/, SHA-256
