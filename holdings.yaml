# holdings.yaml — three tracks. 'shares' (ticker: qty) and
# 'crypto_shares' (coin: qty) are the source of truth for any normally
# -traded position or coin — live-valued every run via Alpaca (qty x
# latest price). Update with 'allocate.py update-shares' / 'update-crypto-shares'
# after a real buy/sell/trim changes a count.
# 'holdings' (ticker: dollar value) is the manual fallback for anything
# NOT share-tracked. Currently empty/unused.
# Update it with 'allocate.py update-holdings' if a future ticker needs it.
# margin: synced via 'allocate.py update-margin <debt> <buffer_pct>' — buffer_pct comes from Robinhood directly (per-security maintenance
# ratios aren't available via Alpaca), so it's only as fresh as the last sync. Verify on Robinhood before any large margin-funded buy.
# IMPORTANT: always use Robinhood's own DISPLAYED buffer % — do not derive
# it from (portfolio value - maint req) / portfolio value. Checked twice
# against real screens and it doesn't reconcile (off by several points);
# Robinhood's actual formula weights something this simple subtraction misses.
#
# Reconciled 2026-07-31 from PHQ-2026-02 verified post-execution evidence
# (governance/evidence/PHQ-2026-02/v1_35/, SHA-256
# fb8eb811df29eb560bfaed16e8d0e89c6cbcf44bc42e1f1ae2ccfca4cddd889e). The
# principal confirmed the v1.35 screenshots are the complete post-transition
# equity/crypto list — the 41 tickers previously tracked here and absent from
# that evidence were fully exited by the manual transition trades and are
# removed rather than zeroed, per this repository's existing zero-position
# convention (see CLAUDE.md's BTC 2026-07-13 precedent).
# Dust crypto (BONK/PEPE/WIF/ZORA, $0.00 mark) is excluded from
# crypto_shares, unchanged from the existing permanent-ignore convention.
#
# PHQ-2026-04 (2026-07-31): SKHY and SPCX manually exited by the principal
# (PHQ-2026-03 authorization) and removed here per verified post-trade
# evidence (governance/evidence/PHQ-2026-04/) — same zero-position removal
# convention as above, not zeroed. Sale proceeds remain cash (resulting
# cash $2,675.05 per evidence, not persisted in this schema); margin debt
# confirmed $0.00 (unchanged from the existing 0.0 below).
#
# PHQ-2026-05 (2026-07-31): seven post-buy quantity updates reconciled from
# the principal-supplied v1.37 "Final Confirmed Account State" package
# (governance/evidence/PHQ-2026-05/v1_37/, SHA-256
# 782f68284b92377ed396584a63c112f7835900ac18a2d117d85f62239da85ebd for the
# JSON export) — AMZN/NVDA/TMO/SPY quantities updated, PWR/VEA/VWO added as
# new share-tracked positions (all three already carried canonical
# `targets.yaml` destination rows with zero prior shares). No new ticker,
# target, cap, or gate is introduced — every changed/added symbol already
# has an existing canonical row. SKHY/SPCX are deliberately NOT restored:
# v1.37's SKHY/SPCX rows carry the exact pre-exit quantities and are treated
# as stale relative to PHQ-2026-04's independently-evidenced 15:10-15:11
# ET sale fills, per explicit principal direction reconciling the conflict
# between the two evidence packages. v1.37's reported cash ($845.84) does
# not reconcile against PHQ-2026-04's post-sale-only cash ($2,675.05) even
# accounting for these buys — flagged as an open item for principal
# re-verification, not resolved by this filing (see PHQ-2026-05's decision
# record). Crypto (BTC/ETH/SOL) and all other equity/fund quantities are
# unchanged and independently confirmed against v1.37 — dust
# (BONK/PEPE/WIF/ZORA) remains permanently excluded, unchanged convention.
