# issuer_lookthrough.yaml — 8% effective-issuer and 40% AI/platform
# common-driver no-add controls, per PHQ-2026-02
# (governance/decisions/PHQ-2026-02-holdings-reconciliation-and-actionable-allocation-policy.md).
#
# MEMBERSHIP is unchanged from PHQ-2026-02 (the same governed 11 issuers).
#
# fund_holding_weight was REFRESHED under PHQ-2026-08 (PD-2, principal-approved)
# from OFFICIAL PRIMARY-SOURCE issuer holdings files — State Street for SPY
# (as of 2026-09-17) and Vanguard for VEA/VWO (both as of 2026-08-31) — retained
# verbatim and SHA-256-pinned under governance/evidence/PHQ-2026-08/. Every value
# below is derived from those files; see `fund_sources:` at the end of this file
# for publisher, as-of date, evidence hash, and the exact source security rows
# (name/ticker/SEDOL/raw weight) each governed issuer's weight was built from.
#
# This remains a point-in-time snapshot, NOT a live fetch (this repository's
# Alpaca client has no ETF-constituent-lookthrough capability; design note
# PHQ-2026-01_TARGET_ALLOCATOR_IMPLEMENTATION_DESIGN_NOTE.md §5/§6 explicitly
# warns against inventing a new estimate). Must be refreshed at each quarterly
# review — stale beyond one quarter should be treated as a disclosed
# data-freshness warning, not silently trusted. `fund_sources.*.holdings_as_of`
# makes that staleness machine-readable rather than opaque.
#
# effective_weight = direct_weight + (fund_weight_of_book x fund_holding_weight),
# computed at runtime from CURRENT reconciled holdings/prices — this file
# supplies only the constituent weights (fund_holding_weight), never the
# effective weight itself, which is never point-in-time-frozen except for
# the one retained historical figure below.

issuer_ceiling_pct: 8.0
common_driver_ceiling_pct: 40.0

# HISTORICAL EVIDENCE ONLY — NOT the measurement rule. Preserved unchanged.
# PHQ-2026-08 (PD-1) makes `common_driver_measurement_rule` below authoritative;
# this figure is arithmetically consistent with having excluded the ETF-embedded
# components of LLY, TSLA and AAPL, which the authoritative rule forbids. It is
# retained as the historical record and must not be rewritten or cited as the rule.
#
# Retained point-in-time measurement from the PHQ-2026-01 due-diligence
# look-through audit (Portfolio_HQ_Final_Due_Diligence_and_Approval_v1_32.json
# `lookthrough_summary.effective_ai_platform_common_driver_estimate`,
# computed from canonical v1.30 TARGET weights, i.e. full deployment, not
# current holdings). Above the 40% ceiling as measured — not rounded into
# compliance, and may not be increased without separate principal approval
# (PHQ-2026-01 point 9, PHQ-2026-02 principal approval text).
retained_common_driver_measurement:
  value_pct: 40.0284
  measured_at: 2026-07-30
  methodology: "canonical v1.30 target-weight-basis look-through, PHQ-2026-01 due diligence"
  source: governance/evidence/PHQ-2026-01/final_due_diligence/Portfolio_HQ_Final_Due_Diligence_and_Approval_v1_32.json

# AI/platform common-driver membership — the same 11 issuers the retained
