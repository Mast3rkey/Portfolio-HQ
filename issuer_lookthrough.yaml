# ---------------------------------------------------------------------------
# PD-1 (PHQ-2026-08) — AUTHORITATIVE COMMON-DRIVER MEASUREMENT RULE.
# Principal-approved. Closes the ambiguity PR #397 exposed between the
# retained 40.0284% headline and its own 41.6454% line-item sum.
# ---------------------------------------------------------------------------
common_driver_measurement_rule:
  basis: FULL_EFFECTIVE_ALL_ISSUERS
  formula: "COMMON_DRIVER_EXPOSURE = SUM over all governed common-driver issuers
    of (DIRECT_EXPOSURE + ALL GOVERNED ETF-EMBEDDED EXPOSURE)"
  selective_exclusion_permitted: false
  selective_exclusion_note: "No governed issuer's ETF-embedded component may be
    omitted — specifically including LLY, TSLA and AAPL, whose embedded slices the
    retained 40.0284% headline is arithmetically consistent with having excluded."
  economic_issuer_aggregation: true
  economic_issuer_aggregation_note: "Multiple share classes or depositary-receipt
    lines of ONE economic issuer aggregate into that governed issuer. Identity is
    resolved by security identifier (SEDOL), never by name similarity."
  principal_approval: granted
  authority: governance/decisions/PHQ-2026-08-common-driver-measurement-authority-and-lookthrough-refresh.md
  implemented_by: "allocate._issuer_exposure — UNCHANGED. It already computes
    direct_pct + sum(fund_pct_of_book * fund_holding_weight) for every governed
    issuer and sums across all of them; this rule ratifies that behaviour."
  governed_issuer_count: 11
  issuer_ceiling_pct_unchanged: 8.0
  common_driver_ceiling_pct_unchanged: 40.0

