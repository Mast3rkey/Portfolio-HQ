schema_version: "1.0"
study_id: RISK-0001
authority:
  decision: RISK-0001
  architecture: XASSET-0019
  cohort: LEVEL2-0001
  numeric_provenance: NUM-0001
  lifecycle: OPS-0009_LANE_G
  execution_authority: ONE_LATER_IMPLEMENTATION_RESULTS_PR_ONLY
  charter_pr_data_acquisition: PROHIBITED
  charter_pr_study_execution: PROHIBITED
  policy_adoption: PROHIBITED
  question: >-
    Does preregistered historical evidence reject the continued plausibility of any
    historical/provisional Level-1 investable-sleeve scenario strongly enough to
    require a separate policy review before replacement sizing, or is the evidence
    insufficient?

frozen_cohort:
  source: governance/evidence/LEVEL2-0001/RESEARCH_COHORT_FREEZE.yaml
  scope: RESEARCH_ONLY_NOT_FINAL_MEMBERSHIP
  expected_core_count: 34
  equity_count: 27
  equity_ids: [AMZN, ASML, AVGO, CEG, COST, ETN, GEV, GNRC, GOOGL, ICE, ISRG, KLAC, LLY, META, MSFT, NVDA, PANW, PWR, RKLB, RTX, SNPS, SPGI, TMO, TSLA, TSM, V, WM]
  broad_market_ids: [SPY, VEA, VWO]
  defensive_core_ids: [GLD]
  crypto_ids: [BTC, ETH, SOL]
  final_membership_authority: PROHIBITED
  level2_sizing_authority: PROHIBITED

representations:
  EQUITY:
    research_unit: CONSTITUENT_DIAGNOSTICS_ONLY
    ids: [AMZN, ASML, AVGO, CEG, COST, ETN, GEV, GNRC, GOOGL, ICE, ISRG, KLAC, LLY, META, MSFT, NVDA, PANW, PWR, RKLB, RTX, SNPS, SPGI, TMO, TSLA, TSM, V, WM]
    aggregate_return_series: PROHIBITED
    weighting_methods_prohibited: [EQUAL_WEIGHT, MARKET_CAP_WEIGHT, CURRENT_WEIGHT, SYNTHETIC_REPRESENTATIVE_PATH]
  FUND_BROAD_MARKET:
    research_unit: SEPARATE_REPRESENTATIONS
    ids: [SPY, VEA, VWO]
    combined_return_series: PROHIBITED
  FUND_GLD_DEFENSIVE:
    research_unit: CORE_PLUS_CONDITIONAL_SENSITIVITY
    core_ids: [GLD]
    conditional_ids: [IAU, SGOL, GLDM]
    conditional_use: REPRESENTATION_SENSITIVITY_ONLY
    peer_ranking: PROHIBITED
    final_vehicle_selection: PROHIBITED
  CRYPTO:
    research_unit: SEPARATE_REPRESENTATIONS
    ids: [BTC, ETH, SOL]
    composites_prohibited: [EQUAL_WEIGHT, MARKET_CAP, CONVICTION, CANONICAL]
  excluded: [CASH, RESERVE, cash_reserve, debt_reduction, residual, unassigned_capital, margin, leverage]

historical_reference_scenarios:
  classification: historical_provisional_reference
  semantics:
    - HISTORICAL
    - COMPUTATIONALLY_DERIVED_UNDER_SUPERSEDED_MECHANICS
    - PROVISIONAL
    - ECONOMICALLY_UNVALIDATED
    - NOT_ADOPTED
    - NOT_BASELINE_POLICY
    - NOT_A_TARGET
    - NOT_AN_OPTIMIZATION_ANCHOR
    - NO_RESIDUAL_ASSIGNMENT
  values_pct:
    EQUITY: "18.67"
    FUND_BROAD_MARKET: "14.67"
    FUND_GLD_DEFENSIVE: "16.67"
    CRYPTO: "16.67"

scenario_states: [LOWER, HISTORICAL_REFERENCE, HIGHER]

scenario_magnitudes:
  unit: PERCENT_OF_UNSPECIFIED_ASSET_STATE_EXPOSURE
  values_pct:
    EQUITY:
      LOWER: "14.94"
      HISTORICAL_REFERENCE: "18.67"
      HIGHER: "22.40"
    FUND_BROAD_MARKET:
      LOWER: "11.74"
      HISTORICAL_REFERENCE: "14.67"
      HIGHER: "17.60"
    FUND_GLD_DEFENSIVE:
      LOWER: "13.34"
      HISTORICAL_REFERENCE: "16.67"
      HIGHER: "20.00"
    CRYPTO:
      LOWER: "13.34"
      HISTORICAL_REFERENCE: "16.67"
      HIGHER: "20.00"
  freeze_status: IMMUTABLE_AFTER_CHARTER_MERGE
  portfolio_reconciliation: NOT_PERFORMED
  residual_assignment: PROHIBITED

scenario_provenance:
  method: SYMMETRIC_RELATIVE_PERTURBATION
  relative_perturbation: "0.20"
  formula:
    LOWER: historical_reference_times_0.80
    HISTORICAL_REFERENCE: historical_reference_unchanged
    HIGHER: historical_reference_times_1.20
  rounding: ROUND_HALF_UP_TO_TWO_DECIMAL_PERCENTAGE_POINTS
  num_0001_classification: PROVISIONAL_GOVERNANCE_GUARDRAIL_FOR_ONE_STUDY
  calibrated: false
  evidence_bounded: false
  optimized: false
  inherited_from_xasset_0016_r2_r3: false
  rationale: >-
    A common proportional perturbation challenges each historical reference on
    the same relative scale, avoids inheriting the superseded fixed +/-2pp
    mechanic, and creates distinct exposure states without searching a grid.
  lapse: AUTOMATIC_ON_AUTHORIZED_STUDY_COMPLETION
  reuse: REQUIRES_NEW_GOVERNANCE_AUTHORITY

data_sources:
  equities_etfs:
    primary:
      provider: ALPACA_MARKET_DATA
      endpoint: "https://data.alpaca.markets/v2/stocks/{symbol}/bars"
      parameters: "timeframe=1Day&adjustment=split&feed=sip&limit=10000"
      return_input: SPLIT_ADJUSTED_NON_TOTAL_RETURN_OHLC
      commit_rule: COMMIT_IF_LICENSE_AND_SIZE_ALLOW_OTHERWISE_QUARANTINE_WITH_HASH
    fallback:
      provider: YAHOO_FINANCE_CHART
      endpoint: "https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
      parameters: "interval=1d&events=div%2Csplits%2CcapitalGains"
      return_input: SPLIT_ADJUSTED_NON_TOTAL_RETURN_CLOSE_PLUS_EXPLICIT_ACTIONS
      disposition: QUARANTINE_NOT_COMMITTED
      whole_path_rule: ONE_PROVIDER_PER_REPRESENTATION_WINDOW_NO_UNDISCLOSED_STITCHING
  crypto:
    primary:
      provider: ALPACA_CRYPTO
      endpoint: "https://data.alpaca.markets/v1beta3/crypto/us/bars"
      parameters: "symbols={symbol}/USD&timeframe=1Day&limit=10000"
      market: SPOT
      commit_rule: COMMIT_IF_LICENSE_AND_SIZE_ALLOW_OTHERWISE_QUARANTINE_WITH_HASH
    fallback:
      provider: COINBASE_EXCHANGE
      endpoint: "https://api.exchange.coinbase.com/products/{product}-USD/candles"
      parameters: "granularity=86400&start={start}&end={end}"
      market: SPOT
      disposition: QUARANTINE_NOT_COMMITTED
      whole_path_rule: ONE_PROVIDER_PER_REPRESENTATION_WINDOW_NO_UNDISCLOSED_STITCHING
  comparator:
    primary:
      provider: FRED
      series: DFF
      endpoint: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFF"
      disposition: COMMIT_OFFICIAL_PUBLIC_DOMAIN_SOURCE_OR_HASH_PINNED_RECEIPT
    analytical_fallback: NONE
  corporate_actions:
    primary:
      provider: ALPACA_CORPORATE_ACTIONS
      endpoint: "https://data.alpaca.markets/v1/corporate-actions"
      types: [cash_dividend, stock_dividend, split, spin_off, merger]
    identity_resolution:
      providers: [SEC_EDGAR, PRIMARY_ISSUER_INVESTOR_RELATIONS]
      use: LEGAL_ENTITY_AND_ACTION_RESOLUTION_ONLY
  secondary_reconciliation:
    providers: [YAHOO_FINANCE_ADJCLOSE, ISSUER_FILINGS, COINBASE_EXCHANGE_OR_ALPACA_OPPOSITE_SOURCE]
    use: RECONCILIATION_ONLY_NOT_SILENT_INPUT_SUBSTITUTION

fallback_order:
  equities_etfs: [ALPACA_MARKET_DATA, YAHOO_FINANCE_CHART, ABSTAIN]
  crypto: [ALPACA_CRYPTO, COINBASE_EXCHANGE, ABSTAIN]
  comparator: [FRED_DFF, ABSTAIN_OPPORTUNITY_COST_CELLS]
  corporate_actions: [ALPACA_CORPORATE_ACTIONS, SEC_EDGAR_OR_ISSUER, ABSTAIN_AFFECTED_CELLS]
  provider_change_after_result_inspection: PROHIBITED
  fallback_retry_before_registered_execution: PERMITTED_AND_LOGGED

data_gate:
  execution_gate: ALL_REQUIRED_DATASETS_PASS_BEFORE_ANY_REGISTERED_CELL_EXECUTES
  required_receipts:
    - REQUEST_URL_WITH_SECRETS_REDACTED
    - REQUEST_TIMESTAMP_UTC
    - RESPONSE_STATUS
    - PAGE_OR_CURSOR_ID
    - NEXT_PAGE_OR_TERMINAL_MARKER
    - RAW_SHA256
    - TRANSFORMED_SHA256
    - COVERAGE_START_END
    - EXPECTED_AND_OBSERVED_COUNTS
    - GAP_INVENTORY
    - IDENTITY_LINEAGE
    - CORPORATE_ACTION_DISPOSITION
    - PROVIDER_AND_ENDPOINT
    - LICENSE_AND_COMMIT_OR_QUARANTINE_DISPOSITION
  no_lookahead: true
  no_interpolation: true
  no_forward_fill_prices: true
  no_zero_return_standins: true
  no_silent_universe_reduction: true
  no_unregistered_substitute: true
  failed_required_dataset: AFFECTED_CELLS_INELIGIBLE_AND_FAMILY_MAY_ABSTAIN
  gld_conditional_peer_gate:
    required: false
    requirements:
      - COMPLETE_IDENTITY_AND_INCEPTION
      - ZERO_UNRESOLVED_REQUIRED_SESSION_GAPS
      - COMPLETE_DIVIDEND_SPLIT_ACTION_TREATMENT
      - OVERLAP_TOTAL_RETURN_CORRELATION_AT_LEAST_0_995
      - OVERLAP_ANNUALIZED_RETURN_DIFFERENCE_AT_MOST_0_50_PP
      - OVERLAP_MAX_DRAWDOWN_DIFFERENCE_AT_MOST_2_00_PP
    failure_state: CONDITIONAL_ASSET_NOT_ACQUIRED
    num_0001_classification: UNCALIBRATED_ONE_STUDY_DATA_PARITY_GUARDRAIL
  crypto_gate:
    utc_normalization: REQUIRED
    expected_calendar: EVERY_UTC_DAY_IN_REGISTERED_WINDOW
    duplicate_timestamps_allowed: 0
    missing_days_allowed_per_registered_window: 0
    maximum_contiguous_gap_days: 0
    ohlc_rules: [FINITE, POSITIVE, LOW_LE_MIN_OPEN_CLOSE, HIGH_GE_MAX_OPEN_CLOSE, HIGH_GE_LOW]
    pagination_completeness: REQUIRED
    interpolation: PROHIBITED
    forward_fill: PROHIBITED
    fabricated_pre_inception: PROHIBITED
    undisclosed_alternate_source_stitching: PROHIBITED
    known_sol_gap: >-
      The existing aggregate 418-day SOL gap must be re-inventoried. Every
      registered window intersecting any unresolved SOL day is ineligible;
      the gap may not be averaged away or represented as zero return.

scenario_windows:
  count: 7
  evaluation_end: "2026-07-31"
  windows:
    - id: ASSET_AVAILABLE_HISTORY
      class: ASSET_AVAILABLE
      start: "2004-11-18"
      end: "2026-07-31"
      rule: INTERSECT_WITH_LAWFUL_LISTING_INCEPTION_AND_VALIDATED_COVERAGE
      criterion: GLD_FIRST_TRADING_DATE_AS_CROSS_FAMILY_MODERN_HISTORY_FLOOR
    - id: FAMILY_COMMON_OVERLAP
      class: FAMILY_COMMON
      start_by_family:
        EQUITY: "2024-04-02"
        FUND_BROAD_MARKET: "2007-07-20"
        FUND_GLD_DEFENSIVE: "2018-06-26"
        CRYPTO: "2021-06-01"
      end: "2026-07-31"
      criterion: LATEST_KNOWN_LAWFUL_CORE_OR_CONDITIONAL_INCEPTION_WITHIN_FAMILY
    - id: GFC_2008
      class: FIXED_STRESS
      start: "2007-12-01"
      end: "2009-06-30"
      criterion: NBER_RECESSION_MONTH_BOUNDARIES_NOT_ASSET_PEAK_TROUGH
    - id: Q4_2018
      class: FIXED_STRESS
      start: "2018-10-01"
      end: "2018-12-31"
      criterion: CALENDAR_QUARTER
    - id: COVID_2020
      class: FIXED_STRESS
      start: "2020-02-01"
      end: "2020-04-30"
      criterion: PREDECLARED_PUBLIC_HEALTH_SHOCK_WINDOW_NOT_ASSET_PEAK_TROUGH
    - id: RATE_INFLATION_2022
      class: FIXED_STRESS
      start: "2022-01-01"
      end: "2022-12-31"
      criterion: CALENDAR_YEAR_RATE_AND_INFLATION_SHOCK
    - id: CRYPTO_STRESS_2022
      class: FIXED_STRESS
      start: "2022-05-01"
      end: "2022-12-31"
      criterion: PREDECLARED_TERRA_CELSIUS_FTX_EVENT_INTERVAL_NOT_ASSET_PEAK_TROUGH
  asset_specific_peak_trough_selection: PROHIBITED

missingness_states:
  vocabulary:
    - ELIGIBLE
    - NOT_APPLICABLE_PRE_INCEPTION
    - MISSING_SOURCE_DATA
    - KNOWN_DATA_GAP
    - CORPORATE_ACTION_UNRESOLVED
    - CONDITIONAL_ASSET_NOT_ACQUIRED
    - QUALITY_GATE_FAILED
