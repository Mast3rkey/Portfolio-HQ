data_sources:
  equities_etfs:
    primary: {provider: ALPACA_MARKET_DATA, endpoint: "https://data.alpaca.markets/v2/stocks/{symbol}/bars", parameters: "timeframe=1Day&adjustment=split&feed=sip&limit=10000", return_input: SPLIT_ADJUSTED_NON_TOTAL_RETURN_OHLC, commit_rule: COMMIT_IF_LICENSE_AND_SIZE_ALLOW_OTHERWISE_QUARANTINE_WITH_HASH}
    fallback: {provider: YAHOO_FINANCE_CHART, endpoint: "https://query1.finance.yahoo.com/v8/finance/chart/{symbol}", parameters: "interval=1d&events=div%2Csplits%2CcapitalGains", return_input: SPLIT_ADJUSTED_NON_TOTAL_RETURN_CLOSE_PLUS_EXPLICIT_ACTIONS, disposition: QUARANTINE_NOT_COMMITTED, whole_path_rule: ONE_PROVIDER_PER_REPRESENTATION_WINDOW_NO_UNDISCLOSED_STITCHING}
  crypto:
    primary: {provider: ALPACA_CRYPTO, endpoint: "https://data.alpaca.markets/v1beta3/crypto/us/bars", parameters: "symbols={symbol}/USD&timeframe=1Day&limit=10000", market: SPOT, commit_rule: COMMIT_IF_LICENSE_AND_SIZE_ALLOW_OTHERWISE_QUARANTINE_WITH_HASH}
    fallback: {provider: COINBASE_EXCHANGE, endpoint: "https://api.exchange.coinbase.com/products/{product}-USD/candles", parameters: "granularity=86400&start={start}&end={end}", market: SPOT, disposition: QUARANTINE_NOT_COMMITTED, whole_path_rule: ONE_PROVIDER_PER_REPRESENTATION_WINDOW_NO_UNDISCLOSED_STITCHING}
  comparator: {provider: FRED, series: DFF, endpoint: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFF", disposition: COMMIT_OFFICIAL_PUBLIC_DOMAIN_SOURCE_OR_HASH_PINNED_RECEIPT, analytical_fallback: NONE}
  corporate_actions:
    primary: {provider: ALPACA_CORPORATE_ACTIONS, endpoint: "https://data.alpaca.markets/v1/corporate-actions", types: [cash_dividend, stock_dividend, split, spin_off, merger]}
    identity_resolution: {providers: [SEC_EDGAR, PRIMARY_ISSUER_INVESTOR_RELATIONS], use: LEGAL_ENTITY_AND_ACTION_RESOLUTION_ONLY}
  secondary_reconciliation: {providers: [YAHOO_FINANCE_ADJCLOSE, ISSUER_FILINGS, COINBASE_EXCHANGE_OR_ALPACA_OPPOSITE_SOURCE], use: RECONCILIATION_ONLY_NOT_SILENT_INPUT_SUBSTITUTION}

fallback_order:
  equities_etfs: [ALPACA_MARKET_DATA, YAHOO_FINANCE_CHART, ABSTAIN]
  crypto: [ALPACA_CRYPTO, COINBASE_EXCHANGE, ABSTAIN]
  comparator: [FRED_DFF, ABSTAIN_OPPORTUNITY_COST_CELLS]
  corporate_actions: [ALPACA_CORPORATE_ACTIONS, SEC_EDGAR_OR_ISSUER, ABSTAIN_AFFECTED_CELLS]
  provider_change_after_result_inspection: PROHIBITED
  fallback_retry_before_registered_execution: PERMITTED_AND_LOGGED

data_gate:
  stage_order: [GLOBAL_STUDY_INTEGRITY, CELL_DATA_ELIGIBILITY]
  GLOBAL_STUDY_INTEGRITY:
    failure_effect: GLOBAL_HALT_ZERO_CELLS_EXECUTE
    gates: [CHARTER_PROTOCOL_PREREG_HASH_IDENTITY, CLOSED_SCHEMA_VALIDATION, TRIAL_INVENTORY_INTEGRITY, RUNNER_AND_CONFIG_IDENTITY, SOURCE_HIERARCHY_INTEGRITY, GLOBAL_CODE_AND_VERSION_INTEGRITY, STUDY_WIDE_PROVENANCE_REGISTRY_COMPLETE, COMPLETE_PREEXECUTION_ELIGIBILITY_MATRIX]
  CELL_DATA_ELIGIBILITY:
    failure_effect: DEPENDENT_REGISTERED_CELLS_INELIGIBLE_ONLY
    gates: [SOURCE_ACQUISITION_AND_RECEIPTS, COVERAGE_AND_GAP_VALIDATION, IDENTITY_AND_CORPORATE_ACTION_RESOLUTION, TOTAL_RETURN_CONSTRUCTION_VALIDATION, REPRESENTATION_WINDOW_QUALITY, COMPARATOR_WINDOW_AVAILABILITY]
    propagation:
      SOL_GAP: INTERSECTING_SOL_CELLS_INELIGIBLE
      VEA_ACQUISITION_FAILURE: ALL_VEA_CELLS_INELIGIBLE
      CEG_ACTION_UNRESOLVED: INTERSECTING_CEG_CELLS_INELIGIBLE
      DFF_MISSING_REQUIRED_DAY: AFFECTED_OPPORTUNITY_COST_METRICS_UNAVAILABLE
      CONDITIONAL_GOLD_PEER_GATE_FAILURE: PEER_EXCLUDED_AS_CONDITIONAL_ASSET_NOT_ACQUIRED
      MANDATORY_REPRESENTATION_UNAVAILABLE: FAMILY_STATE_UNAVAILABLE
      REPRESENTATION_CONFLICT: STUDY_RESULT_UNABLE_TO_DETERMINE
  preexecution_freeze: ALL_ACQUISITION_VALIDATION_AND_ELIGIBILITY_STATES_FROZEN_BEFORE_FIRST_CELL
  required_receipts: [REQUEST_URL_WITH_SECRETS_REDACTED, REQUEST_TIMESTAMP_UTC, RESPONSE_STATUS, PAGE_OR_CURSOR_ID, NEXT_PAGE_OR_TERMINAL_MARKER, RAW_SHA256, TRANSFORMED_SHA256, COVERAGE_START_END, EXPECTED_AND_OBSERVED_COUNTS, GAP_INVENTORY, IDENTITY_LINEAGE, CORPORATE_ACTION_DISPOSITION, PROVIDER_AND_ENDPOINT, LICENSE_AND_COMMIT_OR_QUARANTINE_DISPOSITION]
  integrity_rules: {no_lookahead: true, no_interpolation: true, no_forward_fill_prices: true, no_zero_return_standins: true, no_silent_universe_reduction: true, no_unregistered_substitute: true}
  gld_conditional_peer_gate:
    required: false
    unresolved_required_session_gaps_parameter_id: GOLD_UNRESOLVED_SESSION_GAPS_ALLOWED
    requirements: [COMPLETE_IDENTITY_AND_INCEPTION, ZERO_UNRESOLVED_REQUIRED_SESSION_GAPS, COMPLETE_DIVIDEND_SPLIT_ACTION_TREATMENT, OVERLAP_TOTAL_RETURN_CORRELATION_AT_LEAST_GOLD_PARITY_CORRELATION_MIN, OVERLAP_ANNUALIZED_RETURN_DIFFERENCE_AT_MOST_GOLD_PARITY_RETURN_MAX_PP, OVERLAP_MAX_DRAWDOWN_DIFFERENCE_AT_MOST_GOLD_PARITY_DRAWDOWN_MAX_PP]
    failure_state: CONDITIONAL_ASSET_NOT_ACQUIRED
  crypto_gate:
    utc_normalization: REQUIRED
    expected_calendar: EVERY_UTC_DAY_IN_REGISTERED_WINDOW
    duplicate_timestamps_parameter_id: CRYPTO_DUPLICATE_TIMESTAMPS_ALLOWED
    missing_days_parameter_id: CRYPTO_MISSING_DAYS_ALLOWED
    maximum_contiguous_gap_parameter_id: CRYPTO_MAX_CONTIGUOUS_GAP_DAYS
    ohlc_rules: [FINITE, POSITIVE, LOW_LE_MIN_OPEN_CLOSE, HIGH_GE_MAX_OPEN_CLOSE, HIGH_GE_LOW]
    pagination_completeness: REQUIRED
    interpolation: PROHIBITED
    forward_fill: PROHIBITED
    fabricated_pre_inception: PROHIBITED
    undisclosed_alternate_source_stitching: PROHIBITED
    known_sol_gap_rule: REINVENTORY_418_DAY_AGGREGATE_GAP_AND_MARK_EVERY_INTERSECTING_WINDOW_INELIGIBLE

