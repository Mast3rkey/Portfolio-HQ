alignment_rules:
  equity_etf_calendar: XNYS_OFFICIAL_SESSIONS
  equity_etf_observation: OFFICIAL_SESSION_CLOSE
  crypto_calendar: UTC_24_7
  common_evaluation_timestamp: EACH_XNYS_OFFICIAL_CLOSE_IN_AMERICA_NEW_YORK
  crypto_mapping: LATEST_COMPLETED_UTC_DAILY_CLOSE_AT_OR_BEFORE_EVALUATION_TIMESTAMP
  weekend_crypto_rule: COMPOUND_ALL_UNMAPPED_COMPLETED_UTC_DAILY_RETURNS_INTO_NEXT_XNYS_INTERVAL
  comparator_interval: ACTUAL_CALENDAR_DAYS_BETWEEN_XNYS_EVALUATION_TIMESTAMPS
  future_observation_mapped_backward: PROHIBITED
  missing_observation_as_zero: PROHIBITED
  native_path_reporting: RETAIN_NATIVE_SESSION_OR_UTC_DAY_SERIES_SEPARATELY

corporate_action_rules:
  equities_etfs_total_return_method: SPLIT_ADJUSTED_PRICES_PLUS_EXPLICIT_DIVIDENDS_AND_ACTIONS
  total_return_series_combined_with_explicit_dividends: PROHIBITED
  dividends: GROSS_DECLARED_CASH_CREDITED_ON_EX_DATE_PRIMARY_PAY_DATE_SENSITIVITY_DISCLOSED
  splits: APPLY_GOVERNED_SPLIT_FACTOR_AND_VERIFY_RETURN_CONTINUITY
  spin_offs: REQUIRE_PRIMARY_IDENTITY_RATIO_AND_ENTITLEMENT_EVIDENCE_OR_MARK_UNRESOLVED
  ticker_changes: CONTINUE_ONLY_WITH_PROVED_SAME_LEGAL_ENTITY_LINEAGE
  mergers: CONTINUE_ONLY_THROUGH_EXPLICIT_GOVERNED_CONSIDERATION_AND_ENTITY_RULE
  legal_entity_continuity: REQUIRED
  listing_inception: NO_FABRICATED_PRE_INCEPTION_HISTORY
  synthetic_predecessor_stitching: PROHIBITED
  known_boundaries:
    CEG: PRE_STANDALONE_HISTORY_UNAVAILABLE
    GEV: PRE_SPIN_HISTORY_UNAVAILABLE
    RKLB: PRE_2021_08_25_NOT_RKLB_HISTORY
    RTX: PREDECESSOR_HISTORY_NOT_SILENTLY_STITCHED
  unresolved_period: CORPORATE_ACTION_UNRESOLVED
  gold_fund_expense_treatment: OBSERVED_FUND_PATH_ALREADY_INCLUDES_EXPENSE_DRAG_NO_SECOND_SUBTRACTION
  crypto_yield: SPOT_ONLY_NO_STAKING_LENDING_OR_YIELD

comparator:
  series: DFF
  role: ANALYTICAL_OPPORTUNITY_COST_ONLY
  strategic_cash: false
  residual: false
  funding_destination: false
  fifth_sleeve: false
  portfolio_policy: false
  annual_rate_unit: PERCENT
  accrual_convention: SIMPLE_ACTUAL_360_COMPOUNDED_BY_CALENDAR_DAY
  daily_factor: "1 + (lagged_DFF_percent / 100) / 360"
  availability_lag: ONE_US_BUSINESS_DAY_AFTER_OBSERVATION_DATE
  calendar_day_rule: USE_MOST_RECENT_LAWFULLY_AVAILABLE_LAGGED_DFF_FOR_WEEKENDS_AND_HOLIDAYS
  missing_rate_rule: GAP_OVER_SEVEN_CALENDAR_DAYS_FAILS_AFFECTED_OPPORTUNITY_COST_CELLS
  evaluation_alignment: ACCRUE_EXACT_CALENDAR_DAYS_BETWEEN_COMMON_EVALUATION_TIMESTAMPS

metric_families:
  PATH_RISK:
    independent_family: DOWNSIDE_PATH
    metrics:
      max_drawdown: "min_t(index_t / running_peak_t - 1)"
      worst_month: LOWEST_CALENDAR_MONTH_COMPOUNDED_TOTAL_RETURN
      worst_quarter: LOWEST_CALENDAR_QUARTER_COMPOUNDED_TOTAL_RETURN
      stress_window_loss: COMPOUNDED_TOTAL_RETURN_OVER_FIXED_STRESS_WINDOW
      volatility: SAMPLE_STANDARD_DEVIATION_OF_NATIVE_SIMPLE_RETURNS_ANNUALIZED_252_EQUITY_ETF_365_CRYPTO
  RECOVERY:
    independent_family: RECOVERY_BURDEN
    metrics:
      recovery_duration_days: CALENDAR_DAYS_FROM_DRAWDOWN_PEAK_TO_FIRST_INDEX_AT_OR_ABOVE_PRIOR_PEAK
      censor_status: RECOVERED_OR_CENSORED_AT_WINDOW_END
      time_underwater_area: SUM_OF_MAX_0_ONE_MINUS_INDEX_OVER_RUNNING_PEAK_TIMES_INTERVAL_DAYS
  OPPORTUNITY_COST:
    independent_family: OPPORTUNITY_COST
    metrics:
      excess_total_return: ASSET_TOTAL_RETURN_MINUS_COMPOUNDED_DFF_TOTAL_RETURN
      exposure_scaled_excess_contribution: SCENARIO_EXPOSURE_TIMES_EXCESS_TOTAL_RETURN
  CONTRIBUTION:
    independent_family: DOWNSIDE_PATH
    metrics:
      exposure_scaled_drawdown_loss: SCENARIO_EXPOSURE_TIMES_ABSOLUTE_MAX_DRAWDOWN
      exposure_scaled_stress_loss: SCENARIO_EXPOSURE_TIMES_ABSOLUTE_NEGATIVE_STRESS_RETURN
      constituent_loss_envelope: PER_CONSTITUENT_SCENARIO_EXPOSURE_TIMES_LOSS_NO_AGGREGATE_PATH
  CROSS_SECTIONAL_EQUITY:
    independent_family: DIAGNOSTIC_NOT_EXTRA_DOMINANCE_FAMILY
    metrics: [ELIGIBLE_BREADTH_COUNT_AND_PROPORTION, MEDIAN, P10, P25, P75, P90, MIN, MAX, IQR, RANGE, CLUSTER_DISPERSION, LEAVE_ONE_OUT_SENSITIVITY]
  REPRESENTATION:
    independent_family: CONSISTENCY_VETO_NOT_IMPROVEMENT_COUNT
    metrics: [PER_REPRESENTATION_DIRECTION, MATERIAL_CONFLICT, CONDITIONAL_GOLD_PEER_CONFLICT]
  CORRELATION_COBEHAVIOR:
    independent_family: DIAGNOSTIC_ONLY
    metrics: [PAIRWISE_PEARSON_DAILY_RETURN_CORRELATION, JOINT_NEGATIVE_INTERVAL_FREQUENCY]
  composite_score: PROHIBITED

dominance_rule:
  comparison: LOWER_OR_HIGHER_VERSUS_HISTORICAL_REFERENCE_WITHIN_FAMILY
  mandatory_independent_families: [DOWNSIDE_PATH, RECOVERY_BURDEN, OPPORTUNITY_COST]
  minimum_distinct_families_with_strict_improvement: 2
  no_material_worsening_across_all_applicable_mandatory_families: true
  correlated_metrics_within_one_family_count: 1
  representation_consistency_veto: true
  conflict_result: unable_to_determine
  monotonicity_required_only_for: [EXPOSURE_SCALED_LOSS_CONTRIBUTION, EXPOSURE_SCALED_OPPORTUNITY_CONTRIBUTION]
  materiality_tolerances:
    opportunity_cost_contribution_pp: "1.00"
    downside_contribution_pp: "1.00"
    underwater_area_contribution_pp: "1.00"
    recovery_duration_days: 30
    volatility_contribution_pp: "1.00"
    equity_breadth_delta_pp: "10.00"
  equivalence: ABSOLUTE_DIFFERENCE_AT_OR_BELOW_APPLICABLE_TOLERANCE
  num_0001_classification: UNCALIBRATED_ONE_STUDY_PROVISIONAL_GOVERNANCE_GUARDRAILS
  family_rules:
    EQUITY:
      aggregate_path: PROHIBITED
      minimum_eligible_constituents: 21
      directional_breadth_required: "0.75"
      median_must_agree: true
      leave_one_out_direction_must_be_stable: true
      cluster_diagnostics_cannot_override_family_rule: true
    FUND_BROAD_MARKET:
      required_representations: [SPY, VEA, VWO]
      all_eligible_directions_must_agree: true
      material_difference_or_conflict: unable_to_determine
    FUND_GLD_DEFENSIVE:
      core_required: GLD
      conditional_peer_conflict_if_gate_passes: unable_to_determine
    CRYPTO:
      required_representations: [BTC, ETH, SOL]
      asset_available_and_common_window_eligibility_required: true
      all_eligible_directions_must_agree: true
      material_difference_or_gap_conflict: unable_to_determine
  policy_review_trigger: CANDIDATE_SCENARIO_DOMINATES_HISTORICAL_REFERENCE_UNDER_ALL_RULES
  automatic_policy_change: PROHIBITED

point_target_rule:
  not_supported: >-
    The historical reference is not rejected but both adjacent registered
    scenarios are equivalent to it, materially conflicting, or otherwise fail
    to establish unique point precision while required data remain eligible.
  not_rejected: >-
    The historical reference is not dominated, at least one adjacent scenario
    is materially worse across at least two independent families with no
    opposite-direction representation conflict, and the evidence is eligible;
    this is not validation or adoption.
  unable_to_determine: >-
    Mandatory data, representation consistency, breadth, or corporate-action
    gates prevent the point premise from being assessed.
  method_review_direction:
    range_or_nonpoint: POINT_TARGET_NOT_SUPPORTED
    null: OTHERWISE
  replacement_method_creation: PROHIBITED

trial_inventory:
  representation_count: 37
  representation_derivation:
    equity_constituents: 27
    broad_market: 3
    gld_core_and_conditional: 4
    crypto: 3
  scenario_count: 3
  window_class_count: 7
  derived_registered_cell_ceiling: 777
  formula: 37_TIMES_3_TIMES_7
  cell_identity: REPRESENTATION_TIMES_SCENARIO_TIMES_WINDOW_TIMES_EXACT_CONFIG_HASH_TIMES_DATA_HASH_BUNDLE
  metrics_from_same_path_are_new_trials: false
  failed_discarded_ineligible_attempts_remain_accounted: true
  reserve_trials: 0
  unused_capacity_reallocation: PROHIBITED
  new_cells_after_results: REQUIRES_CHARTER_AMENDMENT
  conditional_gld_cells_count_inside_ceiling: true

rerun_rule:
  after_results_observed: PROHIBITED
  required_authority: SEPARATELY_ACCEPTED_CHARTER_AMENDMENT_OR_NEW_RISK_STUDY
  allowed_basis: [MATERIAL_NEW_EVIDENCE_REGIME, SEPARATELY_GOVERNED_INTEGRITY_CORRECTION]
  discovered_defect_automatic_rerun: PROHIBITED
  preregistered_fallback_retries_before_execution: PERMITTED_IF_LOGGED
  known_historical_windows_held_out_claim: PROHIBITED
  terminology: PREREGISTERED_HISTORICAL_REPLAY
  protocol_held_out: ONLY_IF_GENUINELY_SEQUESTERED_AND_HASH_PROVED
  prospective_evidence: ONLY_FUTURE_OBSERVATIONS_NOT_AVAILABLE_AT_CHARTER_FREEZE

result_vocabulary:
  result_states:
    provisional_scenario_not_rejected: >-
      The dominance rule did not reject the historical provisional reference;
      non-rejection is not validation, calibration, adoption, or policy support.
    policy_review_required: >-
      A registered adjacent scenario dominates the historical reference under
      the preregistered rule; this requires a separate policy review and causes
      no automatic weight or method change.
    unable_to_determine: >-
      Data, eligibility, breadth, corporate-action, or representation-conflict
      gates prevent a directional disposition.
  review_direction: [lower_exposure, higher_exposure, null]
  point_target_assessment: [not_supported, not_rejected, unable_to_determine]
  method_review_direction: [range_or_nonpoint, null]
  non_rejection_equals_validation: false
  policy_review_equals_automatic_change: false

prohibited_scope:
  - FINAL_LEVEL1_TARGETS
  - FINAL_LEVEL2_MEMBERSHIP
  - LEVEL2_WEIGHTS
  - OPTIMIZER_OR_WEIGHT_GRID_SEARCH
  - COMPOSITE_SCORE
