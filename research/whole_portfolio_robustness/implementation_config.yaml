schema_version: "1.0"
study_id: PORTFOLIO-ROBUSTNESS-0001
status: FROZEN_BEFORE_HOLDOUT_EXECUTION

decision_cell:
  cadence: QUARTERLY
  one_way_cost_bps: "10"
  tax_profile: TAXABLE_MID
  rationale: >-
    The middle registered cost and tax assumptions with the primary registered
    quarterly cadence are the single decision cell. Every other registered
    combination remains a required sensitivity; none may replace this cell
    after results are known.

simulation:
  window_initialization: INDEPENDENT_100000_AT_FIRST_WINDOW_SESSION
  initial_allocation: FIRST_WINDOW_SESSION_CLOSE_COUNTS_AS_REBALANCE
  quarterly_months: [1, 4, 7, 10]
  annual_months: [1]
  rebalance_session: FIRST_XNYS_SESSION_IN_SCHEDULED_MONTH
  event_order: CASH_ACCRUAL_THEN_PRICE_AND_DIVIDEND_THEN_DIVIDEND_TAX_THEN_REBALANCE
  target_base: POST_FRICTION_FIXED_POINT_NAV
  fixed_point_tolerance_dollars: "0.000001"
  fixed_point_max_iterations: 100
  crypto_session_price: PRIOR_COMPLETED_UTC_DAILY_CLOSE
  equity_price: SPLIT_ADJUSTED_CLOSE
  dividend_basis: SPLIT_ADJUSTED_PER_SHARE_CREDITED_ON_EX_DATE
  cash_accrual: CALENDAR_DAILY_COMPOUNDING_BETWEEN_XNYS_CLOSES
  dff_availability: ONE_FEDERAL_BUSINESS_DAY_LAG_THEN_FOLLOWING_CALENDAR_DAY
  cash_operating_drag_bps_annual: "25"
  cash_rate_floor: NONE
  no_price_fill: true
  unavailable_target: CASH_UNTIL_NEXT_SCHEDULED_REBALANCE
  fractional_shares: true
  borrowing: PROHIBITED

tax:
  lot_method: HIFO
  hifo_tie_break: ACQUISITION_DATE_THEN_CREATION_ORDER
  long_term_holding_days_minimum: 366
  realized_losses: NO_CREDIT_NO_OFFSET
  transaction_cost_added_to_basis: false
  gold_instrument: GLD
  gold_gain_rate_applies_regardless_of_holding_period: true
  dividend_profile_rule: REGISTERED_QUALIFIED_FRACTION_BLEND
  terminal_unrealized_gain_tax: NONE

metrics:
  annualization_sessions: 252
  cagr_day_basis: "365.2425"
  volatility: SAMPLE_STANDARD_DEVIATION_OF_DAILY_NET_RETURNS
  downside_deviation: ROOT_MEAN_SQUARED_NEGATIVE_EXCESS_RETURN_ANNUALIZED
  sharpe: MEAN_DAILY_EXCESS_OVER_SAMPLE_STD_DAILY_EXCESS_ANNUALIZED
  sortino: MEAN_DAILY_EXCESS_OVER_DOWNSIDE_DEVIATION_ANNUALIZED
  cvar_95: MEAN_OF_RETURNS_AT_OR_BELOW_EMPIRICAL_FIFTH_PERCENTILE
  recovery_days: CALENDAR_DAYS_FROM_PRE_TROUGH_PEAK_TO_FIRST_FULL_RECOVERY
  concentration_aggregation: MAXIMUM_DAILY_VALUE_WITHIN_WINDOW
  direct_hhi_scale: FRACTION_SQUARED
  cash_and_cost_drag: >-
    Zero-cost zero-cash-yield shadow cumulative return minus observed
    cumulative return for the same variant, cadence, tax profile, and window.
  tax_drag: >-
    Tax-deferred cumulative return minus observed cumulative return for the
    same variant, cadence, cost, and window.

windows:
  walk_forward_interpretation: SINGLE_CALENDAR_YEAR_EVALUATION_SLICES_NO_REFIT
  portfolio_paths_scope: DECISION_CELL_ONLY_ALL_REGISTERED_WINDOWS
  sensitivity_metrics_scope: ALL_VARIANTS_ALL_REGISTERED_WINDOWS_ALL_REGISTERED_FRICTIONS

decision_rule:
  confirmation_direction_metrics: [SHARPE_DELTA, SORTINO_DELTA, SELECTED_TAIL_DELTA]
  sensitivity_support_cell: SHARPE_AND_SORTINO_POSITIVE_AND_EITHER_TAIL_POSITIVE
  tail_selection: >-
    A tail metric is eligible only if its decision-cell holdout deterministic
    improvement clears its registered magnitude threshold. Every eligible tail
    metric must also clear its own bootstrap probability threshold.
  concentration_test_window: holdout_all_current_assets
  concentration_test_cell: DECISION_CELL
  daily_drift_controls: APPLY_REGISTERED_CEILINGS_TO_MAXIMUM_DAILY_EXPOSURE

bootstrap:
  execution_cells: DECISION_CELL_ONLY
  boundary: CIRCULAR_WITHIN_EACH_REGISTERED_WINDOW
  geometric_restart_probability: "0.047619047619047619"
  paired_inputs: PORTFOLIO_AND_RISK_FREE_RETURN_INDICES

output:
  numeric_precision_decimal_places: 12
  deterministic_json: SORTED_KEYS_UTF8_TRAILING_NEWLINE
  facts_inference_separation: REQUIRED
  automatic_target_change: PROHIBITED
  advisory_only: true
  stage1: UNARMED_AND_NOT_EXECUTABLE
