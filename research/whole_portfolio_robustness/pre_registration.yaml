  trade_timing: CLOSE_TO_CLOSE_WITH_COST_DEBIT_AT_REBALANCE
  unavailable_pre_inception_weight: HOLD_AS_CASH_UNTIL_NEXT_SCHEDULED_REBALANCE_AFTER_LAWFUL_INCEPTION
  survivorship_disclosure: CURRENT_ROSTER_HISTORICAL_COUNTERFACTUAL_NOT_A_HISTORICAL_RECOMMENDATION
  active_weight_rule: PRO_RATA_WITHIN_EACH_CHANGED_SLEEVE_ONLY
  gated_weight_rule: ALWAYS_CASH_NEVER_REDISTRIBUTED
  dividends: SPLIT_ADJUSTED_PRICES_PLUS_EXPLICIT_CASH_DIVIDENDS_EX_DATE_CREDIT_ONCE
  cash_return: LAGGED_DFF_ACTUAL_360_MINUS_25_BPS_ANNUAL_OPERATING_DRAG
