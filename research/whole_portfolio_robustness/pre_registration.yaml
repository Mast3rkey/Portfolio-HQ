schema_version: "1.0"
study_id: PORTFOLIO-ROBUSTNESS-0001
status: PREREGISTERED_NOT_EXECUTED
registered_at: "2026-09-07"

purpose:
  question: >-
    Does any bounded, economically interpretable change to the current accepted
    portfolio improve held-out risk-adjusted performance and survivability after
    realistic costs and tax sensitivities without sacrificing too much return?
  successor_to: RISK-0001
  distinction: >-
    RISK-0001 tested isolated sleeve representations and explicitly excluded a
    whole portfolio, residual capital, cash, reserve, and margin. This study
    evaluates the current accepted roster as one reconciled 100% portfolio.
  baseline_rule: CURRENT_ACCEPTED_TARGETS_REMAIN_POLICY_UNLESS_A_LATER_REVIEWED_DECISION_CHANGES_THEM
  result_authority: RECOMMEND_POLICY_REVIEW_OR_RETAIN_BASELINE_ONLY
  automatic_adoption: PROHIBITED

