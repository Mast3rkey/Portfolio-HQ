variants:
  selection_rule: FIXED_BEFORE_ANY_V2_RESULT
  optimization: PROHIBITED
  definitions:
  - id: BASELINE
    hypothesis: The accepted allocation is not robustly dominated.
    transforms: []
    expected_sleeves_pct:
      eligible_direct_equity: '56.50'
      broad_market_funds: '23.00'
      gold: '4.00'
      crypto: '4.00'
      cash_and_protected_capital: '12.50'
  - id: BROAD_PLUS_5
    hypothesis: Five points shifted from eligible single names to broad funds improve diversification without material return sacrifice.
    transforms:
    - from: eligible_direct_equity
      to: broad_market_funds
      percentage_points: '5.00'
      within_sleeve_rule: PRO_RATA
    expected_sleeves_pct:
      eligible_direct_equity: '51.50'
      broad_market_funds: '28.00'
      gold: '4.00'
      crypto: '4.00'
      cash_and_protected_capital: '12.50'
  - id: DEFENSIVE_PLUS_5
    hypothesis: Five points shifted from eligible single names to protected cash improve tail survival enough to justify opportunity cost.
    transforms:
    - from: eligible_direct_equity
      to: cash_and_protected_capital
      percentage_points: '5.00'
      within_sleeve_rule: PRO_RATA
    expected_sleeves_pct:
      eligible_direct_equity: '51.50'
      broad_market_funds: '23.00'
      gold: '4.00'
      crypto: '4.00'
      cash_and_protected_capital: '17.50'
  - id: CRYPTO_HALF
    hypothesis: Halving crypto reduces tail risk and drawdown enough to offset foregone upside.
    transforms:
    - from: crypto
      to: cash_and_protected_capital
      percentage_points: '2.00'
      within_sleeve_rule: PRO_RATA
    expected_sleeves_pct:
      eligible_direct_equity: '56.50'
      broad_market_funds: '23.00'
      gold: '4.00'
      crypto: '2.00'
      cash_and_protected_capital: '14.50'
  - id: GOLD_PLUS_2
    hypothesis: Two points shifted from eligible single names to gold improve regime and tail resilience.
    transforms:
    - from: eligible_direct_equity
      to: gold
      percentage_points: '2.00'
      within_sleeve_rule: PRO_RATA
    expected_sleeves_pct:
      eligible_direct_equity: '54.50'
      broad_market_funds: '23.00'
      gold: '6.00'
      crypto: '4.00'
      cash_and_protected_capital: '12.50'
  - id: DIVERSIFIED_BALANCE
    hypothesis: A fixed multi-sleeve deconcentration improves several risk metrics without relying on one hedge sleeve.
    transforms:
    - from: eligible_direct_equity
      to: broad_market_funds
      percentage_points: '3.00'
      within_sleeve_rule: PRO_RATA
    - from: eligible_direct_equity
      to: gold
      percentage_points: '1.00'
      within_sleeve_rule: PRO_RATA
    - from: eligible_direct_equity
      to: cash_and_protected_capital
      percentage_points: '1.00'
      within_sleeve_rule: PRO_RATA
    - from: crypto
      to: cash_and_protected_capital
      percentage_points: '2.00'
      within_sleeve_rule: PRO_RATA
    expected_sleeves_pct:
      eligible_direct_equity: '51.50'
      broad_market_funds: '26.00'
      gold: '5.00'
      crypto: '2.00'
      cash_and_protected_capital: '15.50'
