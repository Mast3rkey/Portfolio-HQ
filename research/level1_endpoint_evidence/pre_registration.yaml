result_status_of_stage_1_output:
  is_a_driver_source: false
  is_admissible_endpoint_supporting_evidence: false
  may_be_cited_as_endpoint_supporting_evidence: false
  may_enter_a_snapshot_as_a_driver: false
  may_claim_full_j_1_through_j_12_compliance: false
  statement: >-
    The Stage 1 result record is a feasibility finding about constructibility over the
    Stage-1-testable subset of XASSET-0024 SSJ. It states no endpoint, contains no share, and is
    classified non-DRIVER and non-admissible. It may never be cited, admitted, or relied upon as
    endpoint-supporting evidence, and a later filing that attempted to do so would be manufacturing
    the source this program was chartered to determine the feasibility of.

