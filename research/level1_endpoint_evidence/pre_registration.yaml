stage_1_executability:
  # AMENDED BY XASSET-0029. `executable` stays false PERMANENTLY and keeps its enforced-false
  # check. Its meaning is now explicit and load-bearing: NO COMMITTED VALUE IN THIS REPOSITORY
  # AUTHORIZES STAGE-1 EXECUTION. XASSET-0028 already enforced `_false(executable)` in the
  # validator while the authorization gate simultaneously required `executable is True`, so the
  # canonical file could never be both valid and self-authorizing. XASSET-0029 preserves that
  # lock rather than unpicking it, and relocates authorization to an external, one-shot,
  # post-lifecycle attestation. See `stage_1_operational_authorization` below.
  executable: false
  executable_is_never_the_authorization_source: true
  status: STRUCTURALLY_CLOSED_NOT_OPERATIONALLY_AUTHORIZED
  blocking_prerequisite: XASSET_0029_LIFECYCLE_CLOSURE_THEN_EXTERNAL_ONE_SHOT_PREEXECUTION_ATTESTATION
  authorized_by_xasset_0027: false
  authorized_by_xasset_0028: false
  authorized_by_xasset_0029: false
  construction_universe_structurally_closed: true
  amended_by: XASSET-0029
  predecessor_amended_by_xasset_0028: XASSET-0028
  predecessor_status_xasset_0027: NOT_YET_EXECUTABLE_CONSTRUCTION_UNIVERSE_NOT_CLOSED
  predecessor_blocking_prerequisite_xasset_0027: CONCRETE_CONSTRUCTION_UNIVERSE_CLOSURE
  predecessor_blocking_prerequisite_xasset_0028: XASSET_0028_LIFECYCLE_CLOSURE
  statement: >-
    XASSET-0027 charters this programme's architecture — its families, gates, disposition rules,
    reading map, deferrals, provenance requirements, and firewall — and does NOT authorize Stage 1
    execution. XASSET-0027's own blocking prerequisite was that a concrete construction universe did
    not exist. XASSET-0028 closed that universe structurally, retiring that blocker. XASSET-0028's
    own lifecycle has since closed in full, which retires the XASSET-0028 blocker in turn.
    XASSET-0029 does NOT thereby declare Stage 1 executable. It establishes the mechanism by which
    exactly one Stage-1 attempt may become authorized, and that mechanism is deliberately NOT a
    committed value: authorization is an external, one-shot preexecution attestation that cannot
    exist until after XASSET-0029 has itself been reviewed, accepted, merged, post-merge verified,
    and confirmed green by merge-commit CI. Structural closure is not operational authorization, and
    no reader may treat the two as the same fact.
  operational_authorization_requires_all_of:
  - INDEPENDENT_FULL_EXACT_HEAD_REVIEW
  - PRINCIPAL_EXACT_HEAD_ACCEPTANCE
  - MERGE
  - POST_MERGE_VERIFICATION
  - MERGE_COMMIT_CI_SUCCESS
  - MERGED_SUCCESSOR_HASH_AND_UNIVERSE_HASH_VERIFICATION
  no_merge_to_execution_gap: true
  no_merge_to_execution_gap_note: >-
    Every gate above must be satisfied and verified against the merged bytes before any Stage-1 lane
    opens. A validator that can structurally read the closed universe must still fail closed on
    lifecycle authorization until every gate is met.

# ESTABLISHED BY XASSET-0029. This block specifies WHAT a valid Stage-1 authorization must prove
# and WHICH exact identities it must bind. It is inert: it never asserts that authorization has
# been granted, and nothing a reader can edit here grants it.
stage_1_operational_authorization:
  mechanism: EXTERNAL_ONE_SHOT_PREEXECUTION_ATTESTATION
  established_by: XASSET-0029
  currently_effective: false
  currently_effective_note: >-
    False here is not a switch awaiting a flip. Effectivity is not readable from this file at all:
    it is decided at runtime by validating an external attestation that does not exist yet. A future
    edit setting this true would change nothing, because no validator consults it for authorization.
  authorization_is_committed_state: false
  authorization_is_external_runtime_evidence: true
  implementing_module: level1_stage1_execution_authorization.py
  execution_attempt_id: ENDPOINT-0001::STAGE_1::ATTEMPT_1
  one_shot: true
  one_shot_note: >-
    XASSET-0027 SSP.1 permits exactly ONE later Stage-1 evaluation/results PR. The attestation, the
    execution claim, and the completion record are each created with O_EXCL and mirrored into an
    append-only ledger, so a second claim always fails and an authorization naming one attempt can
    never authorize another. A rerun after completion requires new governance authority.
  review_independence_position:
    account_level_independence_observable: false
    account_level_independence_note: >-
      This repository uses a single GitHub account for both authoring and reviewing sessions, a
      pre-existing platform limitation recorded repeatedly in its own history. GitHub login
      inequality therefore CANNOT prove independent session authorship, and the mechanism does not
      pretend otherwise. An earlier fail-closed condition asserting that a self-authored review is
      mechanically refused was removed rather than left as an unenforced promise.
    what_is_actually_verified: DURABLE_PRINCIPAL_CERTIFICATION_OF_THE_INDEPENDENT_REVIEW
    what_is_actually_verified_note: >-
      The principal's own durable acceptance record must NAME the exact independent review pass it
      relies upon. The mechanism then verifies that review exists on the authorizing pull request,
      was submitted against the exact accepted head, carries the approving formal disposition, is
      not dismissed, and precedes the acceptance, which in turn precedes the merge. That is a real,
      mechanically checkable certification chain; it is not a claim about session identity.
    reviewer_identity_is_derived_not_declared: true
    author_identity_is_authorizing: false
    author_identity_note: >-
      author_identity is caller-supplied informational metadata only. It is recorded for audit and
      is deliberately NOT used to establish independence or any other authorization fact.
  result_identity:
    mechanism: SHA256_OF_CANONICAL_JSON
    single_shared_function: stage1_result_identity
    shared_by:
    - FUTURE_STAGE_1_RESULT_WRITER
    - COMPLETION_RECORD
    - PUBLIC_RESULT_VALIDATION
    note: >-
      Exactly one deterministic identity, so "is this the artifact the lawful execution completed"
      is mechanically decidable. Key order and insignificant whitespace do not change identity; any
      content change does. Completing result A therefore prevents publishing result B.
  lifecycle_truth_sources:
    principle: >-
      A recorded lifecycle value is never accepted because its text is well-formed. Every value is
      re-derived from a durable source and compared, and an unreachable source FAILS CLOSED. An
      entirely fictional but internally consistent review/acceptance/merge/CI chain must be refused.
    git_object_store: >-
      Content-addressed and offline. Supplies the merge SHA, both real parents, current ancestry, and
      the byte identity of load-bearing files AS THEY EXIST IN THE MERGED TREE.
    github_governance_metadata: >-
      Supplies the review and its exact reviewed commit and formal disposition, the reviewer login
      (DERIVED, never self-declared), the principal acceptance comment, the post-merge verification
      comment, and the merge-commit CI run and job. GOVERNANCE METADATA ONLY - never market, price,
      fundamental, or any other economic data, and never a Stage-1 data-acquisition path.
  execution_state_machine:
    states:
    - ABSENT
    - READY
    - CLAIMED
    - COMPLETED
    new_execution_permitted_in: READY
    result_validation_permitted_in:
    - CLAIMED
    - COMPLETED
    separation_note: >-
      "May a NEW execution start?" and "did THIS result come from the one lawful execution?" are
      different questions and are answered by different predicates. Conflating them made consuming
      the authorization reject the very execution that consumed it, while deferring consumption left
      a replay and concurrency window. The claim is taken atomically immediately before the first
      real Stage-1 work.
    claimed_state_never_implies_lawful_provenance: true
    claimed_state_note: >-
      State DETECTION and authorization VALIDITY are different questions. A surviving claim record
      or ledger entry may establish that the lane is CLAIMED, but lawful provenance additionally
      requires that the exact attestation still exists, still hashes to what the claim bound, and
      still validates against durable git and GitHub truth. A missing, invalid, or drifted
      attestation fails closed even while the lane reports CLAIMED.
    final_publication_requires_completion: true
    final_publication_note: >-
      Public result validation requires a COMPLETED record whose attempt, attestation, claim, and
      RESULT identity all match, the last computed from the supplied artifact. Structural
      validation of a candidate result before completion uses the private precompletion seam and
      never weakens this final public boundary.
    claim_binds:
    - EXECUTION_ATTEMPT_ID
    - EXACT_ATTESTATION_SHA256
    completion_binds:
    - EXECUTION_ATTEMPT_ID
    - EXACT_ATTESTATION_SHA256
    - EXACT_CLAIM_SHA256
    - EXACT_RESULT_ARTIFACT_SHA256
  durability_boundary:
    claim_recorded_in_two_places: true
    single_record_loss_reopens_lane: false
    total_directory_loss_state: ABSENT
    total_directory_loss_is_ready: false
    crash_after_claim_reopens_lane: false
    statement: >-
      O_EXCL prevents a second creation only while the path exists, so "can never be replayed" would
      be an overclaim. What is enforced: the claim is recorded in both claim.json and an append-only
      ledger, and EITHER establishes CLAIMED, so losing one alone does not reopen the lane;
      destroying the whole directory also destroys the attestation, so the lane becomes ABSENT, which
      is not READY and requires passing the full authenticated lifecycle verification again; and a
      crash after claiming leaves the lane CLAIMED, recoverable only by a governed act. A privileged
      operator deleting the entire directory is outside any filesystem-based enforcement boundary,
      and that limit is disclosed rather than papered over.
  trust_boundary:
    repository_state_says: WHAT_IS_STRUCTURALLY_AUTHORIZED
    external_attestation_says: WHETHER_THIS_EXECUTION_IS_AUTHORIZED
    results_document_says: NOTHING_ABOUT_AUTHORIZATION
    results_cannot_self_authorize: true
    private_structural_seams_are_non_authorizing: true
  must_bind_exactly:
  - REPOSITORY_IDENTITY
  - EXACT_REVIEWED_BASE_SHA
  - EXACT_MERGE_PARENTS_REVIEWED_BASE_THEN_ACCEPTED_HEAD
  - MERGE_TREE_EQUALS_ACCEPTED_HEAD_TREE
  - PRINCIPAL_CERTIFIED_INDEPENDENT_REVIEW_ID
  - EXACT_COMPLETED_RESULT_IDENTITY
  - STUDY_ID
  - AUTHORIZING_DECISION_XASSET_0029
  - AUTHORIZING_PULL_REQUEST_NUMBER
  - PREDECESSOR_XASSET_0028_MERGE_SHA
  - PREDECESSOR_XASSET_0028_ACCEPTED_HEAD
  - PREDECESSOR_XASSET_0028_MERGE_BASE
  - LOAD_BEARING_IMPLEMENTATION_IDENTITY_FROM_MERGED_TREE
  - CURRENT_GIT_ANCESTRY_OF_THE_AUTHORIZING_MERGE
  - CANONICAL_PROTOCOL_SHA256
  - CANONICAL_PREREGISTRATION_SHA256
  - CONSTRUCTION_UNIVERSE_SHA256
  - CONSTRUCTION_COUNT_680
  - EXECUTION_ATTEMPT_ID
  - INDEPENDENT_REVIEW_IDENTITY_AND_REVIEWED_SHA
  - PRINCIPAL_ACCEPTANCE_IDENTITY_AND_ACCEPTED_HEAD
  - MERGE_SHA_AND_BOTH_PARENTS
  - POST_MERGE_VERIFICATION_IDENTITY
  - MERGE_COMMIT_CI_RUN_JOB_AND_SUCCESS_CONCLUSION
  must_fail_closed_on:
  - NO_ATTESTATION_PRESENT
  - MALFORMED_OR_DUPLICATE_KEYED_ATTESTATION
  - WRONG_REPOSITORY_OR_STUDY_OR_DECISION
  - WRONG_OR_STALE_AUTHORIZATION_HEAD
  - WRONG_CANONICAL_OR_UNIVERSE_HASH
  - WRONG_CONSTRUCTION_COUNT
  - ABSENT_OR_ADVERSE_INDEPENDENT_REVIEW
  - ABSENT_ACCEPTANCE_OR_ACCEPTANCE_FOR_ANOTHER_HEAD
  - ABSENT_MERGE_OR_WRONG_MERGE_PARENTS
  - ABSENT_POST_MERGE_VERIFICATION
  - ABSENT_OR_UNSUCCESSFUL_MERGE_COMMIT_CI
  - POST_ACCEPTANCE_OR_POST_MERGE_DRIFT
  - REPLAYED_OR_ALREADY_CONSUMED_AUTHORIZATION
  - AUTHORIZATION_FOR_A_DIFFERENT_EXECUTION_ATTEMPT
  - UNVERIFIABLE_OR_UNREACHABLE_GOVERNANCE_TRUTH_SOURCE
  - NONEXISTENT_BUT_WELL_FORMED_REVIEW_ACCEPTANCE_VERIFICATION_OR_CI_IDENTIFIER
  - SELF_DECLARED_REVIEWER_IDENTITY
  - PRINCIPAL_CERTIFICATION_OF_THE_INDEPENDENT_REVIEW_ABSENT_OR_MISMATCHED
  - LIFECYCLE_RECORD_BELONGING_TO_ANOTHER_PULL_REQUEST
  - LIFECYCLE_CHRONOLOGY_VIOLATION
  - DISMISSED_OR_NON_FINAL_SELECTED_REVIEW
  - MERGE_FIRST_PARENT_NOT_THE_EXACT_REVIEWED_BASE
  - MERGE_TREE_DIFFERS_FROM_THE_ACCEPTED_HEAD_TREE
  - CLAIMED_OR_COMPLETED_LANE_WITHOUT_A_STILL_VALID_ATTESTATION
  - SUPPLIED_RESULT_NOT_THE_COMPLETED_RESULT_IDENTITY
  - LOAD_BEARING_ENFORCEMENT_CODE_DRIFT
  - AUTHORIZING_MERGE_NOT_IN_CURRENT_ANCESTRY
  no_merge_to_execution_gap: true
  no_merge_to_execution_gap_mechanism: >-
    Merging XASSET-0029 authorizes nothing. The attestation cannot be pre-staged, because generating
    it requires evidence that does not exist until after the merge: the merge SHA, a post-merge
    verification record, and a merge-commit CI run that has CONCLUDED success at that exact merge
    SHA. CI cannot have concluded at the instant of merge, so a strictly positive interval between
    merge and authorizability is enforced by evidence rather than by convention.
  no_infinite_authorization_regress: true
  no_infinite_authorization_regress_mechanism: >-
    Arming is a runtime operator act, not a further merged governance PR. XASSET-0029 is the final
    governance decision required for Stage 1; after it merges and verifies, the generator is run
    once and no additional authorization PR is ever required. The regress terminates because the
    final step changes no repository state.

