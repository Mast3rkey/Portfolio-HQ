- condition: AN_UNRESOLVED_PAIR_WOULD_BE_CONSUMED_AS_AN_INPUT
  authority: XASSET-0024_SECTION_H_4
- condition: THE_PREFERENCE_ONLY_READING_OF_SECTION_E_1_IS_ESTABLISHED
