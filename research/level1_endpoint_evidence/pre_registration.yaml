# Level-1 endpoint-evidence program — canonical pre-registration
#
# Authorized by governance/decisions/XASSET-0027-level1-endpoint-authority-and-all-four-sleeve-evidence-program-charter.md
#
# This YAML is canonical for every closed identity, candidate, gate, ordering, vocabulary, and count.
# research/level1_endpoint_evidence/PROTOCOL_V1.md explains the design but cannot enlarge or override it.
#
# This file preregisters a research design. It contains no endpoint, no bound, no percentage, no
# sleeve share, and no study result. It is not a DRIVER source and is not admissible as
# endpoint-supporting evidence.

schema_version: '2.0'
study_id: ENDPOINT-0001

identifier_note:
  statement: >-
    ENDPOINT-0001 is a study identifier only. It is not a governance decision prefix, and no
    ENDPOINT-#### decision series is created, implied, or reserved by it. The authorizing decision is
    XASSET-0027.

authority:
  authorizing_decision: XASSET-0027
  authorizing_decision_path: governance/decisions/XASSET-0027-level1-endpoint-authority-and-all-four-sleeve-evidence-program-charter.md
  lane: OPS-0009_LANE_G
  program_shape: ALL_FOUR_SLEEVE_SELECTION_FREE_PROGRAM
  program_shape_source: XASSET-0026
  governing_research_question_source: XASSET-0025_SECTION_K
  endpoint_quantity_source: XASSET-0024_SECTION_C
  admissibility_checklist_source: XASSET-0024_SECTION_J_1_THROUGH_J_12
  prohibited_input_firewall_source: XASSET-0025_SECTION_F
  authority_constituted_by_same_decision: true
  authority_exercised_by_this_program: false
  authority_exercise_note: >-
    XASSET-0027 constitutes LEVEL1_ENDPOINT_AUTHORITY and does not exercise it. This program does not
    exercise it either. Executing Stage 1 states no endpoint and selects no value.

lifecycle_effectivity:
  charter_effective_only_after_all_of:
  - ACCEPTED_INDEPENDENT_EXACT_HEAD_REVIEW
  - PRINCIPAL_EXACT_HEAD_ACCEPTANCE
  - MERGE
  - IMMEDIATE_POST_MERGE_VERIFICATION
  - SUCCESSFUL_MERGE_COMMIT_CI
  stage_1_execution_may_begin_only_after: CONSTRUCTION_UNIVERSE_CLOSURE_THEN_XASSET_0027_LIFECYCLE_CLOSURE_AND_MERGED_HASH_VERIFICATION
  merge_alone_is_sufficient: false
  note: >-
    Merge alone does not make this charter operationally effective and does not open a Stage 1
    execution lane. The full lifecycle above must close first, and the merged canonical hashes must
    verify from the merged commit. This removes any window between merge and lifecycle closure in
    which a second mutation lane could claim authority. Separately and additionally, Stage 1 is
    NOT EXECUTABLE until a concrete construction universe is closed by its own future, separately
    authorized unit — see construction_universe_closure. Lifecycle closure alone does not make
    Stage 1 executable either.

stage_1_executability:
  executable: false
  status: NOT_YET_EXECUTABLE_CONSTRUCTION_UNIVERSE_NOT_CLOSED
  blocking_prerequisite: CONCRETE_CONSTRUCTION_UNIVERSE_CLOSURE
  authorized_by_xasset_0027: false
  statement: >-
    XASSET-0027 charters this programme's architecture — its families, gates, disposition rules,
    reading map, deferrals, provenance requirements, and firewall — and does NOT authorize Stage 1
    execution. Executing Stage 1 requires a concrete construction universe that does not yet exist
    and that XASSET-0027 does not create.

stages:
  stage_1:
    stage_id: STAGE_1_CONSTRUCTION_FEASIBILITY
    authorized_by_xasset_0027: false
    executable_only_after: CONSTRUCTION_UNIVERSE_CLOSURE_THEN_XASSET_0027_LIFECYCLE_CLOSURE_AND_MERGED_HASH_VERIFICATION
    acquires_data: false
    fits_or_estimates_anything: false
    produces_endpoint: false
    produces_admissible_evidence: false
    unit_of_work: ONE_CANDIDATE_EVALUATION
    description: >-
      A deterministic, per-candidate evaluation of whether a lawful endpoint-supporting evidence
      construction is identifiable for that candidate under accepted authority, recording every
      blocking gate. Stage 1 evaluates constructibility over the Stage-1-testable subset of
      XASSET-0024 SSJ. It does not build, acquire, estimate, or admit anything.
  stage_2:
    stage_id: STAGE_2_EMPIRICAL_EVIDENCE_PRODUCTION
    authorized_by_xasset_0027: false
    eligibility_condition: AT_LEAST_ONE_STAGE_1_CANDIDATE_CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
    authorization_requirement: SEPARATE_LATER_EXPLICITLY_ACCEPTED_GOVERNANCE_DECISION
    note: >-
      Stage 2 is neither authorized, commissioned, scheduled, nor partially granted by XASSET-0027.
      Satisfying the eligibility condition creates no entitlement to Stage 2 and does not authorize
      data acquisition, estimation, or any empirical run.

# --------------------------------------------------------------------------------------------------
# Governing research question
# --------------------------------------------------------------------------------------------------

research_question:
  source: XASSET-0025_SECTION_K
  reproduced_verbatim: >-
    For one named Level-1 sleeve, is there directly evidenced, question-matched economic content —
    admissible as a DRIVER under exactly one of XASSET-0020 SSE.1's six classes on its own subject
    matter — that intrinsically establishes a LOWER or an UPPER limit on that sleeve's share of one
    normalized unit of prospective unlevered asset-side capital, at exact precision, from a single
    origin, with no step whose coefficient, ordering, tolerance, cutoff, or selection could have been
    chosen differently?
  instantiation: PER_CANDIDATE_TEMPLATE
  instantiation_note: >-
    The question form is sleeve-agnostic and is instantiated identically for every candidate. Evidence
    is sleeve-specific or comparison-scoped, per XASSET-0025 SSJ and XASSET-0026 SSD.
  null_answer_is_complete_outcome: true
  null_answer_source: XASSET-0020_SECTION_J_3

# --------------------------------------------------------------------------------------------------
# Closed population
# --------------------------------------------------------------------------------------------------

sleeves:
- equity
- fund_broad_market
- fund_gld_defensive
- crypto

bounds:
- LOWER
- UPPER

driver_classes:
- portfolio_function
- valuation_opportunity_cost
- downside_path_risk
- recovery
- diversification_cobehavior
- sleeve_deployability

driver_class_scope:
  record_keys:
  - driver_class
  - section_e1_scope_language
  - minimum_evidence_item_scope
  source: XASSET-0026_SECTION_D
  scope_note: >-
    Records evidence-item subject-matter scope only. Per XASSET-0026 SSD, evidence-item scope and
    program endpoint/output coverage are different questions, and no DRIVER class is closed to a
    program by its output coverage alone. Comparators are not fixed to a second sleeve by SSE.1 and
    are not fixed here.
  classes:
    portfolio_function:
      driver_class: portfolio_function
      section_e1_scope_language: THE_SLEEVES_DIRECTLY_EVIDENCED_JOB_IN_THE_PROSPECTIVE_PORTFOLIO
      minimum_evidence_item_scope: ONE_SLEEVE
    valuation_opportunity_cost:
      driver_class: valuation_opportunity_cost
      section_e1_scope_language: MARGINAL_DOLLAR_HERE_RATHER_THAN_TO_THE_DIRECT_ALTERNATIVE
      minimum_evidence_item_scope: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    downside_path_risk:
      driver_class: downside_path_risk
      section_e1_scope_language: DIRECTLY_COMPARABLE_LOSS_SHAPE_DEPTH_OR_PATH_EVIDENCE
      minimum_evidence_item_scope: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    recovery:
      driver_class: recovery
      section_e1_scope_language: DIRECTLY_COMPARABLE_RECOVERY_OR_TIME_UNDERWATER_EVIDENCE
      minimum_evidence_item_scope: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    diversification_cobehavior:
      driver_class: diversification_cobehavior
      section_e1_scope_language: DIRECT_PAIR_EVIDENCE_DUPLICATION_SHARED_LOSS_OFFSET
      minimum_evidence_item_scope: ONE_UNORDERED_PAIR
    sleeve_deployability:
      driver_class: sleeve_deployability
      section_e1_scope_language: SLEEVE_LEVEL_CONVERTIBILITY_LOCKUP_OR_IMPLEMENTATION_FRICTION
      minimum_evidence_item_scope: ONE_SLEEVE

# --------------------------------------------------------------------------------------------------
# Construction families — closed by accepted authority, not invented here
# --------------------------------------------------------------------------------------------------

construction_families:
  what_this_vocabulary_is: CLOSED_PROVENANCE_ORIGINATION_FAMILY_CLASSIFICATION
  what_this_vocabulary_is_not: AN_EXHAUSTIVE_ENUMERATION_OF_CONCRETE_CONSTRUCTIONS
  closure_basis:
    route_set_closed_by: XASSET-0023_SECTION_H_THERE_IS_NO_THIRD_ROUTE
    route_class_coherence_closed_by: XASSET-0023_SECTION_H_4_ITEM_3
    class_set_closed_by: NUM_0001_SECTION_1_CLASSES_1_THROUGH_6_WITH_CLASS_6_DISQUALIFYING
    statement: >-
      XASSET-0023 SSH states of the two origination routes that "There is no third route," and SSH.4
      item 3 fixes route-class coherence exactly: a SSH.3 derivation is NUM-0001 class 2, and a SSH.2
      statement may carry class 1, 3, 4, or 5. Class 6 is disqualifying under SSH.4 item 2. The lawful
      set of (route, NUM-0001 class) provenance families is therefore closed by already-accepted
      authority at exactly five members. This program enumerates them; it does not select among them,
      rank them, invent one, or exclude one.
    what_closure_does_not_establish: >-
      Closing the family vocabulary does NOT close the set of concrete constructions. XASSET-0023
      SSH.2 states the conditions under which an endpoint is "uniquely stated" and SSH.3 the
      conditions for a source-prescribed derivation; both are constraint sets, and satisfying a
      constraint set does not enumerate the objects that satisfy it. Many distinct source
      identities, source architectures, comparator architectures, evidence forms, external
      impositions, calibrations, governance selections, provisional guardrails, and prescribed
      derivations can inhabit the same family. A family is a classification of provenance, not a
      hypothesis.
  record_keys:
  - family_id
  - route
  - num_0001_class
  - class_name
  - originates_or_clips
  - authority_ref
  families:
  - family_id: R1_C1
    route: R1
    num_0001_class: 1
    class_name: EXTERNALLY_IMPOSED
    originates_or_clips: ORIGINATE
    authority_ref: XASSET-0023_SECTION_H_4_ITEM_3
  - family_id: R1_C3
    route: R1
    num_0001_class: 3
    class_name: EMPIRICALLY_CALIBRATED
    originates_or_clips: ORIGINATE
    authority_ref: XASSET-0023_SECTION_H_4_ITEM_3
  - family_id: R1_C4
    route: R1
    num_0001_class: 4
    class_name: EVIDENCE_BOUNDED_GOVERNANCE_SELECTION
    originates_or_clips: ORIGINATE
    authority_ref: XASSET-0023_SECTION_H_4_ITEM_3
  - family_id: R1_C5
    route: R1
    num_0001_class: 5
    class_name: PROVISIONAL_GOVERNANCE_GUARDRAIL
    originates_or_clips: ORIGINATE
    authority_ref: XASSET-0023_SECTION_H_4_ITEM_3
  - family_id: R2_C2
    route: R2
    num_0001_class: 2
    class_name: MATHEMATICALLY_DERIVED
    originates_or_clips: ORIGINATE
    authority_ref: XASSET-0023_SECTION_H_4_ITEM_3
  excluded_class:
    num_0001_class: 6
    class_name: UNSUPPORTED_UNCLASSIFIED
    reason: DISQUALIFYING_UNDER_XASSET_0023_SECTION_H_4_ITEM_2
  excluded_non_routes:
    reason: >-
      XASSET-0024 SSD's non-routes N1 through N8 are barred origination mechanisms, not construction
      families. A candidate outside the five families above would necessarily be a non-route and is
      barred before evaluation rather than enumerated as a candidate.
    non_routes:
    - N1_CONSTRAINT_APPLICATION_OR_BOUND_INTERSECTION
    - N2_DISCLOSURE_CLASSIFIED_CONTENT
    - N3_CROSS_REPRESENTATION_SELECTION_ABSENT_A_RULE
    - N4_MIDPOINT_SYMMETRY_DEFAULT_OR_MINIMUM_RANGE_WIDTH
    - N5_RESIDUAL_PLUG_OR_COMPLEMENT
    - N6_REUSING_A_STUDY_INTERNAL_THRESHOLD_OR_ITS_PATTERN
    - N7_HISTORICAL_TARGET_OUTPUT_ALLOCATION_WEIGHT_TIER_OR_GATE
    - N8_AUTHOR_OR_REVIEWER_SELECTION_OR_A_DECISION_PROSE_VALUE

# --------------------------------------------------------------------------------------------------
# Candidate universe — deterministic generator, closed before execution
# --------------------------------------------------------------------------------------------------

family_slot_grid:
  what_this_is: A_CLASSIFICATION_GRID_OF_SLEEVE_BOUND_DRIVER_CLASS_AND_PROVENANCE_FAMILY
  what_this_is_not: A_TRIAL_CEILING_OR_AN_EXHAUSTIVE_CANDIDATE_ENUMERATION
  generation_rule: CARTESIAN_PRODUCT_OF_SLEEVES_BOUNDS_DRIVER_CLASSES_AND_CONSTRUCTION_FAMILIES
  generation_order:
  - sleeves
  - bounds
  - driver_classes
  - construction_families
  generation_order_note: >-
    The generation order fixes slot-id assignment and iteration determinism only. It carries no
    economic meaning, no priority, and no sleeve preference.
  slot_id_format: '{sleeve}::{bound}::{driver_class}::{family_id}'
  cell_id_format: '{sleeve}::{bound}::{driver_class}'
  slot_count: 240
  deterministic: true
  byte_identically_reproducible: true
  slot_addition_or_removal: PROHIBITED
  exhaustive_over_families: true
  exhaustive_over_constructions: false
  exhaustiveness_statement: >-
    This grid is exhaustive over the four closed dimensions — sleeve, bound, DRIVER class, and
    provenance family — and is NOT exhaustive over concrete constructions. A slot names a lawful
    provenance shape for a sleeve and bound; it does not name a hypothesis. Two analysts could occupy
    the same slot while evaluating materially different source architectures. The grid is therefore a
    classification scaffold for a future construction universe, not that universe.

construction_universe_closure:
  status: NOT_CLOSED
  stage_1_executable: false
  route_taken: HONEST_PREREQUISITE
  routes_considered_and_unavailable_to_this_filing:
  - route: CONCRETE_FINITE_REGISTRY
    unavailable_to_this_filing_because: >-
      A concrete registry cannot be closed by XASSET-0027 from the currently accepted corpus alone. The
      set of existing admitted sources is exactly XASSET-0021's frozen snapshot, and XASSET-0025
      Outcome C already searched precisely that corpus exhaustively and found no qualifying source, so
      a Stage 1 restricted to it would re-run an accepted determination and add nothing. The remaining
      space is constructions whose sources do not yet exist, and accepted authority does not enumerate
      the concrete hypothetical source or construction architectures such a registry would need.
      Designing and freezing those hypothetical architectures would itself be substantive
      research-design work, reserved to the separately authorized construction-universe closure unit.
      This filing therefore does not determine whether that future unit can or cannot successfully
      preregister a finite hypothetical-architecture registry.
  - route: DETERMINISTIC_CONSTRUCTION_GRAMMAR
    unavailable_to_this_filing_because: >-
      XASSET-0023 SSH.2 and SSH.3 state the conditions a qualifying statement or derivation must meet.
      They are constraint sets, not generators, and satisfying a constraint set does not enumerate the
      objects satisfying it. No accepted decision supplies a finite grammar producing concrete source
      or derivation architectures, and the (route, class) product is a provenance classification
      rather than a construction grammar. Whether a lawful grammar could be designed is likewise left
      to the future closure unit and is not determined here.
  routes_are_unavailable_now_not_permanently_foreclosed: true
  routes_note: >-
    Both entries record what XASSET-0027 cannot do from present authority. Neither is a determination
    that the route is permanently unavailable, and neither may be cited as having foreclosed any option
    for the future closure unit.
  verified_this_session:
  - NO_ACCEPTED_DECISION_ENUMERATES_CONCRETE_SOURCE_OR_CONSTRUCTION_ARCHITECTURES
  - XASSET_0023_H_2_AND_H_3_ARE_CONSTRAINT_SETS_NOT_GENERATORS
  - XASSET_0025_OUTCOME_C_ALREADY_EXHAUSTED_THE_FROZEN_EXISTING_SOURCE_CORPUS
  consequence: >-
    Stage 1 is NOT EXECUTABLE. No 240-slot run may be performed, and no such run could establish
    exhaustive non-constructibility, because the slots bound provenance families rather than
    hypotheses. A negative slot result would mean only that no construction the executor considered
    within that family qualified.
  next_required_prerequisite: CONCRETE_CONSTRUCTION_UNIVERSE_PREREGISTRATION
  next_required_prerequisite_note: >-
    The smallest separately authorized next step is one governance unit whose scope is to determine
    whether a concrete construction universe can be closed at all and, if so, to freeze it. That unit
    must confront the open-hypothetical problem directly and must state its own answer; this charter
    does not pre-decide it, does not choose among the possibilities that unit may consider, and does
    not schedule it.
  authorized_by_xasset_0027: false
  invented_completeness: PROHIBITED
  invented_completeness_note: >-
    Honestly recording that this filing cannot close the universe is preferable to manufacturing a
    registry. This charter records that the universe is not closed NOW and that XASSET-0027 cannot
    close it, rather than asserting a completeness it cannot support — and equally, rather than
    asserting an impossibility it has no authority to determine.

completeness_rule:
  applies_only_after_construction_universe_closure: true
  cell_negative_requires_all_registered_constructions_evaluated: true
  statement: >-
    Once — and only once — a concrete construction universe is closed by its own separately authorized
    unit, a cell may be recorded BLOCKED_CATEGORICALLY only if every registered construction for that
    cell was evaluated and every one returned BLOCKED_CATEGORICALLY. Until that closure exists this
    rule has no registered set to range over, which is precisely why Stage 1 is not executable.
  family_slot_negative_does_not_establish_non_constructibility: true
  family_slot_negative_note: >-
    A negative on a family slot means no construction the executor considered within that provenance
    family qualified. It does not establish that no construction within that family could qualify, and
    it may never be reported as exhaustive non-constructibility.
  unevaluated_construction_permitted: false
  partial_cell_outcome_permitted: false

trial_inventory:
  status: NOT_YET_DEFINABLE
  reason: >-
    A trial ceiling bounds hypotheses. The construction universe is not closed, so the number of
    constructions is undefined and no honest ceiling can be stated. The 240 family slots are a
    classification grid and are expressly not a trial ceiling.
  defined_by: THE_FUTURE_SEPARATELY_AUTHORIZED_CONSTRUCTION_UNIVERSE_CLOSURE_UNIT
  unit_of_trial_once_defined: ONE_CONSTRUCTION_EVALUATION
  derived_cell_expression: 4_SLEEVES_X_2_BOUNDS_X_6_DRIVER_CLASSES
  derived_cells: 48
  derived_family_slot_expression: 4_SLEEVES_X_2_BOUNDS_X_6_DRIVER_CLASSES_X_5_CONSTRUCTION_FAMILIES
  derived_family_slots: 240
  family_slots_per_cell: 5
  result_aware_constructions: PROHIBITED
  every_registered_construction_must_be_recorded: true
  construction_may_not_be_dropped_or_omitted: true

roll_up_units:
  derived_expression: 4_SLEEVES_X_2_BOUNDS
  derived_count: 8
  computed_only_from_own_six_cells: true
  cross_bound_reference: PROHIBITED
  cross_sleeve_reference: PROHIBITED

# --------------------------------------------------------------------------------------------------
# Gate sequence
# --------------------------------------------------------------------------------------------------

gate_sequence:
  evaluation_requirement: EVALUATE_EVERY_APPLICABLE_GATE_BEFORE_CLASSIFYING
  record_first_failing_gate_only: false
  first_failing_gate_is_diagnostic_only: true
  first_failing_gate_note: >-
    first_failing_gate_id is a reporting convenience computed after the disposition is already fixed.
    It never participates in classification, and changing it cannot change any disposition.
  gates_may_not_be_added_removed_reordered_or_reinterpreted_after_any_outcome_observed: true
  record_keys:
  - gate_id
  - gate_index
  - question
  - controlling_authority
  - failure_disposition
  gates:
  - gate_id: G1_DRIVER_SUBJECT_MATTER
    gate_index: 1
    question: >-
      Can evidence about this sleeve be admissible as a DRIVER under this cell's DRIVER class on the
      evidence's own subject matter?
    controlling_authority: XASSET-0024_J_3
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G2_MAGNITUDE_INTRINSICALITY
    gate_index: 2
    question: >-
      Would the quantitative statement be intrinsic to that evidence rather than a share figure
      appended to it, evaluated separately under each of XASSET-0024 SSK.1's two open readings?
    controlling_authority: XASSET-0024_SECTION_D_AND_J_4_AND_SECTION_K_1
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G3_NORMALIZATION
    gate_index: 3
    question: >-
      Would the candidate state the XASSET-0024 SSC quantity — a share of one normalized unit of
      prospective unlevered asset-side capital — rather than a quantity in the sleeve's own,
      within-instrument, market, per-share, or leverage-bearing denominator?
    controlling_authority: XASSET-0024_SECTION_C_AND_SECTION_F_LIMB_1
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G4_ORIGIN
    gate_index: 4
    question: >-
      Is every input free of barred origin, including barred historical values, equal division,
      symmetry, residual, complement, and any reconstruction of a barred value?
    controlling_authority: XASSET-0024_SECTION_F_LIMB_2_AND_NON_ROUTES_N4_N5_N7
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G5_CONSTRAINT_SHAPE
    gate_index: 5
    question: >-
      Would the candidate originate a bound, rather than only cap, clip, block, or intersect one that
      already exists?
    controlling_authority: XASSET-0024_SECTION_F_LIMB_4_AND_NON_ROUTE_N1
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G6_ROUTE_COMPLIANCE
    gate_index: 6
    question: >-
      Would the candidate satisfy its own family's route in full — R1 per XASSET-0023 SSH.2 items 1-6
      including competent stating authority, or R2 per SSH.3 items 1-7 with the derivation
      source-prescribed and containing no step whose coefficient, ordering, tolerance, cutoff, or
      selection could have been chosen differently?
    controlling_authority: XASSET-0024_J_5_AND_J_6_AND_XASSET_0023_H_2_AND_H_3
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G7_DISCRETION_AND_PROVENANCE
    gate_index: 7
    question: >-
      Would the candidate carry its own family's NUM-0001 class coherently, with class 4 satisfying
      the eight-item anti-discretion test and class 5 satisfying NUM-0001 SS6's provisional label and
      stated review condition?
    controlling_authority: XASSET-0024_SECTION_E_3_AND_J_7_AND_NUM_0001_SECTIONS_6_7_8
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G8_UNIQUENESS
    gate_index: 8
    question: >-
      Would exactly one lawful value exist for this endpoint quantity across the admitted set, with no
      second candidate value resolvable by any midpoint, average, precedence, or conservatism rule?
    controlling_authority: XASSET-0024_J_8
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G9_REPRESENTATION
    gate_index: 9
    question: >-
      Would the candidate be self-contained under XASSET-0024 SSG path 1, or covered by a separately
      accepted Level-1 aggregation or selection rule under path 2?
    controlling_authority: XASSET-0024_SECTION_G_AND_J_9
    failure_disposition: BLOCKED_PENDING_SEPARATE_PREREQUISITE
  - gate_id: G10_PAIR_INDEPENDENCE
    gate_index: 10
    question: >-
      Would the candidate avoid consuming any unresolved pair as an input at all, establishing
      direction-invariance by independence rather than direction-robustness by inspection?
    controlling_authority: XASSET-0024_SECTION_H_4_AND_J_10
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G11_EXACTNESS_AND_DETERMINISM
    gate_index: 11
    question: >-
      Would the candidate carry exact source precision or an exact rational derivation, with no
      ungoverned rounding and byte-identical reproduction from the same frozen inputs?
    controlling_authority: XASSET-0024_J_11_AND_XASSET_0021_SECTION_G
    failure_disposition: BLOCKED_CATEGORICALLY
  - gate_id: G12_SNAPSHOT_ADMISSIBILITY_PATH
    gate_index: 12
    question: >-
      Is a lawful XASSET-0021 snapshot successor identifiable that could admit the candidate, noting
      that no snapshot successor is created, extended, or authorized by this program?
    controlling_authority: XASSET-0024_J_1_AND_J_2_AND_XASSET_0026_G_2_CONSTRAINT_3
    failure_disposition: BLOCKED_PENDING_SEPARATE_PREREQUISITE

categorical_definition:
  term: BLOCKED_CATEGORICALLY
  means: NOT_CLOSEABLE_BY_A_NAMED_PREREQUISITE_UNDER_THE_CURRENTLY_ACCEPTED_METHODOLOGY
  does_not_mean: PERMANENTLY_IMPOSSIBLE_UNDER_ALL_FUTURE_GOVERNANCE
  amendment_note: >-
    A later accepted methodology amendment can change a currently categorical rule, and such an
    amendment is already a XASSET-0027 reopen trigger. This charter therefore records a bar against
    the methodology as it currently stands, and does not declare permanent impossibility across all
    future authority.

prerequisite_definition:
  term: BLOCKED_PENDING_SEPARATE_PREREQUISITE
  means: CLOSEABLE_BY_A_NAMED_SEPARATELY_AUTHORIZED_PREREQUISITE_WITHOUT_METHODOLOGY_AMENDMENT
  requires_named_dependency: true

# --------------------------------------------------------------------------------------------------
# Disposition rules — deterministic and order-independent
# --------------------------------------------------------------------------------------------------

disposition_rules:
  order_independent: true
  order_independence_statement: >-
    No disposition at any level depends on gate order, candidate order, or cell order. Candidate
    disposition is a universal test over that candidate's own gate results; cell outcome is an
    existential test over that cell's own five candidate dispositions; roll-up is an existential test
    over its own six cell outcomes. Permuting any input sequence cannot change any output.
  candidate_disposition:
    quantifier: UNIVERSAL_OVER_ITS_OWN_GATE_RESULTS
    categorical_dominates_prerequisite: true
    uncertainty_dominates_prerequisite: true
    precedence:
    - condition: ANY_CATEGORICAL_GATE_FAILURE
      outcome: BLOCKED_CATEGORICALLY
    - condition: ANY_GATE_UNABLE_TO_DETERMINE
      outcome: UNABLE_TO_DETERMINE
    - condition: ANY_PREREQUISITE_GATE_FAILURE
      outcome: BLOCKED_PENDING_SEPARATE_PREREQUISITE
    - condition: ALL_GATES_PASS
      outcome: CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
    compound_failure_note: >-
      A candidate failing both a prerequisite gate and any categorical gate is BLOCKED_CATEGORICALLY,
      never BLOCKED_PENDING_SEPARATE_PREREQUISITE. Closing the named prerequisite would leave the
      categorical defect standing, so recording it as a closeable to-do would misstate what the
      evidence shows. Every applicable gate is evaluated before classification precisely so this
      cannot depend on which gate happens to be reached first.
    uncertainty_precedence_note: >-
      UNABLE_TO_DETERMINE outranks a prerequisite failure, and the ordering is logical rather than
      stylistic. A categorical bar may dominate uncertainty because the candidate is barred whatever
      the uncertainty resolves to. A prerequisite failure may not, because closing the named
      prerequisite cannot resolve the uncertainty: a candidate whose G2 is UNABLE_TO_DETERMINE
      because XASSET-0024 SSK.1 is unresolved, and whose G9 representation also fails, is not merely
      waiting on a representation rule — supplying that rule would leave SSK.1 exactly as unresolved.
      Recording such a candidate as prerequisite-blocked would convert an open methodology question
      into a closeable to-do. Absent a categorical bar, uncertainty is never downgraded.
    applies_at: CANDIDATE_LEVEL_ONLY
    applies_at_note: >-
      This ordering governs a single candidate's own gate results. Cell and roll-up precedence are
      unchanged existential tests, because a different candidate that is determinately
      prerequisite-blocked can legitimately keep a cell open even while another candidate is
      uncertain.
  cell_outcome:
    quantifier: EXISTENTIAL_OVER_ITS_OWN_FIVE_CANDIDATE_DISPOSITIONS
    precedence:
    - condition: ANY_CANDIDATE_CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
      outcome: CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
    - condition: ANY_CANDIDATE_BLOCKED_PENDING_SEPARATE_PREREQUISITE
      outcome: BLOCKED_PENDING_SEPARATE_PREREQUISITE
    - condition: ANY_CANDIDATE_UNABLE_TO_DETERMINE
      outcome: UNABLE_TO_DETERMINE
    - condition: ALL_CANDIDATES_BLOCKED_CATEGORICALLY
      outcome: BLOCKED_CATEGORICALLY
    quantifier_asymmetry_note: >-
      Candidate disposition is universal over gates while cell outcome is existential over candidates,
      and the two are deliberately different. A candidate is blocked if any one of its gates blocks it;
      a cell is open if any one of its lawful construction families survives. Both are existence or
      universality tests over a closed set, and neither weights, counts, averages, ranks, or votes.
  roll_up_outcome:
    quantifier: EXISTENTIAL_OVER_ITS_OWN_SIX_CELL_OUTCOMES
    precedence:
    - condition: ANY_CELL_CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
      outcome: CANDIDATE_CONSTRUCTION_IDENTIFIED
    - condition: ANY_CELL_BLOCKED_PENDING_SEPARATE_PREREQUISITE
      outcome: PREREQUISITE_REQUIRED
    - condition: ANY_CELL_UNABLE_TO_DETERMINE
      outcome: UNABLE_TO_DETERMINE
    - condition: ALL_CELLS_BLOCKED_CATEGORICALLY
      outcome: NO_CONSTRUCTIBLE_CANDIDATE

# --------------------------------------------------------------------------------------------------
# The XASSET-0024 SSK.1 open reading — evaluated, mapped, never resolved
# --------------------------------------------------------------------------------------------------

open_reading_handling:
  open_question_source: XASSET-0024_SECTION_K_1
  question: >-
    Whether XASSET-0020 SSE.1's six DRIVER classes are subject-matter classes capable of housing a
    magnitude statement, or preference-only classes that cannot.
  resolved_by_this_program: false
  relied_upon_by_this_program: false
  handling: EVALUATE_G2_UNDER_BOTH_READINGS_AND_MAP_DETERMINISTICALLY
  required_recorded_fields:
  - g2_outcome_under_subject_matter_reading
  - g2_outcome_under_preference_only_reading
  - g2_outcome_is_reading_dependent
  per_reading_vocabulary:
  - PASSES
  - FAILS
  - UNABLE_TO_DETERMINE
  consequence_if_preference_only_reading_later_established: ALL_CELLS_ABSTAIN
  note: >-
    Mapping both readings deterministically preserves XASSET-0024 SSK.1, XASSET-0025 SSO.1, and
    XASSET-0026 SSK.2, each of which leaves the reading open. An unresolved methodology reading is not
    a categorical impossibility, so a candidate that passes only under the subject-matter reading is
    governed as UNABLE_TO_DETERMINE while SSK.1 stands, never as BLOCKED_CATEGORICALLY.

g2_reading_mapping:
  closed_table: true
  coupled_to_g2_gate_result: true
  coupling_statement: >-
    The two reading fields determine the recorded G2 gate result. This is an enforced identity, not an
    informational annotation: a results record whose G2 gate result disagrees with the mapping is
    rejected. Without this coupling the table would be decorative, and a record could carry a
    reading-dependent pair while recording G2 as PASS and deriving a constructible candidate.
  record_keys:
  - subject_matter_reading
  - preference_only_reading
  - g2_effective_outcome
  - required_g2_gate_result
  - reading_dependent
  rows:
  - subject_matter_reading: PASSES
    preference_only_reading: PASSES
    g2_effective_outcome: PASSES
    required_g2_gate_result: PASS
    reading_dependent: false
  - subject_matter_reading: FAILS
    preference_only_reading: FAILS
    g2_effective_outcome: FAILS_CATEGORICALLY
    required_g2_gate_result: FAIL
    reading_dependent: false
  - subject_matter_reading: PASSES
    preference_only_reading: FAILS
    g2_effective_outcome: UNABLE_TO_DETERMINE
    required_g2_gate_result: UNABLE_TO_DETERMINE
    reading_dependent: true
  - subject_matter_reading: FAILS
    preference_only_reading: PASSES
    g2_effective_outcome: INCOHERENT_REJECTED
    required_g2_gate_result: RECORD_REJECTED
    reading_dependent: false
  - subject_matter_reading: UNABLE_TO_DETERMINE
    preference_only_reading: ANY
    g2_effective_outcome: UNABLE_TO_DETERMINE
    required_g2_gate_result: UNABLE_TO_DETERMINE
    reading_dependent: false
  - subject_matter_reading: ANY
    preference_only_reading: UNABLE_TO_DETERMINE
    g2_effective_outcome: UNABLE_TO_DETERMINE
    required_g2_gate_result: UNABLE_TO_DETERMINE
    reading_dependent: false
  incoherence_note: >-
    The preference-only reading is strictly narrower than the subject-matter reading: anything
    admissible under it is admissible under the subject-matter reading too. A candidate recorded as
    failing the subject-matter reading while passing the preference-only reading is therefore a
    recording defect, rejected rather than mapped to an outcome.
  reading_dependent_maps_to_candidate_outcome: UNABLE_TO_DETERMINE
  reading_dependent_end_to_end_note: >-
    With the coupling above and the candidate precedence in disposition_rules, a reading-dependent
    candidate necessarily records G2 as UNABLE_TO_DETERMINE and therefore necessarily disposes to
    UNABLE_TO_DETERMINE unless some categorical gate independently fails — including when a
    prerequisite gate also fails. That is the end-to-end guarantee the closed table promises.

# --------------------------------------------------------------------------------------------------
# Stage-1-testable subset of XASSET-0024 SSJ, and deferred requirements
# --------------------------------------------------------------------------------------------------

stage_1_testable_subset:
  statement: >-
    Stage 1 tests the Stage-1-testable subset of XASSET-0024 SSJ.1 through SSJ.12. A
    CONSTRUCTIBLE_CANDIDATE_IDENTIFIED disposition therefore means "a construction candidate
    satisfying the Stage-1-testable subset," and never that full SSJ.1-SSJ.12 admissibility has been
    established.
  record_keys:
  - j_item
  - stage_1_status
  - gate_or_basis
  items:
  - j_item: J_1_ADMISSION
    stage_1_status: PARTIALLY_TESTABLE
    gate_or_basis: G12_PLUS_SOURCE_CURRENTNESS_RULE
  - j_item: J_2_SNAPSHOT_POSITION
    stage_1_status: PARTIALLY_TESTABLE
    gate_or_basis: G12_IDENTIFIABILITY_ONLY_NO_SUCCESSOR_CREATED
  - j_item: J_3_DRIVER_CLASSIFICATION
    stage_1_status: TESTABLE
    gate_or_basis: G1
  - j_item: J_4_QUESTION_IDENTITY
    stage_1_status: TESTABLE
    gate_or_basis: G2_G3_G4_G5
  - j_item: J_5_COMPETENT_AUTHORITY
    stage_1_status: TESTABLE
    gate_or_basis: G6
  - j_item: J_6_ROUTE_COMPLIANCE
    stage_1_status: TESTABLE
    gate_or_basis: G6
  - j_item: J_7_PROVENANCE
    stage_1_status: TESTABLE
    gate_or_basis: G7
  - j_item: J_8_UNIQUENESS
    stage_1_status: TESTABLE
    gate_or_basis: G8
  - j_item: J_9_REPRESENTATION_CLOSURE
    stage_1_status: TESTABLE
    gate_or_basis: G9
  - j_item: J_10_PAIR_INDEPENDENCE
    stage_1_status: TESTABLE
    gate_or_basis: G10
  - j_item: J_11_EXACTNESS_AND_DETERMINISM
    stage_1_status: TESTABLE
    gate_or_basis: G11
  - j_item: J_12_RECONCILIATION_FEASIBILITY
    stage_1_status: NOT_YET_DETERMINABLE_DEFERRED
    gate_or_basis: DEFERRED_WHOLE_CANDIDATE_PREREQUISITE

deferred_admissibility_requirements:
  record_keys:
  - requirement_id
  - authority
  - why_not_determinable_in_stage_1
  - determinable_when
  - stage_1_may_claim_compliance
  requirements:
  - requirement_id: J_12_EXACT_SET_VALUED_RECONCILIATION
    authority: XASSET-0024_J_12_UNDER_XASSET_0020_SECTION_K
    why_not_determinable_in_stage_1: >-
      XASSET-0020 SSK defines reconciliation jointly over the admitted sleeve point vector, or over
      the exact feasible set of sleeve vectors inside admitted ranges, together with any separately
      governed liquidity asset, and a negative complement invalidates the candidate. It is inherently
      a whole-candidate, cross-sleeve condition. Stage 1 produces no endpoint value, prohibits
      cross-sleeve and cross-bound reference, and forbids any share from appearing in its result, so
      there is nothing from which an exact reconciliation could be computed. Any Stage-1 verdict on it
      would require assuming future endpoint values or other sleeves' outcomes.
    determinable_when: ACTUAL_CANDIDATE_ENDPOINT_VALUES_OR_SETS_COEXIST_AT_A_LATER_SEPARATELY_AUTHORIZED_STAGE
    stage_1_may_claim_compliance: false
  cross_sleeve_arithmetic_to_satisfy_a_deferred_requirement: PROHIBITED
  note: >-
    Deferring J.12 is the smallest faithful boundary. The alternative — introducing cross-sleeve
    endpoint arithmetic into Stage 1 so a reconciliation gate could return a verdict — would breach
    the single-sleeve bound rule, the cross-sleeve prohibition, and the no-endpoint-value rule at once.

# --------------------------------------------------------------------------------------------------
# Result vocabulary
# --------------------------------------------------------------------------------------------------

result_vocabulary:
  candidate_dispositions:
  - CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
  - BLOCKED_CATEGORICALLY
  - BLOCKED_PENDING_SEPARATE_PREREQUISITE
  - UNABLE_TO_DETERMINE
  cell_outcomes:
  - CONSTRUCTIBLE_CANDIDATE_IDENTIFIED
  - BLOCKED_CATEGORICALLY
  - BLOCKED_PENDING_SEPARATE_PREREQUISITE
  - UNABLE_TO_DETERMINE
  roll_up_outcomes:
  - CANDIDATE_CONSTRUCTION_IDENTIFIED
  - PREREQUISITE_REQUIRED
  - NO_CONSTRUCTIBLE_CANDIDATE
  - UNABLE_TO_DETERMINE
  gate_result_vocabulary:
  - PASS
  - FAIL
  - UNABLE_TO_DETERMINE
  - NOT_APPLICABLE
  no_outcome_is_a_score: true
  mechanism: FIXED_PRECEDENCE_QUANTIFIER_TESTS
  mechanism_note: >-
    Every step at every level is an existence or universality quantifier over a closed set. No
    candidate, cell, or sleeve is weighted, counted, averaged, ranked, or voted, and no numeric
    threshold participates anywhere.
  point_or_range_support:
    recorded_per_candidate: true
    values:
    - WOULD_SUPPORT_RANGE_ENDPOINT
    - WOULD_SUPPORT_POINT_ENDPOINT
    - WOULD_SUPPORT_NEITHER
    range_first_posture: CARRIED_FORWARD_UNCHANGED
    range_first_source: XASSET-0024_SECTION_H_3
    range_first_note: >-
      RANGE feasibility is established before POINT feasibility unless a candidate's evidence uniquely
      supplies a point, in which case the point route remains available on its own terms. This is a
      sequencing preference and bars nothing.

# --------------------------------------------------------------------------------------------------
# Prohibited inputs and origins — complete XASSET-0025 SSF firewall
# --------------------------------------------------------------------------------------------------

prohibited_inputs:
  may_not_be_used_anchored_to_initialized_from_centered_on_sanity_checked_against_or_reverse_engineered_toward: true
  barred_historical_values:
  - HISTORICAL_PROVISIONAL_TARGET_FAMILY
  - HISTORICAL_RESIDUAL
  - HISTORICAL_ASSIGNED_SUM
  - HISTORICAL_SIX_WAY_EQUAL_BASELINE
  - HISTORICAL_FIXED_ADJUSTMENT_INCREMENT
  - HISTORICAL_R2_R3_CONSTRUCTS
  barred_value_note: >-
    Barred historical values are referenced by name rather than reproduced. Reproducing a barred
    numeral inside this preregistration would itself introduce the anchor the firewall exists to
    exclude. XASSET-0025 SSF records their exact locations.
  barred_constructions:
  - EQUAL_DIVISION_INCLUDING_FRESHLY_COMPUTED
  - SYMMETRY_CONVENTION
  - MIDPOINT
  - DEFAULT_OR_MINIMUM_RANGE_WIDTH
  - RESIDUAL_OR_COMPLEMENT_PLUG
  - RECONSTRUCTION_OF_ANY_BARRED_VALUE
  barred_current_state:
  - CURRENT_TARGETS
  - CURRENT_HOLDINGS
  - CURRENT_WEIGHTS
  - CURRENT_TIERS
  - CURRENT_GATES
  - CLUSTER_CAPS
  - ISSUER_AND_COMMON_DRIVER_CEILINGS
  barred_risk_reuse:
  - RISK_SCENARIO_MAGNITUDES
  - ALL_TWENTY_LAPSED_CONSEQUENTIAL_PARAMETERS
  - GOLD_PARITY_ADMISSION_THRESHOLDS
  - STUDY_INTERNAL_MATERIALITY_AND_REPRESENTATION_THRESHOLDS
  - ANY_RISK_DERIVATION_PATTERN_AS_TEMPLATE
  barred_other:
  - CHART_OR_TECHNICAL_VALUES
  - MARGIN_LEVERAGE_OR_BUFFER_STATE
  - PER_SHARE_VALUATION_AGGREGATED_WITHOUT_AN_ACCEPTED_RULE
  - WITHIN_FUND_OR_MARKET_COMPOSITION_SHARES
  - ANY_DECISION_PROSE_VALUE_INCLUDING_XASSET_0027_S_OWN
  literal_scan_is_a_floor_not_the_boundary: true
  literal_scan_note: >-
    XASSET-0024 SSF Limb 2 and XASSET-0023 SSH.2 item 6 both provide that clearing a literal string
    scan is a floor rather than the boundary. G4 tests origin, not spelling.

risk_lane_boundary:
  risk_0001_attempt_2: COMPLETE
  retry: PROHIBITED
  attempt_3: DOES_NOT_EXIST
  family_re_question: PROHIBITED
  parameter_reuse: REQUIRES_SEPARATE_GOVERNANCE_AUTHORITY
  protected_result_path: /private/tmp/phq-risk0001-results
  protected_result_path_access: PROHIBITED_NO_READ_WRITE_DELETE_CLEAN_RESET_OR_REPURPOSE
  accepted_risk_evidence_citation: PERMITTED_ONLY_WITHIN_ITS_ACCEPTED_HISTORICAL_MEANING

# --------------------------------------------------------------------------------------------------
# Representation
# --------------------------------------------------------------------------------------------------

representation:
  disposition: SOURCE_DEPENDENT_NO_PRIOR_RULE_REQUIRED
  disposition_source: XASSET-0026_SECTION_H
  self_contained_path_preserved: true
  self_contained_path_source: XASSET-0024_SECTION_G_PATH_1
  rule_created_by_this_program: false
  cm_14_through_cm_17_membership_designated: false
  non_self_contained_handling: NAME_THE_EXACT_DEPENDENCY_AND_BLOCK_PENDING_SEPARATE_PREREQUISITE
  non_self_contained_handling_note: >-
    A candidate whose construction would require cross-representation combination records the exact
    representation dependency and fails G9 as a prerequisite. The dependency is never silently solved,
    and no majority, average, weighting, representative selection, or most conservative selection is
    performed. Where such a candidate also fails any categorical gate, the categorical disposition
    dominates and the candidate is not recorded as merely prerequisite-blocked.

# --------------------------------------------------------------------------------------------------
# Consequential parameters
# --------------------------------------------------------------------------------------------------

consequential_parameter_registry:
  record_keys:
  - parameter_id
  - value
  - unit
  - num_0001_class
  - contextual_class
  - selection_basis
  - evidence_status
  - supporting_evidence
  - canonical_source
  - duplicate_locations
  - fallback_locations
  - hardcoded_or_config_editable
  - binding_status
  - binding_scope
  - valid_for_study_id
  - lapse_condition
  - reuse_rule
  - calibrated
  - evidence_bounded
  parameters: []
  zero_parameter_declaration:
    stage_1_introduces_zero_consequential_numeric_parameters: true
    statement: >-
      Stage 1 introduces no consequential numeric parameter as NUM-0001 SS18 defines the term. It
      applies no threshold, tolerance, cutoff, materiality level, window, weight, coefficient, or
      score. Every gate is a qualitative admissibility test drawn from already-accepted authority, and
      every count below is derived from the closed population rather than chosen.
    design_consequence: >-
      A study with no free numeric parameter cannot be tuned toward a preferred outcome, and there is
      no parameter for a later sweep, sensitivity variant, or neighboring-value robustness check to
      perturb. With the candidate universe now closed by a deterministic generator, the qualitative
      search surface is closed as well: the executor selects neither which constructions to try nor
      when to stop.
    verification_requirement: >-
      The dedicated validator asserts the registry's parameters list is empty. Introducing any
      parameter requires a separately accepted governance amendment with new hash pins.
  derived_identities:
    record_keys:
    - identity_id
    - expression
    - value
    - contextual_class
    identities:
    - identity_id: SLEEVE_COUNT
      expression: CLOSED_SLEEVE_POPULATION_LENGTH
      value: 4
      contextual_class: CALCULATED_OUTPUT
    - identity_id: BOUND_COUNT
      expression: CLOSED_BOUND_POPULATION_LENGTH
      value: 2
      contextual_class: CALCULATED_OUTPUT
    - identity_id: DRIVER_CLASS_COUNT
      expression: CLOSED_DRIVER_CLASS_POPULATION_LENGTH
      value: 6
      contextual_class: CALCULATED_OUTPUT
    - identity_id: CONSTRUCTION_FAMILY_COUNT
      expression: CLOSED_LAWFUL_ROUTE_CLASS_PAIR_COUNT
      value: 5
      contextual_class: CALCULATED_OUTPUT
    - identity_id: CELL_COUNT
      expression: SLEEVE_COUNT_X_BOUND_COUNT_X_DRIVER_CLASS_COUNT
      value: 48
      contextual_class: CALCULATED_OUTPUT
    - identity_id: FAMILY_SLOT_COUNT
      expression: CELL_COUNT_X_CONSTRUCTION_FAMILY_COUNT
      value: 240
      contextual_class: CALCULATED_OUTPUT
    - identity_id: ROLL_UP_UNIT_COUNT
      expression: SLEEVE_COUNT_X_BOUND_COUNT
      value: 8
      contextual_class: CALCULATED_OUTPUT
    - identity_id: GATE_COUNT
      expression: CLOSED_GATE_SEQUENCE_LENGTH
      value: 12
      contextual_class: CALCULATED_OUTPUT

# --------------------------------------------------------------------------------------------------
# Data, sources, provenance
# --------------------------------------------------------------------------------------------------

data_and_sources:
  stage_1_acquires_data: false
  stage_1_network_access: NOT_REQUIRED_AND_NOT_AUTHORIZED
  stage_1_data_manifest: NOT_APPLICABLE_NO_DATA_ACQUIRED
  stage_1_admissible_inputs:
  - ACCEPTED_GOVERNANCE_DECISIONS_IN_GOVERNANCE_DECISIONS_DIRECTORY
  - XASSET_0021_FROZEN_SNAPSHOT_INVENTORY_AS_ALREADY_RECORDED
  - NUM_0001_CLASS_DEFINITIONS
  stage_1_inadmissible_inputs:
  - ANY_NEWLY_ACQUIRED_MARKET_OR_FUNDAMENTAL_DATA
  - ANY_PROHIBITED_INPUT_LISTED_ABOVE
  - ANY_RISK_0001_EXECUTION_ARTIFACT
  existing_source_consultation_requires_exact_identity: true
  source_currentness:
    universal_age_threshold: PROHIBITED
    freshness_score_or_penalty: PROHIBITED
    rule: APPLY_EACH_SOURCE_OWNED_CURRENTNESS_RULE_EXACTLY_AS_WRITTEN_AND_RECORD_OBSERVED_STATE
    source_without_governed_currentness_rule: REMAINS_HISTORICAL_OR_DISCLOSURE_MAY_NOT_BECOME_A_CURRENT_POSITIVE_DRIVER
    controlling_authority: XASSET-0020_SECTION_F_1_AND_XASSET_0021_SECTION_H

source_architecture_vocabulary:
  values:
  - EXISTING_SOURCE_ARCHITECTURE
  - HYPOTHETICAL_SOURCE_ARCHITECTURE
  existing_requires:
  - source_path
  - source_sha256
  hypothetical_requires:
  - hypothetical_source_requirements
  hypothetical_forbids:
  - source_path
  - source_sha256
  note: >-
    A construction that consults an actual admitted source is EXISTING_SOURCE_ARCHITECTURE and must
    carry that source's exact path and SHA-256. A construction describing the architecture a future
    source would need is HYPOTHETICAL_SOURCE_ARCHITECTURE and carries a stated requirements
    description with no path or hash.

frozen_provenance_requirements:
  applies_to: THE_FUTURE_CONSTRUCTION_UNIVERSE_CLOSURE_UNIT
  binding_on_any_future_stage_1: true
  existing_source_architecture:
    identity_must_be_frozen_before_execution: true
    frozen_fields:
    - source_path
    - source_sha256
    path_and_hash_must_be_bound_to_a_preregistered_construction_identity: true
    observed_bytes_must_be_verified_against_the_frozen_hash: true
    syntactic_validation_is_insufficient: true
    syntactic_validation_note: >-
      Accepting a syntactically valid path plus an arbitrary 64-hex string validates shape, not
      identity. The recorded digest must be recomputed from the observed file bytes and must match,
      and the path and digest must be the ones frozen in the construction universe rather than chosen
      at results time.
  hypothetical_source_architecture:
    requirements_must_be_frozen_before_execution: true
    frozen_fields:
    - hypothetical_source_requirements
    executor_authored_free_text_at_results_time: PROHIBITED
    executor_authored_free_text_note: >-
      A non-empty string authored in the results document is not a preregistration. The exact
      architecture and its requirements must be frozen in the construction universe before execution,
      and the results record may report the frozen architecture but may not invent or alter it.
  result_author_may_alter_a_frozen_architecture: false
  currently_satisfiable: false
  currently_satisfiable_note: >-
    No construction universe exists, so no architecture is frozen and these requirements cannot
    currently be met by any results document. That is the direct mechanical reason Stage 1 is not
    executable.

provenance_manifest:
  required_fields:
  - study_id
  - stage_id
  - execution_attempt_id
  - authorizing_decision
  - authorizing_decision_merge_sha
  - protocol_path
  - protocol_sha256_observed
  - preregistration_path
  - preregistration_sha256_observed
  - hash_verification_result
  - repository_head_sha
  - execution_date
  - candidates_evaluated
  - candidates_expected
  - cells_evaluated
  - cells_expected
  - validator_result
  candidate_count_semantics: REGISTERED_CONSTRUCTIONS_IN_THE_CLOSED_CONSTRUCTION_UNIVERSE
  candidate_count_semantics_note: >-
    candidates_expected counts registered constructions, not family slots. It is supplied by the
    future construction universe closure unit and is expressly not 240. No count is pinned here,
    because pinning one would assert a construction universe this charter does not close.
  hash_verification_failure_behavior: VOIDS_EXECUTION_AUTHORITY_HALT

# --------------------------------------------------------------------------------------------------
# Execution identity, stopping, defect governance
# --------------------------------------------------------------------------------------------------

execution:
  attempt_identity:
    record_keys:
    - execution_attempt_id
    - protocol_sha256_observed
    - preregistration_sha256_observed
    - repository_head_sha
    unregistered_attempt: PROHIBITED
  stopping_rules:
    terminates_when: EVERY_REGISTERED_CONSTRUCTION_IN_THE_CLOSED_CONSTRUCTION_UNIVERSE_CARRIES_A_RECORDED_DISPOSITION
    stopping_rule_currently_has_no_registered_set: true
    stopping_rule_note: >-
      The registered set is supplied by the future construction universe closure unit, not by the 240
      family slots. Until that closure exists this rule ranges over nothing, which is one of the
      mechanical reasons Stage 1 is not executable.
    early_stop_on_positive_finding: PROHIBITED
    early_stop_rationale: >-
      Coverage is all four sleeves and every lawful construction family. Stopping at the first
      constructible candidate would advantage whichever candidate happened to be evaluated first and
      would make a negative elsewhere unexhaustive.
    partial_result_publication: PROHIBITED
  rerun_rule:
    after_outcomes_observed: PROHIBITED
    required_authority: SEPARATELY_ACCEPTED_AMENDMENT_OR_NEW_AUTHORIZED_STUDY
    allowed_basis:
    - MATERIAL_NEW_EVIDENCE_REGIME
    - SEPARATELY_GOVERNED_INTEGRITY_CORRECTION
    discovered_defect_automatic_rerun: PROHIBITED
    defect_handling: RECORD_THE_DEFECT_HALT_AND_RETURN_FOR_SEPARATE_GOVERNANCE
  history_mining_controls:
    gates_frozen_before_evaluation: true
    candidates_frozen_before_evaluation: true
    vocabulary_frozen_before_evaluation: true
    outcome_aware_gate_change: PROHIBITED
    outcome_aware_candidate_addition_or_removal: PROHIBITED
  out_of_sample_discipline:
    applicable_to_stage_1: false
    reason: >-
      Stage 1 acquires no data, estimates nothing, and fits nothing. There is no sample, no held-out
      period, and no fitted quantity, so an out-of-sample or walk-forward split would be a ritual with
      no object. Recording this honestly is preferred to performing a vacuous split.
    required_of_any_future_stage_2: true
  neighboring_parameter_robustness:
    applicable_to_stage_1: false
    reason: >-
      Stage 1 has no numeric parameter to perturb, per the zero-parameter declaration above.
    required_of_any_future_stage_2_if_it_introduces_parameters: true
  negative_result_preservation:
    all_candidate_dispositions_recorded_regardless_of_direction: true
    null_is_a_complete_outcome: true
    suppression_of_any_candidate_disposition: PROHIBITED

