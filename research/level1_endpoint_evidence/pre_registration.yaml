# --------------------------------------------------------------------------------------------------

mandatory_abstention_conditions:
- condition: REPRESENTATION_PATH_1_FAILS_AND_NO_ACCEPTED_RULE_EXISTS
  authority: XASSET-0024_SECTION_G_PATH_3
- condition: ANY_REQUIRED_INPUT_IS_BARRED_BY_ORIGIN
  authority: XASSET-0024_SECTION_F_LIMB_2
- condition: ANY_STEP_COULD_HAVE_BEEN_CHOSEN_DIFFERENTLY
