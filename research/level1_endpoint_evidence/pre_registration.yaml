  slot_id_format: '{sleeve}::{bound}::{driver_class}::{family_id}'
  cell_id_format: '{sleeve}::{bound}::{driver_class}'
  slot_count: 240
  deterministic: true
  byte_identically_reproducible: true
  slot_addition_or_removal: PROHIBITED
  exhaustive_over_families: true
  exhaustive_over_constructions: false
  closed_construction_universe_exists: true
  closed_construction_universe_closed_by: XASSET-0028
  closed_construction_universe_note: >-
    UNCHANGED BY XASSET-0028. The 240-slot grid is still exhaustive over provenance families and
    still NOT exhaustive over constructions; it remains a classification scaffold and is still not a
    trial ceiling. What changed is that the construction universe the scaffold classified now exists
    and is closed separately, at 680 registered constructions. A slot still does not name a
    hypothesis; a registered construction does.
  exhaustiveness_statement: >-
    This grid is exhaustive over the four closed dimensions — sleeve, bound, DRIVER class, and
    provenance family — and is NOT exhaustive over concrete constructions. A slot names a lawful
    provenance shape for a sleeve and bound; it does not name a hypothesis. Two analysts could occupy
