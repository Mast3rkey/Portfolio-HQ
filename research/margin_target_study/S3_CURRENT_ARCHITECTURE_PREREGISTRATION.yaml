proposed_accounting_contract:
  authority: PROPOSED_RESULT_BLIND_NOT_EXECUTABLE
  state:
    G: GROSS_MARKET_VALUE_OF_SECURITIES
    D: MARGIN_DEBT
    C: SETTLED_CASH
    N: G_MINUS_D_SECURITY_NET_EQUITY
    B: G_PLUS_C_MINUS_D_WHOLE_BOOK_EQUITY
  numeric_guards:
    reject: [BOOLEAN_NUMERICS, NONFINITE, NEGATIVE_G_D_C_ARRIVALS_COSTS, COST_RATE_GTE_1]
    target_domain: ONE_LE_L_STAR_LE_H_LE_1_8
    nonpositive_N: NO_VOLUNTARY_TARGET_RESTORATION_OR_NEW_DRAW; MANDATORY_CURE_OR_FAILED_CELL_ONLY
    trim_denominator: ONE_MINUS_L_STAR_TIMES_S_MUST_BE_POSITIVE
    bounds: [REPAYMENT_LE_DEBT, CASH_REPAYMENT_LE_SETTLED_SOURCE_CASH, SALE_LE_GROSS, NO_NEGATIVE_ENDING_CASH_OR_DEBT]
  identities:
    cash_repayment: r_cash=min(A,C,D,max(0,G/L_star-N))
    trim_gross_sale: q=max(0,(G-L_star*N)/(1-L_star*s))
    trim_net_debt_repayment: r_trim=(1-s)*q
    purchase_cash: C_prime=C+x-(1+b)*p
    purchase_gross: G_prime=G+p
    purchase_debt: D_prime=D+x
    purchase_book: B_prime=B-b*p
    genuine_target_purchase_using_all_A: p=(L_star*(N_i+A)-G_i)/(1+L_star*b)
    genuine_target_draw: x=(1+b)*p-A
    cost_aware_full_deployment_capacity: x_cap=max(0,((1+b)*(H*N_i-G_i)+(H-1)*A)/(1+H*b))
    capacity_purchase_if_full_gap: p_cap=(A+x_cap)/(1+b)
    executed_draw_cash_first: x_actual=max(0,(1+b)*p_executed-A)
  proposed_event_clock:
    - OPENING_ENTITLEMENT_SNAPSHOT
    - PENDING_OR_IMMEDIATE_MANDATORY_RISK_CURE_BEFORE_UNAVAILABLE_CASH
    - DAILY_INTEREST_CAPITALIZATION
    - SOURCE_TAGGED_DIVIDEND_OR_CORPORATE_ACTION_CASH_ARRIVAL
    - R2_ROUTING_EXACTLY_ONCE
    - SOURCE_TAGGED_EXTERNAL_DEPOSIT_ARRIVAL_AND_FLOW_LEDGER_ENTRY
    - R1_CASH_REPAYMENT_EXACTLY_ONCE
    - SEPARATELY_AUTHORIZED_VOLUNTARY_TRIM_ROUTING
    - RESIDUAL_WEIGHTED_GAP_ALLOCATION_UNDER_SELECTED_DEPLOYMENT_SEMANTIC
    - END_OF_CYCLE_VALUATION_AND_SOURCE_LEDGER
  deployment_semantics:
    CASH_ONLY_NO_NEW_DRAW_PROPOSAL:
      x: '0'
      max_purchase: p_le_A/(1+b)
      classification: PROPOSED_NOT_INHERITED_R1_GUARANTEE
    INHERITED_DEPOSIT_DAY_CAPACITY_AND_WEIGHTED_GAPS:
      source: margin_simulation.py deposit-day _leverage_capped_margin then _weighted_gap_allocate
      legacy_zero_buy_cost_comparator: x_legacy=max(0,H*(N_i+A)-G_i-A)
      meaning: LEGACY_RAW_CAPACITY_IGNORES_BUY_FEES; ACTUAL_DRAW_MAY_BE_ZERO_OR_LOWER_DUE_TO_GAPS_LOTS_GATES
      prohibition: EFFECTIVE_LEVERAGE_CAP_IS_NOT_A_TARGET_OR_NO_BORROW_PROMISE
    COST_AWARE_CAPACITY_PROPOSAL:
      classification: PROPOSED_FEE_RESERVATION_BEFORE_WEIGHTED_GAP_ALLOCATION_NOT_IMPLEMENTED
      capacity: x_cap=max(0,((1+b)*(H*N_i-G_i)+(H-1)*A)/(1+H*b))
      execution: CASH_FIRST; x_actual=max(0,(1+b)*p_executed-A); x_actual_le_x_cap
      partial_allocation: GAPS_LOTS_GATES_MAY_BIND; UNUSED_CASH_REMAINS_CASH; ACTUAL_FEE=b*p_executed
      infeasible: IF_N_i_LE_0_OR_OPENING_LEVERAGE_ABOVE_H_THEN_NO_NEW_DRAW_AND_MANDATORY_CURE_OR_FAILED_CELL
      limitation: CASH_PURCHASES_ARE_NOT_PROMISED_TO_REPAIR_AN_ALREADY_INFEASIBLE_CAP
    GENUINE_END_CYCLE_TARGET_PROPOSAL:
      prerequisite: SEPARATELY_REGISTERED_TARGET_AND_FEASIBLE_DRAW
      meaning: SOLVE_TARGET_PURCHASE_IDENTITY_SUBJECT_TO_ALL_GATES
  performance_accounting:
    external_deposits: EXCLUDED_FROM_TWR_REPORTED_SEPARATELY_AS_CONTRIBUTED_WEALTH
    dividends: RETURN_CASH_CREDITED_AND_ROUTED_ONCE_NOT_EXTERNAL_FLOW
