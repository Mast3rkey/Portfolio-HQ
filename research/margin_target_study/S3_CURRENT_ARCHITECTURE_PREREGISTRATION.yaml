      trim_on_branch: IF_SELECTED_AUTHORIZED_TRIM_EVENT_THEN_q=max(0,(G_c-L_star*N_c)/(1-L_star*s))_SUBJECT_TO_0_le_q_le_G_c_AND_0_le_(1-s)*q_le_D_c; r_trim=(1-s)*q
