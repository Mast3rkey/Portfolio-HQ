        EXISTING_CASH_EXPLICIT_RULE: SOURCE_MUST_BE_E; ROUTE_REQUIRES_SEPARATELY_ADMITTED_RULE_AND_AMOUNT_OTHERWISE_r_j=0
        NO_REPAYMENT_ROUTE: r_j=0
