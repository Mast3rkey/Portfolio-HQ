    cash_routing_c:
      total: R=r_E+sum_k_in_K(r_k)
      terminal_state: [G_c=G_last, D_c=D_0-R, C_c=C_0+sum_k_in_K(F_k)-R, N_c=G_c-D_c, B_c=G_c+C_c-D_c]
      residual_partition: A_c=(E_0-r_E)+sum_k_in_K(F_k-r_k); P_c=P_0; C_c=P_c+A_c
