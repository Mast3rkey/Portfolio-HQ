# ENDPOINT-0001 concrete construction universe — closure determination
#
# Authorized by XASSET-0028. Read-only research-design artifact. Contains no endpoint, bound,
# point, range, percentage, target, weight, score, or sleeve preference, and executes nothing.
#
# Every count and hash below is RECOMPUTED from the deterministic generator by
# level1_construction_universe_closure_validator; none is hand-authored.

determination_id: ENDPOINT-0001-CONSTRUCTION-UNIVERSE-CLOSURE-V1
authorizing_decision: XASSET-0028
status: CLOSED

closure_basis: >-
  XASSET-0027 SSI.1 records that a provenance family is a classification of provenance, not a
  hypothesis, and names the dimensions that can inhabit one family. Five of those are exactly the
  already-closed (route, NUM-0001 class) families. Evidence form is representation, preserved as a
  downstream gate. Source ARCHITECTURE is frozen into construction identity, as
  frozen_provenance_requirements -- addressed by name to this unit and binding on any future Stage
  1 -- requires. That leaves comparator architecture, and accepted authority already closes it:
  XASSET-0020 SSH fixes exactly six unordered sleeve-sleeve pair records and additionally requires
  each of the four sleeves to be compared directly with UNSIZED_UNASSIGNED_CAPITAL. Crossing that
  closed contract with the canonical driver_class_scope partition fixes every DRIVER class's
  comparator architecture set exactly. No comparator rule is supplied; SSH's own mandated
  comparisons are enumerated.

closed_dimensions:
  sleeves:
  - equity
  - fund_broad_market
  - fund_gld_defensive
  - crypto
  bounds:
  - LOWER
  - UPPER
  driver_classes:
  - portfolio_function
  - valuation_opportunity_cost
  - downside_path_risk
  - recovery
  - diversification_cobehavior
  - sleeve_deployability
  provenance_families:
  - R1_C1
  - R1_C3
  - R1_C4
  - R1_C5
  - R2_C2

comparator_contract:
  enumerates_xasset_0020_section_h_only: true
  supplies_a_new_comparator_rule: false
  unassigned_capital_is_a_diversification_cobehavior_comparator: false
  unassigned_capital_exclusion_reason: >-
    XASSET-0020 SSH's UNSIZED_UNASSIGNED_CAPITAL comparison is not a pair record and carries its
    own separate conclusion vocabulary, and diversification_cobehavior's canonical scope is
    ONE_UNORDERED_PAIR. Registering a comparator the accepted contract does not admit would be
    inventing a construction rather than enumerating one. The alternative -- registering it as a
    NOT_APPLICABLE row for grid symmetry -- was considered and declined for that reason.
  driver_class_scope:
    portfolio_function: ONE_SLEEVE
    valuation_opportunity_cost: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    downside_path_risk: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    recovery: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    diversification_cobehavior: ONE_UNORDERED_PAIR
    sleeve_deployability: ONE_SLEEVE
  architectures_per_driver_class:
    portfolio_function: 1
    valuation_opportunity_cost: 4
    downside_path_risk: 4
    recovery: 4
    diversification_cobehavior: 3
    sleeve_deployability: 1

source_architecture_contract:
  frozen_source_architecture: HYPOTHETICAL_SOURCE_ARCHITECTURE
  source_architecture_is_frozen_construction_identity: true
  source_architecture_selectable_at_result_time: false
  hypothetical_source_requirements_frozen_before_execution: true
  hypothetical_source_requirements_generated_from_closed_identity_only: true
  result_author_may_author_or_alter_requirements: false
  source_path_and_sha256_present: false
  source_path_and_sha256_absent_reason: >-
    source_architecture_vocabulary.hypothetical_forbids bars source_path and source_sha256 on a
    HYPOTHETICAL construction. They are therefore absent from every registered identity.
  existing_source_architecture_disposition: RESOLVED_BY_XASSET_0025_OUTCOME_C_OVER_THE_XASSET_0021_FROZEN_SNAPSHOT
  existing_source_architecture_reason: >-
    The existing-source half is not silently omitted. XASSET-0027 SSI.1.1 records that the
    existing-source corpus is exactly XASSET-0021's frozen snapshot, that XASSET-0025 Outcome C
    already searched precisely that corpus exhaustively and found no qualifying source, that a
    Stage 1 restricted to it would re-run an accepted determination and add nothing, and that the
    remaining space is constructions whose sources do not yet exist. The source-architecture
    dimension therefore resolves to exactly ONE lawful value rather than two.
  no_source_identity_enumeration: true
  no_unbounded_source_search: true
  no_unbounded_source_search_reason: >-
    A frozen requirement specification names no institution, vendor, jurisdiction, or document.
    Stage 1 evaluates whether the frozen specification is lawfully satisfiable under the twelve
    gates. Two independent executors handed the same construction_id are handed the same frozen
    requirement set byte for byte, so a negative means the registered specification was evaluated
    and blocked, never that an executor failed to find something.
  consumable_by_validate_stage1_results: true
  frozen_universe_adapter: level1_construction_universe_closure_validator.frozen_construction_universe
  frozen_result_identity_fields:
  - cell_id
  - sleeve
  - bound
  - driver_class
  - family_id
  - route
  - num_0001_class
  - governing_authority_refs
  - source_architecture
  - hypothetical_source_requirements
  frozen_result_identity_note: >-
    Every immutable identity field a Stage-1 candidate result row duplicates must EQUAL the frozen
    construction exactly. Review 4946154405 MAJOR 2 found that verifying construction-id membership
    and source provenance alone let a row name a valid registered id while mislabeling its sleeve,
    bound, DRIVER class, family, route, NUM-0001 class, cell, or authority trace, which would corrupt
    the cell roll-up even though the id itself is registered.
  public_stage_1_validator_is_unconditionally_fail_closed: true
  public_stage_1_validator_note: >-
    Review 4946154405 BLOCKING 1 found the public Stage-1 results validator consulted operational
    authorization only when no construction_universe argument was supplied, so any caller passing one
    bypassed the gate. The public parameter is REMOVED: validate_stage1_results(results) always
    enforces authorization and always obtains the canonical universe internally. Structural machinery
    is exercised through the private _validate_stage1_results_against_universe, which is explicitly
    not an authorization path.

