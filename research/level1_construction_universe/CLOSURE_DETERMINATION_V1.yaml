# ENDPOINT-0001 concrete construction universe — closure determination
#
# Authorized by XASSET-0028. Read-only research-design artifact. Contains no endpoint, bound,
# point, range, percentage, target, weight, score, or sleeve preference, and executes nothing.
#
# Every count and hash below is RECOMPUTED from the deterministic generator by
# level1_construction_universe_closure_validator; none is hand-authored.

determination_id: ENDPOINT-0001-CONSTRUCTION-UNIVERSE-CLOSURE-V1
authorizing_decision: XASSET-0028
status: CLOSED

closure_basis: >-
  XASSET-0027 SS-I.1 records that a provenance family is a classification of provenance, not a
  hypothesis, and names the dimensions that can inhabit one family: source identities, source
  architectures, comparator architectures, evidence forms, external impositions, calibrations,
  governance selections, provisional guardrails, and prescribed derivations. Five of those are
  exactly the already-closed (route, NUM-0001 class) families. Evidence form is representation,
  preserved as a downstream gate rather than an identity dimension. Source identity is what Stage
  1 searches for, not something a registry could fix without enumerating every institution in
  existence. That leaves comparator architecture as the one open identity dimension, and accepted
  authority already closes it: XASSET-0020 SS-H fixes exactly six unordered sleeve-sleeve pair
  records and additionally requires each of the four sleeves to be compared directly with
  UNSIZED_UNASSIGNED_CAPITAL. Crossing that closed contract with the canonical driver_class_scope
  partition fixes every DRIVER class's comparator architecture set exactly. No comparator rule is
  supplied; SS-H's own mandated comparisons are enumerated.

closed_dimensions:
  sleeves:
  - equity
  - fund_broad_market
  - fund_gld_defensive
  - crypto
  bounds:
  - LOWER
  - UPPER
  driver_classes:
  - portfolio_function
  - valuation_opportunity_cost
  - downside_path_risk
  - recovery
  - diversification_cobehavior
  - sleeve_deployability
  provenance_families:
  - R1_C1
  - R1_C3
  - R1_C4
  - R1_C5
  - R2_C2

comparator_contract:
  enumerates_xasset_0020_section_h_only: true
  supplies_a_new_comparator_rule: false
  unassigned_capital_is_a_diversification_cobehavior_comparator: false
  unassigned_capital_exclusion_reason: >-
    XASSET-0020 SS-H's UNSIZED_UNASSIGNED_CAPITAL comparison is not a pair record and carries its
    own separate conclusion vocabulary, and diversification_cobehavior's canonical scope is
    ONE_UNORDERED_PAIR. Registering a comparator the accepted contract does not admit would be
    inventing a construction rather than enumerating one. The alternative -- registering it as a
    NOT_APPLICABLE row for grid symmetry -- was considered and declined for that reason.
  driver_class_scope:
    portfolio_function: ONE_SLEEVE
    valuation_opportunity_cost: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    downside_path_risk: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    recovery: COMPARISON_SCOPED_COMPARATOR_NOT_FIXED
    diversification_cobehavior: ONE_UNORDERED_PAIR
    sleeve_deployability: ONE_SLEEVE
  architectures_per_driver_class:
    portfolio_function: 1
    valuation_opportunity_cost: 4
    downside_path_risk: 4
    recovery: 4
    diversification_cobehavior: 3
    sleeve_deployability: 1

